,"파란색 삼각형","녹색 삼각형"],"c":"등급 기호: A = 녹색 삼각형; B = 빨간색 사각형; C = 파란색 원; D = 노란색 별."},{"id":"646c152a","q":"레저용 (동력) 보트에서 가장 위험하고 불이 붙기 쉬워 특별한 주의가 필요한 가연물은 무엇입니까?","o":["유리섬유.","나무.","종이.","전기 패널.","액체 연료."],"c":"액체 연료(휘발유)는 선저에 쌓이는 인화성 증기를 내뿜습니다. 시동 전에 해당 구획을 환기하십시오."},{"id":"1137ef1a","q":"처벌 가중을 위한 재범이란 같은 위반을 어느 기간 이내에 반복하는 것입니까?","o":["1개월","6개월","9개월","12개월","3개월"],"c":"재범이란 같은 위반을 12개월 이내에 반복하는 것입니다. 재범은 처벌을 가중합니다."},{"id":"9c97e5d2","q":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면, 낮에 흘수로 인해 조종이 제한된 선박은 마스트에 어떤 형상물을 게양해야 합니까?","o":["파란색 원뿔 1개.","검은색 구 2개.","검은색 구 1개.","파란색 구 1개.","검은색 원통 1개."],"c":"흘수 제약 선박: 낮에는 검은색 원통 1개, 밤에는 수직선상으로 붉은색 전주등 3개."},{"id":"fbf7dec9","q":"구명조끼 사용과 관련하여 출항 전에 무엇을 하는 것이 좋습니까?","o":["구명조끼를 임시로 만든다","어린이와 어른의 수를 센다","구명조끼 사용법을 시연한다","다른 배에서 구명조끼를 빌린다","선상 인원 수를 센다"],"c":"출항 전에 모두에게 구명조끼가 어디 있고 어떻게 입는지 보여 주십시오. 비상시에는 배울 시간이 없습니다."},{"id":"99732c14","q":"연료와의 화학 반응에서 가장 흔한 지연물(산화제)은 무엇입니까?","o":["수소","산소","질소","이산화탄소","헬륨 가스"],"c":"화재의 삼요소: 연료, 지연물(산화제), 열. 흔한 지연물은 공기 중의 산소입니다."},{"id":"bb65db08","q":"화학 포말 소화기는 기본적으로 어떤 원리로 화점에 작용합니까?","o":["질식","제거","연쇄 반응 차단","냉각","분산"],"c":"포말은 연료를 산소로부터 차단하는 층을 만듭니다: 질식 소화."},{"id":"3d855b1f","q":"다음 중 항해등을 사용하는 상황이 아닌 것은 무엇입니까?","o":["밤에 선박이 표류(a matroca)하고 있을 때","선박이 부두에 접안해 있을 때","밤에","필요할 때","시정이 제한될 때"],"c":"항해등은 일몰부터 일출까지와 시정이 제한될 때 사용합니다. 부두에 접안한 선박은 필요하지 않습니다."},{"id":"b994289c","q":"선미에 가능한 한 가깝게 또는 트랜섬에 설치되어, 수평 135° 범위에서 후방에서 오는 선박에게만 보이는 흰색 정등을 무엇이라고 합니까?","o":["예선등","마스트등","선미등","현등","선미 등(luz de popa)"],"c":"선미등(luz de alcançado)은 흰색이며 선미에 있고 135°를 비춥니다. 후방에서 오는 선박이 보는 등입니다."},{"id":"815071a3","q":"길이 12미터 미만의 스포츠·레저용 선박은 보통 무엇을 표시합니까?","o":["현등과 선수의 노란색 등 1개","현등(녹색과 붉은색)과 선수 끝의 흰색 등 1개","양색등으로 결합된 현등(녹색과 붉은색)과 흰색 전주등 1개","흰색 전주등 1개만","현등(녹색과 붉은색)만"],"c":"12m 미만에서는 결합형 현등(양색등)과 마스트등·선미등을 대신하는 흰색 전주등 1개를 사용할 수 있습니다."},{"id":"13c64eb4","q":"선박의 마스트에 설치되어 수평 225° 범위에서 정횡이나 선수 방향에서 오는 선박에게 보이는 흰색 정등을 무엇이라고 합니까?","o":["선수등","마스트등","선미등","항공등","충돌등"],"c":"마스트등은 흰색이며 선체 중심선에 있고, 선수에서 각 현의 정횡 후방 22.5°까지 225°를 비춥니다."},{"id":"25c4e0b2","q":"우현 부표는 밤에 어떤 색의 등화를 냅니까?","o":["녹색","붉은색","노란색","파란색","흰색"],"c":"IALA B지역(브라질): 우현 표지는 붉은색 원뿔형이며 붉은색 등화를 냅니다; 좌현 표지는 녹색 원통형이며 녹색 등화를 냅니다. 정정: 원래 자료에는 A지역 기준인 “녹색”으로 되어 있었습니다."},{"id":"83ffe153","q":"다이빙 작업 중인 선박은 무엇을 게양해야 합니까?","o":["Golf 기","Alfa 기","Delta 기","Maik 기","Bravo 기"],"c":"Alfa 기(흰색과 파란색) = 잠수부가 물속에 있으니 거리를 두고 천천히 지나가십시오."},{"id":"4522d6b2","q":"선상 화재 시 불을 끄기 위해 어디에 위치해야 합니까?","o":["불꽃과 연기의 바람 불어 가는 쪽(풍하)에 선다.","선수나 선미에 선다.","연기가 향하는 좌현 쪽에 선다.","불꽃과 연기의 바람 불어오는 쪽(풍상)에 선다.","선박 중앙부에 선다."],"c":"바람이 불어오는 쪽(풍상)에서 불을 끄십시오. 그러면 연기와 열이 나에게서 멀어집니다."},{"id":"6094f465","q":"물은 어떤 화재에 사용할 수 있는 소화약제입니까?","o":["가연성 금속","가연성 고체 물질","전기 모터","항해 장비","인화성 액체"],"c":"물은 냉각 작용을 하며 A급(고체) 화재에 적합합니다. 전기, 인화성 액체, 금속 화재에는 사용하지 마십시오."},{"id":"262db5cb","q":"선박에서 화재가 발생했을 때 다음 중 적절하지 않은 조치는 무엇입니까?","o":["선박에 비치된 휴대용 소화기로 화재 진압을 시도한다.","폭발 위험이 있으므로 화재 진압을 시도하지 않고 즉시 선박을 포기(퇴선)한다.","불꽃이 사람들에게서 멀어지도록 선박을 변침한다.","사람들을 불꽃의 풍상 쪽으로 이동시키고 구명조끼를 입게 한다.","다른 선박에 위험 상황을 알린다."],"c":"진압을 시도하지 않고 퇴선하는 것은 부적절합니다. 먼저 진압을 시도하고, 사람들을 구명조끼를 입혀 풍상 쪽에 두며, 도움을 요청하십시오."},{"id":"d4d0bac9","q":"“D”급 화재의 소화약제는 무엇입니까?","o":["기계 포말","물","화학 포말","건조 분말 소화약제","CO2"],"c":"자연발화성 금속(D급)에는 특수 분말 소화약제가 필요합니다. 물은 금속과 반응하여 불을 더 키울 수 있습니다."},{"id":"2eb43342","q":"감전된 사람을 전류에서 떼어 놓을 때 사용해서는 안 되는 재료는 무엇입니까?","o":["도자기 조각.","나무 조각.","타이어 조각.","금속 조각.","플라스틱 조각."],"c":"금속은 전기가 통합니다. 나무, 고무, 플라스틱처럼 마른 절연 재료를 사용하십시오."},{"id":"00c48265","q":"다음 중 스포츠·레저용 선박에 요구되는 구명 설비가 아닌 것은 무엇입니까?","o":["구명부환","구명정(baleeira)","구명조끼","불꽃 신호기","구명뗏목"],"c":"구명정(baleeira)은 대형 선박의 구명용 보트로, 스포츠·레저용 선박에는 요구되지 않습니다."},{"id":"9caf67b7","q":"강, 호수, 운하, 석호, 만, 작은 만, 후미 및 보호된 해역으로 간주되는 내륙 수로에서 이루어지는 항해는 무엇으로 분류됩니까?","o":["담수 항해","하천 항해","호수 항해","내륙 항해","폐쇄 해역 항해"],"c":"내륙 항해: 강, 호수, 운하, 석호, 만, 작은 만, 후미 및 보호된 해역. Arrais-Amador(소형선박 조종면허)의 항행 한계입니다."},{"id":"86ae8f42","q":"위반에 대한 가중 사유는 무엇입니까?","o":["외국인일 것","연료 고갈","재범","오염","손해"],"c":"재범은 가중 사유입니다: 부과되는 처벌이 무거워집니다."},{"id":"325ad749","q":"선박 등록이 말소되는 두 가지 상황은 무엇입니까?","o":["압류와 소유자의 사망","침몰과 유기(포기)","이미 등록된 다른 선박과 같은 이름 및 압류","연회비 미납과 사고 연루","소유자의 사망과 사망 사고를 낸 충돌"],"c":"선박이 더 이상 존재하지 않거나 사용되지 않을 때 등록이 말소됩니다: 침몰(멸실)과 유기(포기)."},{"id":"1ac6b8a3","q":"위반 통지서가 작성된 후 위반자에게는 어떤 기한이 주어집니까?","o":["소명 제출 기한 30(삼십) 영업일","소명 제출 기한 60(육십) 영업일","소명 제출 기한 30(삼십) 역일","소명 제출 기한 15(십오) 영업일","소명 제출 기한 7(칠) 영업일"],"c":"위반 통지서 작성 후 위반자는 15영업일 이내에 소명을 제출할 수 있습니다."},{"id":"b3ece79b","q":"여러 요인과 함께, 조난자의 생존은 해수 온도에 따른 체류 시간에 달려 있습니다. 주변 온도(기온)의 경우, 그것이 사람에게 미치는 영향은 무엇과 밀접하게 관련되어 있습니까?","o":["전선 시스템","해류","기압","풍속","구름"],"c":"바람은 몸의 열 손실을 늘립니다(체감 온도). 바람이 강할수록 저체온증 위험이 커집니다."},{"id":"a8d3a725","q":"피가 눈에 보일 때 그 출혈을 무엇이라고 합니까?","o":["외출혈","정맥 출혈","내출혈","동맥 출혈","표재성 출혈"],"c":"피가 밖으로 보이면 외출혈입니다. 내출혈은 보이지 않으며 창백함, 쇼크 같은 징후로 알아차립니다."},{"id":"64ecc449","q":"3도 화상에서는 어떻습니까?","o":["피부가 붉어지고 약간 민감해진다","피부가 완전히 파괴되었다","표면이 부드럽고 축축하다","물집이 생기는 것이 특징이다","통증이 없다"],"c":"1도: 붉어짐. 2도: 물집. 3도: 피부 전층 파괴; 신경이 손상되어 아프지 않을 수도 있습니다."},{"id":"ed9e6452","q":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면, 우현의 녹색 현등과 좌현의 붉은색 현등은 어떤 각도 범위에서 보입니까?","o":["선미로부터 122.5°","선수로부터 132.5°","선미로부터 102.5°","선수로부터 112.5°","선미로부터 135.5°"],"c":"현등은 선수에서 정횡 후방 22.5°까지 112.5°를 비춥니다. 두 현등을 합하면 마스트등과 같은 225°가 됩니다."},{"id":"11a7de15","q":"내 모터보트의 전기 패널에서 화재가 났을 때 우선적으로 사용해야 하는 소화기는 무엇입니까?","o":["할론 가스","가압수","CO2","분말 소화약제","포말"],"c":"전기 장비(C급)에는 전기가 통하지 않는 약제가 필요합니다: 잔여물을 남기지 않는 CO2가 가장 좋습니다."},{"id":"92137203","q":"선미 부근에서 우현 또는 좌현에 있는 선박 현측의 곡면 부분을 무엇이라고 합니까?","o":["선미 쪽 현측(쿼터)","선폭","닭발(pés de galinha)","선수 쪽 현측(바우)","세로 보강재(롱거)"],"c":"선미 근처 현측의 곡면은 쿼터(alheta), 선수 근처는 바우(bochecha)입니다."},{"id":"6d179193","q":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면, 선박이 낮에 여러 상태를 표시하기 위해 사용하는 구형 형상물, 원뿔 등의 형상물은 무슨 색입니까?","o":["노란색","녹색","흰색","검은색","빨간색"],"c":"RIPEAM의 주간 형상물(구, 원뿔, 원통, 마름모꼴)은 항상 검은색입니다."},{"id":"2b4f3ce8","q":"선수와 선미에 무게가 많고 선체 중앙부에 무게가 적은 배는 강하고 높은 파도를 만나면 두 동강 날 위험이 있다고 합니다. 이 상태를 무엇이라고 합니까?","o":["트림 상태","조종불능","직립 상태","새깅(contra-alquebramento)","호깅(alquebramento)"],"c":"양 끝에 무게가 있으면 양 끝이 내려가고 중앙이 올라갑니다: 호깅(alquebramento). 중앙에 무게가 있으면 반대입니다: 새깅(contra-alquebramento)."},{"id":"1d8b1bd2","q":"개방 골절의 경우 하지 말아야 할 것은 무엇입니까?","o":["출혈을 멈춘다","진통제를 준다","환자에게 물을 준다","골절된 팔다리를 고정한다","부러진 뼈를 제자리에 맞춘다"],"c":"뼈를 제자리에 맞추려고 해서는 절대 안 됩니다. 출혈을 멈추고 상처를 덮은 뒤 팔다리를 있는 그대로 고정하십시오."},{"id":"520bb0b6","q":"같은 만에 선박 8척이 투묘하고 있다면 무엇을 유지하도록 주의하는 것이 좋습니까?","o":["밤낮 경계","각 선박이 닻을 중심으로 돌 수 있도록 선박 사이에 충분한 공간","닻들이 서로 아주 가까이 박혀 있도록 함","계류줄에 닿지 않도록 모터보트의 드라이브(라베타)를 올려 둠","육지와의 적절한 거리"],"c":"투묘한 선박은 바람과 조류에 따라 각자의 닻을 중심으로 회전합니다. 회전할 때 서로 부딪히지 않도록 공간을 두십시오."},{"id":"bac1e8e6","q":"Arrais-Amador(소형선박 조종면허)를 취득하려면 스포츠·레저용 또는 유사 선박에서 몇 시간의 훈련을 증명해야 합니까?","o":["7시간","20시간","6시간","10시간","3시간"],"c":"자료에 따르면 Arrais-Amador에는 6시간의 훈련 증명이 필요합니다. 관할 Capitania dos Portos(항만청)에서 현행 NORMAM을 확인하십시오."}]</script>
<script type="application/json" id="cartoes-ko">[{"i":0,"x":"선박, 승무원, 승객 및 비승무 전문인력의 안전을 위한 모든 자재와 장비는 사전에 DPC(Diretoria de Portos e Costas, 항만연안국)의 승인을 받아야 합니다."},{"i":1,"x":"해군 검사(Inspeção Naval)는 Capitania(항만청), Delegacia(지청) 및 Agência(출장소)가 수행하는 행정적 성격의 활동으로, DPC가 규정의 감독 역할을 수행하도록 지원합니다."},{"i":2,"x":"아마추어 조종면허의 정지 또는 압수 대상이 되는 행위는 다음과 같습니다: 면허가 없는 사람에게 선박 조종을 맡기는 것, 음주 상태 또는 어떤 종류든 유독성 물질의 영향 아래에서 선박을 조종하는 것, 선박을 여객이나 화물의 상업적 운송에 사용하는 것, 또는 선박을 범죄에 이용하는 것."},{"i":3,"x":"NORMAM-03은 아마추어(amador)를 다음과 같이 정의합니다: Autoridade Marítima(해사 당국)가 인증한 면허를 가지고 비직업적으로 스포츠 및/또는 레저용 선박을 운항하는 모든 사람."},{"i":4,"x":"Veleiro(요트 면허) 소지자는 내수 항행 한계 내에서 엔진 추진이 없는 범선을 조종할 수 있습니다(최소 연령 8세이며, 해양 클럽, 정식 마리나 또는 해양 스카우트 단체에 소속되어야 합니다)."},{"i":5,"x":"Motonauta(수상오토바이 면허) 소지자는 내수 항행 한계 내에서 수상오토바이를 조종할 수 있습니다(최소 연령 18세)."},{"i":6,"x":"Arrais-Amador(소형선박 조종면허) 소지자는 내수 항행 한계 내에서 선박을 조종할 수 있습니다(최소 연령 18세)."},{"i":7,"x":"Mestre-Amador(연안 항해 면허) 소지자는 연안 항행 한계 내에서 국내 항구와 외국 항구 사이를 오가며 선박을 조종할 수 있습니다."},{"i":8,"x":"Capitão-Amador(원양 항해 면허) 소지자는 해안으로부터의 거리 제한 없이, 즉 지리적 제한 없이 국내 항구와 외국 항구 사이를 오가며 선박을 조종할 수 있습니다."},{"i":9,"x":"아마추어 조종면허의 유효기간은 10년이며, 시험 없이 갱신할 수 있습니다."},{"i":10,"x":"바다, 항구 또는 내수 항로에서 인명이 위험에 처해 있음을 알게 된 사람은 누구든지 가능한 한 신속하게 그 사실을 Autoridade Marítima(해사 당국)에 알려야 합니다."},{"i":11,"x":"아마추어 면허는 다음의 경우 취소됩니다: 면허가 정지된 상태에서 선박을 조종하다 적발된 경우, 면허 정지가 재차 발생한 경우."},{"i":12,"x":"아마추어 면허 시험의 시행 기관은 Capitania dos Portos(항만청)와 그 하위 기관(Delegacia 및 Agência)입니다."},{"i":13,"x":"Capitania dos Portos(항만청)에서 규정 준수를 감독하는 부서는 해군 검사(Inspeção Naval) 부서입니다."},{"i":14,"x":"스포츠 및 레저용 선박의 소유자는 자신의 명의로 선박을 등록한 사람입니다."},{"i":15,"x":"선박 등록은 Tribunal Marítimo(해사 법원)에서 이루어지며, PRPM(Provisão de Registro de Propriedade Marítima, 해상 소유권 등록증)이 발급됩니다."},{"i":16,"x":"길이가 24미터 이상이고 총톤수(AB)가 100을 초과하는 모든 선박은 Tribunal Marítimo(해사 법원)에 등록해야 합니다."},{"i":17,"x":"해사 당국은 위반으로 인한 미납금이 있는 사람에 대해, 이를 완납할 때까지 그 사람과 관련된 모든 문서나 행정 절차의 진행을 중지합니다."},{"i":18,"x":"해수욕객 전용 구역을 운항하면 면허가 최대 60일까지 정지될 수 있습니다."},{"i":19,"x":"해변 이용 질서의 관리는 지방자치단체(municípios)의 권한입니다."},{"i":20,"x":"RLESTA에서 정한 한도 내에서 벌금액과 면허 정지 기간을 정하는 권한은 해사 당국 대리인에게 있습니다."},{"i":21,"x":"선박에 승선하여 선박 운항 업무를 수행하는 선원(Aquaviário) 또는 아마추어를 승무원(Tripulante)이라고 합니다."},{"i":22,"x":"선박을 안전하게 운항하는 데 필요한 최소 승무원 수를 “안전 승무원(Tripulação de Segurança)”이라고 합니다."},{"i":23,"x":"선박 압수의 원인이 된 위반 사항이 정해진 기한 내에 시정되지 않으면, 선박은 경매에 부쳐지거나 연방(União) 재산으로 편입됩니다."},{"i":24,"x":"선박 압수의 원인이 된 위반 사항을 시정하여 경매나 연방 재산 편입을 피하기 위해 LESTA가 정한 기한은 90일입니다."},{"i":25,"x":"선박 압수가 발생할 수 있는 세 가지 상황은 다음과 같습니다: 보존 상태가 매우 불량한 경우, 상업적으로 이용된 경우, 안전 구역을 운항한 경우."},{"i":26,"x":"위반자는 위반 통지서를 받은 후 15일 이내에 이의 신청(변론)을 제출할 수 있습니다."},{"i":27,"x":"음주 상태에서 선박을 조종한 경우의 처벌은 면허 최대 120일 정지입니다. 재위반 시에는 면허 취소 처분을 받습니다."},{"i":28,"x":"음주 상태에서 또는 마약성·유독성 물질 사용 후 선박을 조종하는 것은, 법률상 범죄에 해당하지 않는 경우 면허 최대 120일 정지에 처해집니다. 재위반 시에는 면허가 취소됩니다."},{"i":29,"x":"동일한 위반을 반복하면, 벌금 또는 면허 정지 처분의 경우 해당 조항이 다른 절차를 정하지 않는 한 처벌이 2배, 3배 등으로 순차적으로 가중됩니다."},{"i":30,"x":"NORMAM-03은 정원(lotação)을 승무원을 포함하여 승선이 허가된 최대 인원수로 정의합니다."},{"i":31,"x":"LESTA에 따르면 항로표지에 손상을 입힌 위반자는 이를 수리해야 합니다."},{"i":32,"x":"RLESTA에 따르면 항로표지에 손상을 입힌 위반자는 벌금 또는 최대 60일의 면허 정지에 처해집니다."},{"i":33,"x":"석유 플랫폼으로부터의 최소 투묘 거리는 500미터입니다."},{"i":34,"x":"파도가 부서지는 선, 또는 호수나 석호의 경우 수면이 시작되는 지점을 기준선(linha base)이라고 합니다."},{"i":35,"x":"NORMAM-03이 정한 항행 구분 구역에 따르면, 노나 돛으로 추진하는 선박은 기준선으로부터 100미터 밖에서 운항할 수 있습니다."},{"i":36,"x":"NORMAM-03이 정한 항행 구분 구역에 따르면, 엔진 추진 선박, 수상스키 견인, 패러세일링 및 광고판 견인은 기준선으로부터 200미터 밖에서 운항할 수 있습니다."},{"i":37,"x":"모든 선박은 Capitania dos Portos(항만청) 또는 그 하위 기관(Delegacia 및 Agência)에 등록(inscrição)해야 합니다."},{"i":38,"x":"처벌 수위 결정을 위한 재위반이란 12개월 이하의 기간 내에 동일한 위반을 반복하는 것을 말합니다."},{"i":39,"x":"재위반은 위반에 대한 가중 사유입니다."},{"i":40,"x":"수입된 구명 장비를 선상에서 사용하려면, 소유자는 DPC(Diretoria de Portos e Costas, 항만연안국)에서 형식 승인(homologação)을 받아야 합니다."},{"i":41,"x":"내수용으로 분류된 선박은 어느 Arrais-Amador(소형선박 조종면허) 소지자든 조종할 수 있습니다."},{"i":42,"x":"원양(alto-mar)용으로 분류된 선박이 해당 등급의 해역을 항해할 때에는 Capitão-Amador(원양 항해 면허) 소지자만 조종할 수 있습니다."},{"i":43,"x":"항해를 나가기 전에 항해 계획서 또는 출항 신고서를 제출하는 것은 의무입니다."},{"i":44,"x":"압수된 선박은 Autoridade Marítima(해사 당국)가 지정한 장소에 보관되어야 합니다."},{"i":45,"x":"안전 구역은 통항과 투묘가 금지된 구역입니다."},{"i":46,"x":"선상의 모든 사람은 선장(Comandante)의 권한에 따라야 합니다."},{"i":47,"x":"선장은 직무 수행 중 사람, 선박 및 운송 화물의 안전을 보장하기 위해 어떤 사람에게든 하선을 명령할 수 있습니다."},{"i":48,"x":"엔진 추진 또는 범선은 관할 해사 당국이 정한 반대 규정이 없는 경우 투묘를 위해 기준선에 접근할 수 있습니다. 모든 접근은 기준선에 수직으로, 3(세) 노트 이하의 속력으로 하여 해수욕객의 안전을 지켜야 합니다."},{"i":49,"x":"외해(원양) 항행으로 분류된 선박이 내수에서 항해할 때에는, 구명 장비 및 항해 장비의 최소 비치 기준으로 내항(interior de porto) 항행 기준이 요구됩니다."},{"i":50,"x":"책임 서약서(Termo de Responsabilidade)는 스포츠 및/또는 레저용 선박의 소유자가 자기 선박의 운항 상태에 대한 책임을 지는 문서입니다."},{"i":51,"x":"RLESTA에 따르면 해상 경로 또는 해상 경로와 내수 항로를 이용하여 브라질 영토 내 항구나 지점 사이에서 이루어지는 항행을 연안 항행(cabotagem)이라고 합니다."},{"i":52,"x":"RLESTA에 따르면 브라질 항구와 외국 항구 사이에서 이루어지는 항행은 원양 항행(longo curso)으로 분류됩니다."},{"i":53,"x":"하천, 호수, 운하, 석호, 만, 후미, 작은 만 및 보호된 해역 등 내수 수로에서 이루어지는 항행은 내수 항행(interior)으로 분류됩니다."},{"i":54,"x":"NORMAM-03에 따르면, 스포츠 및/또는 레저 활동이나 스포츠 연습에 사용되는 부유 기구와 무동력 소형 선박의 조종자만이 조종면허 제시 의무가 면제됩니다."},{"i":55,"x":"허용 속력을 초과하여 운항하면 벌금 또는 최대 30일의 면허 정지 처분을 받습니다."},{"i":56,"x":"수온은 선박의 조종 조건을 변화시키지 않는 요소입니다."},{"i":57,"x":"키(타)는 금속 또는 목재 구조물로, 선박의 방향을 잡고 정해진 침로를 유지하는 것을 목적으로 합니다."},{"i":58,"x":"프로펠러는 날개가 달린 금속 구조물로, 종방향 축을 통해 엔진에 연결되어 자체 회전으로 선박을 움직이는 역할을 합니다."},{"i":59,"x":"닻(앵커)은 해저에 걸릴 수 있는 금속 부품으로, 선박이 투묘 상태, 즉 위치에서 이동하지 않도록 유지해 줍니다."},{"i":60,"x":"닻(앵커)을 닻줄 보관고(paiol da amarra)나 선박 갑판에 연결하는 체인 또는 로프를 닻줄(앵커 체인, amarra)이라고 합니다."},{"i":61,"x":"투묘나 양묘 작업은 항상 바람, 조류, 조석 조건을 살피며, 그중 우세한 쪽에 선수를 맞추도록(정렬하도록) 해야 합니다."},{"i":62,"x":"좋은 묘박지의 조건으로 필요하지 않은 것 중 하나는 허가된 구역 밖에 투묘하지 않도록 공간이 제한되어 있는 것입니다."},{"i":63,"x":"접안할 때는 일반적으로 안벽에 45° 각도로 접근하여 가능한 한 빨리 선수 계류줄을 건네고, 키(타)를 안벽 반대쪽으로 돌려 선미를 안벽 쪽으로 이동시킵니다."},{"i":64,"x":"주요 계류줄은 lançante(선수·선미줄), espringue(스프링줄), través(브레스트줄)입니다."},{"i":65,"x":"“espia”는 선박을 접안하는 작업에 사용되는 계류줄입니다."},{"i":66,"x":"선박을 접안할 장소에 조류가 있으면 그 효과를 이용하여 조류를 거슬러 접안하며, 전방으로 향하는 줄 하나와 후방으로 향하는 줄 하나를 건넵니다."},{"i":67,"x":"선박을 이안할 때는 일반적으로 후방 계류줄을 먼저 풀고, 선미를 벌리도록 조종하며 키(타)의 효과를 이용해 선미를 떼어낸 다음 전방 계류줄을 풉니다."},{"i":68,"x":"선수 쪽에서 조류가 올 때는 이안이 더 쉬우며, 전방 계류줄을 먼저 늦추고 후방 계류줄은 팽팽하게 유지합니다."},{"i":69,"x":"닻 부표(bóia de arinque)는 닻(앵커)이 해저에 있는 위치를 표시하는 데 사용됩니다."},{"i":70,"x":"접안한 선박이 후방으로 밀리는 것을 막는 기능을 하는 줄을 선수줄(lançante de proa)이라고 합니다."},{"i":71,"x":"선박에서 안벽에 수직으로 나가는 계류줄을 브레스트줄(través)이라고 합니다."},{"i":72,"x":"우회전(시계 방향) 프로펠러 하나를 가진 선박이 키(타)를 중앙에 두고 후진할 때, 선수는 천천히 우현 쪽으로 회두합니다."},{"i":73,"x":"좌회전(반시계 방향) 프로펠러 하나를 가진 선박이 키(타)를 중앙에 두고 전진할 때, 천천히 좌현 쪽으로 회두하는 경향이 있습니다."},{"i":74,"x":"우회전(시계 방향) 프로펠러 하나를 가진 선박이 키(타)를 우현으로 두고 후진할 때, 선수는 천천히 우현 쪽으로 회두합니다."},{"i":75,"x":"조선에서 양묘(suspender)란 닻(앵커)을 거두어들이며 선박이 투묘 장소를 떠나는 것을 말합니다."},{"i":76,"x":"Danforth 닻(앵커)은 스포츠 및 레저용 선박에서 가장 흔히 쓰입니다."},{"i":77,"x":"키(타)는 기본적으로 타두재(madre), 타병(cana), 타판(porta)으로 나뉩니다."},{"i":78,"x":"바람이나 조류가 안벽에 수직인 상태에서 풍상(barlavento) 쪽으로 접근하여 접안할 때는, 선박을 안벽과 평행하게 하고 낮은 속력으로 접근해야 합니다."},{"i":79,"x":"바람이나 조류가 안벽에 수직인 상태에서 풍하(sotavento) 쪽으로 접근하여 접안할 때는, 선박을 안벽과 약 45° 각도로 하여 접근해야 합니다."},{"i":80,"x":"바람이나 조류가 안벽과 평행한 상태에서 접안할 때는, 항상 바람이나 조류를 거슬러 안벽과 예각을 이루며 접근해야 합니다."},{"i":81,"x":"바람과 조류가 없을 때 안벽에서 떠나려면, 키(타)를 안벽 반대쪽으로 두고 기관을 저속 전진으로 하며, 후방에서 전방으로 향하는 줄을 제외한 모든 계류줄을 풉니다."},{"i":82,"x":"바람과 조류가 선수 쪽에서 올 때 안벽에서 떠나려면, 선미에서 전방으로 향하는 줄을 제외한 모든 계류줄을 풀고, 키(타)를 안벽 반대쪽으로 유지합니다."},{"i":83,"x":"바람과 조류가 선미 쪽에서 올 때 안벽에서 떠나려면, 선수에서 후방으로 향하는 줄을 제외한 모든 계류줄을 풀고, 키(타)를 안벽 쪽으로 유지합니다."},{"i":84,"x":"레저용 보트를 Danforth 닻(앵커)으로 투묘할 때는 단단한 모래 저질의 묘박지를 피해야 합니다."},{"i":85,"x":"일반적인 투묘에서 내어줄 닻줄(앵커 체인)의 양을 정하는 간단한 규칙은 최소 현지 수심의 3배입니다."},{"i":86,"x":"악천후의 위험이 있거나 투묘가 매우 오래 지속될 경우, 선박이 위치를 벗어나지 않도록 안전하게 내어줄 닻줄(앵커 체인)의 규칙은 현지 수심의 5배입니다. 날씨가 좋을 때는 현지 수심의 3배입니다."},{"i":87,"x":"선박을 계류하기 위해 부표를 잡을 때는 선수를 부표 쪽으로 향하고 낮은 속력으로 접근해야 합니다."},{"i":88,"x":"해저의 종류(저질 – 진흙, 암반, 모래, 자갈, 펄 등)를 “tença”라고 합니다."},{"i":89,"x":"선박의 선회 공간이 제한된 구역에서는 투묘를 피해야 합니다."},{"i":90,"x":"묘박지에서 양묘할 때, 닻줄(앵커 체인)이 전방으로 팽팽하게 당겨져 있으면 기관을 저속 전진으로 하면서 닻(앵커)을 거두어들여야 합니다."},{"i":91,"x":"서로 시계 안에 있는 선박 사이에 충돌 위험이 확실히 존재하려면, 방위가 일정하고 거리가 줄어드는 상황이어야 합니다."},{"i":92,"x":"제한된 시계(안개, 연기)에서 다른 선박이 충돌 위험 상황에 있음을 탐지한 선박은, 상대 선박의 동작과 관계없이 미리 피항 동작을 취해야 합니다."},{"i":93,"x":"투묘하려면 기관을 역전시키고, 선박이 후진하기 시작할 때 닻(앵커)을 내립니다."},{"i":94,"x":"프로펠러가 두 개인 선박에서 하나는 후진, 다른 하나는 전진으로 같은 회전수를 주면, 선박은 후진하는 프로펠러와 같은 쪽으로 선수를 돌리는 경향이 있습니다."},{"i":95,"x":"조류와 바람이 있을 때 투묘하는 경우, 선박의 갑판 위에 높은 구조물이 있으면 선수를 바람 쪽으로 향해야 합니다."},{"i":96,"x":"좁은 수로에서 두 선박이 반대 침로로 서로 접근하며 항해할 때는, 두 선박 모두 각자의 우현 쪽 가장자리를 따라 항해해야 합니다."},{"i":97,"x":"완전히 올바른 대응 관계는 다음과 같습니다: 우현 – 선박의 오른쪽, 좌현 – 선박의 왼쪽, 전방 – 앞쪽, 후방 – 뒤쪽."},{"i":98,"x":"“항행 중(em movimento)”이라는 용어는 투묘, 육지 계류 또는 좌초 상태가 아닌 모든 선박에 적용됩니다."},{"i":99,"x":"“조종 능력이 제한된 선박”이라는 용어는 작업의 성격상 조종 능력이 제한되어 있는 선박을 말합니다."},{"i":100,"x":"야간에 수직선상으로 배열된 세 개의 붉은색 전주등을 표시한 대형 선박을 보면 주의하십시오. 흘수로 인해 조종 능력이 제한된 선박을 마주하고 있는 것입니다."},{"i":101,"x":"“범선(embarcação a vela)”이라는 용어는 추진 기관이 있더라도 사용하지 않고 돛으로 항행하는 모든 선박을 말합니다."},{"i":102,"x":"선박이 바람, 조석 또는 조류에 밀려 닻(앵커)을 해저에 끌며 움직이는 것을 주묘(garrando)라고 합니다."},{"i":103,"x":"선박이 추진력이 없어 조종할 수 없고 바람과 조석에 떠밀려 가는 상태를 표류(à matroca)라고 합니다."},{"i":104,"x":"선회 성능 측면에서 프로펠러가 두 개인 선박이 하나인 선박보다 유리한 점은, 프로펠러가 조타에 미치는 효과가 서로 상쇄되어 선박이 오직 키(타)의 작용만 받는다는 것입니다."},{"i":105,"x":"거친 바다에서 큰 파도를 넘으려면 엔진을 다음과 같이 가속·감속해야 합니다: 파도를 오를 때 가속하고, 내려가기 전에 감속합니다."},{"i":106,"x":"선박을 안벽이나 잔교에 묶거나 고정하는 행위를 접안하다(atracar)라고 합니다."},{"i":107,"x":"키(타)를 한쪽 현으로 정해진 표준 각도만큼 돌리고 정해진 표준 속력으로 항행할 때 선박이 그리는 곡선을 “표준 선회권(Curva de Giro Padrão)”이라고 합니다."},{"i":108,"x":"정상적인 상황에서 선박의 프로펠러가 오른쪽(시계 방향)으로 회전하면 물을 후방으로 밀어내어 선박을 전방으로 추진합니다."},{"i":109,"x":"선박 길이의 어느 지점에서든 현측에서 측정한, 수면에서 주 갑판(보통 갑판)까지의 거리를 “건현(Borda Livre)”이라고 합니다."},{"i":110,"x":"선수 부근의 우현과 좌현 현측 곡면 부분을 선수 쪽 현측(바우, bochecha)이라고 합니다(좌현 바우와 우현 바우)."},{"i":111,"x":"선미 부근의 우현과 좌현 현측 곡면 부분을 선미 쪽 현측(쿼터, alheta)이라고 합니다(좌현 쿼터와 우현 쿼터)."},{"i":112,"x":"선박에 엔진이 두 개(축 두 개, 프로펠러 두 개) 있을 때 한쪽 프로펠러의 회전수가 다른 쪽보다 낮으면, 선박은 회전수가 낮은 프로펠러 쪽 현으로 향하는 경향이 있습니다."},{"i":113,"x":"선박의 탱크들이 절반만 차 있고 선창(porão)에 상당한 양의 물이 있다면, 선박의 복원성은 분명 “자유 표면(superfície livre)” 효과의 영향을 받고 있는 것입니다."},{"i":114,"x":"선체 중앙부에 무게가 많고 선수와 선미에 무게가 적은 선박은 중간이 부러질 수 있습니다. 이 상태를 새깅(contra-alquebramento)이라고 합니다."},{"i":115,"x":"선박의 선미에서 선수를 바라보고 서 있을 때, 오른쪽이 우현이라고 할 수 있습니다."},{"i":116,"x":"왼쪽(좌현) 또는 오른쪽(우현)으로 돌리면 키(타)를 움직이는 회전 장치를 조타륜(roda de leme 또는 timão)이라고 합니다."},{"i":117,"x":"접안 시 선박의 계류줄을 고정하기 위해 안벽이나 잔교에 설치된 부품을 계선주(cabeço)라고 합니다."},{"i":118,"x":"선박의 구성 부분에는 갑판, 현측, 용골(킬), 선수 쪽 현측(바우), 선미 쪽 현측(쿼터)이 있습니다."},{"i":119,"x":"국제해상충돌예방규칙(RIPEAM/COLREG)은 국제 항행 규칙, 등화와 형상물, 그리고 음향신호를 사용하여 해상 충돌을 방지하는 것을 목적으로 합니다."},{"i":120,"x":"국제해상충돌예방규칙(RIPEAM/COLREG)을 위반하면 면허가 최대 60일까지 정지될 수 있습니다."},{"i":121,"x":"마주치는 상태, 즉 선수와 선수가 마주한 상황에서는 각 선박이 자기 우현 쪽으로 조종(회두)해야 합니다."},{"i":122,"x":"횡단 상태에서는 상대 선박을 자기 좌현 쪽에서 보는 선박, 즉 상대 선박의 녹색등을 보는 선박이 통항 우선권을 가집니다."},{"i":123,"x":"범선은 동력선에 대해 조종상 우선권을 가집니다."},{"i":124,"x":"범선 한 척과 모터보트 한 척이 횡단 상태로 항해하고 있었습니다. 통항 우선권이 있던 범선은 조종하지 않고 모터보트가 회두하기를 기다렸고, 그사이 빠르게 접근했습니다. 두 선박은 충돌했습니다. 결론은 다음과 같습니다: 모터보트가 사고를 피하기 위해 조종하지 않은 잘못이 있지만, 범선도 책임을 면할 수 없습니다. 피항 의무가 있는 선박이 조종하지 않을 경우 우선권이 있는 선박도 충돌을 피하기 위해 조종해야 하기 때문입니다."},{"i":125,"x":"모든 조종은 충분히 미리, 명확하고 확실하게 하여 상대 선박에게 움직임이 바뀌었음을 보여 주어야 합니다."},{"i":126,"x":"하천에서 스포츠 및 레저용 모터보트 두 척이 반대 침로로 항해하는 경우, 조류를 따라 내려오는 선박은 하천 중앙에, 다른 선박은 자기 우현 쪽 가장자리에 위치해야 하며, 조류를 따라 내려오는 선박이 우선권을 가집니다."},{"i":127,"x":"좁은 수로에서 선박은 자기 우현에 더 가까운 쪽 가장자리를 따라 항해해야 하며, 충돌 위험을 확인하면 항상 우현으로 조종해야 합니다."},{"i":128,"x":"수로나 하천, 특히 좁은 곳에서는 큰 선박이 소형 선박에 대해 우선권을 가집니다."},{"i":129,"x":"“안전 속력”이란 충돌을 피하기 위한 적절하고 효과적인 동작을 취할 수 있고, 당시의 상황과 조건에 맞는 적절한 거리 내에서 정지할 수 있는 속력입니다. 하천이나 수로 가장자리에 접안하거나 투묘한 다른 선박 옆을 지날 때는 속력을 줄여야 합니다."},{"i":130,"x":"한 선박이 다른 선박을 추월하는 경우, 속력이 더 빠른 선박(추월선)은 통항 우선권이 없으며, 안전하게 상대 선박을 지나 앞으로 나아가도록 조종해야 합니다."},{"i":131,"x":"스포츠 및 레저용 선박에서 가장 흔한 항해등은 전방의 백색등, 백색 선미등, 그리고 녹색과 붉은색의 현등을 조합한 것입니다."},{"i":132,"x":"기적, 경적 또는 종으로 낼 수 있는 음향신호는 조종, 경고 및 저시정 상황에서 사용됩니다."},{"i":133,"x":"단음은 약 1초 동안 지속됩니다."},{"i":134,"x":"장음은 4~6초 동안 지속됩니다."},{"i":135,"x":"단음 1회는 “나는 우현으로 회두하고 있다”를 의미합니다."},{"i":136,"x":"단음 2회는 “나는 좌현으로 회두하고 있다”를 의미합니다."},{"i":137,"x":"단음 3회는 “나는 기관을 후진하고 있다”를 의미합니다."},{"i":138,"x":"장음 2회 후 단음 1회는 “나는 당신의 우현 쪽으로 추월하려 한다”를 의미합니다."},{"i":139,"x":"장음 2회 후 단음 2회는 “나는 당신의 좌현 쪽으로 추월하려 한다”를 의미합니다."},{"i":140,"x":"단음 5회 이상은 “당신의 조종 의도를 이해하지 못했다”를 의미합니다."},{"i":141,"x":"2분마다 장음 1회는 “제한된 시계에서 대수속력이 있는 동력선”을 의미합니다."},{"i":142,"x":"2분마다 장음 2회는 “제한된 시계에서 기관으로 항행 중이나 정지하여 대수속력이 없는 선박이 있다”를 의미합니다."},{"i":143,"x":"조종불능선은 범선, 조종 능력이 제한된 선박 및 어로에 종사하는 선박에 대해 우선권을 가집니다."},{"i":144,"x":"예인 길이가 200미터 미만인 선박은 마스트에 백색등 2개를 표시해야 합니다."},{"i":145,"x":"예인 길이가 200미터를 초과하는 선박은 마스트에 백색등 3개를 표시해야 합니다."},{"i":146,"x":"위험 화물을 운반하는 대형 선박은 야간에 마스트 꼭대기에 붉은색등 1개를 표시해야 합니다."},{"i":147,"x":"낮에 마스트에 검은색 구형 형상물을 단 선박을 보면, 그 선박은 투묘 중이라는 뜻입니다."},{"i":148,"x":"시계가 나쁜 하천 굽이나 좁은 수로에서는 주의를 끌기 위해 장음 1회를 울려야 합니다. 가려져 보이지 않는 선박들은 이 신호에 장음 1회로 응답해야 합니다."},{"i":149,"x":"반대 방향에서 오는 선박과 서로 지나칠 때 가장 올바른 방법은 좌현 대 좌현으로 지나는 것입니다."},{"i":150,"x":"선박이 안벽에 접안해 있을 때는 항해등을 사용해서는 안 됩니다."},{"i":151,"x":"기적이 없을 경우 선박은 경적이나 종을 사용하여 의도를 신호할 수 있습니다."},{"i":152,"x":"길이 5미터 미만의 무동력 스포츠 및 레저용 선박은 경적 또는 이를 대체하는 장치를 사용할 의무가 면제됩니다."},{"i":153,"x":"주 마스트 또는 가장 잘 보이는 곳에 게양된 검은색 구형 형상물은 위험 신호가 아닙니다."},{"i":154,"x":"야간에 수로를 가로지르는 황색 섬광등은 고속으로 항행하는 선박일 수 있습니다."},{"i":155,"x":"스포츠 및 레저용 선박은 가능한 한 통항로를 횡단하는 것을 피해야 하지만, 그러한 조종이 필요한 경우에는 가장 짧은 경로인 통항로에 수직으로, 가능한 한 빠르게 횡단해야 합니다."},{"i":156,"x":"현등, 마스트등 및 선미등은 야간에 선박의 움직임을 더 잘 식별할 수 있도록 일정한 광호(섹터)를 비추게 되어 있습니다."},{"i":157,"x":"탐조등은 다른 선박을 향해 비추어 그 선박에 위험을 알리는 데 사용할 수 있습니다."},{"i":158,"x":"일반적으로 항로표지로 표시되는 상황은 다음과 같습니다: 자연적 위험물과 수로의 측방 한계, 중대한 해난 사고 지역, 새로운 위험물, 특수 작업이 진행 중인 구역."},{"i":159,"x":"항로표지에는 측방표지, 방위표지, 고립장애표지, 신위험물표지, 안전수역표지 및 특수표지가 있습니다."},{"i":160,"x":"특수표지의 주된 목적은 항해 관련 문서에 언급된 구역이나 특이 사항을 표시하는 것입니다."},{"i":161,"x":"특수표지의 두표는 황색 “X”입니다."},{"i":162,"x":"낮에 표지를 식별하는 것은 두표, 형태 및 색상으로 합니다."},{"i":163,"x":"무등 부표(bóia cega)는 빛을 내지 않는 부표입니다."},{"i":164,"x":"야간에 항로표지를 식별하는 것은 등화의 점등 리듬과 색상으로 합니다. 다시 말해, 야간에는 등화의 색상과 리듬으로 항로표지를 알아볼 수 있습니다."},{"i":165,"x":"항로표지 체계에는 RACON이라는 장치가 있을 수 있으며, 이는 레이더 화면에 신호를 나타내어 표지의 식별을 쉽게 해 주는 시스템입니다."},{"i":166,"x":"같은 표지 두 개를 겹쳐 설치하는 이중 항로표지를 사용하는 유일한 경우는 아직 해도에 기재되지 않은 고립 장애물이 있는 경우입니다."},{"i":167,"x":"좌현 부표는 야간에 녹색 빛을 냅니다."},{"i":168,"x":"입항하는 사람의 우현에 위치하는 수로 측방표지는 붉은색입니다."},{"i":169,"x":"입항하는 사람의 좌현에 위치하는 수로 측방표지는 녹색입니다."},{"i":170,"x":"우현 부표는 야간에 붉은색 빛을 냅니다."},{"i":171,"x":"안전수역을 나타내는 항로표지는 백색과 붉은색입니다."},{"i":172,"x":"고립 장애물을 나타내는 항로표지는 흑색과 붉은색입니다."},{"i":173,"x":"4(네) 개의 사분면을 기준으로 배치된 부표나 입표로 표시되는 항로표지를 방위표지라고 합니다."},{"i":174,"x":"북방위표지의 두표는 꼭짓점이 위를 향한 두 개의 검은 원뿔을 위아래로 겹친 것입니다."},{"i":175,"x":"남방위표지의 두표는 꼭짓점이 아래를 향한 두 개의 검은 원뿔을 위아래로 겹친 것입니다."},{"i":176,"x":"동방위표지의 두표는 두 개의 검은 원뿔을 밑면끼리 맞대어 위아래로 겹친 것입니다."},{"i":177,"x":"서방위표지의 두표는 두 개의 검은 원뿔을 꼭짓점끼리 맞대어 위아래로 겹친 것입니다."},{"i":178,"x":"그 표지를 기준으로 안전한 수역이 있는 사분면을 나타내는 항로표지(방위표지)는 황색과 흑색입니다."},{"i":179,"x":"우선 항로의 측면을 구획하는 부표는 녹색과 붉은색(빨간색)입니다."},{"i":180,"x":"야간에 방위표지, 고립장애표지 및 안전수역표지의 등화 색상은 백색입니다."},{"i":181,"x":"항로표지 부표는 등화 표시 여부에 따라 무등 부표 또는 등부표가 될 수 있습니다."},{"i":182,"x":"야간에 우현 쪽 우선 항로 표지가 내는 빛의 색은 녹색입니다."},{"i":183,"x":"야간에 좌현 쪽 우선 항로 표지가 내는 빛의 색은 붉은색입니다."},{"i":184,"x":"수로 항로표지의 번호는 수로 입구에서부터 오름차순으로 매겨집니다."},{"i":185,"x":"흑색 바탕에 하나 이상의 붉은색 수평 띠가 있는 부표는 고립 장애물을 나타냅니다."},{"i":186,"x":"백색과 붉은색의 수직 줄무늬가 있는 부표는 안전수역을 나타냅니다."},{"i":187,"x":"수로 측방 부표의 형태는 원통형, 기둥형, 원재형(spar) 또는 원뿔형입니다."},{"i":188,"x":"고정교 주 경간의 보 중앙에는 백색 급섬광등을 표시해야 합니다."},{"i":189,"x":"수로(hidrovia)의 항로표지에서 “X” 표지는 반대편 강가로 건너가라는 뜻입니다."},{"i":190,"x":"수로(hidrovia)의 항로표지에서 “H” 표지가 보이면 수로 중앙으로 항행하라는 뜻입니다."},{"i":191,"x":"수로(hidrovia)의 항로표지에서 “Y” 표지는 수로의 분기를 뜻합니다."},{"i":192,"x":"수로(hidrovia)의 항로표지에서 “+” 표지는 고립 장애물을 뜻합니다."},{"i":193,"x":"수로(hidrovia)의 항로표지에서 “ ” 표지는 강가에 붙은 수로를 뜻합니다."},{"i":194,"x":"항행 가능한 하천 위 다리의 교각에 두 개의 황색 마름모가 측면 꼭짓점끼리 연결되어 있다면, 이는 일방 통항만 허용된다는 뜻입니다."},{"i":195,"x":"선박을 몰고 수로 분기점에 접근하던 항해자가 두 가지 색의 항로표지를 만났고, 더 깊은 수심이 자신의 우현 쪽 수로에 있음을 확인했다면, 항해자가 본 두 색은 붉은색 수평 띠가 있는 녹색입니다."},{"i":196,"x":"항행 가능한 하천 위 다리의 교각에 황색 마름모 하나가 있다면, 이는 양방향 통항이 허용된다는 뜻입니다."},{"i":197,"x":"항행 가능한 하천 위 다리의 교각에 녹색으로 칠해진 삼각형이 있다면, 이는 하천을 내려가거나 올라가는 사람의 오른쪽으로 통항한다는 뜻입니다."},{"i":198,"x":"항행 가능한 하천 위 다리의 교각에 붉은색으로 칠해진 삼각형이 있다면, 이는 하천을 내려가거나 올라가는 사람의 왼쪽으로 통항한다는 뜻입니다."},{"i":199,"x":"항행 가능한 하천 위 다리의 교각에 녹색으로 칠해진 직사각형이 있다면, 이는 하천을 내려가거나 올라가는 사람의 오른쪽으로 통항한다는 뜻입니다."},{"i":200,"x":"항행 가능한 하천 위 다리의 교각에 넓은 백색 수평 띠가 있는 붉은색 직사각형이 있다면, 이는 통항이 금지되어 있다는 뜻입니다."},{"i":201,"x":"야간에 황색 빛을 내는 부표는 레저 구역을 뜻합니다."},{"i":202,"x":"야간에 깜박이는 녹색등이 보였고, 해도로 확인해 보니 항구 입구에 접근하고 있었습니다. 이 표지의 형태는 원통형일 가능성이 높습니다."},{"i":203,"x":"낮에 위쪽에 두 개의 검은 구가 달린 기둥 형태의 표지를 보았습니다. 아마도 고립 장애물을 마주하고 있는 것입니다."},{"i":204,"x":"낮에 위쪽에 두 개의 검은 원뿔이 달린 기둥을 보았습니다. 아마도 안전한 수역이 있는 사분면을 나타내는 표지(방위표지)를 마주하고 있는 것입니다."},{"i":205,"x":"항내 항로표지는 정해진 규칙에 따르며, 항해자는 안전한 항행을 위한 지침으로 이를 활용해야 합니다."},{"i":206,"x":"두 동력선이 거의 또는 정반대 침로로 접근하여 충돌 위험이 있을 때는 “좌현 대 좌현”으로 지나가야 합니다."},{"i":207,"x":"안전수역표지는 항행 가능한 수역을 의미합니다."},{"i":208,"x":"안전수역표지의 두표는 붉은색 구 하나입니다."},{"i":209,"x":"국제해상충돌예방규칙(RIPEAM/COLREG)은 공해 및 이와 연결되어 원양 선박이 항행할 수 있는 모든 수역의 모든 선박, 그리고 내수의 선박에 적용됩니다."},{"i":210,"x":"브라질이 속한 항로표지 지역은 “B” 지역(IALA B지역)이라고 합니다."},{"i":211,"x":"브라질에서 “항로표지의 관례적 방향”, 즉 항로표지 번호는 항상 바다에서 들어오는 방향으로, 하천 항행의 경우에는 강을 거슬러 올라가는 방향으로 증가합니다."},{"i":212,"x":"잠수 작업 중인 선박은 ALFA기를 게양해야 합니다."},{"i":213,"x":"돛으로 항행하면서 기관 추진도 함께 사용하는 선박은 전방의 가장 잘 보이는 곳에 꼭짓점이 아래를 향한 원뿔형 형상물을 표시해야 합니다."},{"i":214,"x":"다른 선박의 정횡 후방 22.5°를 넘는 방향에서 더 빠른 속력으로 접근하는 선박은 추월선으로 간주해야 합니다."},{"i":215,"x":"항해자가 리우데자네이루에서 벨렝으로 간다면, 그는 연안 항행(cabotagem)을 하는 것입니다."},{"i":216,"x":"길이 12미터 미만의 동력선은 국제해상충돌예방규칙(RIPEAM/COLREG) 제23조 a)항에 규정된 등화 대신 백색 전주등 1개와 현등을 표시할 수 있습니다."},{"i":217,"x":"“correr com o tempo(폭풍을 따라 달리기)”라는 표현은 폭풍우를 견디기 위해 파도를 선미 쪽 현측(쿼터)으로 받으며 감속하여 항해하는 것을 뜻합니다."},{"i":218,"x":"야간에 수직선상으로 배열된 두 개의 붉은색 전주등을 표시한 선박은 조종불능선입니다."},{"i":219,"x":"길이 12미터 미만의 스포츠 및 레저용 선박은 보통 결합형 현등(녹색과 붉은색)과 백색 전주등 1개를 표시합니다."},{"i":220,"x":"선미에 가능한 한 가깝게, 또는 트랜섬에 설치되어 후방에서 오는 사람에게만 135°의 수평 광호로 보이는 백색 연속등을 선미등이라고 합니다."},{"i":221,"x":"선미등과 같은 특성을 가지며 그 위에 설치된 황색등을 예선등이라고 합니다."},{"i":222,"x":"선박의 마스트에 설치되어 정횡이나 선수 방향에서 오는 사람에게 225°의 수평 광호로 보이는 백색 연속등을 마스트등이라고 합니다."},{"i":223,"x":"길이 20미터 미만의 범선은 야간에 항행 중일 때 마스트의 가장 잘 보이는 곳에 결합형 등을 표시할 수 있습니다."},{"i":224,"x":"주간에만 운항하도록 “형식”별로 표준화된 등급의 순수 범선은 구명조끼를 제외한 규정 구명 장비의 비치 의무가 면제됩니다."},{"i":225,"x":"길이 50미터 미만의 선박이 가장 잘 보이는 곳에 백색등 1개를 표시하고 있다면 투묘 중입니다."},{"i":226,"x":"길이 100미터 이상의 선박이 제한된 시계에서 투묘 중일 때는 전방에서 종을, 후방에서 징(gongo)을 울려야 합니다."},{"i":227,"x":"하천 표지에서 좌안(margem esquerda)이란 강을 내려가는 사람(상류에서 하류 방향)의 왼쪽에 있는 강가를 말합니다."},{"i":228,"x":"길이 12미터를 넘는 동력선이 가장 잘 보이는 곳에 백색등 1개를 표시하고 있다면 투묘 중입니다."},{"i":229,"x":"방위표지 부표는 북, 동, 남, 서입니다(이것이 4개의 사분면입니다)."},{"i":230,"x":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면, 좁은 수로에서 어떤 선박이 나를 추월하면서 장음 2회와 단음 1회를 울릴 때, 추월에 동의한다면 4회의 기적(장음, 단음, 장음, 단음)을 울리고, 나의 우현 쪽으로 안전하게 추월할 수 있도록 조종해야 합니다."},{"i":231,"x":"북방위표지 부표를 만나면, 그 부표의 남쪽, 동쪽, 서쪽으로 항행하는 것이 위험하다는 것으로 이해합니다."},{"i":232,"x":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면, 충돌 위험 상황에서 조종할 의무가 없는 선박을 “우선권이 있는 선박”이라고 합니다."},{"i":233,"x":"선상 사고 발생 시 부상자가 숨을 쉬지 않으면 입-대-입 인공호흡을 실시해야 합니다."},{"i":234,"x":"입-대-입 인공호흡에서 분당 불어넣는 횟수는 10~15회입니다."},{"i":235,"x":"입-대-입 인공호흡을 하기 전에 입 안에 이물질이 있는지 먼저 확인해야 합니다."},{"i":236,"x":"입-대-입 인공호흡을 실시한 후에도 피해자의 심장이 뛰지 않는 것이 확인되면, 올바른 조치는 외부 심장 마사지(흉부 압박)를 하는 것입니다."},{"i":237,"x":"선상 사고 피해자의 심장이 뛰지 않으면 외부 심장 마사지(흉부 압박)를 시작해야 합니다."},{"i":238,"x":"심정지에 동반되는 증상 중 하나는 동공 확대입니다."},{"i":239,"x":"심정지 시 즉시 시도해야 하며 때때로 효과가 있는 것은 피해자의 가슴을 주먹으로 세게 한 번 치는 것입니다."},{"i":240,"x":"심장 마사지로 심장이 다시 뛰기 시작한 후에도 입-대-입 인공호흡은 계속해야 합니다."},{"i":241,"x":"외부 심장 마사지에서 가슴을 압박하고 이완하는 이상적인 빈도는 분당 69회입니다."},{"i":242,"x":"호흡 정지와 심정지가 동시에 있을 때는 심장 마사지 8회와 입-대-입 인공호흡 1회를 번갈아 실시해야 합니다."},{"i":243,"x":"입-대-입 인공호흡 시에는 피해자의 머리를 뒤로 젖혀 두어야 합니다."},{"i":244,"x":"아래팔(전완) 골절의 경우 판자, 골판지 또는 두꺼운 신문지로 고정할 수 있습니다."},{"i":245,"x":"부목(tala)은 천 조각으로 묶어 부러진 뼈를 고정하는 데 사용하는 도구입니다."},{"i":246,"x":"팔을 고정할 때는 구부린 상태로 두어야 합니다."},{"i":247,"x":"다리 골절의 경우, 다리를 곧게 편 상태에서 긴 나무를 천 조각이나 벨트로 묶어 고정할 수 있습니다."},{"i":248,"x":"부러진 다리의 발 위치는 가능한 한 가장 자연스러워야 합니다."},{"i":249,"x":"골절 피해자 근처에 화재나 폭발 위험이 있으면, 먼저 피해자를 위험 장소에서 옮겨야 합니다."},{"i":250,"x":"감전 피해자는 전기가 통하지 않는 재료를 사용하여 전류와의 접촉에서 떼어내야 합니다."},{"i":251,"x":"금속 조각은 피해자를 전류와의 접촉에서 떼어내는 데 사용해서는 안 되는 재료 중 하나입니다."},{"i":252,"x":"피해자를 전류와의 접촉에서 떼어낸 후, 필요하다면 입-대-입 인공호흡과 외부 심장 마사지를 실시해야 합니다."},{"i":253,"x":"작은 화상은 물로 씻고 물집을 터뜨리지 않도록 해야 합니다."},{"i":254,"x":"큰 화상의 경우 절대로 피해자의 옷을 벗겨서는 안 됩니다."},{"i":255,"x":"2도 화상은 물집과 삼출액이 나타나는 것이 특징입니다."},{"i":256,"x":"3도 화상에서는 진피가 완전히 파괴됩니다."},{"i":257,"x":"출혈(hemorragia)은 많은 양의 피를 잃는 것입니다."},{"i":258,"x":"피가 눈에 보이는 경우에는 외출혈이라고 합니다."},{"i":259,"x":"출혈을 멈추려면 두꺼운 천으로 해당 부위를 눌러야 합니다."},{"i":260,"x":"출혈 피해자는 쇼크를 막기 위해 따뜻하게 해 주어야 합니다."},{"i":261,"x":"피해자에게 해를 가장 적게 주는 지혈(hemostasia) 방법은 압박입니다."},{"i":262,"x":"지혈대(torniquete)는 매우 큰 출혈을 멈추는 데 사용합니다."},{"i":263,"x":"지혈대는 넓은 천과 나무 막대를 사용하여 적용하며, 매듭으로 나무를 천에 고정하고 나무를 비틀면 그 압력으로 출혈이 멈춥니다."},{"i":264,"x":"절단 부위 바로 위에 지혈대를 적용한 경우를 제외하고, 15분마다 조임을 풀어 주어야 합니다."},{"i":265,"x":"지혈대 사용 시 중요한 주의 사항은 다음과 같습니다: 출혈이 멈추지 않으면 계속 조이고, 출혈이 멈추었다고 바로 제거하지 않으며, 덮지 않고, 15분마다 조임을 풀어 줍니다."},{"i":266,"x":"대량 출혈 피해자에 대한 올바른 조치는 의식이 없는 동안 액체를 주지 않고, 따뜻하게 감싸 두는 것입니다."},{"i":267,"x":"응급처치는 의료 기관으로 이송하기 전에 시행하는 긴급 구호 조치입니다."},{"i":268,"x":"열사병(intermação)은 습하고 환기가 되지 않는 장소에서 과도한 열이 사람에게 작용하여 생기는 결과입니다."},{"i":269,"x":"부식성 물질, 일반 가성 물질 및 석유 제품을 삼킨 경우에는 물이나 우유를 마시게 하여 해당 물질을 희석하거나 중화합니다."},{"i":270,"x":"어떤 이유로 입-대-입 방법을 쓸 수 없을 때는 코를 통해 피해자에게 공기를 불어넣을 수 있습니다."},{"i":271,"x":"인체가 열을 더 빠르게 잃는 상태는 저체온증(Hipotermia)으로 생길 수 있습니다."},{"i":272,"x":"저체온증은 체온을 섭씨 35도 미만으로 떨어뜨릴 만큼 차가운 물이면 어떤 물에 의해서든 발생합니다."},{"i":273,"x":"저체온증의 경우 응급처치를 한 후 환자를 엎드린 자세(복와위)로, 약간 옆으로 기울여 두어야 합니다."},{"i":274,"x":"추위에 오래 노출되어 생기는 손상을 동상(Geladura)이라고 합니다."},{"i":275,"x":"다리 골절 피해자를 더 편하게 하기 위해 고정할 때 가장 좋은 자세는 다리를 곧게 편 자세입니다."},{"i":276,"x":"체내 혈액의 양은 약 6리터입니다."},{"i":277,"x":"가스 중독 시 피부가 푸르스름한 색을 띱니다."},{"i":278,"x":"상처의 감염을 막으려면 물과 비누로 씻고, 생리식염수로 상처를 적신 뒤 주기적으로 깨끗이 해야 합니다."},{"i":279,"x":"상처의 주요 합병증은 출혈과 감염입니다."},{"i":280,"x":"일사병(insolação)은 햇빛에 직접적이고 장시간 노출되어 생기는 결과입니다."},{"i":281,"x":"익수의 경우 다음과 같이 조치합니다: 익수자를 옆으로 눕혀 마신 물을 토하게 하고, 젖은 옷을 벗긴 뒤 몸을 따뜻하게 합니다."},{"i":282,"x":"익수자가 숨을 쉬지 않으면 옆으로 눕히고, 호흡을 막는 이물질을 입에서 제거한 뒤 입-대-입 인공호흡을 실시해야 합니다."},{"i":283,"x":"익수자의 심장이 뛰지 않으면 외부 심장 마사지(흉부 압박)를 실시해야 합니다."},{"i":284,"x":"화상 환자의 옷이 몸에 달라붙어 있으면 옷을 화상 부위 위에 그대로 두어야 합니다."},{"i":285,"x":"귀의 상처에서 맑은 액체가 나오는 것이 보이면 두개골 골절을 의미합니다."},{"i":286,"x":"내부 골절(폐쇄 골절)의 경우 즉시 해야 할 조치는 다친 부위를 고정하는 것입니다."},{"i":287,"x":"불은 화재 삼각형의 세 요소, 즉 가연물, 산소 공급원(산소) 및 발화 온도가 모두 있을 때에만 발생합니다."},{"i":288,"x":"가연물과 산소 공급원 사이에 화학 반응이 일어나 연소할 수 있는 가스를 만들어 내는 데 필요한 온도를 발화 온도라고 합니다."},{"i":289,"x":"연소는 발화 온도가 있는 상태에서 가연물과 산소가 만나 일으키는 반응입니다."},{"i":290,"x":"가연물은 산소와 발화 온도가 있을 때 탈 수 있는 자연의 물질입니다."},{"i":291,"x":"산소 공급원(comburente)은 가연물과 화학적으로 결합하여 연소를 일으킬 수 있는 모든 물질입니다. 자연에서 가장 쉽게 찾을 수 있는 산소 공급원은 산소입니다."},{"i":292,"x":"가연물에서 방출되는 가스를 산소 공급원만 있으면 점화시킬 수 있는 데 필요한 온도를 “발화점(Ponto de Ignição)”이라고 합니다."},{"i":293,"x":"스포츠 및 레저용 선박에서 가장 흔히 볼 수 있는 소화 장비는 휴대용 소화기입니다."},{"i":294,"x":"휴대용 소화기는 소화약제를 사용하여 불을 끄는 소화 장비입니다."},{"i":295,"x":"소화약제는 화재를 진압하는 물질입니다."},{"i":296,"x":"선상 화재 시 불길과 싸우려면 불길과 연기의 풍상(barlavento) 쪽에 위치합니다."},{"i":297,"x":"물 소화기는 고체 가연물 화재 진압에 사용해야 합니다."},{"i":298,"x":"“A”급 화재는 섬유질 또는 고체 가연물에서 발생하며, 잔불이나 재를 남깁니다. 예: 종이, 나무, 천."},{"i":299,"x":"CO2 소화기는 전원이 연결된 전기 장비 화재에 사용됩니다."},{"i":300,"x":"포말 소화기는 인화성 액체 화재에 사용됩니다."},{"i":301,"x":"“B”급 화재는 인화성 액체에서 발생하는 화재입니다."},{"i":302,"x":"“C”급 화재는 전원이 연결된 전기·전자 재료나 장비에서 발생하는 화재입니다."},{"i":303,"x":"물 소화기를 사용하려면 방아쇠를 당기고 불길의 밑부분을 향해 분사해야 합니다."},{"i":304,"x":"CO2 소화기를 사용하려면 안전핀을 뽑고, 분사구(혼)를 잡은 뒤 방아쇠를 당겨 불의 밑부분을 향해 분사해야 합니다."},{"i":305,"x":"포말 소화기를 사용하려면 소화기를 뚜껑이 아래로 가도록 뒤집고, 불길의 밑부분 위로 분사해야 합니다."},{"i":306,"x":"가연물을 멀리 치우고 주변 장소를 냉각하면 화재 진압에 큰 도움이 됩니다."},{"i":307,"x":"CO2 소화기 사용 시 주의할 점은 분사된 약제가 피부와 눈에 직접 닿지 않도록 하는 것입니다."},{"i":308,"x":"CO2 소화약제의 단점은 환기되지 않는 공간에서 사람을 질식시킬 수 있다는 것입니다."},{"i":309,"x":"물은 거주 구역 화재에 사용할 수 있는 소화약제입니다."},{"i":310,"x":"휴대용 소화기는 접근하기 쉽고 화재 위험이 있는 장소에 비치해야 합니다."},{"i":311,"x":"조타실에 있는데 엔진에서 타는 냄새가 나기 시작합니다. 가져와야 할 휴대용 소화기는 포말 소화기입니다."},{"i":312,"x":"선박의 선미에 있는데 항해 콘솔에서 연기가 나는 것이 보입니다. 가져와야 할 소화기는 CO2 소화기입니다."},{"i":313,"x":"휴대용 소화기가 없을 때는 물 양동이를 임시로 사용하여 불을 끌 수 있습니다."},{"i":314,"x":"선상에는 항상 연간 점검 유효기간 내의 휴대용 소화기를 갖추어야 합니다."},{"i":315,"x":"스포츠 및 레저용 선박의 휴대용 소화기 수량과 종류는 항해를 계속하기 위해 선상에서 충족해야 하며, DPC의 규범 문서(DPC의 NORMAM-03)에 정해져 있습니다."},{"i":316,"x":"고정식 소화 설비는 고정된 분사구를 갖춘 설비입니다."},{"i":317,"x":"접근하기 어려운 장소의 화재는 고정식 소화약제 설비로 진압합니다."},{"i":318,"x":"소화약제에는 물, CO2, 포말 및 분말 소화약제가 있습니다."},{"i":319,"x":"“D”급 화재용 소화약제는 건조 분말 소화약제(PQS)입니다."},{"i":320,"x":"나트륨, 칼륨, 마그네슘, 티타늄, 알루미늄과 같은 가연성 금속이 관련된 화재를 “D”급 화재라고 합니다."},{"i":321,"x":"“A”급 화재에 사용하는 소화기는 녹색 삼각형으로 표시됩니다."},{"i":322,"x":"“B”급 화재에 사용하는 소화기는 빨간색 사각형으로 표시됩니다."},{"i":323,"x":"“C”급 화재에 사용하는 소화기는 파란색 원으로 표시됩니다."},{"i":324,"x":"“D”급 화재에 사용하는 소화기는 노란색 별로 표시됩니다."},{"i":325,"x":"선상에 비치된 양이 제한적이기는 하지만 “A”급과 “B”급 화재에 가장 좋은 소화약제는 포말입니다."},{"i":326,"x":"건조 분말 소화약제(PQS) 소화기의 단점은 잔여물이 전자 장비를 손상시킬 수 있다는 것입니다."},{"i":327,"x":"에테르와 벤진은 휘발성 연료로 간주됩니다."},{"i":328,"x":"물을 보편적 약제로 하는 가장 오래된 소화 방법을 냉각 소화라고 합니다."},{"i":329,"x":"큰 불꽃을 일으키는 차단기처럼 규격이 맞지 않는 전기 자재로 인해 선상 화재가 발생하는 경우가 흔합니다."},{"i":330,"x":"연소는 그 속도에 따라 완전 연소, 불완전 연소, 자연 발화 및 폭발로 분류할 수 있습니다."},{"i":331,"x":"수증기는 질식 효과에 의한 소화약제로 사용할 수 있습니다."},{"i":332,"x":"산소 공급원이 없는 가연물의 예로는 나무가 있습니다."},{"i":333,"x":"내부 구조에 산소 공급원을 가지고 있는 가연물의 화재는 냉각에 의해서만 진압할 수 있습니다."},{"i":334,"x":"포말 소화약제의 주된 기능과 부차적 기능은 각각 질식과 냉각입니다."},{"i":335,"x":"열이 전달되는 방법에는 복사, 전도, 대류의 세 가지가 있습니다."},{"i":336,"x":"나무, 종이, 천, 넝마(estopa), 페인트처럼 연소할 수 있는 모든 물질을 가연물이라고 합니다."},{"i":337,"x":"이산화탄소(CO2) 소화약제의 주된 기능과 부차적 기능은 각각 질식과 냉각입니다."},{"i":338,"x":"고체 가연물을 분석해 보면, 물질이 잘게 쪼개질수록 연소 속도가 빨라진다고 할 수 있습니다."},{"i":339,"x":"선박에서 연료를 보관하기에 적합한 장소는 흘수선 아래의 구획입니다."},{"i":340,"x":"연소에서 산소를 제거하는 소화 방법을 질식 소화라고 합니다."},{"i":341,"x":"잊지 마십시오: 화재와 싸우는 가장 효율적인 방법은 화재가 시작되지 않도록 하는 것, 즉 화재 발생을 막는 예방입니다."},{"i":342,"x":"휘발성 연료란 상온에서 가스를 방출하는 연료를 말합니다."},{"i":343,"x":"아마추어 항해자가 선상 소화기에 대해 가져야 할 주요 주의 사항 중 하나는 소화기를 사용 가능한 상태로, 유효기간 내로 유지하는 것입니다."},{"i":344,"x":"포말 소화기는 제대로 작동하게 하려면 뒤집어야 하는 유일한 소화기입니다."},{"i":345,"x":"구명조끼는 선박을 포기해야 하는 경우에 착용할 수 있도록 선상에 보관해야 합니다."},{"i":346,"x":"구명조끼를 장난감, 등받이 또는 베개로 사용해서는 안 됩니다."},{"i":347,"x":"내수 항행용으로 분류된 스포츠 및 레저용 선박은 구명부환 01개(부양성 투척줄 포함)와 III등급 구명조끼(승선자 1인당 1개)를 의무적으로 갖추어야 합니다."},{"i":348,"x":"구명조끼는 부력 부분이 앞쪽으로 오도록 하여 몸에 묶어 착용해야 합니다."},{"i":349,"x":"선상의 구명조끼 수는 최대 승선 인원을 충족해야 합니다."},{"i":350,"x":"구명조끼는 필요할 때 쉽게 꺼낼 수 있는 곳에 두어야 하며, 절대로 선박에 묶어 두어서는 안 됩니다."},{"i":351,"x":"팽창식 구명조끼는 물속에 들어간 후에 부풀려야 합니다."},{"i":352,"x":"통제할 수 없는 화재로 선박을 포기하는 경우, 수면에 기름이 있으면 조류를 거스르는 방향으로 뛰어내려야 합니다."},{"i":353,"x":"사고 선박에서 가능한 한 빨리 멀어지려면 조류를 거슬러 헤엄쳐야 하며, 필요하면 수면의 기름 위험에서 벗어날 때까지 물속으로 헤엄쳐야 합니다."},{"i":354,"x":"선박 주변에 기름 유출과 화재 위험이 없다면 조류를 따라 헤엄쳐 선박에서 멀어져야 합니다."},{"i":355,"x":"현측을 넘어 뛰어내려 선박을 포기할 때는 항상 풍상(barlavento) 쪽에서 하고, 그다음 바람을 거슬러 헤엄쳐야 합니다. 즉, 퇴선 작업에서 물에 뛰어들 때는 풍상 쪽으로 해야 합니다."},{"i":356,"x":"풍상 쪽으로 퇴선하는 이유는 그쪽에서 기름띠의 범위가 더 작고, 바람에 의한 압류로 선박이 더 빨리 멀어지기 때문입니다."},{"i":357,"x":"퇴선 시 구명뗏목 위로 뛰어내려서는 안 됩니다."},{"i":358,"x":"내수에서 선박에 위험이 되는 것으로는 떠다니는 통나무, 떠다니는 나무 줄기, 암석 및 모래톱 등이 있습니다."},{"i":359,"x":"선박의 안전을 위해 항해를 나가기 전에 항해등, 구명 장비 및 소화 장비 등 여러 가지를 점검해야 합니다."},{"i":360,"x":"허용된 승선 인원 한도를 절대로 초과해서는 안 됩니다."},{"i":361,"x":"선박의 높은 부분에 무게가 과도하거나 선박의 좌우 측면에 대해 무게 배분이 잘못되면 선박의 복원성이 나빠집니다. 최소 건현 한계 표시가 물에 잠기게 해서는 절대 안 됩니다."},{"i":362,"x":"구명부환은 쉽게 떼어낼 수 있는 곳에 고정해 두어야 합니다."},{"i":363,"x":"구명조끼를 입고 물에 뛰어드는 가장 좋은 방법은 다리를 곧게 펴고 발을 모으는 것입니다."},{"i":364,"x":"조난 시 임시 부유물로는 타이어, 큰 깡통, 통, 통나무 또는 큰 나무 조각을 사용해야 합니다."},{"i":365,"x":"선박을 포기할 때는 적절한 옷과 구명 장비를 갖추도록 해야 합니다."},{"i":366,"x":"조난자 수가 구명뗏목 수용 능력보다 많으면, 신체 상태가 양호한 모든 사람이 교대로 뗏목 안에 들어가도록 계획해야 합니다."},{"i":367,"x":"구명뗏목에서 교대를 할 때는 뗏목 안 사람들의 편안함을 위해 옷을 바꿔 입어, 뗏목 안에 있는 사람들이 항상 마른 옷을 입도록 해야 합니다."},{"i":368,"x":"구명뗏목을 선박에 묶어 둔 줄은 모든 사람이 뗏목에 탑승한 후에만 잘라야 합니다."},{"i":369,"x":"구명뗏목의 덮개는 쉽게 발견될 수 있도록 주황색입니다."},{"i":370,"x":"현대식 비상식량은 대부분 당분 형태입니다."},{"i":371,"x":"다른 요인들과 함께, 조난자의 생존은 해수 온도에 따른 체류 시간에 좌우됩니다. 주변 온도(기온)의 경우, 사람에게 미치는 영향은 풍속과 밀접한 관련이 있습니다."},{"i":372,"x":"회두 조종으로 되돌아가 항적(프로펠러가 남긴 흔적) 위를 정확히 반대 침로로 항행하려면 부타코프 선회(Curva de Boutakow)를 사용해야 합니다."},{"i":373,"x":"마찬가지로 누군가 물에 빠졌을 때, 즉 “익수자” 상황에서 프로펠러가 남긴 항적 위를 정확히 반대 침로로 되돌아가려면 부타코프 선회(Curva de Boutakow)를 사용해야 합니다."},{"i":374,"x":"구명뗏목은 밀폐된 용기(캡슐)에 들어 있으며, 조난자가 사용할 수 있도록 특수 장치로 팽창됩니다."},{"i":375,"x":"구명뗏목은 유리섬유 용기에 담겨 노천 갑판의 전용 거치대에 놓여 있습니다. 사용하려면 용기를 바다에 던지고, 용기가 물에 떨어진 후 어느 정도 저항이 느껴질 때까지 줄을 당긴 다음 세게 한 번 잡아당겨야 합니다. 그러면 CO2 용기가 방출되어 약 30초 만에 뗏목이 팽창합니다."},{"i":376,"x":"구명뗏목은 12개월마다 점검해야 합니다."},{"i":377,"x":"조난 시에는 열악한 조건과 모든 종류의 자원 부족으로 건강에 특별한 주의가 필요합니다. 에너지를 아끼고, 무리하지 않으며, 불필요하게 말하지 않아야 합니다. 그러나 혈액 순환을 유지하기 위해 규칙적으로 몸을 움직이는 것이 좋습니다."},{"i":378,"x":"조난자가 주간에 주의를 끌기 위해 사용하는 장치를 발연부신호(fumígeno)라고 합니다."},{"i":379,"x":"조난자가 야간에 주의를 끌기 위해 사용하는 장치를 로켓 낙하산 신호(foguete pirotécnico)라고 합니다."},{"i":380,"x":"구명뗏목에 탈 때는 뒤집히지 않도록 한쪽으로만 무게가 쏠리지 않게 해야 합니다."},{"i":381,"x":"III등급 구명조끼는 스포츠 및/또는 레저용 선박 중 내항(interior de porto)용 선박에만 요구됩니다."},{"i":382,"x":"조난 시 Marinha do Brasil(브라질 해군)이 정한 물의 양은 1인당 하루 700 ml(2캔)입니다."},{"i":383,"x":"물에 빠진 사람의 구조를 쉽게 하기 위해 구명부환에는 손잡이 고리가 있는 부양성 투척줄을 묶어 두어야 합니다."},{"i":384,"x":"III등급 구명뗏목은 제한된 수역에서 운항하는 선박에 사용됩니다."},{"i":385,"x":"메스꺼움이 있으면 즉시 멀미약을 먹고 누워 있어야 합니다. 구토는 몸에서 많은 수분을 잃게 합니다."},{"i":386,"x":"식량이 부족하기 때문에 조난자에게 장 기능 저하(변비)는 흔한 현상입니다."},{"i":387,"x":"내수 항행에 사용되는 선박은 생존정 비치 의무가 면제됩니다."}]</script>

<script>
/* ---------- troca de idioma ----------
   O conteúdo (questões, dicas, cartões) vem de arquivos traduzidos por idioma.
   As estatísticas continuam indexadas pelo id da questão e pelo nome da matéria em português. */
const LANGS = [["pt", "Português", "PT"], ["en", "English", "EN"], ["ja", "日本語", "日本"], ["ko", "한국어", "한국"]];
let BANK_PT = [], CARDS_PT = [];
const LANG_CACHE = {};
let rerender = () => {};
const screen = (fn) => { rerender = fn; };

async function loadLangData(lang) {
  if (lang === "pt") return { q: null, c: null };
  if (LANG_CACHE[lang]) return LANG_CACHE[lang];
  const [q, c] = await Promise.all([loadJSON("banco-" + lang, `questoes.${lang}.json`), loadJSON("cartoes-" + lang, `cartoes.${lang}.json`)]);
  return (LANG_CACHE[lang] = { q, c });
}

/* monta BANK/CARDS no idioma atual, guardando o original em .pt */
function applyLangData(data) {
  const qmap = data.q ? Object.fromEntries(data.q.map((x) => [x.id, x])) : {};
  BANK = BANK_PT.map((q) => {
    const tq = qmap[q.id];
    const ok = tq && Array.isArray(tq.o) && tq.o.length === q.o.length;
    return ok ? { ...q, q: tq.q, o: tq.o, c: tq.c, pt: q } : { ...q, pt: q };
  });
  QMAP = Object.fromEntries(BANK.map((q) => [q.id, q]));
  const cmap = data.c ? Object.fromEntries(data.c.map((x) => [x.i, x.x])) : {};
  CARDS = CARDS_PT.map((c, i) => ({ ...c, x: cmap[i] || c.x, pt: c.x }));
}

function paintStatic() {
  document.documentElement.lang = LOCALE();
  $("#brandName").textContent = tr("Simulado Arrais e Motonauta");
  $("#bankLine").textContent =t("Banco de {n} questões", { n: BANK.length || 294 });
  const cur = LANGS.find((l) => l[0] === LANG);
  $("#langBtn").replaceChildren(h("span", { html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>', "aria-hidden": "true", style: "display:inline-flex" }), cur[2]);
  $("#langBtn").setAttribute("aria-label", tr("Idioma") + ": " + cur[1]);
  $("#langMenu").replaceChildren(...LANGS.map(([code, name]) => h("button", { role: "menuitemradio", "aria-checked": String(code === LANG), lang: code, "data-raw": true, onclick: () => setLang(code) }, name)));
  applyTheme();
}

async function setLang(code) {
  closeLangMenu();
  if (code === LANG) return;
  try { applyLangData(await loadLangData(code)); }
  catch { return; }
  LANG = code; store.lang = code; save();
  paintStatic(); setChip(); rerender();
}

function closeLangMenu() { $("#langMenu").hidden = true; $("#langBtn").setAttribute("aria-expanded", "false"); }
$("#langBtn").addEventListener("click", (e) => {
  e.stopPropagation();
  const m = $("#langMenu"); m.hidden = !m.hidden; $("#langBtn").setAttribute("aria-expanded", String(!m.hidden));
  if (!m.hidden) m.querySelector('[aria-checked="true"]')?.focus();
});
document.addEventListener("click", (e) => { if (!e.target.closest?.(".langwrap")) closeLangMenu(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLangMenu(); });

/* bloco "ver original em português" para quem estuda em outro idioma (a prova é em português) */
function originalBox(q, order) {
  if (LANG === "pt" || !q.pt) return null;
  return h("details", { class: "orig" }, h("summary", {}, "Ver original em português"),
    h("p", { "data-raw": true, lang: "pt-BR", style: "font-weight:500;color:var(--fg)" }, q.pt.q),
    ...(order || q.pt.o.map((_, i) => i)).map((oi, k) => h("p", { "data-raw": true, lang: "pt-BR" }, `${LETTERS[k]}) ${q.pt.o[oi]}`)));
}

<script>
/* ---------- conta Claude: sincronização entre aparelhos e painel do instrutor ----------
   Funciona só para quem abre o link logado no claude.ai com permissão de gravar.
   Perfil completo: data/users/<id>/perfil (privado). Resumo para o instrutor: turma/<id>. */
const CLOUD = { ready: false, db: null, user: null, uid: null, canEdit: false, writable: null, name: "", timer: null, busy: false, dirty: false };
const CLOUD_ID = "conta";

async function cloudInit() {
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const me = await user.me();
    if (!me.id) return;
    Object.assign(CLOUD, { db, user, uid: me.id, name: me.name || "", canEdit: !!me.canEdit, writable: await user.can("data.write"), ready: true });
  } catch { CLOUD.ready = false; }
}
const cloudOffer = () => CLOUD.ready && CLOUD.writable !== false;
const profileDoc = () => CLOUD.db.doc(`data/users/${CLOUD.uid}/perfil`);

async function cloudOpen(nameIfNew) {
  const snap = await profileDoc().get();
  let p = snap.exists ? JSON.parse(JSON.stringify(snap.data().profile || {})) : null;
  if (!p || !p.name) {
    p = { name: nameIfNew, created: Date.now(), attempts: [], seen: {}, review: {}, cards: {} };
    await profileDoc().set({ profile: p, updated: Date.now() });
  }
  p.cloud = true; p.last = Date.now();
  store.profiles[CLOUD_ID] = p; store.current = CLOUD_ID;
  try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch {}
  await cloudPushSummary();
}

/* chamada por save(): agrupa gravações e manda no máximo uma a cada 3 s */
function cloudOnSave() {
  if (!CLOUD.ready || store.current !== CLOUD_ID) return;
  CLOUD.dirty = true;
  clearTimeout(CLOUD.timer);
  CLOUD.timer = setTimeout(cloudFlush, 3000);
}
async function cloudFlush() {
  if (CLOUD.busy) { CLOUD.timer = setTimeout(cloudFlush, 1500); return; }
  const p = store.profiles[CLOUD_ID]; if (!p || !CLOUD.dirty) return;
  CLOUD.busy = true; CLOUD.dirty = false;
  try {
    const copy = JSON.parse(JSON.stringify(p)); delete copy.cloud;
    copy.attempts = copy.attempts.slice(-150);
    await profileDoc().set({ profile: copy, updated: Date.now() });
    setSync("Sincronizado");
  } catch (e) { setSync(e?.code === "quota_exceeded" ? "Espaço da conta cheio" : "Não sincronizou; tentaremos de novo"); CLOUD.dirty = true; }
  CLOUD.busy = false;
}
function setSync(s) { const el = document.getElementById("syncNote"); if (el) el.textContent = tr(s); }

/* resumo para o painel do instrutor: grava só quando um simulado termina */
async function cloudPushSummary() {
  const p = store.profiles[CLOUD_ID]; if (!CLOUD.ready || !p) return;
  const at = p.attempts;
  const doc = {
    name: p.name.slice(0, 40), n: at.length, updated: Date.now(),
    last: at.length ? at.at(-1).pct : null, best: at.length ? Math.max(...at.map((a) => a.pct)) : null,
    avg: at.length ? Math.round(at.reduce((s, a) => s + a.pct, 0) / at.length) : null,
    recent: at.slice(-10).map((a) => ({ at: a.at, pct: a.pct, n: a.n })), topics: topicStats(p),
  };
  try { await CLOUD.db.doc(`turma/${CLOUD.uid}`).set(doc); } catch {}
}
async function cloudDeleteProfile() {
  try { await profileDoc().delete(); await CLOUD.db.doc(`turma/${CLOUD.uid}`).delete(); } catch {}
}

/* ---------- painel do instrutor (dono e editores) ---------- */
let turmaUnsub = null;
function screenInstructor() {
  screen(screenInstructor);
  run = null;
  const box = h("div", { class: "stack" }, h("p", { class: "card muted" }, "Carregando a turma…"));

<script>
/* ---------- utilidades ---------- */
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
const UNITS = { pt: ["h ", "min ", "s"], en: ["h ", "min ", "s"], ja: ["時間", "分", "秒"], ko: ["시간 ", "분 ", "초"] };
const fmtTime = (s) => { s = Math.max(0, Math.round(s)); const [H, M, S] = UNITS[LANG] || UNITS.pt; const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60; if (hh) return `${hh}${H}${String(mm).padStart(2, "0")}${M}`.trim(); return (mm ? `${mm}${M}${String(ss).padStart(2, "0")}${S}` : `${ss}${S}`).trim(); };
const fmtClock = (s) => { s = Math.max(0, Math.ceil(s)); const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60; return (hh ? hh + ":" + String(mm).padStart(2, "0") : mm) + ":" + String(ss).padStart(2, "0"); };
const fmtDate = (t) => new Date(t).toLocaleDateString(LOCALE(), { day: "2-digit", month: "2-digit", year: "2-digit" }) + " " + new Date(t).toLocaleTimeString(LOCALE(), { hour: "2-digit", minute: "2-digit" });
const initials = (n) => n.trim().split(/\s+/).slice(0, 2).map((p) => p[0]).join("").toUpperCase();
const LETTERS = "ABCDE";
const MIN_PER_Q = 2.25; /* 40 questões = 1h30 */
let QMAP = {};
const byId = () => QMAP;
const TOPICS = () => [...new Set(BANK.map((q) => q.t))].sort((a, b) => a.localeCompare(b, "pt"));
const stat = (l, v) => h("div", { class: "stat" }, h("span", {}, l), h("b", {}, v));

function topicStats(p) {
  const acc = {};
  for (const a of p.attempts) for (const [t, [c, n]] of Object.entries(a.topics)) { acc[t] ??= [0, 0]; acc[t][0] += c; acc[t][1] += n; }
  return acc;
}
const reviewIds = (p) => Object.keys(p.review || {}).filter((id) => QMAP[id]);

/* ---------- montagem da prova ----------
   1) até 25% da prova vem da fila de revisão (questões erradas que ainda não foram acertadas 2x seguidas)
   2) o resto é sorteado mantendo a proporção de cada matéria, com prioridade para as inéditas */
function buildExam(n, { weak = false, topic = null } = {}) {
  const p = me();
  const pool = BANK.filter((q) => !topic || q.t === topic);
  n = Math.min(n, pool.length);
  const rev = shuffle(reviewIds(p).filter((id) => !topic || QMAP[id].t === topic)).slice(0, Math.ceil(n * 0.25));
  const taken = new Set(rev);
  const need = n - rev.length;
  const groups = {};
  for (const q of pool) if (!taken.has(q.id)) (groups[q.t] ??= []).push(q);
  const ts = weak ? topicStats(p) : {};
  const weights = Object.fromEntries(Object.entries(groups).map(([t, qs]) => {
    const s = ts[t]; const err = s && s[1] ? 1 - s[0] / s[1] : 0.5;
    return [t, qs.length * (weak ? 0.4 + 2 * err : 1)];
  }));
  const total = Object.values(weights).reduce((a, b) => a + b, 0) || 1;
  const quota = {}; let used = 0;
  const rem = Object.entries(weights).map(([t, w]) => {
    const exact = (w / total) * need; quota[t] = Math.min(groups[t].length, Math.floor(exact)); used += quota[t]; return [t, exact - Math.floor(exact)];
  }).sort((a, b) => b[1] - a[1]);
  while (used < need) {
    let moved = false;
    for (const [t] of rem) { if (used >= need) break; if (quota[t] < groups[t].length) { quota[t]++; used++; moved = true; } }
    if (!moved) break;
  }
  const seen = p.seen || {};
  const picked = rev.map((id) => QMAP[id]);
  for (const [t, qs] of Object.entries(groups)) {
    const order = shuffle(qs.slice()).sort((a, b) => (seen[a.id] || 0) - (seen[b.id] || 0));
    picked.push(...order.slice(0, quota[t]));
  }
  return shuffle(picked).map((q) => ({ id: q.id, order: shuffle(q.o.map((_, i) => i)), pick: null, flag: false, rev: taken.has(q.id) || undefined }));
}

function strategy(r, prevAll, p) {
  const tips = [];
  const prev = prevAll.filter((a) => (a.topic || null) === (r.topic || null));
  if (prev.length) {
    const last = prev.at(-1); const d = r.pct - last.pct;
    const avg = Math.round(prev.reduce((s, a) => s + a.pct, 0) / prev.length);
    tips.push(d > 0 ? t("Você subiu {d} pontos em relação ao anterior ({a}% → {b}%). Mantenha o ritmo.", { d, a: last.pct, b: r.pct }) : d < 0 ? t("Sua nota caiu {d} pontos em relação ao anterior ({a}%). Revise as erradas antes de fazer outro.", { d: -d, a: last.pct }) : t("Mesma nota do anterior ({a}%).", { a: last.pct }));
    if (prev.length >= 2) tips.push(t(r.pct >= avg ? "Sua média até aqui era {a}%. Desta vez você ficou acima dela." : "Sua média até aqui era {a}%. Desta vez você ficou abaixo dela.", { a: avg }));

    const better = Object.entries(r.topics).filter(([t, [c, n]]) => before[t] && n >= 3 && pct(c, n) - pct(...before[t]) >= 15).map(([t]) => t);
    if (better.length) tips.push(t("Melhorou em {a} comparado ao seu histórico.", { a: better.slice(0, 3).map(tr).join(", ") }));

function spark(attempts) {
  const pts = attempts.filter((a) => !a.topic).slice(-12); if (pts.length < 2) return null;

  const items = run.items.filter((it) => it.pick !== Q[it.id].a).map((it) => ({ id: it.id, order: shuffle(it.order.slice()), pick: null, flag: false, rev: true }));
  run = { n: items.length, mode: run.mode, topic: run.topic, startedAt: Date.now(), cur: 0, items: shuffle(items), limit: null };
  me().running = run; save(); startTimer(); renderQuestion();
}

function screenReview(filter = "all") {
  screen(() => screenReview(filter));
  const Q = byId();
  const groups = { all: () => true, wrong: (it) => it.pick !== Q[it.id].a, flag: (it) => it.flag, right: (it) => it.pick === Q[it.id].a };
  const count = (f) => run.items.filter(groups[f]).length;
  const list = run.items.map((it, i) => [it, i]).filter(([it]) => groups[filter](it));
  app.replaceChildren(h("div", { class: "stack" },
    h("div", { class: "row", style: "justify-content:space-between" }, h("h1", {}, "Gabarito comentado"), h("button", { class: "btn", onclick: screenResult }, iconEl("back"), "Resultado")),
    h("div", { class: "filters", role: "group", "aria-label": "Filtrar questões" },
      [["all", "Todas"], ["wrong", "Erradas e em branco"], ["right", "Certas"], ["flag", "Marcadas"]].map(([k, l]) => h("button", { "aria-pressed": String(k === filter), onclick: () => screenReview(k) }, `${tr(l)} (${count(k)})`))),
    list.length ? h("div", { class: "review" }, list.map(([it, i]) => {
      const q = Q[it.id]; const ok = it.pick === q.a; const blank = it.pick == null;
      const L = (oi) => LETTERS[it.order.indexOf(oi)];
      return h("article", { class: "card stack", style: "gap:10px" },
        h("div", { class: "qhead" }, h("span", {}, t("Questão {n}", { n: i + 1 }) + (it.flag ? " · " + tr("marcada") : "")), h("span", {}, q.t)),
        h("p", { style: "font-weight:500", "data-raw": true }, q.q),
        originalBox(q, it.order),
        blank ? h("div", { class: "ans-line b" }, iconEl("x"), h("span", {}, "Em branco"))
              : h("div", { class: "ans-line " + (ok ? "r" : "w") }, iconEl(ok ? "check" : "x"), h("span", { "data-raw": true }, t("Sua resposta: {l}) {o}", { l: L(it.pick), o: q.o[it.pick] }))),
        ok ? null : h("div", { class: "ans-line r" }, iconEl("check"), h("span", { "data-raw": true }, t("Correta: {l}) {o}", { l: L(q.a), o: q.o[q.a] }))),
        h("div", { class: "tip" }, h("b", {}, q.fix ? "Gabarito corrigido: " : "Dica: "), h("span", { "data-raw": true }, q.c)),
        q.v ? illus(q.v) : null);
    })) : h("p", { class: "card muted" }, "Nenhuma questão neste filtro.")));
  window.scrollTo({ top: 0 });
}

function screenHistory(confirm = null) {
  screen(() => screenHistory(confirm));
  const p = me(); const ts = topicStats(p); const sp = spark(p.attempts);
  const danger = confirm ? h("section", { class: "confirm stack", style: "gap:10px" },
    h("b", { "data-raw": true }, confirm === "reset" ? t("Zerar o histórico de {n}? Notas, questões vistas e fila de revisão serão apagadas. Não dá para desfazer.", { n: p.name }) : t("Apagar o usuário {n} e todo o histórico dele? Não dá para desfazer.", { n: p.name })),
    h("div", { class: "row" },
      h("button", { class: "btn danger", onclick: async () => {
        if (confirm === "reset") { Object.assign(p, { attempts: [], seen: {}, review: {}, cards: {} }); delete p.running; save(); if (p.cloud) cloudPushSummary(); screenHome(); }
        else { if (p.cloud) await cloudDeleteProfile(); delete store.profiles[store.current]; store.current = null; save(); screenProfiles(); }
      } }, confirm === "reset" ? "Zerar histórico" : "Apagar usuário"),
      h("button", { class: "btn ghost", onclick: () => screenHistory() }, "Cancelar"))) : null;
  app.replaceChildren(h("div", { class: "stack" },
    h("div", { class: "row", style: "justify-content:space-between" }, h("h1", {}, "Meu histórico"), h("button", { class: "btn", onclick: screenHome }, iconEl("back"), "Início")),
    sp ? h("section", { class: "card stack", style: "gap:8px" }, h("h3", {}, "Evolução nas provas completas"), sp) : null,
    Object.keys(ts).length ? h("section", { class: "card stack", style: "gap:12px" }, h("h3", {}, "Acerto acumulado por matéria"), h("div", { class: "topics" }, topicRows(ts))) : null,
    p.attempts.length ? h("section", { class: "card stack", style: "gap:8px" }, h("h3", {}, "Simulados feitos"),
      h("div", { class: "scroll" }, h("table", { class: "hist" },
        h("thead", {}, h("tr", {}, ["Data", "Tipo", "Questões", "Nota", "Tempo", "Situação"].map((c) => h("th", {}, c)))),
        h("tbody", {}, p.attempts.slice().reverse().map((a) => h("tr", {},
          h("td", {}, fmtDate(a.at)), h("td", {}, a.topic || "Completa"), h("td", {}, `${a.correct}/${a.n}`), h("td", { style: "font-weight:600" }, a.pct + "%"), h("td", {}, fmtTime(a.secs)),
          h("td", {}, h("span", { class: "pill " + (a.pct >= 50 ? "ok" : "bad"), style: "font-size:.8rem;padding:2px 10px" }, a.pct >= 50 ? "Aprovado" : "Reprovado")))))))) : h("p", { class: "card muted" }, "Nenhum simulado ainda."),
    h("section", { class: "card stack", style: "gap:10px" }, h("h3", {}, "Gerenciar usuário"),
      danger || h("div", { class: "row" },
        h("button", { class: "btn", onclick: () => screenHistory("reset") }, "Zerar histórico"),
        h("button", { class: "btn danger-outline", onclick: () => screenHistory("delete") }, "Apagar usuário")))));
  window.scrollTo({ top: 0 });
}

/* ---------- inicialização ---------- */
async function loadJSON(inlineId, url) {
  const el = document.getElementById(inlineId);
  return el ? JSON.parse(el.textContent) : (await fetch(url)).json();
}
async function boot() {
  applyTheme();
  try {
    [BANK, CARDS] = await Promise.all([loadJSON("banco", "questoes.json"), loadJSON("cartoes", "cartoes.json").catch(() => [])]);
  } catch {
    app.replaceChildren(h("p", { class: "card err" }, "Não foi possível carregar as questões. Recarregue a página."));
    return;
  }
  BANK_PT = BANK; CARDS_PT = CARDS;
  try { applyLangData(LANG === "pt" ? {} : await loadLangData(LANG)); } catch { LANG = "pt"; applyLangData({}); }
  paintStatic();
  me() && store.current !== CLOUD_ID ? screenHome() : screenProfiles();
  await cloudInit();
  if (CLOUD.ready) {
    if (store.current === CLOUD_ID) { try { await cloudOpen(store.profiles[CLOUD_ID]?.name || CLOUD.name); screenHome(); } catch { screenProfiles(); } }
    else if (!me() && !run) screenProfiles();
    else if (me() && !run && CLOUD.canEdit && document.querySelector(".seg3")) screenHome();
  }
}
boot();
