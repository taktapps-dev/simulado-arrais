<script type="application/json" id="cartoes">[{"t":"Legislação","x":"Todo material e equipamento destinado a segurança da embarcação, tripulante, passageiro e profissional não tripulante, tem de ser previamente aprovado pela Diretoria de Portos e Costas (DPC)."},{"t":"Legislação","x":"A Inspeção Naval é atividade, de cunho administrativo, exercida pelas Capitanias, Delegacias e Agências, que auxiliam a DPC a exercer seu papel de fiscalizador das normas."},{"t":"Legislação","x":"São atitudes passíveis de suspensão ou apreensão da carteira de habilitação do amador: entregar a condução da embarcação à pessoa não habilitada; conduzir embarcação em estado de embriaguez alcoólica ou sob efeito de substância tóxica de qualquer natureza; utilizar a embarcação, para transporte comercial de passageiros ou carga; ou utilizar a embarcação para prática de crime."},{"t":"Legislação","x":"A NORMAM-03 define amador como: Todo aquele com habilitação certificada pela Autoridade Marítima para operar embarcações de esporte e/ou recreio, em caráter não profissional."},{"t":"Legislação","x":"O Veleiro está apto para conduzir embarcações à vela sem propulsão a motor, nos limites da navegação interior (idade mínima 8 anos e deverá ser filiado a um clube náutico, marina organizada ou grupo de escoteiros do mar)."},{"t":"Legislação","x":"O Motonauta está apto para conduzir moto aquática, nos limites da navegação interior (idade mínima 18 anos)."},{"t":"Legislação","x":"O Arrais-Amador está apto para conduzir embarcações, nos limites da navegação interior (idade mínima 18 anos)."},{"t":"Legislação","x":"O Mestre-Amador está apto para conduzir embarcações entre portos nacionais e estrangeiros, nos limites da navegação costeira."},{"t":"Legislação","x":"O Capitão-Amador está apto para conduzir embarcações entre portos nacionais e estrangeiros, sem limites de afastamento da costa, ou seja, sem limites geográficos."},{"t":"Legislação","x":"As carteiras de habilitação de amador tem validade de 10 anos, renovável sem obrigatoriedade de exames."},{"t":"Legislação","x":"Qualquer pessoa, que tomar conhecimento da existência de vida humana em perigo no mar, nos portos ou vias navegáveis interiores deverá comunicar o fato à Autoridade Marítima, com maior rapidez possível."},{"t":"Legislação","x":"O Amador terá sua habilitação cancelada quando: for encontrado conduzindo embarcação já tendo sido suspensa sua carteira de habilitação; reincidência de suspensão da carteira."},{"t":"Legislação","x":"O órgão responsável pela execução dos exames de amadores é a Capitania dos Portos e seus órgãos subordinados (Delegacias e Agências)."},{"t":"Legislação","x":"O setor da Capitania dos Portos que fiscaliza o cumprimento das normas é a Inspeção Naval."},{"t":"Legislação","x":"O proprietário da embarcação de esporte e recreio é a pessoa que registrou a embarcação em seu nome."},{"t":"Legislação","x":"O registro da embarcação é feito no Tribunal Marítimo, com a expedição da Provisão de Registro de Propriedade Marítima (PRPM)."},{"t":"Legislação","x":"São obrigadas a registro no Tribunal Marítimo todas as embarcações com comprimento maior ou igual a 24 metros, e com arqueação bruta (AB) maior que 100."},{"t":"Legislação","x":"A autoridade marítima sustará o andamento de qualquer documento ou ato administrativo de interesse de quem estiver em débito decorrente de infração até sua quitação."},{"t":"Legislação","x":"Trafegar em área reservada a banhistas poderá suspender o certificado de habilitação em até 60 dias."},{"t":"Legislação","x":"O ordenamento do uso das praias compete aos municípios."},{"t":"Legislação","x":"A prerrogativa de estabelecer o valor da multa e o período de suspensão do certificado de habilitação, respeitados os limites estipulados na RLESTA, é da competência do representante da autoridade marítima."},{"t":"Legislação","x":"Aquaviário ou Amador que exerce funções a bordo, embarcado, na operação da embarcação é denominado Tripulante."},{"t":"Legislação","x":"A quantidade mínima de tripulantes necessária a operar, com segurança, a embarcação é denominada “Tripulação de Segurança”."},{"t":"Legislação","x":"Caso a irregularidade determinante de apreensão da embarcação não seja sanada no prazo devido, a embarcação será leiloada ou incorporada aos bens da União."},{"t":"Legislação","x":"O prazo estabelecido pela LESTA para sanar irregularidade determinante de apreensão da embarcação, e não ficar sujeita a leilão ou incorporação aos bens da União é de 90 dias."},{"t":"Legislação","x":"São três situações passíveis de ocorrer apreensão da embarcação: quando apresentar-se em péssimo estado de conservação, for utilizada comercialmente e trafegar em áreas de segurança."},{"t":"Legislação","x":"Um infrator, após o recebimento do auto de infração, pode apresentar sua defesa num prazo de 15 dias."},{"t":"Legislação","x":"A penalidade por conduzir embarcação em estado de embriaguez é de suspensão do Certificado de Habilitação em até 120 dias. A reincidência sujeitará o infrator à pena de cancelamento do Certificado de Habilitação."},{"t":"Legislação","x":"Conduzir embarcação em estado de embriaguez ou após uso de substância entorpecente ou tóxica, quando não constituir crime previsto em lei acarreta a suspensão do Certificado de Habilitação em até 120 dias. A reincidência acarreta o cancelamento do Certificado de Habilitação."},{"t":"Legislação","x":"As repetições na prática da mesma infração implicará, em caso de pena de multa ou suspensão do Certificado de Habilitação, se o próprio artigo que a impuser não estabelecer outro procedimento, na multiplicação da penalidade por dois, três e assim sucessivamente."},{"t":"Legislação","x":"A NORMAM-03 define lotação como a quantidade máxima de pessoas autorizadas a embarcar, incluindo a tripulação."},{"t":"Legislação","x":"Segundo a LESTA os danos causados aos sinais náuticos sujeitam o infrator a repará-los."},{"t":"Legislação","x":"Segundo a RLESTA causar danos a sinais náuticos sujeitam o infrator a multa ou suspensão do Certificado de Habilitação em até 60 dias."},{"t":"Legislação","x":"A distância mínima de fundeio para uma plataforma de petróleo é de 500 metros."},{"t":"Legislação","x":"A linha de arrebentação das ondas ou, no caso de lagos e lagoas, onde se inicia o espelho d’água, é chamada de linha base."},{"t":"Legislação","x":"Considerando as áreas seletivas para navegação, definidas pela NORMAM-03, as embarcações utilizando propulsão a remo ou a vela poderão trafegar a partir de 100 metros da linha base."},{"t":"Legislação","x":"Considerando as áreas seletivas para navegação, definidas pela NORMAM-03, as embarcações de propulsão a motor, reboque de esqui aquático, pára-quedas e painéis de publicidade poderão trafegar a partir de 200 metros da linha base."},{"t":"Legislação","x":"Toda embarcação deve ser inscrita na Capitania dos Portos ou órgãos subordinados ( Delegacias e Agências)."},{"t":"Legislação","x":"A reincidência, para efeito de gradação das penalidades, é a repetição da mesma infração em um período igual ou inferior a 12 meses."},{"t":"Legislação","x":"A reincidência, é uma circunstância agravante às infrações."},{"t":"Legislação","x":"Com relação a equipamentos de salvatagem importados, para utilizá-los a bordo, o proprietário deverá homologá-los na Diretoria de Portos e Costas (DPC)."},{"t":"Legislação","x":"A embarcação classificada como de interior pode ser conduzida por qualquer Arrais-Amador."},{"t":"Legislação","x":"Uma embarcação classificada como de alto-mar, quando navegando em local de sua classe, só poderá ser conduzida por Capitão-Amador."},{"t":"Legislação","x":"É obrigatório a apresentação do plano de navegação ou aviso de saída, antes de sair para navegar."},{"t":"Legislação","x":"A embarcação apreendida deve ser recolhida a local determinado pela Autoridade Marítima."},{"t":"Legislação","x":"Áreas de segurança são áreas de tráfego e fundeio proibido."},{"t":"Legislação","x":"Todas as pessoas a bordo estão sujeitas a autoridade do Comandante."},{"t":"Legislação","x":"O comandante, no exercício de suas funções e para garantia da segurança das pessoas, da embarcação e da carga transportada, pode ordenar o desembarque de qualquer pessoa."},{"t":"Legislação","x":"As embarcações de propulsão a motor ou à vela poderão se aproximar da linha base para fundear, caso não haja nenhum dispositivo contrário estabelecido pela autoridade marítima competente. Toda aproximação deverá ser feita perpendicular à linha base e com velocidade não superior a 3 (três) nós, preservando a segurança dos banhistas."},{"t":"Legislação","x":"Quando uma embarcação classificada na navegação de mar aberto (alto mar) estiver navegando em águas interiores, será exigida a sua dotação mínima quanto a salvatagem e equipagem de navegação a de navegação de interior de porto."},{"t":"Legislação","x":"Termo de Responsabilidade, é o documento em que, o proprietário da embarcação de esporte e/ou recreio, assume a responsabilidade pela condição de operação de sua embarcação."},{"t":"Legislação","x":"Segundo a RLESTA a navegação realizada entre portos ou pontos do território brasileiro, utilizando a via marítima ou esta e as vias navegáveis interiores é denominada navegação de cabotagem."},{"t":"Legislação","x":"Segundo a RLESTA a navegação realizada entre portos brasileiros e estrangeiros é classificada como longo curso."},{"t":"Legislação","x":"A navegação realizada em hidrovias interiores, assim considerados rios, lagos, canais, lagoas, baias, angras, enseadas e áreas marítimas abrigadas é classificada como interior."},{"t":"Legislação","x":"De acordo com a NORMAM-03, estão dispensados de apresentar habilitação náutica apenas os condutores de dispositivos flutuantes e de embarcações miúdas sem motorização quando utilizados na atividade de esporte e/ou recreio ou para a prática de esporte."},{"t":"Legislação","x":"Trafegar com velocidade superior a permitida acarretará na aplicação de multa ou na suspensão da habilitação em até 30 dias."},{"t":"Manobras e propulsão","x":"A temperatura da água é um fator que NÃO altera condições de manobra da embarcação."},{"t":"Manobras e propulsão","x":"O leme é uma estrutura metálica ou de madeira, que tem por finalidade dar direção a embarcação e mantê-la no rumo determinado."},{"t":"Manobras e propulsão","x":"O hélice é uma estrutura metálica, que possui pás e serve para movimentar a embarcação através de seu próprio giro, acoplado através de um eixo longitudinal a um motor."},{"t":"Manobras e propulsão","x":"As âncoras são peças metálicas, capazes de prender no fundo, para permitir que a embarcação se mantenha fundeada, ou seja, sem se deslocar da posição."},{"t":"Manobras e propulsão","x":"Corrente ou cabo que serve para prender a âncora ao paiol da amarra ou ao convés da embarcação, chama-se amarra."},{"t":"Manobras e propulsão","x":"As fainas de fundear ou suspender devem ser feitas sempre observando as condições de vento, corrente e maré, procurando afilar-se (alinhar-se) ao que predominar mais."},{"t":"Manobras e propulsão","x":"Uma das condições que não é necessária para caracterizar um bom fundeadouro é ter um espaço limitado para não se fundear fora da área permitida."},{"t":"Manobras e propulsão","x":"Para atracar deve-se, em regra geral, aproximar do cais, num ângulo de 45°, de modo a passar um cabo de proa logo que possa, colocando o leme para o bordo oposto ao do cais, para deslocar a popa para este."},{"t":"Manobras e propulsão","x":"Os cabos principais de amarração são lançantes, espringues e traveses."},{"t":"Manobras e propulsão","x":"As “espias” são cabos de amarração que servem para serem usados na faina (ação) de atracar uma embarcação."},{"t":"Manobras e propulsão","x":"Havendo correnteza no local, que se vai atracar uma embarcação, devemos aproveitar seu efeito e atracar contra a correnteza, passando-se um cabo dizendo (na direção) para vante e outro dizendo para ré."},{"t":"Manobras e propulsão","x":"Para desatracar a embarcação, como regra geral, devemos largar os cabos de ré, procurando manobrar para abrir a popa, aproveitar o efeito do leme para afastar a popa e então largar os cabos de vante."},{"t":"Manobras e propulsão","x":"Com corrente de proa a desatracação é mais fácil, folgando-se primeiro os cabos de vante e mantendo os de ré apertados."},{"t":"Manobras e propulsão","x":"A bóia de arinque é utilizada para indicar o local onde a âncora está no fundo."},{"t":"Manobras e propulsão","x":"O cabo que tem a função de evitar que uma embarcação atracada, caia para ré é chamado de lançante de proa."},{"t":"Manobras e propulsão","x":"A espia que sai da embarcação perpendicularmente ao cais, chama-se través."},{"t":"Manobras e propulsão","x":"Uma embarcação com um hélice apenas, com rotação no sentido horário, com leme a meio, com seguimento (movimento) para ré, a proa guinará para boreste lentamente."},{"t":"Manobras e propulsão","x":"Uma embarcação com um hélice apenas, com rotação no sentido anti-horário, com leme a meio, e em movimento para a vante tende a guinar para bombordo lentamente."},{"t":"Manobras e propulsão","x":"Uma embarcação com um hélice apenas, com rotação no sentido horário, com leme a boreste, com seguimento (movimento) para ré, a proa guinará para boreste lentamente."},{"t":"Manobras e propulsão","x":"Suspender, em manobra, é sair com a embarcação do local de fundeio, recolhendo a âncora."},{"t":"Manobras e propulsão","x":"A âncora Danforth é a mais comum a bordo das embarcações de esporte e recreio."},{"t":"Manobras e propulsão","x":"Basicamente o leme se divide em: madre, cana e porta."},{"t":"Manobras e propulsão","x":"Numa atracação, com vento ou corrente perpendicular ao cais, com aproximação a barlavento, deve-se aproximar com a embarcação paralela ao cais, com pouco seguimento."},{"t":"Manobras e propulsão","x":"Numa atracação, com vento ou corrente perpendicular ao cais, com aproximação a sotavento, deve-se aproximar com a embarcação com um ângulo aproximado de 45° com o cais."},{"t":"Manobras e propulsão","x":"Numa atracação com vento ou corrente, paralelos ao cais, deve-se aproximar com a embarcação sempre contrário ao vento ou corrente, com ângulo agudo ao cais."},{"t":"Manobras e propulsão","x":"Para se largar do cais, sem vento e sem corrente, deve ser feita com o leme contrário ao cais e máquina devagar adiante, largar todas as espias, exceto a de ré, que esteja dizendo para vante."},{"t":"Manobras e propulsão","x":"Para se largar de um cais, com vento e corrente pela proa, deverei largar todas as espias, exceto a que diz para vante, na popa, mantendo o leme contrário ao cais."},{"t":"Manobras e propulsão","x":"Para se largar de um cais, com vento e corrente pela popa, deverei largar todas as espias, exceto a que diz para ré, na proa, mantendo o leme na direção do cais."},{"t":"Manobras e propulsão","x":"Deve-se fundear o barco de lazer, com a âncora Danforth, evitando os fundeadouros de tença de areia dura."},{"t":"Manobras e propulsão","x":"A regra simples para se determinar a quantidade de amarra a se largar num fundeio normal é de, no mínimo, 3 vezes a profundidade local."},{"t":"Manobras e propulsão","x":"Quando houver risco de mau tempo ou o fundeio for muito demorado, a regra para se largar a amarra, com segurança da embarcação não sair da posição é de 5 vezes a profundidade local. Com bom tempo é de 3 vezes a profundidade do local."},{"t":"Manobras e propulsão","x":"Para se pegar uma boia, para amarrarmos uma embarcação, devemos proceder aproados a ela, com pouco seguimento."},{"t":"Manobras e propulsão","x":"chama-se “tença” ao tipo de fundo (qualidade do fundo – lama, pedra, areia, cascalho, lodo, etc.)."},{"t":"Manobras e propulsão","x":"Deve-se evitar fundear em área onde o espaço de giro da embarcação seja limitado."},{"t":"Manobras e propulsão","x":"Para se suspender de um fundeadouro, devemos ir recolhendo a âncora, com máquina devagar adiante, caso a amarra esteja tesada para vante."},{"t":"Manobras e propulsão","x":"Uma embarcação no visual da outra, para existir, com certeza, o risco de colisão, deverá apresentar a situação de marcação constante e distância diminuindo."},{"t":"Manobras e propulsão","x":"Em visibilidade restrita (nevoeiro e fumaça), a embarcação que detectar a presença de outra em situação de risco de colisão deverá manobrar independentemente da manobra da outra com antecedência."},{"t":"Manobras e propulsão","x":"Para fundear deve-se inverter a máquina e quando estiver caindo a ré, largar âncora."},{"t":"Manobras e propulsão","x":"Quando numa embarcação de dois hélices, um deles dá a ré e o outro adiante, com a mesma rotação, essa embarcação tende a girar a proa para o mesmo bordo do hélice que dá ré."},{"t":"Manobras e propulsão","x":"Para se fundear com correnteza e vento, deve-se aproar ao vento, caso a embarcação tenha uma estrutura alta no convés."},{"t":"Manobras e propulsão","x":"Quando duas embarcações navegam num canal estreito, em rumos opostos, aproximando-se, ambos devem tomar a margem de seu boreste."},{"t":"Manobras e propulsão","x":"Uma correlação que está totalmente correta é: Boreste – lado direito da embarcação; Bombordo – lado esquerdo da embarcação: A Vante – fica na frente; e A Ré – fica atrás."},{"t":"Manobras e propulsão","x":"O termo “em movimento” se aplica a todas as embarcações que não se encontram fundeadas, amarradas à terra ou encalhadas."},{"t":"Manobras e propulsão","x":"O termo “embarcação com capacidade de manobra restrita” designa uma embarcação que devido à natureza dos seus serviços, se encontra restrita em sua capacidade de manobrar."},{"t":"Manobras e propulsão","x":"Se você avistar uma embarcação de grande porte, à noite, exibindo três luzes circulares encarnadas dispostas em linha vertical, tome cuidado, pois estará diante de uma embarcação com capacidade de manobra restrita devido ao seu calado."},{"t":"Manobras e propulsão","x":"O termo “embarcação a vela” designa qualquer embarcação sob vela desde que sua máquina propulsora, se houver, não esteja em uso."},{"t":"Manobras e propulsão","x":"Quando a embarcação é levada pelo vento, maré ou corrente, arrastando pelo fundo sua âncora, diz-se que ela está garrando."},{"t":"Manobras e propulsão","x":"Quando uma embarcação está sem propulsão, sem condição de manobrar e sendo arrastada pelos ventos e marés, diz-se que está à matroca."},{"t":"Manobras e propulsão","x":"Uma vantagem das embarcações de dois hélices sobre as de um hélice, sob o ponto de vista evolutivo, seria os efeitos do hélice no governo se anulam, ficando a embarcação somente sob a ação do leme."},{"t":"Manobras e propulsão","x":"Quando em mar ruim para vencer as ondas grandes deve-se acelerar e desacelerar o motor da seguinte forma: acelerar na subida e desacelerar antes da descida."},{"t":"Manobras e propulsão","x":"A ação de amarrar ou prender uma embarcação ao cais ou trapiche, chama-se atracar."},{"t":"Manobras e propulsão","x":"A curva que a embarcação faz quando o leme está para um dos bordos a um determinado grau considerado padrão e a uma determinada velocidade padrão, chama-se “Curva de Giro Padrão”."},{"t":"Manobras e propulsão","x":"Em situações normais, quando o hélice de uma embarcação gira para a direita (sentido horário) ele joga a água para trás (ré) e impulsiona a embarcação para vante."},{"t":"Manobras e propulsão","x":"Chama-se “Borda Livre” a distância entre a superfície da água até o pavimento principal (normalmente o convés) medida em qualquer ponto do comprimento da embarcação no costado."},{"t":"Manobras e propulsão","x":"As partes curvas do costado de uma embarcação, nas imediações da proa, por boreste e por bombordo são chamados de bochechas (bochechas de Bombordo e bochechas de Boreste)."},{"t":"Manobras e propulsão","x":"As partes curvas do costado de uma embarcação, nas imediações da popa, por boreste e por bombordo são chamados de alhetas (alhetas de Bombordo e alhetas de Boreste)."},{"t":"Manobras e propulsão","x":"Se a embarcação possui dois motores (dois eixos e dois hélices), se um dos hélices estiver numa rotação inferior ao outro, a tendência da embarcação é ir para o bordo do hélice que está com menor rotação."},{"t":"Manobras e propulsão","x":"Se os tanques de uma embarcação estão com seus volumes pela metade e há considerável volume de água no porão, a embarcação certamente estará com sua estabilidade sofrendo o efeito de “superfície livre”."},{"t":"Manobras e propulsão","x":"Uma embarcação com muito peso a meia-nau e pouco peso na proa e popa pode vir a quebrar ao meio. Nesta situação diz-se que a embarcação está com contra-alquebramento."},{"t":"Manobras e propulsão","x":"Estando a bordo de uma embarcação, posicionado na popa, de frente para a proa, pode-se afirmar que a sua direita estará o bordo de boreste."},{"t":"Manobras e propulsão","x":"Peça giratória que, quando acionada (girada) para esquerda (bombordo) ou direita (boreste), movimenta o leme, é chamada de roda de leme ou timão."},{"t":"Manobras e propulsão","x":"Chamam-se cabeços, as peças fixadas aos cais e trapiches que servem para prender as espias das embarcações por ocasião da atracação."},{"t":"Manobras e propulsão","x":"São partes de uma embarcação: convés, costado, quilha, bochechas, alhetas."},{"t":"Navegação e balizamento","x":"O RIPEAM tem por finalidade evitar o abalroamento no mar, utilizando-se regras internacionais de navegação, luzes e marcas e, ainda, sinais sonoros."},{"t":"Navegação e balizamento","x":"Descumprir as regras do RIPEAM poderá suspender o certificado de habilitação em até 60 dias."},{"t":"Navegação e balizamento","x":"Na situação de roda a roda, ou seja, proa com proa, as embarcações deverão manobrar (guinar), cada uma para o seu boreste."},{"t":"Navegação e balizamento","x":"Na situação de rumos cruzados, tem preferência de passagem a embarcação que avistar a outra pelo seu bombordo, isto é, a que vê a luz verde da outra embarcação."},{"t":"Navegação e balizamento","x":"Uma embarcação à vela tem preferência de manobra em relação a uma embarcação a motor."},{"t":"Navegação e balizamento","x":"Um veleiro e uma lancha vinham navegando em rumos cruzados. Tendo preferência de passagem, o veleiro não manobrou e esperou que a lancha guinasse, enquanto se aproximava rapidamente dela. Houve uma colisão das duas embarcações. Podemos concluir que: Apesar da lancha ter errado por não manobrar para evitar o acidente, o veleiro não pode ser isentado de culpa, pois, a embarcação que tem preferência deverá manobrar para evitar a colisão, caso a outra, obrigada a manobrar, não o faça."},{"t":"Navegação e balizamento","x":"Toda manobra deverá ser feita de forma franca e positiva, com ampla antecedência, demonstrando à outra embarcação, que houve alteração de movimento."},{"t":"Navegação e balizamento","x":"No caso de um rio onde duas lanchas de esporte e recreio navegam em rumos opostos, a embarcação que vem a favor da corrente deverá se posicionar no meio do rio e a outra na sua margem de boreste, sendo que a que vem a favor da corrente tem preferência."},{"t":"Navegação e balizamento","x":"Em canais estreitos as embarcações devem navegar pela margem mais próxima a seu boreste e sempre manobrar para boreste quando verificar o risco de colisão."},{"t":"Navegação e balizamento","x":"Num canal ou rio, principalmente estreito, a embarcação maior tem preferência em relação à embarcação miúda."},{"t":"Navegação e balizamento","x":"“velocidade de segurança” é a velocidade que possibilita uma ação apropriada e eficaz de evitar um abalroamento bem como para ser parada a uma distância apropriada às circunstâncias e condições predominantes. Quando cruzamos com outras embarcações atracadas ou fundeadas às margens dos rios e canais, devemos diminuir a velocidade."},{"t":"Navegação e balizamento","x":"No caso de uma embarcação alcançando a outra, não tem preferência de passagem a que está com maior velocidade (alcançadora), que deverá manobrar para passar pela outra, à frente, com segurança."},{"t":"Navegação e balizamento","x":"As luzes de navegação mais comuns, em embarcação de esporte e recreio são uma luz branca a vante, uma luz de alcançado branca, luzes verde e encarnada (vermelha), combinadas."},{"t":"Navegação e balizamento","x":"Os sinais sonoros que podem ser emitidos por apitos, buzinas ou ainda sinos, são utilizados nas situações de manobra, advertência e em baixa visibilidade."},{"t":"Navegação e balizamento","x":"O apito curto tem a duração de aproximadamente 1 segundo."},{"t":"Navegação e balizamento","x":"O apito longo tem a duração de 4 a 6 segundos."},{"t":"Navegação e balizamento","x":"Um apito curto significa que “estou guinando para boreste”."},{"t":"Navegação e balizamento","x":"Dois apitos curtos significam que “estou guinando para bombordo”."},{"t":"Navegação e balizamento","x":"Três apitos curtos significam “estou dando máquinas atrás\"."},{"t":"Navegação e balizamento","x":"Dois apitos longos seguidos de um curto significa que “tenciono ultrapassa-lo por seu boreste”."},{"t":"Navegação e balizamento","x":"Dois apitos longos seguidos de dois curtos significa que “tenciono ultrapassa-lo por seu bombordo”."},{"t":"Navegação e balizamento","x":"Cinco apitos curtos ou mais significam que “não entendi suas intenções de manobra”."},{"t":"Navegação e balizamento","x":"Um apito longo de dois em dois minutos significa “embarcação com propulsão mecânica com seguimento, em visibilidade restrita”."},{"t":"Navegação e balizamento","x":"Dois apitos longos de dois em dois minutos significam que “existe embarcação sob máquinas, mas parada e sem seguimento em visibilidade restrita”."},{"t":"Navegação e balizamento","x":"Uma embarcação sem governo tem preferência em relação à embarcação à vela, à embarcação com capacidade de manobra restrita e à embarcação engajada na pesca."},{"t":"Navegação e balizamento","x":"Embarcação com comprimento do reboque inferior a 200 metros, deverá exibir duas luzes brancas no mastro."},{"t":"Navegação e balizamento","x":"Embarcação com comprimento do reboque superior a 200 metros, deverá exibir três luzes brancas no mastro."},{"t":"Navegação e balizamento","x":"Embarcação de grande porte que carrega cargas perigosas deverá exibir, à noite, uma luz encarnada (vermelha) no alto do mastro."},{"t":"Navegação e balizamento","x":"Se durante o dia eu avistar uma embarcação com um balão preto no mastro, significa que ela está fundeada."},{"t":"Navegação e balizamento","x":"Em curvas de rios ou canais estreitos, onde a visibilidade é prejudicada, devemos dar um apito longo para chamar atenção. Esse apito deverá ser respondido pelas embarcações que estiverem ocultas com um apito longo."},{"t":"Navegação e balizamento","x":"A forma mais correta de cruzar uma embarcação com outra embarcação vindo em sentido contrário é bombordo com bombordo."},{"t":"Navegação e balizamento","x":"As luzes de navegação não deverão ser usadas quando a embarcação estiver atracada no cais."},{"t":"Navegação e balizamento","x":"Na ausência de apito, a embarcação poderá utilizar buzina ou sino para sinalizar as suas intenções."},{"t":"Navegação e balizamento","x":"As embarcações de esporte e recreio, sem propulsão a motor, com menos de 5 metros de comprimento estão dispensadas de usar buzina ou outro dispositivo que a substitua."},{"t":"Navegação e balizamento","x":"Um balão preto içado no mastro principal ou onde melhor possa ser visto não constitui sinal de perigo."},{"t":"Navegação e balizamento","x":"Uma luz intermitente amarela cruzando o canal, à noite, poderá ser uma embarcação desenvolvendo grande velocidade ao navegar."},{"t":"Navegação e balizamento","x":"Uma embarcação de esporte e recreio deverá evitar cruzar uma via de tráfego, tanto quanto possível, porém, se for necessário tal manobra, deverá fazê-la de forma a cruzar perpendicularmente a via de tráfego que é o caminho mais curto e o mais rápido possível."},{"t":"Navegação e balizamento","x":"As luzes de bordos, de mastro e de alcançado são setorizadas para melhor identificar o movimento da embarcação, à noite."},{"t":"Navegação e balizamento","x":"O holofote pode ser utilizado para sinalizar perigo a outra embarcação quando dirigido a ela."},{"t":"Navegação e balizamento","x":"São situações normalmente indicadas por balizamento: os perigos naturais e limites laterais dos canais, zonas de acidentes marítimos importantes, novos perigos e áreas onde estão sendo realizados serviços especiais."},{"t":"Navegação e balizamento","x":"São sinais de balizamento: sinais laterais, sinais cardinais, sinais de perigo isolado, novos perigos, sinais de águas seguras e sinais especiais."},{"t":"Navegação e balizamento","x":"O objetivo principal dos sinais especiais é indicar uma área ou peculiaridade mencionada em documentos náuticos."},{"t":"Navegação e balizamento","x":"A marca de tope de um sinal especial é um “X” amarelo."},{"t":"Navegação e balizamento","x":"A identificação dos sinais durante o dia é feita por marca de tope, forma e cor."},{"t":"Navegação e balizamento","x":"A bóia cega é a que NÃO emite luzes."},{"t":"Navegação e balizamento","x":"A identificação do balizamento à noite, é feita por ritmo de apresentação e cores das luzes. Em outras palavras, podemos reconhecer o balizamento à noite pela cor e ritmo das luzes."},{"t":"Navegação e balizamento","x":"O sistema de balizamento poderá ser de um dispositivo chamado RACON que é um sistema que emite um sinal na tela do radar e que facilita, portanto, a sua identificação."},{"t":"Navegação e balizamento","x":"O único caso em que utilizamos um balizamento dobrado, com dois sinais iguais é no caso de haver perigo isolado ainda não registrado na carta náutica."},{"t":"Navegação e balizamento","x":"A bóia de bombordo emite luz, à noite, de cor verde."},{"t":"Navegação e balizamento","x":"O sinal lateral de canal que fica a boreste de quem entra no porto tem a cor encarnada."},{"t":"Navegação e balizamento","x":"O sinal lateral de canal que fica a bombordo, de quem entra no porto, tem a cor verde."},{"t":"Navegação e balizamento","x":"A boia de boreste emite luz, à noite, de cor encarnada."},{"t":"Navegação e balizamento","x":"O balizamento que indica águas seguras, possui as cores branca e encarnada."},{"t":"Navegação e balizamento","x":"O balizamento que indica perigo isolado, possui as cores preta e encarnada."},{"t":"Navegação e balizamento","x":"O balizamento em que os sinais estão indicados por boias ou balizas posicionadas em relação aos 4 (quatro) quadrantes chama-se cardinal."},{"t":"Navegação e balizamento","x":"A marca de tope do sinal cardinal norte são dois cones pretos, um sobre o outro, com os vértices para cima."},{"t":"Navegação e balizamento","x":"A marca de tope do sinal cardinal sul são dois cones pretos, um sobre o outro, com os vértices para baixo."},{"t":"Navegação e balizamento","x":"A marca de tope do sinal cardinal leste são dois cones pretos, um sobre o outro base a base."},{"t":"Navegação e balizamento","x":"A marca de tope do sinal cardinal oeste são dois cones pretos, um sobre o outro ponta a ponta."},{"t":"Navegação e balizamento","x":"O balizamento que indica o quadrante que, a partir dele, temos águas seguras, tem as cores amarela e preta."},{"t":"Navegação e balizamento","x":"As boias que delimitam as laterais de um canal preferencial tem as cores verde e encarnada (vermelha)."},{"t":"Navegação e balizamento","x":"À noite, a cor das luzes de sinais cardinais, perigo isolado e águas seguras é branca."},{"t":"Navegação e balizamento","x":"As bóias do balizamento podem ser, quanto à apresentação de luzes cegas ou luminosas."},{"t":"Navegação e balizamento","x":"À noite, a cor da luz emitida, pelo balizamento de canal preferencial a boreste é verde."},{"t":"Navegação e balizamento","x":"À noite, a cor da luz emitida, pelo balizamento de canal preferencial a bombordo é encarnada."},{"t":"Navegação e balizamento","x":"A numeração do balizamento de canal segue a ordem crescente, a partir da entrada do canal."},{"t":"Navegação e balizamento","x":"Uma bóia com cor preta e uma ou mais faixas horizontais encarnadas indica perigo isolado."},{"t":"Navegação e balizamento","x":"Uma bóia com cores brancas e encarnadas em faixas verticais, indica águas seguras."},{"t":"Navegação e balizamento","x":"Os formatos das boias laterais de canal são cilíndrico, pilar, charuto ou cônico."},{"t":"Navegação e balizamento","x":"A viga do vão principal de uma ponte fixa, deve exibir no centro uma luz rápida branca."},{"t":"Navegação e balizamento","x":"No balizamento de uma hidrovia, um sinal “X” significa trocar de margem."},{"t":"Navegação e balizamento","x":"No balizamento de uma hidrovia, ao observar-se um sinal “H” significa seguir no meio do canal."},{"t":"Navegação e balizamento","x":"No balizamento de uma hidrovia um sinal “Y” significa bifurcação de canal."},{"t":"Navegação e balizamento","x":"No balizamento de uma hidrovia um sinal “+” significa perigo isolado."},{"t":"Navegação e balizamento","x":"No balizamento de uma hidrovia, um sinal “ ” significa canal junto a margem."},{"t":"Navegação e balizamento","x":"Num pilar de ponte sobre um rio navegável, observou-se dois losangos amarelos, um ligado ao outro pelos pontos laterais, isto significa que o tráfego é permitido com sentido único."},{"t":"Navegação e balizamento","x":"Quando um navegante, em sua embarcação, vem se aproximando de uma bifurcação de canal e se depara com um balizamento de duas cores, e sendo que ele verificou que a maior profundidade estava no canal a seu boreste, as duas cores vistas pelo navegante são verde, com uma faixa horizontal encarnada"},{"t":"Navegação e balizamento","x":"Num pilar de ponte sobre um rio navegável, observou-se um losango amarelo, isto significa que o tráfego é permitido nos dois sentidos."},{"t":"Navegação e balizamento","x":"Num pilar de ponte sobre um rio navegável, observou-se um triângulo pintado de verde, isto significa que o tráfego está à direita de quem desce ou sobe o rio."},{"t":"Navegação e balizamento","x":"Num pilar de ponte sobre um rio navegável, observou-se um triângulo pintado de vermelho, isto significa que o tráfego está à esquerda de quem desce ou sobe o rio."},{"t":"Navegação e balizamento","x":"Num pilar de ponte sobre um rio navegável, observou-se um retângulo pintado de verde, isto significa que o tráfego está à direita de quem desce ou sobe o rio."},{"t":"Navegação e balizamento","x":"Num pilar de ponte sobre um rio navegável, observou-se um retângulo pintado de vermelho com uma faixa larga horizontal branca, isto significa que o tráfego está proibido."},{"t":"Navegação e balizamento","x":"Uma bóia, à noite, emitindo uma luz amarela, significa área de recreação."},{"t":"Navegação e balizamento","x":"À noite, foi avistada uma luz verde piscando e, pela carta náutica, verificou-se a aproximação da entrada de um porto. O formato provável deste sinal é cilíndrico."},{"t":"Navegação e balizamento","x":"Durante o dia, observou-se uma haste em forma de pilar, com duas esferas pretas na sua parte de cima. Provavelmente estamos diante de um perigo isolado."},{"t":"Navegação e balizamento","x":"Durante o dia, observou-se um pilar, com dois cones pretos em cima. Provavelmente estamos diante de um quadrante de águas seguras."},{"t":"Navegação e balizamento","x":"O balizamento de interior de porto obedecerá a regras definidas e deverá ser utilizado, pelo navegante, como orientação para uma navegação segura."},{"t":"Navegação e balizamento","x":"Quando duas embarcações à propulsão mecânica estiverem se aproximando em rumos quase ou diretamente opostos com risco de abalroamento, deverão se cruzar “bombordo com bombordo”."},{"t":"Navegação e balizamento","x":"A sinalização de águas seguras significa águas navegáveis."},{"t":"Navegação e balizamento","x":"A marca de tope do sinal de águas seguras é uma esfera encarnada."},{"t":"Navegação e balizamento","x":"As regras do RIPEAM se aplicam a todas as embarcações em mar aberto e em todas as águas a este ligadas, navegáveis por navios de alto mar, e para embarcações em águas interiores."},{"t":"Navegação e balizamento","x":"A região do balizamento que engloba o Brasil é chamada: Região “B” (IALA B)."},{"t":"Navegação e balizamento","x":"No Brasil a “direção convencional do balizamento”, ou seja, a numeração do balizamento cresce sempre vindo do mar e, no caso da navegação fluvial, subindo o rio."},{"t":"Navegação e balizamento","x":"Uma embarcação quando em operação de mergulho, deverá exibir a bandeira ALFA."},{"t":"Navegação e balizamento","x":"Uma embarcação navegando à vela, quando também usando sua propulsão mecânica, deve exibir a vante, onde melhor possa ser visto uma marca em forma de cone, com vértice para baixo."},{"t":"Navegação e balizamento","x":"Deve ser considerada uma embarcação alcançadora aquela que se aproximar da outra vindo de uma direção de mais de 22,5° graus para ré do través dessa última e com maior velocidade."},{"t":"Navegação e balizamento","x":"Se um navegante vai do Rio de Janeiro para Belém, ele estará realizando uma navegação de cabotagem."},{"t":"Navegação e balizamento","x":"Embarcações de propulsão mecânica com menos de 12 metros de comprimento, ao invés das luzes prescritas no parágrafo a) da regra 23 do RIPEAM, pode exibir uma luz circular branca e luzes de bordos."},{"t":"Navegação e balizamento","x":"A expressão “correr com o tempo” significa por o mar pela alheta e navegar com velocidade reduzida para aguentar um temporal."},{"t":"Navegação e balizamento","x":"Uma embarcação, à noite, exibindo duas luzes circulares encarnadas dispostas em linha vertical será uma embarcação sem governo."},{"t":"Navegação e balizamento","x":"Embarcações de esporte e recreio de comprimento inferior a 12 metros, exibem normalmente luzes de bordo (verde e encarnada) combinadas e uma luz circular branca."},{"t":"Navegação e balizamento","x":"Uma luz branca continua situada tão próximo quanto possível da popa, ou no espelho de popa, visível apenas de quem vem de ré, num setor horizontal de 135°, chamas-e luz de alcançado."},{"t":"Navegação e balizamento","x":"Uma luz amarela, com as mesmas características da luz de alcançado, e por cima desta, chama-se luz de reboque."},{"t":"Navegação e balizamento","x":"Uma luz branca contínua, situada no mastro da embarcação visível de quem vem de través ou de proa em um setor horizontal de 225°, chama-se luz de mastro."},{"t":"Navegação e balizamento","x":"Uma embarcação de comprimento menor que 20 metros à vela, à noite, em movimento, poderá exibir uma lanterna combinada no mastro onde melhor possa ser vista."},{"t":"Navegação e balizamento","x":"As embarcações com propulsão somente a vela com classes padronizadas por “tipo” para tráfego exclusivamente no período diurno, estão dispensadas de dotar material de salvatagem prescrito, exceto os coletes salva-vidas."},{"t":"Navegação e balizamento","x":"Uma embarcação com comprimento inferior a 50 metros, exibindo uma luz branca onde melhor possa ser vista está fundeada."},{"t":"Navegação e balizamento","x":"Uma embarcação com comprimento igual ou superior a 100 metros, fundeada, em visibilidade restrita, deverá soar o sino a vante e o gongo a ré."},{"t":"Navegação e balizamento","x":"Na sinalização fluvial, entende-se por margem esquerda a margem situada do lado esquerdo de quem desce o rio (de montante para jusante)."},{"t":"Navegação e balizamento","x":"Uma embarcação a motor com mais de 12 metros, com uma luz branca onde melhor possa ser vista está fundeada."},{"t":"Navegação e balizamento","x":"As boias dos sinais cardinais são: Norte, Leste, Sul e Oeste (estes são os 4 quadrantes)."},{"t":"Navegação e balizamento","x":"De acordo com o RIPEAM, em um canal estreito, se alguma embarcação está me alcançando e faz soar dois apitos longos e um curto, caso eu concorde com a ultrapassagem, devo soar quatro apitos (longo, curto, longo, curto) e manobrar, permitindo a ultrapassagem segura pelo meu boreste."},{"t":"Navegação e balizamento","x":"Ao me deparar com uma boia cardinal Norte, eu entendo que é perigoso navegar ao Sul, Leste e Oeste da boia."},{"t":"Navegação e balizamento","x":"De acordo com o RIPEAM, em situação de risco de abalroamento, a embarcação que não tem a obrigação de manobrar, é chamada de “embarcação que tem preferência”."},{"t":"Primeiros socorros","x":"Quando por ocasião de um acidente a bordo, o acidentado não estiver respirando, deve-se proceder a uma respiração boca a boca."},{"t":"Primeiros socorros","x":"A frequência de sopros por minuto, numa respiração boca a boca é de 10 a 15."},{"t":"Primeiros socorros","x":"Para se realizar a respiração boca a boca, deve-se, antes, verificar se existem corpos estranhos na boca."},{"t":"Primeiros socorros","x":"Caso seja verificado que, após ter feito a respiração boca a boca, o coração da vítima ainda não está batendo, o procedimento correto será fazer massagem cardíaca externa."},{"t":"Primeiros socorros","x":"Caso o coração da vítima de um acidente a bordo, não esteja batendo, deve-se iniciar a massagem cardíaca externa."},{"t":"Primeiros socorros","x":"Um dos sintomas que acompanha a parada cardíaca é a menina dos olhos dilatada."},{"t":"Primeiros socorros","x":"O que deve ser tentado no caso de parada cardíaca, e que às vezes funciona, de imediato é um murro forte no peito da vítima."},{"t":"Primeiros socorros","x":"Após a massagem cardíaca ter feito o coração voltar a bater, deve-se continuar a respiração boca a boca."},{"t":"Primeiros socorros","x":"A frequência ideal de compressão e descompressão do peito, na massagem cardíaca externa é de 69 vezes por minuto."},{"t":"Primeiros socorros","x":"Quando houver ao mesmo tempo, parada respiratória e parada cardíaca, deve-se realizar movimentos intercalados, 8 massagens cardíacas e uma respiração boca a boca."},{"t":"Primeiros socorros","x":"Na respiração boca a boca, deve-se deixar a cabeça da vítima voltada para trás."},{"t":"Primeiros socorros","x":"No caso de fratura de antebraço, pode-se imobilizá-lo com tábua, papelão ou jornal grosso."},{"t":"Primeiros socorros","x":"A tala é o dispositivo utilizado para imobilizar ossos quebrados, por meio de tiras de pano amarradas a ele."},{"t":"Primeiros socorros","x":"Para imobilizar o braço, deve-se deixá-lo dobrado."},{"t":"Primeiros socorros","x":"Para fraturas na perna, pode-se prender madeiras compridas, por meio de tiras de pano ou cinto, com a perna esticada."},{"t":"Primeiros socorros","x":"A posição do pé, de uma perna quebrada, deve ser a mais natural possível."},{"t":"Primeiros socorros","x":"Caso exista risco de incêndio ou de explosão, em local próximo à vítima fraturada, deve-se removê-la primeiro do local de risco."},{"t":"Primeiros socorros","x":"A vítima de choque elétrico precisa ser afastada do contato com a corrente elétrica, utilizando material não condutor de eletricidade."},{"t":"Primeiros socorros","x":"A peça de metal é um dos materiais que não deve ser utilizado para afastar a vítima do contato com a corrente elétrica."},{"t":"Primeiros socorros","x":"Após a retirada da vítima do contato com a corrente elétrica, caso seja necessário, deve-se realizar respiração boca a boca e massagem cardíaca externa."},{"t":"Primeiros socorros","x":"Nas pequenas queimaduras, deve-se lavar com água e evitar romper a bolha."},{"t":"Primeiros socorros","x":"Nas grandes queimaduras, nunca se deve tirar a roupa da vítima."},{"t":"Primeiros socorros","x":"Uma queimadura de 2° grau é caracterizada pela presença de bolhas e exudação."},{"t":"Primeiros socorros","x":"Em uma queimadura de 3° grau a derme fica completamente destruída."},{"t":"Primeiros socorros","x":"Hemorragia é uma grande perda de sangue."},{"t":"Primeiros socorros","x":"Sempre que visualizamos o sangue, dizemos que a hemorragia é externa."},{"t":"Primeiros socorros","x":"Para estancarmos uma hemorragia, devemos pressionar o local com pano grosso."},{"t":"Primeiros socorros","x":"A vítima de hemorragia deve ser aquecida para evitar choque."},{"t":"Primeiros socorros","x":"O método de (hemostasia) interrupção de sangramento que menos malefício causa a vítima é a compressão."},{"t":"Primeiros socorros","x":"O torniquete é utilizado para estancar hemorragias muito grandes."},{"t":"Primeiros socorros","x":"O torniquete deve ser aplicado, utilizando um pano largo e um pedaço de madeira que se fixará ao pano, por meio de um nó e torcendo a madeira, a pressão interromperá a hemorragia."},{"t":"Primeiros socorros","x":"Excetuados os casos em que o torniquete é aplicado logo acima de amputações, o aperto deve ser aliviado de 15 em 15 minutos."},{"t":"Primeiros socorros","x":"São cuidados importantes com o torniquete: apertá-lo sempre que a hemorragia não estancar, não retirá-lo logo que a hemorragia cesse, não cobri-lo e aliviar o aperto de 15 em 15 minutos."},{"t":"Primeiros socorros","x":"São atitudes certas, com relação a vítima de grandes hemorragias, não dar líquidos enquanto estiver inconsciente e mantê-la agasalhada."},{"t":"Primeiros socorros","x":"Os primeiros socorros são medidas emergenciais de prestação de socorro, antes do encaminhamento médico."},{"t":"Primeiros socorros","x":"Intermação, é a consequência do excessivo calor em locais úmidos e não arejados sobre o indivíduo"},{"t":"Primeiros socorros","x":"Nos casos de ingestão de substâncias corrosivas, cáusticos em geral e derivados de petróleo, diluir ou neutralizar essas substâncias pela ingestão de água ou leite."},{"t":"Primeiros socorros","x":"Quando, por algum motivo, não podermos aplicar o método boca a boca, poderemos ventilar a vítima através do nariz."},{"t":"Primeiros socorros","x":"A condição na qual o corpo humano perde calor mais rapidamente pode ser produzido por Hipotermia."},{"t":"Primeiros socorros","x":"A Hipotermia se dá por qualquer água que esfrie o suficiente para a abaixar a temperatura do corpo a menos de 35 graus centígrados."},{"t":"Primeiros socorros","x":"Em caso de hipotermia, após aplicar os primeiros socorros, deveremos deixar o paciente em posição de decúbito ventral, levemente inclinada de lado."},{"t":"Primeiros socorros","x":"A lesão em decorrência da exposição prolongada ao frio, chama-se Geladura."},{"t":"Primeiros socorros","x":"A fim de melhorar o conforto da vítima com fratura na perna, a melhor posição que ela deve ser imobilizada é: esticada."},{"t":"Primeiros socorros","x":"A quantidade aproximada de sangue no organismo é de 6 litros."},{"t":"Primeiros socorros","x":"Na intoxicação por gazes a pele assume a cor azulada."},{"t":"Primeiros socorros","x":"Para evitar infecções em uma ferida devemos limpar com água e sabão, banhar a ferida com soro fisiológico e limpá-la periodicamente."},{"t":"Primeiros socorros","x":"As principais complicações de uma ferida são hemorragia e infecção."},{"t":"Primeiros socorros","x":"Insolação é a consequência da exposição direta e prolongada dos raios solares sobre o indivíduo."},{"t":"Primeiros socorros","x":"No caso de afogamento, proceda do seguinte modo: deite o afogado de lado, para vomitar a água que bebeu, tire a roupa molhada e aqueça-o."},{"t":"Primeiros socorros","x":"Caso o afogado não esteja respirando, deve-se deitá-lo de lado, limpar sua boca de objetos que obstruam sua respiração e realizar a respiração boca a boca."},{"t":"Primeiros socorros","x":"Caso o coração do afogado não esteja batendo, devo proceder a uma massagem cardíaca externa."},{"t":"Primeiros socorros","x":"Caso a pessoa queimada esteja com as roupa grudadas no corpo, deve-se manter as roupas sobre as queimaduras."},{"t":"Primeiros socorros","x":"Vejo sair um líquido claro de um ferimento do ouvido, significa fratura de crânio."},{"t":"Primeiros socorros","x":"Em caso de fratura interna a ação imediata será imobilizar o membro afetado."},{"t":"Segurança e incêndio","x":"Só haverá fogo quando ocorrer a presença de três elementos do triângulo do fogo: o combustível, o comburente (oxigênio) e a temperatura de ignição."},{"t":"Segurança e incêndio","x":"A temperatura necessária para que a reação química ocorra entre o combustível e o comburente, produzindo gases capazes de entrarem em combustão, chama-se temperatura de ignição."},{"t":"Segurança e incêndio","x":"Combustão é a reação de combustível e oxigênio, ao se encontrarem, na presença da temperatura de ignição."},{"t":"Segurança e incêndio","x":"O combustível é o elemento da natureza capaz de se queimar na presença de oxigênio e da temperatura de ignição."},{"t":"Segurança e incêndio","x":"Comburente é todo elemento que, associando-se quimicamente ao combustível, é capaz de fazê-la entre em combustão. O comburente mais facilmente encontrado na natureza é o oxigênio."},{"t":"Segurança e incêndio","x":"Chama-se “Ponto de Ignição”, a temperatura necessária para inflamar os gases que estejam se desprendendo de um combustível, só com a presença do comburente."},{"t":"Segurança e incêndio","x":"Os equipamentos de combate a incêndio mais comumente encontrados a bordo das embarcações de esporte e recreio são os extintores portáteis."},{"t":"Segurança e incêndio","x":"Extintores portáteis são equipamentos de combate a incêndio, que utilizam os agentes extintores para apagar o fogo."},{"t":"Segurança e incêndio","x":"Os agentes extintores são as substâncias que extinguem incêndios."},{"t":"Segurança e incêndio","x":"Com incêndio a bordo, para dar combate as chamas me mantenho a barlavento das chamas e fumaça."},{"t":"Segurança e incêndio","x":"O extintor de água deve ser utilizado no combate a incêndio em materiais sólidos inflamáveis."},{"t":"Segurança e incêndio","x":"O incêndio da classe “A” ocorre em materiais fibrosos ou sólidos inflamáveis que deixam como resíduos brasas ou cinzas. Por exemplo: papel, madeira, pano."},{"t":"Segurança e incêndio","x":"Os extintores de CO2 são utilizados em incêndios de equipamentos elétricos quando energizados."},{"t":"Segurança e incêndio","x":"Os extintores de espuma são utilizados em incêndios em líquidos inflamáveis."},{"t":"Segurança e incêndio","x":"O incêndio da classe “B” é o que ocorre em líquidos inflamáveis."},{"t":"Segurança e incêndio","x":"O incêndio da classe “C” é o que ocorre em materiais ou equipamentos elétricos ou eletrônicos quando energizados."},{"t":"Segurança e incêndio","x":"Para se utilizar o extintor de água, deve-se apertar o gatilho e direcioná-lo para a base das chamas."},{"t":"Segurança e incêndio","x":"Para se utilizar o extintor CO2, deve-se retirar o pino de segurança, segurar o difusor e apertar o gatinho, direcionando o jato, para a base do fogo."},{"t":"Segurança e incêndio","x":"Para se utilizar o extintor de espuma, deve-se virar o extintor, com a tampa para baixo, e dirigir o jato sobre a base das chamas."},{"t":"Segurança e incêndio","x":"O combate a incêndio é muito auxiliado quando removemos para longe o material inflamável e resfriamos os locais próximos."},{"t":"Segurança e incêndio","x":"São cuidados que devemos ter com os extintores de CO2: evitar o contato direto do jato com a pele e os olhos."},{"t":"Segurança e incêndio","x":"O agente extintor de CO2 tem como inconveniente o fato de poder asfixiar uma pessoa em ambientes não ventilados."},{"t":"Segurança e incêndio","x":"A água é um agente extintor que pode ser utilizado nos incêndios em acomodações."},{"t":"Segurança e incêndio","x":"Os extintores portáteis devem ser arrumados em locais de fácil acesso e de risco de incêndio."},{"t":"Segurança e incêndio","x":"Estou na cabine de comando e começo a sentir cheiro de queimado vindo do motor. O extintor portátil que devo pegar é o de espuma."},{"t":"Segurança e incêndio","x":"Estando na popa da embarcação e vejo sair fumaça no console de navegação. O extintor que deve ser pego é o de CO2."},{"t":"Segurança e incêndio","x":"Podemos improvisar, para apagar incêndios, na falta de um extintor portátil, baldes de água."},{"t":"Segurança e incêndio","x":"Deve-se ter a bordo sempre extintores portáteis com as revisões anuais dentro da validade."},{"t":"Segurança e incêndio","x":"A quantidade e o tipo de extintor portátil, nas embarcações de esporte e recreio, devem ser cumpridos a bordo, para seguir viagem, e são definidos em documentos normativos da DPC (na NORMAM-03 da DPC)."},{"t":"Segurança e incêndio","x":"Os sistemas fixos de combate a incêndio são sistemas com difusores fixos."},{"t":"Segurança e incêndio","x":"Os incêndios, em locais de difícil acesso, são combatidos através de sistemas fixos de agentes extintores."},{"t":"Segurança e incêndio","x":"São agentes extintores: água, CO2, espuma e o pó químico."},{"t":"Segurança e incêndio","x":"O agente extintor para incêndios classe “D” é o Pó Químico Seco (PQS)."},{"t":"Segurança e incêndio","x":"Os incêndios que envolvem metais combustíveis como sódio, potássio, magnésio, titânio e alumínio são denominados incêndios da classe “D”."},{"t":"Segurança e incêndio","x":"Extintores utilizados em incêndios classe “A” são identificados por meio de um triângulo verde."},{"t":"Segurança e incêndio","x":"Extintores utilizados em incêndios classe “B” são identificados por meio de um quadrado vermelho."},{"t":"Segurança e incêndio","x":"Extintores utilizados em incêndios classe “C” são identificados por meio de um círculo azul."},{"t":"Segurança e incêndio","x":"Extintores utilizados em incêndios classe “D” são identificados por meio de uma estrela amarela."},{"t":"Segurança e incêndio","x":"O melhor agente extintor para incêndios classe “A” e “B”, apesar de existir em quantidade limitada a bordo é a espuma."},{"t":"Segurança e incêndio","x":"O extintor de Pó Químico Seco (PQS) tem como desvantagem o fato dos resíduos poderem avariar equipamentos eletrônicos."},{"t":"Segurança e incêndio","x":"O éter e a benzina são considerados combustíveis voláteis."},{"t":"Segurança e incêndio","x":"O método mais antigo de se apagar incêndios, sendo seu agente universal a água, é chamado de resfriamento."},{"t":"Segurança e incêndio","x":"É comum se ter incêndio a bordo decorrente de material elétrico mal especificado como disjuntores que provocam grandes centelhas."},{"t":"Segurança e incêndio","x":"As combustões podem ser classificadas conforme sua velocidade em completa, incompleta, espontânea e explosão."},{"t":"Segurança e incêndio","x":"O vapor de água pode ser utilizado como agente extintor, por abafamento."},{"t":"Segurança e incêndio","x":"Um exemplo de combustível sem comburente seria a madeira."},{"t":"Segurança e incêndio","x":"Os incêndios de combustíveis que tenham comburente em sua estrutura íntima somente podem ser extintos por resfriamento."},{"t":"Segurança e incêndio","x":"O agente extintor espuma tem como funções principal e secundária, abafar e resfriar, respectivamente."},{"t":"Segurança e incêndio","x":"Há três métodos de transmissão de calor, a saber: irradiação, condução e convecção."},{"t":"Segurança e incêndio","x":"Todo material capaz de entrar em combustão, tais como, madeira, papel, pano, estopa, tinta, chama-se Combustível."},{"t":"Segurança e incêndio","x":"O agente extintor dióxido de carbono (CO2) tem como funções principal e secundária, abafar e resfriar, respectivamente."},{"t":"Segurança e incêndio","x":"Analisando os combustíveis sólidos, podemos dizer que quanto maior a fragmentação do material, maior será a velocidade da combustão."},{"t":"Segurança e incêndio","x":"Os locais adequados para armazenar combustível, a bordo de embarcações, são os compartimentos abaixo da linha d’água."},{"t":"Segurança e incêndio","x":"O método de extinção de incêndio pelo qual se retira o oxigênio da combustão é conhecido como abafamento."},{"t":"Segurança e incêndio","x":"Não esqueça: o mais eficiente método de combater incêndios é evitar que eles tenham início, ou seja, é a prevenção, evitando que ele ocorra."},{"t":"Segurança e incêndio","x":"Diz-se que os combustíveis voláteis são aqueles que liberam gases em temperaturas normais no ambiente."},{"t":"Segurança e incêndio","x":"Um dos principais cuidados que o navegante amador deve ter com os extintores de incêndio a bordo é mantê-los disponíveis e dentro do prazo de validade."},{"t":"Segurança e incêndio","x":"O extintor de espuma é o único extintor que precisamos inverter (virar) para que ele funcione corretamente."},{"t":"Sobrevivência no mar","x":"O colete salva-vidas deverá ser guardado a bordo, para ser vestido, no caso de ter que se abandonar a embarcação."},{"t":"Sobrevivência no mar","x":"Não se deve usar o colete salva-vidas como brinquedo, encosto ou como travesseiro."},{"t":"Sobrevivência no mar","x":"As embarcações de esporte e recreio classificadas para a navegação interior, deverão ser dotadas, obrigatoriamente, de 01 boia salva-vidas (com retinida flutuante) e coletes classe III (um para cada pessoa a bordo)."},{"t":"Sobrevivência no mar","x":"O colete salva-vidas deve ser utilizado amarrado ao corpo, com a parte flutuante para frente."},{"t":"Sobrevivência no mar","x":"O número de coletes a bordo deve atender ao limite máximo de pessoas a bordo."},{"t":"Sobrevivência no mar","x":"Os coletes salva-vidas, devem ficar em local de fácil acesso, em caso de necessidade, e nunca, amarrado à embarcação."},{"t":"Sobrevivência no mar","x":"Os coletes salva-vidas infláveis devem ser enchidos quando já dentro da água."},{"t":"Sobrevivência no mar","x":"No caso de abandono da embarcação, por causa de incêndio incontrolável, deve-se pular, quando houver óleo na superfície d’água, contra a correnteza."},{"t":"Sobrevivência no mar","x":"Para se afastar da embarcação acidentada, o mais rápido possível, deve-se nadar contra a correnteza e se for o caso, por baixo d’água, até afastar o risco de óleo, na superfície."},{"t":"Sobrevivência no mar","x":"Caso não haja vazamento de óleo e riscos de incêndio, nas proximidades da embarcação, deve-se afastar dela nadando a favor da correnteza."},{"t":"Sobrevivência no mar","x":"O abandono do navio, saltando pela borda, deverá ser sempre a barlavento, nadando-se em seguida contra a direção do vento, ou seja, ao pularmos na água, em uma faina (ação) de abandono, deveremos fazê-lo por barlavento."},{"t":"Sobrevivência no mar","x":"O abandono por barlavento se justifica por ser onde as manchas de óleo terão menor extensão e o abatimento por efeito do vento tornará mais rápido o afastamento da embarcação."},{"t":"Sobrevivência no mar","x":"Num abandono da embarcação não devemos saltar em cima da balsa salva-vidas."},{"t":"Sobrevivência no mar","x":"São alguns perigos à embarcação, em águas interiores: toras de madeira flutuando, troncos de árvore flutuando, pedras e bancos de areia."},{"t":"Sobrevivência no mar","x":"Para segurança da embarcação, deve-se proceder diversas verificações, antes de sairmos para navegar como luzes de navegação, equipamentos de salvatagem e de combate a incêndio."},{"t":"Sobrevivência no mar","x":"Nunca devemos exceder o limite permitido de pessoas a bordo."},{"t":"Sobrevivência no mar","x":"A estabilidade da embarcação é prejudicada quando ocorre excesso de peso, em partes altas da embarcação ou, má distribuição de pesos, em relação às laterais da embarcação. Nunca devemos afundar a marca do limite mínimo de flutuação."},{"t":"Sobrevivência no mar","x":"A bóia circular deve ser presa em local de fácil retirada."},{"t":"Sobrevivência no mar","x":"A melhor maneira de saltar na água, utilizando o colete salva-vidas, é com as pernas esticadas e os pés juntos."},{"t":"Sobrevivência no mar","x":"Para improvisar material flutuante, em caso de naufrágio, devemos utilizar pneus, latões, barris, toras ou pedaços grandes de madeira."},{"t":"Sobrevivência no mar","x":"A pessoa deve procurar abandonar a embarcação com roupas adequadas e material de salvatagem."},{"t":"Sobrevivência no mar","x":"Caso o número de náufragos seja maior do que a disponibilidade de balsas deverá ser previsto um revezamento para ficar dentro da balsa, de todos que estiverem em boas condições físicas."},{"t":"Sobrevivência no mar","x":"Havendo revezamento na balsa salva-vidas e para melhor conforto de quem está na balsa as roupas deverão ser trocadas para que os da balsa permaneçam com roupas sempre secas."},{"t":"Sobrevivência no mar","x":"O cabo que prende a balsa à embarcação, só deve ser cortado, quando já estiverem todos embarcados na balsa."},{"t":"Sobrevivência no mar","x":"A cobertura da balsa salva-vidas é de cor alaranjada para facilitar o avistamento."},{"t":"Sobrevivência no mar","x":"As rações modernas são em sua maioria em forma de açúcar."},{"t":"Sobrevivência no mar","x":"Além de outros fatores, a sobrevivência do náufrago depende do período de permanência em função da temperatura da água do mar. No que diz respeito à temperatura ambiente (temperatura do ar), seus efeitos sobre o pessoal estão intimamente ligados a velocidade do vento."},{"t":"Sobrevivência no mar","x":"Quando se deseja retornar e navegar no rumo oposto exatamente em cima da esteira (marca deixada pelo hélice) na manobra de guinada deve-se usar a Curva de Boutakow."},{"t":"Sobrevivência no mar","x":"Da mesma forma, quando alguém cai na água, ou seja, na situação de “homem ao mar”, e para retornar exatamente no rumo oposto sobre a esteira deixada pelo hélice, deve-se usar a Curva de Boutakow."},{"t":"Sobrevivência no mar","x":"A balsa salva-vidas fica em um casulo fechado, e se infla com o dispositivo especial, para ser utilizado pelos náufragos."},{"t":"Sobrevivência no mar","x":"As balsas são contidas em casulos de fibra de vidro que ficam dispostos em cabides próprios e localizados nos conveses abertos. Para sua utilização é preciso lançar o casulo no mar e, após o casulo cair n’água, recolher o cabo até que seja encontrada certa resistência, quando deverá ser dado um puxão forte, o que liberará a descarga das ampolas de CO2 que inflarão a balsa em cerca de 30 segundos."},{"t":"Sobrevivência no mar","x":"As balsas salva-vidas devem ser revisadas a cada 12 meses."},{"t":"Sobrevivência no mar","x":"Em um naufrágio, as condições adversas e a limitação de recursos de toda espécie exigem cuidados especiais com a saúde. É necessário economizar energia, não fazer esforços e não falar desnecessariamente. É conveniente, porém, movimentar-se com regularidade, a fim de manter a circulação sanguínea."},{"t":"Sobrevivência no mar","x":"O dispositivo utilizado pelo náufrago para chamar a atenção, de uso diurno, chama-se fumígeno."},{"t":"Sobrevivência no mar","x":"O dispositivo utilizado pelo náufrago para chamar a atenção, à noite, chama-se foguete pirotécnico."},{"t":"Sobrevivência no mar","x":"Para embarcar na balsa, devemos evitar fazer peso de um lado só, para ela não virar."},{"t":"Sobrevivência no mar","x":"Os coletes salva-vidas classe III são exigidos nas embarcações de esporte e/ou recreio apenas para as de interior de porto."},{"t":"Sobrevivência no mar","x":"Em naufrágios, a quantidade de água estipulada, na Marinha Brasileira, é de 700 ml por dia por homem (2 latas)."},{"t":"Sobrevivência no mar","x":"Uma retinida flutuante com alça de mão deve ser amarrado na bóia circular, para facilitar o resgate de alguém, que caiu na água."},{"t":"Sobrevivência no mar","x":"As balsas salva-vidas classe III são empregadas em embarcações que operam em águas restritas."},{"t":"Sobrevivência no mar","x":"Em caso de náusea, tomar logo o medicamento contra enjoo e manter-se deitado. O vômito representa grande perda de água para o organismo."},{"t":"Sobrevivência no mar","x":"A falta de funcionamento dos intestinos constitui fenômeno comum, em náufragos, dada a exiguidade de alimentação."},{"t":"Sobrevivência no mar","x":"Estão dispensadas de dotar embarcações de sobrevivência as embarcações empregadas na navegação interior."}]</script>
<script type="application/json" id="banco-en">[{"id":"838b61aa","q":"Which part of a vessel is called the bow (proa)?","o":["The rear end of the hull.","The left side when looking forward.","The front end of the hull.","The lowest part of the hold."],"c":"The bow is the forward end. The opposite end is the stern; port and starboard designate the sides."},{"id":"b2028c0a","q":"The stern (popa) corresponds to which region of the vessel?","o":["The front end of the hull.","The widest part of the hull.","The line separating the underwater body from the topsides.","The rear end of the hull."],"c":"The stern is the aft part of the vessel. When manoeuvring, watching its sideways movement is essential, since it swings toward the side opposite the turn."},{"id":"5f4e7f75","q":"Looking from the stern toward the bow, which side is starboard?","o":["The right side of the vessel.","The left side of the vessel.","The sector directly astern.","The sector directly ahead."],"c":"Starboard is always the right side when looking forward; it does not change with the position of the person on board."},{"id":"568f807f","q":"Looking from the stern toward the bow, which side is port?","o":["The right side of the vessel.","The left side of the vessel.","The sector below the keel.","The sector above the deck."],"c":"Port is the left side when looking forward. The corresponding sidelight is red."},{"id":"e12db04f","q":"In nautical terminology, what does a vessel's beam (boca) represent?","o":["The vertical distance between the waterline and the keel.","The length between bow and stern.","The greatest width of the hull.","The height of the main mast."],"c":"Beam is the width of the hull, normally measured at its widest section. It should not be confused with draft or overall length."},{"id":"c15340e2","q":"What does a vessel's draft indicate?","o":["The height between the waterline and the exposed deck.","The maximum width of the hull.","The vertical distance between the waterline and the lowest point of the hull or of the appendage considered.","The horizontal distance travelled in one hour."],"c":"Draft tells how deep the vessel sits in the water and must be compared with the available depth and the under-keel clearance."},{"id":"7bb19646","q":"What is freeboard?","o":["The part of the hull that is permanently submerged.","The distance between the bow and the centre of gravity.","The vertical distance between the waterline and the freeboard deck.","The clearance between the rudder and the propeller."],"c":"Freeboard is the height of hull that remains above the water. Overloading and flooding reduce this safety reserve."},{"id":"3e9a057b","q":"What is the basic structural function of the keel?","o":["To form the main lower longitudinal member of the hull.","To serve only as a support for fenders.","To replace the rudder when turning.","To mark the maximum load waterline."],"c":"The keel acts as a longitudinal backbone of the hull and contributes to its structural strength; in many hulls it also influences directional stability."},{"id":"81c1531b","q":"Which region does the term bilge (porão de esgoto or sentina) refer to?","o":["The low internal point where water and other liquids can accumulate.","The open control compartment.","The space above the main deck.","The external location intended for anchoring."],"c":"The bilge must be inspected and kept clean. Unexpected water there may indicate a leak or a loss of watertightness."},{"id":"6a267472","q":"What is the transom (espelho de popa)?","o":["The panel that closes off the bow.","The transverse surface that closes off the stern of many hulls.","The plate that divides the fuel tank.","The light reflection produced by the wake."],"c":"The transom is common on motorboats and may carry an outboard motor, fittings and other components, depending on the design."},{"id":"93280027","q":"The waterline is defined as:","o":["The planned track between two points.","The line where the water surface meets the hull in the condition considered.","The centreline of the deck.","A mark found only on sailing vessels."],"c":"The position of the waterline varies with load, trim and water density. In the observed condition, it separates the emerged and submerged parts of the hull."},{"id":"5e56a6af","q":"A vessel or object located to leeward (sotavento) is:","o":["On the side the wind is coming from.","Exactly ahead, regardless of the wind.","Always on the starboard side.","On the side toward which the wind is blowing."],"c":"Windward (barlavento) is the side the wind comes from; leeward (sotavento) is the side it blows toward. This reference is useful in approaches and rescues."},{"id":"390a761b","q":"Which knot forms a fixed loop that does not slip when under load?","o":["Bowline.","Reef knot (square knot).","Clove hitch.","Sheet bend."],"c":"The bowline forms a fixed, secure loop and is widely used in seamanship. Like any knot, it must be tied and checked correctly."},{"id":"56aceec9","q":"What is the main purpose of a figure-eight knot at the end of a line?","o":["To permanently join two wire ropes.","To form an adjustable loop for towing.","To replace a splice.","To prevent the end from slipping out through an eye, block or fairlead."],"c":"The figure-eight is a stopper knot. It adds bulk at the end and reduces the risk of the line running completely through a fitting."},{"id":"1172f424","q":"The clove hitch is normally used to:","o":["Join lines of very different diameters under heavy load.","Create a fixed rescue loop.","Quickly secure a line to a post, stanchion or similar object.","Shorten the anchor rode without hauling it in."],"c":"The clove hitch is simple and useful for temporary ties, but may need additional securing when the load varies or there is a risk of it loosening."},{"id":"e99e7a35","q":"Which knot is appropriate for joining two lines, especially when they are of different sizes?","o":["Figure-eight knot.","Sheet bend.","Bowline.","Round turn and two half hitches."],"c":"The sheet bend is traditionally used to join lines, including those of different diameters. The thinner line must work correctly around the bight of the thicker one."},{"id":"2d96f3d8","q":"The reef knot (square knot) is best suited for:","o":["Hoisting people or forming a rescue loop.","Temporarily joining lines of the same size in light applications, with no critical load.","Securing the anchor during bad weather.","Joining very different lines under alternating load."],"c":"If misused, the reef knot can slip, capsize or jam. It should not be chosen for critical loads or rescue."},{"id":"5705c5b0","q":"When making a line fast to a cleat, which practice helps keep the tie secure and tidy?","o":["Make crossing (figure-eight) turns and finish with the correct locking hitch, without unnecessary excess line.","Wrap the line only in parallel circles.","Tie several random knots over the cleat.","Leave the end loose on the wet deck."],"c":"The cleat hitch should spread the load and allow controlled release. Too many knots can hinder an emergency departure from the berth."},{"id":"4bbec0ec","q":"What is whipping on the end of a fibre line for?","o":["To increase the usable length of the line.","To prevent the strands from unravelling.","To turn the line into chain.","To automatically measure depth."],"c":"Whipping keeps the end of the line neat and protected, reducing fraying. It can be done with suitable twine or a method compatible with the material."},{"id":"62a26393","q":"When anchoring, what does the scope ratio (relação de filame) represent?","o":["The ratio between the length of rode paid out and the total depth considered.","The ratio between the vessel's beam and length.","The number of anchors divided by the number of crew.","The distance between two lateral buoys."],"c":"Adequate scope makes the pull act more horizontally on the anchor. Depth, height of the bow fitting, wind, current and swinging room must be considered."},{"id":"c0d9ca3e","q":"In general, increasing scope within safe limits has what effect?","o":["It makes the anchor lose contact with the bottom.","It improves the anchor's ability to dig in, by reducing the angle of pull.","It eliminates the swinging circle.","It removes the need to check the type of bottom."],"c":"More rode usually improves holding, but it also increases the swinging radius. Anchoring must take into account other vessels, hazards and depths."},{"id":"880480d3","q":"When choosing an anchorage spot, which set of factors is most important?","o":["Only the visual distance to the beach.","Only the engine power.","Only the colour of the water on arrival.","Depth, type of bottom, shelter, tide, wind, current and swinging room."],"c":"Good anchoring depends on the environment and on the capacity of the equipment. Tidal variation and the vessel's swing must be anticipated."},{"id":"85538463","q":"What is the main function of spring lines (espringues) when berthed?","o":["To keep the vessel solely held off the pier.","To replace all the fenders.","To limit the vessel's fore-and-aft movement along the pier.","To measure the height of the tide."],"c":"Spring lines work longitudinally and help prevent the vessel from moving ahead or astern along the pier. Head/stern lines and breast lines have different functions."},{"id":"01bef512","q":"When moored to a pier, breast lines (traveses) mainly act to:","o":["Prevent forward movement only.","Keep the anchor buried.","Control the sideways distance between the vessel and the pier.","Turn the rudder to starboard."],"c":"Breast lines are mooring lines run roughly at right angles to the vessel. They must be adjusted together with the other lines, taking tide and local movement into account."},{"id":"d1a70c4c","q":"What is the purpose of fenders when berthing?","o":["To absorb contact and protect the hull and the pier.","To permanently secure the vessel to the bottom.","To replace the life jacket.","To signal a vessel not under command."],"c":"Fenders should be placed at the expected height and contact points before the approach. They do not replace control of the manoeuvre or the mooring lines."},{"id":"1ca2aa35","q":"Why does a conventional rudder lose effectiveness when there is almost no water flowing past it?","o":["Because the compass stops pointing north.","Because the anchor starts acting on the hull.","Because the hydrodynamic force that produces the turn decreases.","Because the engine automatically increases its rpm."],"c":"The rudder needs water flow. Propeller wash, headway and current can change its response, so the manoeuvre must be anticipated."},{"id":"e9a5aca8","q":"With headway, when the rudder is put to starboard, what basic response is expected?","o":["The bow turns to port and the stern stays still.","The whole vessel moves sideways to starboard without turning.","The vessel stops immediately.","The bow turns to starboard and the stern tends to swing to port."],"c":"The rudder deflects the flow and creates a turning moment. In confined spaces it is essential to account for the stern's swing."},{"id":"58e86d0f","q":"On a single-propeller vessel with a right-handed propeller, what tendency is common when going astern?","o":["The stern always walks to starboard, without exception.","Bow and stern stay aligned with no sideways tendency.","The vessel turns only if the anchor has been let go.","The stern tends to walk to port, although wind, current and hull shape may modify the effect."],"c":"The transverse thrust (prop walk) of a right-handed propeller going astern usually pushes the stern to port. It should be observed in practice, as it varies between vessels."},{"id":"8887cadd","q":"On a twin-propeller vessel, one way to turn almost on the spot is to:","o":["Run both engines ahead at the same rpm.","Run one engine ahead and the other astern, with moderate power and control.","Shut down both engines and lock the rudder.","Anchor by the stern and apply full throttle."],"c":"With the engines in opposite directions, the thrusts create a turning moment. The manoeuvre requires low power, a good lookout and room for the hull to swing."},{"id":"1aa7d05c","q":"Whenever possible, the final approach for berthing should be planned:","o":["With the wind and current behind you, at high speed.","Perpendicular to the pier, without fenders.","Into the prevailing wind or current, using the stronger element to control speed.","With the engine shut down from a long way off."],"c":"Approaching against the dominant force improves control and allows headway to be reduced. The plan must consider space, depth and an escape route."},{"id":"22377a30","q":"If the wind is pushing the vessel against the pier when leaving the berth, what can help?","o":["Use a mooring line as a spring, together with fenders and engine/rudder in a controlled way, to swing one end clear.","Remove all fenders before casting off any line.","Go hard ahead with all lines still made fast.","Drop the anchor onto the pier."],"c":"The spring line can serve as a pivot point. The sequence must be agreed in advance, with communication among the crew and protection by fenders."},{"id":"a95d5a3f","q":"When picking up a mooring buoy, which approach gives the most control?","o":["Approach with the dominant force behind you at high speed.","Approach slowly into the dominant wind or current and arrive with little headway.","Pass the buoy along the stern with the propeller engaged.","Bump the buoy lightly to stop the boat."],"c":"The buoy must stay visible and clear of the propeller. A prepared crew member picks up the line once the vessel is already under control."},{"id":"7d7242d9","q":"On seeing a person fall into the water, what should the first response sequence be?","o":["Go into the cabin to look for documents.","Accelerate to move the vessel away from the spot.","Shout 'man overboard', throw a flotation device, keep visual contact and start the return manoeuvre.","Drop the anchor without telling anyone."],"c":"The alert mobilises the crew; the flotation device supports the person and marks the spot; one person should keep pointing at the casualty while the operator manoeuvres."},{"id":"0275c672","q":"On the final approach to a person in the water, the safest procedure is:","o":["Keep the propeller engaged to get alongside faster.","Arrive slowly, keep the person in sight and put the propulsion in neutral or shut it down before recovery.","Approach astern at high rpm.","Ask the person to swim to the engine exhaust."],"c":"The propeller or jet poses a serious hazard. The approach must take wind and current into account and finish with no dangerous thrust near the casualty."},{"id":"50b675da","q":"Why does manoeuvring astern usually require extra caution?","o":["Because the vessel is no longer affected by the wind.","Because the sidelights change colour.","Because the compass starts pointing south.","Rudder response may be weaker or different, visibility is worse and the stern becomes the leading end."],"c":"Going astern is a manoeuvring tool, not a way to travel fast. Use little way, keep a lookout and check the area astern frequently."},{"id":"8827faad","q":"A vessel is sitting very low at the bow because the load is concentrated forward. Which correction is most appropriate?","o":["Redistribute the load safely, respecting the capacity and the design limits.","Increase speed to hide the problem.","Move all the life jackets to the bow.","Empty the water tank onto the deck."],"c":"Poor load distribution alters trim, stability and the ability to handle waves. The load must be secured and kept within the authorised limits."},{"id":"a21afda7","q":"When planing near other vessels or the shore, which precaution is essential?","o":["Keep maximum speed to shorten the passing time.","Cross ahead of slow vessels.","Reduce speed in good time, control the wake and keep a safe distance.","Switch off the lights to avoid reflections."],"c":"Wake can cause damage, falls and danger to sma
