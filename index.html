e combustível pode impedir o crescimento do fogo. A ação deve ser feita sem atravessar fumaça ou perder a rota de fuga.","t":"Segurança e incêndio","id":"b007c3ee","v":"fogo"},{"q":"A água comeca a entrar no casco por uma pequena avaria. Qual resposta inicial e adequada?","o":["Desligar toda comunicação e continuar a viagem.","Concentrar todas as pessoas junto ao bordo mais baixo.","Usar coletes, identificar e reduzir a entrada, acionar esgoto e dirigir-se a local seguro enquanto se pede ajuda se necessário.","Abrir outros compartimentos para a água se distribuir."],"a":2,"c":"Controle de avaria combina segurança das pessoas, tamponamento, esgoto e navegação prudente. A estabilidade e a capacidade das bombas devem ser monitoradas.","t":"Segurança e incêndio","id":"dd66c3c0"},{"q":"A embarcação encalha inesperadamente. Antes de tentar desencalhar, o condutor deve:","o":["Verificar feridos, vazamentos, posição, fundo, maré e estabilidade, evitando manobra que agrave a avaria.","Engatar ré em potência máxima sem inspeção.","Transferir todos para a proa imediatamente.","Perfurar o casco para conferir a profundidade."],"a":0,"c":"Retirar a embarcação sem diagnóstico pode ampliar uma abertura que estava apoiada no fundo. A decisão considera maré, ajuda disponível e risco ambiental.","t":"Segurança e incêndio","id":"75f12cf2"},{"q":"Uma pessoa cai na água. Qual é a resposta imediata mais apropriada?","o":["Todos devem olhar para dentro da embarcação.","Acelerar em linha reta e voltar somente depois.","Pular na água sem colete e sem designar outro condutor.","Gritar o alerta, manter contato visual, lançar flutuação e iniciar manobra de recolhimento com segurança."],"a":3,"c":"Apontar continuamente para a pessoa evita perde-la de vista. A aproximação deve controlar hélice, vento, corrente e risco para quem realiza o resgate.","t":"Segurança e incêndio","id":"50a650cd"},{"q":"O que deve constar de uma orientação de segurança antes da saída?","o":["Somente o horário estimado de chegada.","Local e uso de coletes e extintores, procedimentos de emergência, comunicação, limites da embarcação e funções básicas da tripulação.","Apenas a senha do telefone do condutor.","A promessa de que nenhum equipamento será necessário."],"a":1,"c":"Uma breve orientação reduz o tempo de resposta e permite que outra pessoa auxilie se o condutor ficar incapacitado.","t":"Segurança e incêndio","id":"a965b043","v":"fogo"},{"q":"Qual é a primeira providencia ao encontrar uma vítima a bordo?","o":["Verificar a segurança da cena e proteger a si mesmo, a vítima e os demais antes de prestar atendimento.","Movimentar a vítima imediatamente, em qualquer situação.","Oferecer água antes de avaliar a consciência.","Retirar o colete do socorrista para trabalhar mais livre."],"a":0,"c":"O socorrista não deve se transformar em nova vítima. Depois de controlar riscos, avalia-se resposta e respiração e aciona-se ajuda.","t":"Primeiros socorros","id":"e3be1f32"},{"q":"Uma pessoa está inconsciente, respira normalmente e não há suspeita de trauma. Enquanto aguarda ajuda, deve-se:","o":["Deixá-la de costas e oferecer alimento.","Colocá-la em posição lateral de segurança e vigiar continuamente a respiração.","Colocá-la sentada sem apoio.","Iniciar compressão torácica apesar da respiração normal."],"a":1,"c":"A posição lateral ajuda a manter a via aérea e permite drenagem de secreções. Se houver suspeita de trauma, mova apenas quando necessário para segurança ou via aérea.","t":"Primeiros socorros","id":"5d401810"},{"q":"Uma vítima não responde e não respira normalmente. Qual sequência e adequada?","o":["Aguardar dez minutos antes de agir.","Dar líquidos e mantê-la sentada.","Procurar primeiro uma fratura no tornozelo.","Pedir socorro, providenciar DEA, iniciar RCP e seguir as orientações do equipamento e do atendimento de emergência."],"a":3,"c":"Respiração agônica não e normal. O reconhecimento precoce, a RCP de qualidade e o DEA aumentam a chance de sobrevivência.","t":"Primeiros socorros","id":"8ba9e054"},{"q":"Na RCP de um adulto, qual combinação corresponde a orientação usual para socorrista treinado?","o":["Dez compressões por minuto e uma ventilação a cada ciclo.","Compressões apenas no abdomen, sem retorno do tórax.","Compressões de 100 a 120 por minuto, cerca de 5 a 6 cm de profundidade e ciclos de 30 compressões para 2 ventilações.","Ciclos de 5 compressões para 30 ventilações."],"a":2,"c":"As mãos ficam no centro do tórax, com retorno completo entre compressões e interrupções minimas. Quem não puder ventilar deve ao menos manter compressões e seguir o regulador médico.","t":"Primeiros socorros","id":"c2fd0285"},{"q":"Qual é a medida inicial para controlar uma hemorragia externa importante?","o":["Retirar repetidamente o primeiro curativo para olhar o ferimento.","Oferecer bebida alcoólica para reduzir a dor.","Massagear vigorosamente ao redor da lesão.","Aplicar pressão direta firme com curativo ou tecido limpo e acionar ajuda."],"a":3,"c":"Se o curativo saturar, mantenha a pressão e acrescente material por cima. Hemorragia intensa pode exigir recursos e técnicas adicionais por pessoa treinada.","t":"Primeiros socorros","id":"ed40b265"},{"q":"Um objeto está cravado nó corpo de uma vítima. O que fazer?","o":["Puxá-lo rapidamente e lavar o interior da ferida.","Empurrá-lo até ficar totalmente coberto.","Quebrá-lo rente a pele sem estabilização.","Não retirar o objeto; estabilizá-lo ao redor e buscar atendimento urgente."],"a":3,"c":"A retirada pode aumentar a hemorragia e a lesão interna. O objeto só deve ser manipulado por equipe habilitada, salvo necessidade extrema para permitir atendimento vital.","t":"Primeiros socorros","id":"8ab458b4"},{"q":"Diante de suspeita de fratura em um membro, deve-se:","o":["Forcar o alinhamento até desaparecer a dor.","Manter o membro na posição encontrada, imobilizar sem apertar a circulação e procurar atendimento.","Pedir que a pessoa caminhe para testar.","Massagear diretamente a deformidade."],"a":1,"c":"Imobilize articulações acima e abaixo quando possível e verifique cor, temperatura e sensibilidade antes e depois. Fratura exposta exige proteção do ferimento.","t":"Primeiros socorros","id":"dd174a00"},{"q":"Após queda com suspeita de lesão na coluna, qual conduta é mais segura?","o":["Sentar a vítima para verificar equilibrio.","Evitar movimentos desnecessários, estabilizar cabeça e pescoco e acionar atendimento especializado.","Puxar pelos braços até outro compartimento sem necessidade.","Girar repetidamente a cabeça para testar a mobilidade."],"a":1,"c":"A vítima só deve ser movida sem técnica adequada se houver perigo maior imediato, como incêndio ou afundamento.","t":"Primeiros socorros","id":"021a8a84"},{"q":"Qual cuidado inicial é indicado para uma queimadura térmica recente e pequena?","o":["Aplicar gelo diretamente sobre a pele.","Passar manteiga, pasta de dente ou combustível.","Romper todas as bolhas.","Resfriar com água corrente limpa por cerca de 20 minutos, retirar adornos não aderidos e cobrir sem apertar."],"a":3,"c":"Água corrente fresca limita a lesão; gelo e receitas caseiras podem agravar o dano. Queimaduras extensas, profundas ou em áreas críticas exigem atendimento urgente.","t":"Primeiros socorros","id":"1d06f695"},{"q":"Um produto químico atinge os olhos. Qual resposta imediata e adequada?","o":["Neutralizar com outro produto químico sem saber a substância.","Esfregar os olhos com pano seco.","Manter os olhos fechados sem lavar.","Irrigar com grande quantidade de água limpa, mantendo as pálpebras abertas, e buscar orientação médica."],"a":3,"c":"A irrigação precoce dilui e remove o contaminante. Lentes de contato devem ser retiradas se sairem facilmente, sem atrasar a lavagem.","t":"Primeiros socorros","id":"66a35c70"},{"q":"Durante uma convulsão, qual procedimento e correto?","o":["Imobilizar braços e pernas com força.","Afastar objetos perigosos, proteger a cabeça, marcar o tempo e não conter os movimentos nem colocar nada na boca.","Introduzir um objeto entre os dentes.","Oferecer água enquanto a pessoa se debate."],"a":1,"c":"Depois da crise, verifique respiração e coloque em posição lateral se apropriado. Crise prolongada, repetida, com trauma ou primeira ocorrência requer socorro urgente.","t":"Primeiros socorros","id":"417df74c"},{"q":"Um adulto consciente engasga e não consegue falar, tossir ou respirar. Para socorrista treinado, qual conduta é indicada?","o":["Aplicar cinco golpes entre as escapulas e cinco compressões abdominais, alternando e acionando ajuda.","Dar água e mandar a pessoa deitar.","Introduzir os dedos as cegas na boca.","Esperar que a obstrução passe sem intervir."],"a":0,"c":"Se a pessoa perder a consciência, deve-se iniciar a sequência de RCP e procurar o objeto apenas quando visível. Gestantes e pessoas muito obesas requerem técnica adaptada.","t":"Primeiros socorros","id":"9a29e07e"},{"q":"Uma vítima apresenta pele pálida e fria, fraqueza e sinais de choque. Enquanto o socorro não chega, deve-se:","o":["Obrigá-la a caminhar para estimular a circulação.","Dar bebida alcoólica.","Colocá-la de pé com os braços elevados.","Deitá-la, mantê-la aquecida, controlar causas visíveis e não oferecer comida ou bebida."],"a":3,"c":"Choque pode acompanhar hemorragia, trauma ou outras emergências. A posição deve ser adaptada se houver dificuldade respiratória, trauma ou risco de vômito.","t":"Primeiros socorros","id":"c660d969"},{"q":"Uma pessoa apresenta confusão, pele muito quente e alteração de consciência após exposição ao calor. Isso sugere insolação grave. O que fazer?","o":["Cobri-la com varias mantas e impedir ventilação.","Acionar emergência e iniciar resfriamento rápido com os meios disponíveis, monitorando respiração.","Oferecer álcool e deixá-la sozinha.","Esperar a temperatura baixar sem agir."],"a":1,"c":"Alteração neurológica com hipertermia e emergência. Remova excesso de roupa e resfrie sem provocar risco adicional; não de líquidos a pessoa com consciência alterada.","t":"Primeiros socorros","id":"db0062b4"},{"q":"No resgate de uma pessoa submersa, qual prioridade protege tanto o socorrista quanto a vítima?","o":["Entrar na água sem flutuação, mesmo sem treinamento.","Realizar retirada sem se expor desnecessariamente, avaliar respiração e iniciar RCP e DEA quando indicados.","Suspender a vítima pelos braços e aguardar.","Tentar retirar água dos pulmões antes de avaliar respiração."],"a":1,"c":"Use alcance, cabo, boia ou embarcação sempre que possível. A falta de respiração exige ventilações e compressões conforme treinamento; não se deve atrasar RCP tentando drenar água.","t":"Primeiros socorros","id":"42097a62"},{"q":"Qual informação básica e fornecida pela agulha de uma bússola magnética?","o":["A profundidade exata abaixo da quilha.","A velocidade do vento verdadeiro.","A distância percorrida desde a partida.","A direção do norte magnético, usada como referência para determinar rumos."],"a":3,"c":"A bússola magnética não aponta diretamente o norte verdadeiro. Rumo, variação magnética e desvio da bússola devem ser compreendidos para seu uso correto.","t":"Instrumentos e meteorologia","id":"d4d37ba9"},{"q":"Qual é a diferença entre variação magnética e desvio da bússola?","o":["Variação é o ângulo entre norte verdadeiro e magnético; desvio é o erro causado pelo magnetismo da própria embarcação.","Variação e causada pelo motor, e desvio apenas pela maré.","São nomes diferentes para a mesma velocidade.","Variação mede profundidade, e desvio mede vento."],"a":0,"c":"A variação depende de lugar e época e aparece nas cartas. O desvio varia com a instalação e o rumo, devendo ser conhecido por comparação ou tabela.","t":"Instrumentos e meteorologia","id":"cf396f55"},{"q":"O receptor GNSS apresenta posição precisa na tela. Qual conduta continua obrigatória?","o":["Dispensar a observação visual.","Navegar sem considerar atualização cartográfica.","Manter vigilância e conferir a posição com carta, profundidade e outros meios disponíveis.","Aumentar a velocidade em baixa visibilidade."],"a":2,"c":"GNSS pode sofrer erro de configuração, perda de sinal ou falha de energia. Ele auxilia a navegação, mas não substitui vigilância, planejamento e avaliação do ambiente.","t":"Instrumentos e meteorologia","id":"9a0d8697"},{"q":"O ecobatímetro ou sonda fornece, em regra, qual dado?","o":["A altura das nuvens sobre a embarcação.","O rumo verdadeiro sem correção.","A distância vertical entre o transdutor e o fundo, conforme a calibração adotada.","A velocidade da corrente em qualquer profundidade."],"a":2,"c":"A leitura pode estar referida ao transdutor, a linha d'água ou a quilha, conforme o offset. O condutor precisa conhecer essa configuração e manter margem de segurança.","t":"Instrumentos e meteorologia","id":"a5c961a1"},{"q":"Para que serve o tacômetro do motor?","o":["Indicar a velocidade do vento.","Indicar a rotação do motor, normalmente em revoluções por minuto.","Medir a profundidade.","Apontar o norte magnético."],"a":1,"c":"A rotação ajuda a operar dentro da faixa recomendada e pode revelar carga ou falha anormal quando comparada com velocidade e condições usuais.","t":"Instrumentos e meteorologia","id":"4aa649e1"},{"q":"Qual grandeza e associada ao odômetro ou equipamento de log náutico?","o":["Pressão atmosférica e tendência do tempo.","Altura da maré astronômica.","Distância percorrida e, conforme o equipamento, velocidade da embarcação em relação a água.","Temperatura interna do motor."],"a":2,"c":"O sistema pode apresentar distância acumulada e velocidade. Corrente e abatimento explicam diferencas entre velocidade na água e velocidade sobre o fundo do GNSS.","t":"Instrumentos e meteorologia","id":"443c31ba"},{"q":"O anemômetro é utilizado para medir:","o":["A profundidade abaixo do casco.","A velocidade do vento.","A rotação do eixo propulsor.","A variação magnética da carta."],"a":1,"c":"Direção e intensidade do vento ajudam a avaliar manobra, ondas e evolução meteorológica. A leitura a bordo pode ser vento aparente, afetado pelo movimento da embarcação.","t":"Instrumentos e meteorologia","id":"549f034f"},{"q":"Uma queda contínua e acentuada da pressão indicada pelo barômetro pode sinalizar:","o":["Garantia de ceu limpo por vários dias.","Redução automática da maré.","Aproximação de sistema de baixa pressão e possível piora do tempo.","Falha obrigatória da bússola."],"a":2,"c":"A tendência barométrica deve ser analisada com nuvens, vento, previsão oficial e condições locais. Uma leitura isolada não substitui o conjunto de informações.","t":"Instrumentos e meteorologia","id":"cdb697b9"},{"q":"Qual nuvem está frequentemente associada a trovoadas, rajadas, chuva forte e descargas elétricas?","o":["Cirrus isolado e fino.","Cumulonimbus.","Stratus baixo sem desenvolvimento vertical.","Nuvem lenticular obrigatoriamente sem vento."],"a":1,"c":"Cumulonimbus tem grande desenvolvimento vertical e pode produzir mudanças bruscas. Procure abrigo cedo; não espere a tempestade alcançar a embarcação.","t":"Instrumentos e meteorologia","id":"b5004097"},{"q":"A formacao de nevoeiro reduz rapidamente a visibilidade. O condutor deve:","o":["Aumentar a velocidade para sair mais cedo.","Adotar velocidade segura, reforcar vigilância, usar sinais e equipamentos adequados e procurar local seguro se necessário.","Desligar luzes e VHF.","Seguir apenas a esteira de outra embarcação."],"a":1,"c":"Em visibilidade restrita, o risco pode existir antes do contato visual. O RIPEAM exige sinais de nevoeiro, prontidão de máquina e extrema cautela.","t":"Instrumentos e meteorologia","id":"88a2d7a3"},{"q":"Para que serve a escala Beaufort?","o":["Converter rumo magnético em verdadeiro.","Classificar coletes salva-vidas.","Estimar a força do vento a partir de sua intensidade e de efeitos observáveis no mar e em terra.","Calcular a idade da lua."],"a":2,"c":"A Beaufort relaciona numeros a faixas de vento e ao aspecto da superfície. É útil para observação, mas não substitui boletins e instrumentos.","t":"Instrumentos e meteorologia","id":"8262a21a"},{"q":"O que significam preamar e baixamar?","o":["Preamar é o nível máximo de uma maré; baixamar é o nível mínimo subsequente ou precedente.","Preamar e vento forte; baixamar e calmaria.","Preamar e corrente para sul; baixamar, para norte.","São duas escalas de temperatura da água."],"a":0,"c":"Os horários e alturas previstos aparecem nas Tabelas das Marés para locais de referência. Condições meteorológicas podem alterar os níveis observados.","t":"Instrumentos e meteorologia","id":"73fb87d8"},{"q":"Como se denominam, em termos gerais, a corrente de maré que acompanha a subida e a que acompanha a descida do nível?","o":["Deriva e abatimento.","Barlavento e sotavento.","Enchente e vazante, respectivamente.","Preamar e quadratura."],"a":2,"c":"Enchente e vazante descrevem o movimento horizontal associado ao ciclo de maré. O instante de corrente nula não coincide necessariamente com preamar ou baixamar.","t":"Instrumentos e meteorologia","id":"445f80ea"},{"q":"O que é a amplitude de maré em determinado ciclo?","o":["A distância entre duas boias laterais.","A velocidade máxima permitida no canal.","O ângulo entre norte verdadeiro e magnético.","A diferença de altura entre uma preamar e a baixamar associada."],"a":3,"c":"A amplitude varia com fase lunar, geometria local e outros fatores. Ela não deve ser confundida com a altura da maré referida ao nível de redução.","t":"Instrumentos e meteorologia","id":"05faeb8d"},{"q":"Em quais fases da Lua ocorrem, em geral, marés de sizígia, com maiores amplitudes?","o":["Lua nova e lua cheia.","Quartos crescente e minguante.","Somente no apogeu, independentemente da fase.","Em qualquer fase, sempre com a mesma amplitude."],"a":0,"c":"Nas sizigias, Sol, Terra e Lua ficam aproximadamente alinhados e os efeitos geradores de maré se reforcam. A resposta local pode ocorrer com defasagem.","t":"Instrumentos e meteorologia","id":"fcb63bf7"},{"q":"Em quais fases ocorrem, em geral, marés de quadratura, com menores amplitudes?","o":["Lua nova e lua cheia.","Quartos crescente e minguante.","Somente durante eclipses.","Apenas no verão."],"a":1,"c":"Na quadratura, as direções dos efeitos solar e lunar ficam aproximadamente perpendiculares e a amplitude tende a ser menor.","t":"Instrumentos e meteorologia","id":"7f1ec04c"},{"q":"Em muitos locais semidiurnos, a preamar do dia seguinte ocorre aproximadamente 50 minutos mais tarde. Como usar essa informação?","o":["Como regra exata para qualquer porto do mundo.","Para dispensar a verificação de profundidade.","Para calcular automaticamente o vento.","Apenas como noção geral; para navegar, consultar a Tabela das Marés oficial do local e da data."],"a":3,"c":"O ciclo lunar explica o atraso médio, mas o regime real pode ser semidiurno, diurno ou misto e sofrer efeitos locais e meteorológicos.","t":"Instrumentos e meteorologia","id":"de13f8df"},{"q":"A carta indica profundidade de 1,8 m e a altura de maré no instante e 0,7 m. Desprezando outras correções, qual é a profundidade estimada?","o":["1,1 m.","1,8 m.","2,5 m.","0,7 m."],"a":2,"c":"Soma-se a altura da maré a profundidade cartografada quando ambas usam o mesmo nível de referência: 1,8 + 0,7 = 2,5 m. Ainda se deve descontar calado e margem de segurança.","t":"Instrumentos e meteorologia","id":"fcc2fba7"},{"q":"Tanques parcialmente cheios podem reduzir a estabilidade por qual efeito?","o":["Efeito de variação magnética.","Efeito de superfície livre, pois o líquido se desloca e eleva virtualmente o centro de gravidade.","Efeito de luz de alcançado.","Efeito de cavitação do leme parado."],"a":1,"c":"O movimento transversal do líquido reduz a capacidade de endireitamento. Sempre que possível, evite muitos tanques folgados e mantenha cargas liquidas controladas.","t":"Instrumentos e meteorologia","id":"8685b246"},{"q":"Qual distribuição de carga tende a melhorar a estabilidade de uma pequena embarcação?","o":["Peso alto e concentrado em um único bordo.","Passageiros todos de pé na proa.","Peso baixo, centralizado e bem peado, respeitando lotação e limites do fabricante.","Objetos pesados soltos no convés."],"a":2,"c":"Elevar ou deslocar lateralmente o centro de gravidade aumenta banda e risco de emborcamento. Carga e pessoas devem ser distribuídas e fixadas.","t":"Instrumentos e meteorologia","id":"abd509b7"},{"q":"Qual é o canal internacional de chamada e socorro em radiotelefonia VHF marítima?","o":["Canal 06, na frequência de 121,5 MHz.","Canal 70 para conversas de rotina por voz.","Canal 16, na frequência de 156,8 MHz.","Canal 09 em qualquer país e circunstância."],"a":2,"c":"O canal 16 é usado para socorro, urgência, segurança e chamadas iniciais. Após contato de rotina, a conversa deve passar para canal de trabalho apropriado.","t":"Comunicações VHF","id":"d58c9279"},{"q":"Antes de transmitir pelo VHF, o operador deve:","o":["Pressionar o PTT por vários minutos sem falar.","Fazer chamadas de rotina durante um MAYDAY.","Usar linguagem codificada inventada.","Escutar o canal, confirmar que não há comunicação prioritária e preparar uma mensagem curta e clara."],"a":3,"c":"Escutar evita interferir em tráfego existente. Fale devagar, identifique a estáção e libere o canal assim que possível.","t":"Comunicações VHF","id":"1bd3ca68"},{"q":"Após estabelecer uma chamada de rotina no canal 16, qual é a conduta normal?","o":["Manter toda a conversa social no canal 16.","Combinar e mudar para um canal de trabalho adequado, liberando o canal 16.","Mudar para o canal 70 e conversar por voz.","Desligar o rádio antes que a outra estáção responda."],"a":1,"c":"O canal de chamada e socorro precisa permanecer disponível para tráfego prioritário. O canal de trabalho deve ser permitido para a finalidade e a área.","t":"Comunicações VHF","id":"7446d94c"},{"q":"Quando se usa a palavra-procedimento MAYDAY?","o":["Quando existe perigo grave e iminente para embarcação ou pessoa e é necessária assistência imediata.","Para solicitar informação meteorológica de rotina.","Para avisar pequeno atraso sem risco.","Para testar o microfone antes de sair."],"a":0,"c":"MAYDAY tem a maior prioridade. Uma chamada falsa ocupa recursos de busca e pode colocar outras vidas em risco.","t":"Comunicações VHF","id":"98a2fd88"},{"q":"Quando a palavra-procedimento PAN PAN é apropriada?","o":["Em mensagem urgente sobre segurança de pessoa ou embarcação, sem caracterizar perigo grave e iminente.","Somente depois de um abandono imediato.","Para anunciar previsão de vento destinada a todos.","Para reservar um canal de conversa particular."],"a":0,"c":"PAN PAN tem prioridade sobre mensagens comuns, mas fica abaixo do MAYDAY. Se a situação evoluir para perigo grave e iminente, a classificação deve ser elevada.","t":"Comunicações VHF","id":"1f02c525"},{"q":"Qual palavra-procedimento introduz uma mensagem importante de segurança da navegação ou meteorológica?","o":["MAYDAY RELAY em toda situação.","SECURITE.","PAN PAN MÉDICO obrigatoriamente.","OVER AND OUT como chamada inicial."],"a":1,"c":"SECURITE anuncia aviso de segurança. Em geral, a chamada é feita no canal de chamada e os detalhes seguem em canal indicado, conforme procedimento aplicável.","t":"Comunicações VHF","id":"249ecca9"},{"q":"Quais dados devem aparecer em uma mensagem de socorro, na medida do possível?","o":["Somente o primeiro nome do condutor.","Apenas a marca do motor.","Preco e data de compra da embarcação.","Identificação, posição, natureza do perigo, ajuda necessária, pessoas a bordo e outras informações úteis."],"a":3,"c":"Uma posição clara, repetida e com referência correta e decisiva. Se o tempo for curto, transmita primeiro identificação, posição e natureza do perigo.","t":"Comunicações VHF","id":"d39bae1e"},{"q":"Ao ouvir um MAYDAY que não lhe e dirigido, o operador deve:","o":["Iniciar conversa de rotina no mesmo canal.","Apagar a posição recebida.","Manter silêncio, anotar as informações e aguardar; responder ou retransmitir se a autoridade ou a situação exigir e puder prestar ajuda.","Transmitir musica para confirmar alcance."],"a":2,"c":"O tráfego de socorro tem prioridade absoluta. Uma estáção costeira ou outra embarcação pode coordenar as comunicações e impor silêncio.","t":"Comunicações VHF","id":"4c32d8ef"},{"q":"Para que é reservado o canal 70 do VHF marítimo?","o":["Conversas por voz entre passageiros.","Transmissão contínua de música.","Chamada seletiva digital - DSC, não comunicação rotineira por voz.","Comando remoto do motor de popa."],"a":2,"c":"Equipamentos DSC podem enviar alertas digitais, inclusive com identidade e posição quando corretamente integrados e configurados.","t":"Comunicações VHF","id":"7c78dc8d"},{"q":"O alcance prático de um rádio VHF portátil é influenciado principalmente por:","o":["Linha de visada, altura e qualidade da antena, potência, obstáculos e estado da bateria.","Fase da Lua como único fator.","Cor do casco da embarcação.","Quantidade de água potável a bordo."],"a":0,"c":"VHF propaga-se principalmente em linha de visada. Antena mais alta e desobstruida costuma ampliar o alcance; um portátil deve estar carregado e protegido da água.","t":"Comunicações VHF","id":"bab5397f"},{"q":"Qual é o limite básico da habilitação de Arrais-Amador?","o":["Conduzir qualquer navio em mar aberto e sem limite.","Conduzir embarcações de esporte e recreio nos limites da navegação interior, exceto moto aquática.","Conduzir exclusivamente moto aquática em alto-mar.","Exercer profissionalmente o comando de navio mercante."],"a":1,"c":"A habilitação e de amador e não autoriza atividade profissional. A moto aquática exige a categoria Motonauta, conforme as regras vigentes.","t":"Legislação","id":"b68f8014"},{"q":"O que autoriza a categoria Motonauta?","o":["Conduzir navios mercantes na navegação oceânica.","Pilotar qualquer embarcação profissional de passageiros.","Conduzir moto aquática nos limites da navegação interior, em atividade de esporte e recreio.","Dispensar inscrição e equipamentos da moto aquática."],"a":2,"c":"Motonauta é uma habilitação específica para moto aquática e não transforma o condutor em aquaviário profissional.","t":"Legislação","id":"e216e684"},{"q":"Durante a condução, como deve estar disponível a Carteira de Habilitação de Amador?","o":["Guardada obrigatoriamente em casa.","Valida e acessível para apresentação a fiscalização, no formato admitido pela Autoridade Marítima.","Substituida apenas por recibo de combustível.","Dispensada quando houver passageiros."],"a":1,"c":"O condutor deve possuir habilitação compatível com a embarcação e a área de navegação. Documento vencido ou categoria inadequada não atende ao requisito.","t":"Legislação","id":"a819c9a8"},{"q":"Segundo a LESTA, qual dever do comandante se relaciona a acidentes e perigos a navegação?","o":["Ocultar qualquer avaria para evitar fiscalização.","Modificar boias por conta própria.","Esperar o fim do ano para relatar um perigo urgente.","Comunicar a Autoridade Marítima acidentes, fatos e deficiências de auxílios a navegação ou obstáculos encontrados."],"a":3,"c":"O relato tempestivo permite providências, investigação e aviso aos demais navegantes. O comandante também deve cumprir e fazer cumprir as normas de segurança.","t":"Legislação","id":"70e3e5b3"},{"q":"Qual alternativa apresenta uma medida administrativa de segurança prevista na LESTA?","o":["Apreensão do certificado de habilitação ou impedimento da saída da embarcação, conforme o caso.","Prisão automática aplicada pelo fiscal sem processo.","Perda de propriedade de qualquer bem pessoal.","Cobranca de mensalidade obrigatória pela marina."],"a":0,"c":"Medida administrativa visa proteger pessoas, embarcação, tráfego e ambiente diante de risco ou irregularidade. Ela não se confunde necessariamente com a penalidade ao final do processo.","t":"Legislação","id":"14010766"},{"q":"Quais penalidades administrativas podem decorrer de infração a LESTA?","o":["Multa, suspensão, cancelamento da habilitação e demolição de obra ou benfeitoria, conforme o enquadramento.","Somente advertência verbal.","Apenas cobranca de nova inscrição.","Exclusivamente detenção aplicada pela Capitania."],"a":0,"c":"A penalidade depende da infração e do processo administrativo, sem prejuizo de outras responsabilidades civis ou penais quando cabíveis.","t":"Legislação","id":"e1738d11"},{"q":"Conduzir embarcação sem possuir habilitação compatível constitui:","o":["Conduta permitida se a viagem durar menos de uma hora.","Infração prevista no RLESTA, sujeita as medidas e penalidades cabíveis.","Situação regular sempre que houver colete a bordo.","Apenas falha contratual da marina."],"a":1,"c":"Habilitação, categoria e área precisam ser compatíveis com a condução. Emprestar a embarcação não transfere essa responsabilidade.","t":"Legislação","id":"3569c018"},{"q":"Navegar com equipamento de segurança obrigatório incompleto, inoperante ou fora da validade pode resultar em:","o":["Autorização automática para seguir até qualquer destino.","Infração e impedimento da saída ou outras providências, conforme o risco e o enquadramento.","Substituição do equipamento por telefone celular.","Dispensa por se tratar de embarcação de recreio."],"a":1,"c":"A lista obrigatória depende de classificação, área e características da embarcação. Inspecionar validade e funcionamento antes de sair evita risco e autuação.","t":"Legislação","id":"aaae6a8b"},{"q":"Transportar pessoas acima da lotação autorizada é perigoso porque:","o":["Melhora sempre a estabilidade por aumentar o peso.","É permitido desde que ninguém fique sentado.","Viola o limite da embarcação e pode reduzir borda-livre, estabilidade e capacidade de resposta.","Altera apenas o consumo, sem efeito na segurança."],"a":2,"c":"A lotação considera projeto e condições de segurança. O excesso pode agravar alagamento, comprometer distribuição de carga e dificultar abandono.","t":"Legislação","id":"d77533a5"},{"q":"Qual consequência o RLESTA preve para conduzir embarcação em estado de embriaguez ou após uso de substância entorpecente ou tóxica?","o":["Suspensão da habilitação por até 120 dias, com cancelamento em caso de reincidência, sem prejuizo de outras responsabilidades.","Apenas recomendação verbal sem registro.","Conversão automática da habilitação em profissional.","Nenhuma consequência para navegação interior."],"a":0,"c":"Álcool e drogas prejudicam julgamento, equilibrio, tempo de reação e vigilância. A proibição protege todos os usuários da água.","t":"Legislação","id":"b8468bc3"},{"q":"A partir de que distância da linha de base a moto aquática pode iniciar navegação em alta velocidade, salvo regra local mais restritiva?","o":["A partir de 20 metros.","A partir de 50 metros.","Somente depois de 2 milhas náuticas.","A partir de 200 metros da linha de base."],"a":3,"c":"A faixa próxima a praias, margens e instalações concentra banhistas e manobras de acesso. Normas locais, áreas proibidas e balizamento devem ser respeitados.","t":"Moto aquática","id":"0f3bec1d"},{"q":"Como deve ser feita a passagem entre a margem ou praia e a área permitida para navegação de moto aquática?","o":["Pela trajetória mais perpendicular possível a linha de base e em velocidade inferior a 3 nós.","Em zigue-zague e na maior velocidade possível.","Paralela a praia, a menos de 50 metros dos banhistas.","Com acelerações repetidas para produzir ondas."],"a":0,"c":"A travessia lenta e direta reduz o tempo na faixa sensível e torna o movimento previsível. Mantenha vigilância de banhistas e outras embarcações.","t":"Moto aquática","id":"0f241b11"},{"q":"Em qual período e permitida a navegação de moto aquática?","o":["No período diurno, entre o nascer e o pôr do sol, observadas as condições de segurança.","A qualquer hora, desde que o farol esteja aceso.","Somente entre meia-noite e amanhecer.","Durante a noite apenas com lanterna portátil."],"a":0,"c":"A moto aquática não deve operar à noite. Visibilidade, meteorologia e restrições locais ainda podem tornar insegura uma saída diurna.","t":"Moto aquática","id":"a3198e39"},{"q":"Quais classes de colete salva-vidas são admitidas atualmente para condutor e passageiro de moto aquática?","o":["Classe III ou classe V homologada para essa finalidade.","Somente classe I de uso oceânico.","Qualquer auxiliar de flutuação sem homologação.","Colete inflável automático de uso genérico, sem verificar classe."],"a":0,"c":"Condutor e passageiro devem vestir o colete adequado durante a operação. Ajuste, homologação e conservação precisam ser conferidos.","t":"Moto aquática","id":"355824f4"},{"q":"Onde deve ficar conectado o dispositivo de corte do motor - chave de segurança - durante a condução?","o":["Solto dentro do porta-objetos.","Ao condutor, conforme o sistema e o manual do fabricante, para desligar o motor em caso de queda.","Preso apenas ao passageiro.","Amarrado ao guidom sem contato com o condutor."],"a":1,"c":"O cordão de segurança precisa efetivamente separar-se e acionar o corte se o condutor cair. Teste o sistema conforme o manual antes da saída.","t":"Moto aquática","id":"1e7046ea"},{"q":"Qual posição de passageiro é proibida em uma moto aquática em movimento?","o":["À frente do condutor.","No assento próprio atrás do condutor.","Na posição prevista pelo fabricante.","Atrás do condutor, dentro da lotação."],"a":0,"c":"O condutor precisa controlar guidom, acelerador e campo visual. O passageiro deve permanecer no assento autorizado, atrás do condutor e com os pés nos apoios.","t":"Moto aquática","id":"a7da3cb1"},{"q":"Uma criança de 6 anos pode ser transportada em moto aquática?","o":["Sim, se ficar à frente do condutor.","Sim, sem colete quando o mar estiver calmo.","Sim, desde que a moto aquática tenha qualquer tamanho.","Não; o transporte de criança com menos de 7 anos é proibido."],"a":3,"c":"A restrição etária independe de experiência do condutor. Regras de lotação, colete e posição continuam aplicáveis as demais pessoas.","t":"Moto aquática","id":"0f177580"},{"q":"Uma criança com 9 anos supera o limite etário mínimo geral para passageiro. Que cuidado continua indispensável?","o":["Permitir que ela conduza a moto aquática sem habilitação.","Colocá-la à frente do condutor para facilitar a vigilância.","Transportá-la somente se ocupar com segurança a posição atrás do condutor, usar colete ajustado e cumprir lotação e regras locais.","Dispensar o colete porque já possui mais de 7 anos."],"a":2,"c":"A idade mínima não torna o transporte automaticamente seguro. O condutor deve avaliar porte, apoio dos pés, ajuste do colete e condições da água, além de confirmar eventuais regras locais e a autorização do responsável.","t":"Moto aquática","id":"42a085a2"},{"q":"Por que soltar totalmente o acelerador durante uma guinada pode dificultar o controle de muitas motos aquáticas?","o":["Porque o guidom trava mecanicamente em toda desaceleração.","Porque a bússola desliga o motor.","Porque a âncora flutuante e lancada automaticamente.","Porque o jato propulsor também produz o esforco de governo e diminui quando a potência é retirada."],"a":3,"c":"A capacidade de governo depende do projeto e da propulsão. Antecipe a manobra, mantenha distância e conheca os recursos de desaceleração e controle do modelo utilizado.","t":"Moto aquática","id":"8feb679c"},{"q":"Depois de um emborcamento, como a moto aquática deve ser desvirada?","o":["Sempre no sentido horário, para qualquer modelo.","No sentido indicado nó casco ou no manual do fabricante.","Puxando pelo cabo da chave com o motor ligado.","Girando-a repetidamente nos dois sentidos."],"a":1,"c":"O sentido incorreto pode permitir entrada de água no motor em alguns modelos. Antes de operar, o condutor deve conhecer o procedimento específico.","t":"Moto aquática","id":"c4103e0b"},{"q":"Há vegetação presa na grade de admissão da moto aquática. O que fazer antes de removê-la?","o":["Desligar o motor, retirar a chave de segurança e aguardar a parada total, seguindo o manual.","Manter o motor acelerado e colocar a mão na entrada.","Pedir ao passageiro que alcance a turbina em movimento.","Inverter os cabos da bateria com o motor ligado."],"a":0,"c":"A bomba a jato pode causar lesão grave. Nunca aproxime mãos, pés, cabelos ou roupas da admissão ou do bocal com o motor funcionando.","t":"Moto aquática","id":"ed94f601"},{"q":"Qual é o ponto mais seguro para reembarcar em uma moto aquática após uma queda?","o":["Pela proa, usando o guidom como degrau.","Pelo lado do bocal com o motor acelerado.","Por qualquer ponto, mantendo a turbina em movimento.","O ponto designado pelo fabricante, normalmente pela popa, com o motor desligado."],"a":3,"c":"Reembarcar pela área prevista reduz risco de emborcar novamente e de contato com a propulsão. Suba uma pessoa por vez e redistribua o peso.","t":"Moto aquática","id":"4a5ea341"},{"q":"O que deve integrar a inspeção previa de uma moto aquática?","o":["Apenas a aparência externa do banco.","Somente o nível de combustível, ignorando vazamentos.","Casco, bujões, combustível, vazamentos, bateria, comandos, chave de segurança, coletes, meteorologia e área de navegação.","A retirada do cordão de segurança para não perde-lo."],"a":2,"c":"Use a lista e o manual do fabricante. Planeje autonomia com reserva, informe o roteiro e não saia se houver falha de comando, vazamento ou condição meteorológica inadequada.","t":"Moto aquática","id":"72eaff64"},{"q":"Qual é a carga horária mínima atual do treinamento para Motonauta prevista na norma?","o":["Dez minutos apenas de prática.","Oito horas exclusivamente em sala.","Sessenta minutos de instrução teórica e sessenta minutos de instrução prática.","Nenhum treinamento antes do exame."],"a":2,"c":"O atestado deve decorrer de treinamento por entidade ou profissional habilitado nos termos da NORMAM-212/DPC. Cumprir o mínimo não dispensa prática responsável.","t":"Moto aquática","id":"fa901622"},{"q":"Como é estruturada a prova escrita de Motonauta segundo o programa oficial?","o":["Cem questões discursivas em oito horas.","Dez questões orais sem nota mínima.","Vinte questões de múltipla escolha, duração máxima de uma hora e trinta minutos e nota mínima 5 em 10.","Quarenta questões em trinta minutos, com nota mínima 9."],"a":2,"c":"O programa está no Anexo 3-C da NORMAM-212/DPC. A Autoridade Marítima pode atualizar procedimentos, por isso o candidato deve confirmar as instruções da Capitania onde fará o exame.","t":"Moto aquática","id":"e299b354"},{"q":"Na situação de \"roda a roda\" ou seja __________________ as embarcações deverão manobrar da seguinte forma:","o":["proa com proa, as duas guinam, cada uma para seu boreste","proa com proa, as duas guinam para os bordos opostos","rumos cruzados, as duas guinam para boreste","rumos cruzados, as duas guinam para os bordos opostos","ultrapassagem, o que alcança deverá manobrar"],"a":0,"c":"Situação de Roda a Roda: proa com proa, ambas guinam para boreste (direita).","t":"RIPEAM - regras de governo","id":"bb0a4f71","v":"governo"},{"q":"Embarcação com cabo de reboque inferior a 200 metros de comprimento deverá exibir:","o":["duas luzes encarnadas no mastro","uma luz branca no mastro","três luzes brancas no mastro","duas luzes brancas no mastro","quatro luzes brancas no mastro"],"a":3,"c":"Reboque \u003c 200m: 2 luzes brancas em linha vertical no mastro.","t":"Luzes, marcas e sinais sonoros","id":"f7943ef3"},{"q":"Se durante o dia eu avistar uma embarcação com um balão preto no mastro, ela estará:","o":["sem governo","pairando sob máquinas","fundeada","engajada em pesca de arrasto","em serviço de dragagem"],"a":2,"c":"Um balão preto (esfera) no mastro indica embarcação fundeada.","t":"Luzes, marcas e sinais sonoros","id":"b2d556a3","v":"formas"},{"q":"À noite, foi avistada uma luz verde piscando e, pela carta náutica, verificou-se a aproximação da entrada de um porto. Qual seria o formato provável deste sinal?","o":["Piramidal.","Cúbico.","Esférico.","Cilíndrico.","Cônico."],"a":3,"c":"No Brasil vale a Região B da IALA: entrando no porto, o sinal verde fica a bombordo e tem forma cilíndrica; o encarnado fica a boreste e é cônico. Corrigido: o material original indicava \"cônico\".","t":"Luzes, marcas e sinais sonoros","id":"19f21993","fix":1,"v":"lateral"},{"q":"Na sinalização fluvial, entende-se por margem esquerda a margem:","o":["situada do lado direito do fluxo da corrente","situada a boreste da embarcação","situada a bombordo da embarcação","situada do lado esquerdo de quem sobe o rio","situada do lado esquerdo de quem desce o rio"],"a":4,"c":"Margem esquerda é o lado esquerdo de quem desce o rio (em direção à foz).","t":"Balizamento IALA B","id":"4a136f7e"},{"q":"A sinalização de águas seguras significa:","o":["águas sem circulação","águas policiadas","águas navegáveis","águas limítrofes","águas rasas"],"a":2,"c":"Águas seguras indicam que há águas navegáveis em todo o entorno do sinal.","t":"Balizamento IALA B","id":"74037c7d","v":"seguras"},{"q":"Os cabos principais de amarração são:","o":["retinidas, espringues e traveses","lançantes, espringues e retinidas","lançantes, espringues e traveses","espringues de proa e de popa e retinidas","lançantes de proa e de popa e traveses"],"a":2,"c":"Lançantes (longitudinal), Espringues (longitudinal/trava) e Traveses (transversal).","t":"Cabos, nós e fundeio","id":"4b5011b2"},{"q":"Uma embarcação com um hélice apenas, com rotação no sentido anti-horário, com leme a meio, e em movimento para a vante tende a guinar para:","o":["bombordo muito rapidamente","boreste lentamente","boreste rapidamente","bombordo lentamente","boreste muito lentamente"],"a":3,"c":"Hélice passo esquerdo (anti-horário) para vante tende a levar a popa para boreste e a proa para bombordo.","t":"RIPEAM - regras de governo","id":"283355c2"},{"q":"Quando duas embarcações navegam num canal estreito, em rumos opostos, aproximando-se, a manobra correta de ambas caso haja risco de abalroamento:","o":["a embarcação que navega subindo o canal deve manobrar para bombordo e a outra deve manobrar para boreste","a embarcação que navega subindo o canal deve manobrar para boreste e a outra deve manobrar para bombordo","a embarcação que navega descendo o canal deve manobrar para boreste e a outra manter o rumo","ambas devem ir mais para a margem de seu boreste","ambas devem manter-se boreste com boreste"],"a":3,"c":"Em canais estreitos, a regra de ouro é manter-se o mais próximo possível da margem de boreste","t":"RIPEAM - regras de governo","id":"f356018b"},{"q":"Para se suspender de um fundeadouro devemos:","o":["ir recolhendo a âncora, com máquina devagar adiante, caso a amarra \"esteja dizendo para ré\" da embarcação","ir recolhendo a âncora, com máquina devagar adiante, caso a amarra esteja tesada para vante","ir recolhendo a âncora, com máquina devagar adiante, caso a amarra esteja perpendicular à embarcação","ir recolhendo a âncora, com máquina devagar atrás","ir recolhendo a âncora, observando a posição da amarra em relação a proa"],"a":4,"c":"Suspender (subir a âncora) exige atenção constante à posição da amarra para não forçar o guincho.","t":"Cabos, nós e fundeio","id":"66591a9c"},{"q":"O agente extintor dióxido de carbono (CO2) tem como funções principal e secundária, respectivamente:","o":["abafar e isolar","abafar e resfriar","resfriar e abafar","isolar e resfriar","resfriar e isolar"],"a":1,"c":"CO2 extingue principalmente por abafamento (retira O2) e secundariamente por resfriamento.","t":"Segurança e incêndio","id":"fe80bf2f","v":"fogo"},{"q":"É consequência do excessivo calor em locais úmidos e não arejados sobre o indivíduo:","o":["insolação","hipotermia","hidratação","Geladura","Intermação"],"a":4,"c":"Intermação ocorre pelo excesso de calor em locais fechados/úmidos (diferente da insolação, que é sol direto).","t":"Conhecimentos gerais","id":"a21434df"},{"q":"Um dos sintomas citados que NÃO acompanha a parada cardíaca:","o":["menina dos olhos dilatada","ruborização da face","abaixamento rápido da temperatura do corpo","perda de sentidos","palidez"],"a":1,"c":"Na parada cardíaca, a face fica pálida ou azulada (cianose), nunca ruborizada (vermelha).","t":"Conhecimentos gerais","id":"caff95af"},{"q":"O método de (hemostasia) interrupção de sangramento que menos maleficio causa a vítima é:","o":["torniquete","garroteamento","estrangulamento","amputação","compressão"],"a":4,"c":"A compressão direta é o método mais simples e menos agressivo antes de medidas drásticas.","t":"Primeiros socorros","id":"b96cafd0"},{"q":"O colete salva-vidas deve ficar:","o":["trancado em local seguro","no convés principal, solto, para ser utilizado em caso de emergência","amarrado à embarcação e em local bem fechado, para protegê-lo da ação do tempo","em local de fácil acesso em caso de necessidade, e nunca amarrado à embarcação","num paiol da embarcação ou no compartimento de acomodações"],"a":3,"c":"Coletes devem estar acessíveis e nunca amarrados ou trancados.","t":"Segurança e incêndio","id":"c3f13bbe"},{"q":"Um infrator, após o recebimento do auto de infração, pode apresentar sua defesa num prazo de:","o":["5 dias","20 dias","10 dias","15 dias","12 dias"],"a":3,"c":"O prazo para defesa prévia após o auto de infração é de 15 dias.","t":"Legislação","id":"3933da59"},{"q":"A embarcação estrangeira que apresentar irregularidades representando ameaça de danos ao meio ambiente, à tripulação, a terceiros ou à segurança do tráfego aquaviário, pode ser ordenada a:","o":["entrar em quarentena","repatriar a tripulação","pagar uma multa estipulada pela autoridade marítima","sair das águas jurisdicionais","assinar um termo de responsabilidade"],"a":3,"c":"Por soberania e segurança, a Autoridade Marítima pode ordenar a saída das AJB.","t":"Legislação","id":"8148a5ee"},{"q":"Qual a idade mínima e qual a condição necessária para a habilitação a veleiro?","o":["16 anos e deverá ser filiado a um clube náutico, marina organizada ou grupo de escoteiros.","08 anos e deverá ser filiado a um clube náutico, marina organizada ou grupo de escoteiros do mar.","12 anos e deve ser habilitado em exame na Capitania dos Portos.","18 anos e deve ser habilitado de acordo com a NORMAM 211.","10 anos e deve ser habilitado em exame na Capitania dos Portos."],"a":1,"c":"Veleiro (infantil/juvenil): a partir de 8 anos e filiado a entidade náutica.","t":"Legislação","id":"48c8df11"},{"q":"A distância vertical da superfície da água até o pavimento principal (normalmente o convés) medida em qualquer ponto do comprimento do barco no costado é conhecido como:","o":["Borda Falsa","Borda Livre","Obras Vivas","Verdugo","Meia Borda"],"a":1,"c":"Borda Livre é a distância da linha d'água até o convés.","t":"Cabos, nós e fundeio","id":"35ea555e"},{"q":"As partes curvas do costado de uma embarcação, nas imediações da proa, por boreste ou por bombordo, são chamadas de:","o":["alhetas","bocas","longarinas","bochechas","convés"],"a":3,"c":"As \"curvas\" da proa são as bochechas; as da popa são as alhetas.","t":"Nomenclatura e estrutura","id":"c1ffe62a","v":"casco"},{"q":"Assinale qual das alternativas abaixo está CORRETA:","o":["a espuma não pode ser usada para combater fogo na gasolina pois é muito corrosiva","podemos usar água para combater o fogo na gasolina pois a água baixa a temperatura de ignição","a água do mar dissolve a gasolina e se mistura a ela rapidamente, apagando o incêndio","a espuma combate o fogo na gasolina por resfriamento pois a espuma é muito gelada","não podemos usar água para combater fogo na gasolina pois a temperatura de ignição da gasolina é inferior à temperatura da água"],"a":4,"c":"Água em combustível líquido (Classe B) espalha o fogo em vez de apagar.","t":"Conhecimentos gerais","id":"ff8f1b9c"},{"q":"De acordo com o Regulamento Internacional Para Evitar Abalroamentos no Mar (RIPEAM), as marcas em forma de balão (esfera), cones, etc deverão ser exibidas:","o":["durante o dia ou noite","apenas durante a noite","apenas durante o dia","apenas em baixa visibilidade","em situação de manobra"],"a":2,"c":"Marcas (formas geométricas) são para exibição diurna. À noite usa-se luzes.","t":"Luzes, marcas e sinais sonoros","id":"2ee95428","v":"formas"},{"q":"De acordo com o Regulamento Internacional Para Evitar Abalroamentos no Mar (RIPEAM), em um canal estreito, se algum barco está me alcançando e faz soar dois apitos longos e um apito curto. Caso eu concorde, o meu barco deverá:","o":["soar quatro apitos longos e guinar para boreste, pois ele vai me ultrapassar por bombordo","soar quatro apitos (longo, curto, longo, curto) e manobrar, permitindo a ultrapassagem segura por meu boreste","manter constantes o rumo e a velocidade, pois ele tem a intenção de me ultrapassar bombordo","manter constantes o rumo e a velocidade, pois ele tem a intenção de me ultrapassar por boreste","soar um apito longo, guinar para boreste e diminuir a velocidade, pois ele vai me ultrapassar por bombordo"],"a":1,"c":"Dois longos e um curto: intenção de ultrapassar por boreste. Acordo: Longo-Curto-Longo-Curto.","t":"Luzes, marcas e sinais sonoros","id":"521a9fd7","v":"apitos"},{"q":"De acordo com o Regulamento Internacional Para Evitar Abalroamento no Mar (RIPEAM), em uma situação de risco de abalroamento, a embarcação que NÃO tenha a obrigação de manobrar, é chamada de embarcação:","o":["sem preferência","manobradora","que tem preferência","obrigada a manobrar","alcançada"],"a":2,"c":"A que não manobra é a que \"tem preferência\" ou embarcação estacionária (mantém rumo/velocidade).","t":"RIPEAM - regras de governo","id":"2eda24ca","v":"governo"},{"q":"Dentre as alternativas abaixo, aponte a que MENOS contribui para a ocorrência de acidentes em embarcações de esporte e recreio:","o":["embarcação conduzida por pessoa inabilitada","manutenção deficiente de todo o material da embarcação","ocorrência de nevoeiro na região que será navegada","condutores ingerindo bebidas alcoólicas antes de desatracar","excesso de velocidade da embarcação"],"a":2,"c":"Nevoeiro é fator natural; os outros (álcool, falta de habilitação) são erros humanos diretos.","t":"Cabos, nós e fundeio","id":"e412fa95"},{"q":"Nas embarcações de médio porte quando em navegação costeira, qual dos itens abaixo é dispensável segundo o preconizado pela NORMAM-211?","o":["Balsa salva-vidas.","Agulha magnética.","Apito.","Âncora.","Artefato pirotécnico."],"a":0,"c":"Para navegação costeira em médio porte (até 24m), a balsa é dispensável se houver embarcação de apoio/salvamento","t":"Segurança e incêndio","id":"65f4d368"},{"q":"Num barco em movimento, o que pode ser improvisado para imobilizar uma perna fraturada?","o":["Uma adriça e boças.","A porta do leme e uma espia.","Algum pedaço de material rígido e tiras de pano.","As malaguetas do timão e a amarra.","Um cadaste e tiras de pano."],"a":2,"c":"Primeiros socorros: improvisar talas com material rígido e amarras de pano.","t":"Primeiros socorros","id":"5a478a51"},{"q":"Numa hidrovia interior, quando nos deparamos com um painel quadrangular na cor laranja tendo a letra R pintada na cor preta significa:","o":["retornar","restrição de navegação","retorno proibido","rumo a seguir","redução de velocidade"],"a":4,"c":"Painel laranja com \"R\" preto = Redução de Velocidade.","t":"Cabos, nós e fundeio","id":"ec8f4639"},{"q":"O equipamento chamado de GPS - Sistema de Posicionamento Global - não é obrigatório para qualquer porte de embarcação quando essas estiverem:","o":["navegando em alto-mar","praticando pesca esportiva oceânica","praticando navegação interior","praticando navegação costeira","fundeadas"],"a":2,"c":"Na navegação interior (rios, lagos, baías), o GPS não é item obrigatório de dotação.","t":"Conhecimentos gerais","id":"00115d5a"},{"q":"Para o tratamento correto de insolação deveremos:","o":["refrescar o corpo com banho ou compressas frescas","dar estimulantes leve como café ou chá preto","em caso de dúvida aplicar a respiração artificial","colocar o paciente sentado ou de pé","manter o corpo aquecido utilizando cobertas secas"],"a":0,"c":"Tratamento de insolação foca em baixar a temperatura corporal gradualmente.","t":"Conhecimentos gerais","id":"fee6b113"},{"q":"Quando praticando navegação interior, em águas abrigadas, uma unidade de facho manual de luz vermelha será obrigatória somente para:","o":["embarcações de grande porte","embarcações de órgãos públicos","embarcações de pesca artesanal","embarcações miúdas","embarcações a vela"],"a":0,"c":"Fachos manuais são obrigatórios para embarcações de grande porte (Iates) mesmo em águas abrigadas.","t":"Luzes, marcas e sinais sonoros","id":"04d41153"},{"q":"Quanto aos primeiros socorros em uma pessoa afogada, o posicionamento correto do paciente para ser iniciado o atendimento é:","o":["deitá-la de costas com a cabeça virada de lado","deitá-la de bruços com a cabeça virada de lado","o procedimento pode ser aplicado em qualquer posição","deitá-la de lado com a cabeça voltada para baixo","colocá-la de pé ou sentada com a cabeça ereta"],"a":0,"c":"Deitá-la de costas com a cabeça de lado ajuda a expelir água/vômito inicialmente.","t":"Primeiros socorros","id":"b6f15673"},{"q":"Segundo a Lei Federal 9.537/97 (LESTA) e o Decreto nº 2.596/98 (RLESTA), a Autoridade Marítima, no Brasil, é a (o):","o":["Marinha do Brasil","Capitania dos Portos","Diretoria de Portos e Costas","Ministério dos Transportes","Agência Nacional das Águas"],"a":0,"c":"A Autoridade Marítima no Brasil é exercida pelo Comandante da Marinha.","t":"Legislação","id":"377701fb"},{"q":"Teoricamente, o ângulo ideal para se aplicar no leme e se obter uma guinada rápida numa situação de emergência é em torno de:","o":["10° para o bordo desejado","60° para o bordo desejado","35° para o bordo desejado","45° para o bordo desejado","90º para o bordo desejado"],"a":2,"c":"O ângulo de máxima eficiência do leme é geralmente entre 30° e 35°.","t":"Cabos, nós e fundeio","id":"a0d18cb4"},{"q":"Toda embarcação impossibilitada de manobrar em apoio à atividade de mergulho amador, no período diurno, deverá exibir:","o":["a bandeira \"Charlie\" e poderá exibir a bandeira verde com faixa transversal branca","a bandeira \"Oscar\" e poderá exibir a bandeira vermelha com faixa transversal verde","a bandeira \"Mike\"","a bandeira \"Alfa\" e poderá exibir a bandeira vermelha com faixa transversal branca","a bandeira \"Zulu\" e deverá exibir a bandeira vermelha com faixa transversal verde"],"a":3,"c":"Mergulho: Bandeira Alfa (Código Internacional) ou Bandeira Vermelha com faixa branca.","t":"Luzes, marcas e sinais sonoros","id":"fe6b4686"},{"q":"Uma embarcação com um hélice (passo para a direita), leme todo voltado para bombordo, partindo da situação de parado, com o hélice girando no sentido anti- horário, a proa:","o":["Irá para ré","guinará lentamente para boreste","fará círculos no sentido anti-horário","guinará rapidamente para bombordo","fará círculos no sentido horário"],"a":1,"c":"Hélice passo à direita dando atrás (anti-horário): a popa vai para bombordo e a proa para boreste.","t":"Cabos, nós e fundeio","id":"f2e48822"},{"q":"Uma queimadura de 1º grau caracteriza-se pelo aparecimento de:","o":["pele descascada","bolhas","buracos enegrecidos","vermelhidão superficial na pele","falta de sensibilidade ao toque"],"a":3,"c":"1º grau: Vermelhidão (ex: sol). 2º grau: Bolhas. 3º grau: Destruição de tecidos.","t":"Primeiros socorros","id":"e5482aa3"},{"q":"Utilizando o Método Boca a Boca com Massageamento Cardíaco, no corpo do acidentado, qual é local correto para a aplicação da massagem cardíaca?","o":["No meio das costas.","Terço inferior do abdome.","Terço inferior do osso esterno.","No terço inferior do osso cúbito.","No meio das costelas."],"a":2,"c":"A massagem é feita sobre o osso esterno (centro do peito).","t":"Primeiros socorros","id":"9b528514"},{"q":"Um dos sintomas que identificam um estado de desidratação por inadequada ingestão de água é:","o":["Tonteira","Sede","Dispneia","Convulsão","Ausência de salivação"],"a":1,"c":"O sintoma primário e mais óbvio da desidratação é a sede.","t":"Primeiros socorros","id":"5255e199"},{"q":"Num canal ou rio, principalmente estreitos, a embarcação maior (mais de 20 metros) tem em relação à embarcação miúda:","o":["deixar o seu boreste livre para a outra","manter seu rumo e velocidade independente da situação da outra","preferência","que manobrar","que manobrar sempre para boreste"],"a":2,"c":"Em canais estreitos, a embarcação miúda (menor que 20 m) não deve atrapalhar a passagem da maior, que só pode navegar com segurança no canal. Por isso a maior tem preferência.","t":"RIPEAM - regras de governo","id":"9f65ff9a"},{"q":"O apito longo tem a duração de:","o":["4 a 6 segundos","1 segundo","2 segundos","1 minuto","3 segundos"],"a":0,"c":"Apito curto dura cerca de 1 segundo; apito longo dura de 4 a 6 segundos.","t":"Luzes, marcas e sinais sonoros","id":"272e1924","v":"apitos"},{"q":"Deve ser considerada uma embarcação alcançadora aquela que se aproximar da outra vindo:","o":["na direção oposta da outra e com maior velocidade","na mesma direção da outra e com menor velocidade","de uma direção de mais de 67,5 graus para ré do través dessa última e com maior velocidade","na direção oposta da outra e com menor velocidade","de uma direção de mais de 22,5 graus para ré do través dessa última e com maior velocidade"],"a":4,"c":"Alcançadora é quem se aproxima vindo de mais de 22,5° para ré do través da outra, com mais velocidade. À noite ela veria só a luz de alcançado (popa) da outra.","t":"RIPEAM - regras de governo","id":"0ffc09c5","v":"luzes"},{"q":"Uma embarcação, à noite, exibindo duas luzes circulares encarnadas, dispostas em linha vertical, onde melhor possam ser vistas, será uma embarcação:","o":["no canal","sem governo","com mergulhadores na área","fundeada","com manobras restritas"],"a":1,"c":"Duas luzes circulares encarnadas em linha vertical indicam embarcação sem governo. De dia, o equivalente são duas esferas pretas.","t":"Luzes, marcas e sinais sonoros","id":"8188ef15","v":"formas"},{"q":"O termo \"em movimento\" se aplica a todas as embarcações que:","o":["estão fundeadas","estão amarradas","não se encontram fundeadas, amarradas à terra ou encalhadas","estão encalhadas","estão atracadas"],"a":2,"c":"Pelo RIPEAM, está em movimento toda embarcação que não está fundeada, amarrada à terra ou encalhada, mesmo que esteja parada.","t":"RIPEAM - regras de governo","id":"5688782d"},{"q":"Dois apitos longos seguidos de um curto significam:","o":["estou parando máquinas","estou dando a ré","tenciono ultrapassá-lo por seu bombordo","tenciono ultrapassá-lo por seu boreste","tenciono ultrapassá-lo por qualquer bordo"],"a":3,"c":"Em canal estreito: dois longos e um curto = pretendo ultrapassar por seu boreste; dois longos e dois curtos = por seu bombordo.","t":"Luzes, marcas e sinais sonoros","id":"1f1ef914","v":"apitos"},{"q":"A bóia cega:","o":["emite luzes intermitentes","não emite luzes","emite luzes muito rápidas","emite luzes amarelas","emite luzes brancas"],"a":1,"c":"Bóia cega é a que não tem luz. É identificada só de dia, pela cor, forma e marca de tope.","t":"Balizamento IALA B","id":"fb697d99"},{"q":"A identificação dos sinais durante o dia é feita por:","o":["somente forma e cor","marca de tope, cor e som","marca de tope, forma e cor","marca de tope, cor e tamanho","somente marca de tope e cor"],"a":2,"c":"De dia, o sinal é identificado por três elementos: marca de tope, forma e cor. À noite, pela cor e pelo ritmo da luz.","t":"Balizamento IALA B","id":"ab1de4c5"},{"q":"A cor da luz emitida pelo balizamento de canal preferencial a bombordo é:","o":["verde","azul","branca","amarela","encarnada"],"a":4,"c":"Canal preferencial a bombordo é um sinal encarnado com faixa verde. Na Região B a luz segue a cor predominante: encarnada.","t":"Balizamento IALA B","id":"4d740626","v":"pref"},{"q":"A regra simples para se determinar a quantidade de amarra que se usa para fundear normalmente é:","o":["no mínimo 2 vezes a profundidade local","no mínimo 4 vezes a profundidade local","no mínimo 3 vezes a profundidade local","no mínimo 1,5 vezes a profundidade local","no mínimo 6 vezes a profundidade local"],"a":2,"c":"Regra prática: filar no mínimo 3 vezes a profundidade local. Com mau tempo ou fundo ruim, aumente.","t":"Cabos, nós e fundeio","id":"0eb51097"},{"q":"Quando em mar ruim, para vencer as ondas grandes, deve-se acelerar e desacelerar o motor da seguinte forma:","o":["desacelerar na subida e acelerar antes da descida","quando subir na onda acelera e continua acelerando na descida","não acelerar nem na subida nem na descida","manter a velocidade constante tanto na subida quanto na descida da onda","acelerar na subida e desacelerar antes da descida"],"a":4,"c":"Acelere na subida da onda para não perder seguimento e reduza antes da descida, para a proa não mergulhar na onda seguinte.","t":"Manobras e propulsão","id":"e160e8a0"},{"q":"Quando alguém cai na água, ou seja, \"situação de homem ao mar\", e para retornar exatamente no rumo oposto sobre a esteira deixada pelo hélice, deve-se usar a:","o":["Curva \"Race Track\"","Curva de Williams","Manobra de Putin","Curva de Butakow","Manobra de Zemane"],"a":3,"c":"A curva de Butakow coloca a embarcação no rumo oposto, voltando pela própria esteira até o ponto da queda.","t":"Segurança e incêndio","id":"3ab973cd"},{"q":"O incêndio da classe C é o:","o":["que ocorre na presença de agente extintor","que ocorre em materiais sólidos inflamáveis","que ocorre em líquidos inflamáveis","que ocorre em equipamentos elétricos","que ocorre em metais inflamáveis"],"a":3,"c":"Classe A = sólidos (brasa e cinza); B = líquidos inflamáveis; C = equipamentos elétricos energizados; D = metais pirofóricos.","t":"Segurança e incêndio","id":"d7d1c3f0","v":"fogo"},{"q":"Os incêndios que envolvem materiais fibrosos ou sólidos que deixam como resíduos brasas ou cinzas são denominados:","o":["Incêndios classe \"C\"","Incêndios classe \"E\"","Incêndios classe \"A\"","Incêndios classe \"B\"","Incêndios classe \"D\""],"a":2,"c":"Materiais sólidos que deixam brasa e cinza (madeira, papel, tecido) formam a classe A. Combatem-se principalmente com água, por resfriamento.","t":"Segurança e incêndio","id":"afd43eb1","v":"fogo"},{"q":"Para se utilizar o extintor de espuma, deve-se:","o":["apertar o gatilho e direcionar o jato para as chamas","abrir a válvula de acionamento","retirar o pino de segurança e direcioná-lo sobre os equipamentos elétricos","apertar o gatilho e direcioná-lo sobre os líquidos inflamáveis","virar o extintor, com a tampa para baixo, e dirigir o jato sobre a base das chamas"],"a":4,"c":"O extintor de espuma química é acionado virando-o com a tampa para baixo, o que mistura os produtos. Dirija o jato à base das chamas.","t":"Segurança e incêndio","id":"4f90437d","v":"fogo"},{"q":"As principais complicações de uma ferida são:","o":["hemorragia e febre","bolhas e hemorragia","infecção e queimadura","hemorragia e infecção","bolhas e queimaduras"],"a":3,"c":"Os dois maiores riscos de uma ferida são a hemorragia (perda de sangue) e a infecção. Por isso: conter o sangramento e proteger a lesão.","t":"Primeiros socorros","id":"6f7331b7"},{"q":"Quando alguém de sua embarcação cair ao mar você deve:","o":["telefonar para os bombeiros","jogar uma bóia salva-vidas, mantendo a pessoa no visual e mandar avisar a quem estiver na manobra","dar 3 apitos curtos","içar a bandeira alfa","dar 2 apitos longos"],"a":1,"c":"Primeiro jogue uma bóia salva-vidas, depois mantenha a vítima à vista o tempo todo e avise quem está na manobra.","t":"Segurança e incêndio","id":"1eedc7a5"},{"q":"A cobertura da balsa salva-vidas é de:","o":["cor azul para combinar com o mar","fibra de vidro para resistir às intempéries","lona amarela para afastar tubarões","cor branca para aquecer pouco","cor alaranjada para facilitar o avistamento"],"a":4,"c":"Cores laranja e amarela dão o maior contraste com o mar e facilitam o avistamento pelo resgate.","t":"Segurança e incêndio","id":"715bbe76"},{"q":"Aquaviário ou amador que exerce funções, embarcado, na operação da embarcação:","o":["amador","passageiro","tripulante","aquaviário","armador"],"a":2,"c":"Tripulante é quem exerce funções a bordo, na operação da embarcação. Passageiro não tem função a bordo.","t":"Legislação","id":"f60f447d"},{"q":"A penalidade por conduzir embarcação em estado de embriaguez é:","o":["suspensão do Certificado de Habilitação até sessenta dias","suspensão do Certificado de Habilitação até cento e vinte dias. A reincidência sujeitará o infrator à pena de cancelamento do Certificado de Habilitação","suspensão do Certificado de Habilitação até noventa dias","cancelamento do Certificado de Habilitação","suspensão definitiva do Certificado de Habilitação"],"a":1,"c":"Embriaguez: suspensão do certificado de habilitação por até 120 dias; a reincidência leva ao cancelamento.","t":"Legislação","id":"782cb100"},{"q":"As âncoras flutuantes das balsas devem ser mantidas na água, visando reduzir:","o":["a altura das ondas","o vento","a velocidade de deriva","a possibilidade de emborcamento","o risco de tubarões"],"a":2,"c":"A âncora flutuante (drogue) reduz a deriva da balsa e a mantém perto do local do naufrágio, onde a busca vai começar.","t":"Segurança e incêndio","id":"71ad5559"},{"q":"Extintores utilizados em incêndios classe \"B\" são identificados por meio de:","o":["uma estrela amarela","um círculo azul","um quadrado vermelho","um triângulo azul","um triângulo verde"],"a":2,"c":"Símbolos de classe: A = triângulo verde; B = quadrado vermelho; C = círculo azul; D = estrela amarela.","t":"Segurança e incêndio","id":"bf08b2fd","v":"fogo"},{"q":"A bordo de seu barco de lazer (motorizado), qual o combustível mais perigoso e mais propenso a se incendiar, sendo, portanto, motivo de cuidados especiais:","o":["Fibra de vidro.","Madeira.","Papéis.","Painéis elétricos.","Combustíveis líquidos."],"a":4,"c":"Combustíveis líquidos (gasolina) liberam vapores inflamáveis que se acumulam no porão. Ventile o compartimento antes de dar partida.","t":"Segurança e incêndio","id":"646c152a"},{"q":"A reincidência, para efeito de agravamento da pena, é a repetição de uma mesma infração em um período igual ou inferior a:","o":["um mês","seis meses","nove meses","doze meses","três meses"],"a":3,"c":"Reincidência é repetir a mesma infração em até 12 meses. Ela agrava a pena.","t":"Legislação","id":"1137ef1a"},{"q":"De acordo com o Regulamento Internacional Para Evitar Abalroamentos no Mar (RIPEAM), um navio que, durante o dia, está com manobra restrita devida ao seu calado deverá içar que marcas no mastro:","o":["Um cone azul.","Duas esferas pretas.","Uma esfera preta.","Uma esfera azul.","Um cilindro preto."],"a":4,"c":"Restrita por seu calado: de dia um cilindro preto; à noite três luzes circulares encarnadas em linha vertical.","t":"RIPEAM - regras de governo","id":"9c97e5d2","v":"formas"},{"q":"No tocante ao uso de coletes salva-vidas convém que antes de uma viagem se faça a(o):","o":["improvisação de coletes salva-vidas","contagem das crianças e adultos","demonstração de uso dos coletes salva-vidas","empréstimo de colete de outro barco","contagem das pessoas a bordo"],"a":2,"c":"Antes de sair, demonstre a todos onde ficam os coletes e como vesti-los. Em emergência não há tempo para aprender.","t":"Segurança e incêndio","id":"fbf7dec9"},{"q":"O comburente mais comum numa reação química com o combustível é o:","o":["hidrogênio","oxigênio","nitrogênio","gás carbônico","gás hélio"],"a":1,"c":"Triângulo do fogo: combustível, comburente e calor. O comburente comum é o oxigênio do ar.","t":"Segurança e incêndio","id":"99732c14","v":"fogo"},{"q":"O extintor de espuma química atua no foco de incêndio basicamente pelo princípio de:","o":["abafamento","retirada","quebra da reação em cadeia","resfriamento","espalhamento"],"a":0,"c":"A espuma forma uma camada que isola o combustível do oxigênio: extinção por abafamento.","t":"Segurança e incêndio","id":"bb65db08","v":"fogo"},{"q":"As situações abaixo são as que eu utilizo as luzes de navegação, exceto:","o":["à noite com a embarcação a matroca","com a embarcação atracada no cais","à noite","quando for necessário","em visibilidade restrita"],"a":1,"c":"Luzes de navegação são usadas do pôr ao nascer do sol e com visibilidade restrita. Embarcação atracada no cais não precisa delas.","t":"Luzes, marcas e sinais sonoros","id":"3d855b1f"},{"q":"Uma luz branca continua situada tão próximo quanto possível da popa, ou no espelho de popa, visível apenas de quem vem de ré, num setor horizontal de 135°, chama-se:","o":["luz de reboque","luz de mastro","luz de alcançado","luz de bordo","luz de popa"],"a":2,"c":"A luz de alcançado é branca, fica na popa e cobre 135°. É a luz que quem vem por ré enxerga.","t":"Luzes, marcas e sinais sonoros","id":"b994289c","v":"luzes"},{"q":"Embarcações de esporte e recreio de comprimento inferior a 12 metros exibem normalmente:","o":["luzes de bordo e uma luz amarela na proa","luzes de bordo (verde e encarnada) e uma luz branca no bico de proa","luzes de bordo (verde e encarnada) combinadas e uma luz circular branca","apenas uma luz circular branca","apenas as luzes de bordo (verde e encarnada)"],"a":2,"c":"Abaixo de 12 m é permitido usar luzes de bordo combinadas e uma luz circular branca, que substitui o mastro e a popa.","t":"Luzes, marcas e sinais sonoros","id":"815071a3","v":"luzes"},{"q":"Uma luz branca contínua, situada no mastro da embarcação visível de quem vem de través ou de proa em um setor horizontal de 225°, chama-se:","o":["luz de proa","luz de mastro","luz de alcançado","luz de aviação","luz de colisão"],"a":1,"c":"A luz de mastro é branca, fica na linha de centro e cobre 225°, de proa até 22,5° para ré do través de cada bordo.","t":"Luzes, marcas e sinais sonoros","id":"13c64eb4","v":"luzes"},{"q":"A bóia de boreste emite luz, à noite, de cor:","o":["verde","encarnada","amarela","azul","branca"],"a":1,"c":"Região B (Brasil): sinal de boreste é encarnado, cônico e com luz encarnada; o de bombordo é verde, cilíndrico, com luz verde. Corrigido: o material original indicava \"verde\", que é a Região A.","t":"Balizamento IALA B","id":"25c4e0b2","fix":1,"v":"lateral"},{"q":"Uma embarcação quando em operação de mergulho, deverá exibir:","o":["a bandeira Golf","a bandeira Alfa","a bandeira Delta","a bandeira Maik","a bandeira Bravo"],"a":1,"c":"Bandeira Alfa (branca e azul) = tenho mergulhador na água, mantenha distância e passe devagar.","t":"Luzes, marcas e sinais sonoros","id":"83ffe153"},{"q":"Com incêndio a bordo, Qual o seu posicionamento para dar o combate às chamas:","o":["Mantenho-me a Sotavento das chamas e fumaça.","Mantenho-me na proa ou na popa.","Mantenho-me a bombordo a favor da fumaça.","Mantenho-me a Barlavento das chamas e fumaça.","Mantenho-me a meia embarcação."],"a":3,"c":"Combata o fogo a barlavento (de onde vem o vento): a fumaça e o calor vão para longe de você.","t":"Segurança e incêndio","id":"4522d6b2","v":"fogo"},{"q":"A água é um agente extintor que pode ser utilizado nos incêndios em:","o":["metais inflamáveis","material sólido inflamável","motores elétricos","equipamentos de navegação","líquidos inflamáveis"],"a":1,"c":"A água age por resfriamento e é indicada para a classe A (sólidos). Não use em eletricidade, líquidos inflamáveis ou metais.","t":"Segurança e incêndio","id":"6094f465","v":"fogo"},{"q":"Qual dos procedimento citados abaixo não será adequado quando ocorrer um incêndio a bordo da embarcação:","o":["Tentar combater o incêndio utilizando o extintor portátil existente a bordo.","Abandonar imediatamente a embarcação sem tentar combater o incêndio devido ao risco de explosão.","Guinar a embarcação de maneira que as chamas se afastem das pessoas.","Colocar as pessoas a barlavento das chamas, fazendo com que as mesmas coloquem colete salva-vidas.","Informar a outras embarcações a sua situação de perigo."],"a":1,"c":"Abandonar sem tentar combater é inadequado. Primeiro tente combater, posicione as pessoas a barlavento com colete e peça ajuda.","t":"Segurança e incêndio","id":"262db5cb","v":"fogo"},{"q":"O agente extintor para incêndios classe \"D\" é:","o":["espuma mecânica","água","espuma química","Pó químico seco","CO2"],"a":3,"c":"Metais pirofóricos (classe D) pedem pó químico especial. Água pode reagir com o metal e piorar o fogo.","t":"Segurança e incêndio","id":"d4d0bac9","v":"fogo"},{"q":"Qual dos materiais abaixo não deve ser utilizado para afastar a vítima do contato com a corrente elétrica:","o":["Peça de porcelana.","Pedaço de madeira.","Pedaço de pneu.","Peça de metal.","Peça de plástico."],"a":3,"c":"Metal conduz eletricidade. Use materiais isolantes e secos, como madeira, borracha ou plástico.","t":"Primeiros socorros","id":"2eb43342"},{"q":"São equipamentos de salvatagem, exigidos em embarcação de esporte e recreio, exceto:","o":["bóia circular","baleeira","colete salva-vidas","pirotécnico","balsa salva-vidas"],"a":1,"c":"Baleeira é a embarcação salva-vidas de navios grandes e não é exigida em esporte e recreio.","t":"Segurança e incêndio","id":"00c48265"},{"q":"A navegação realizada em hidrovias interiores, assim considerados rios, lagos, canais, lagoas, baias, angras, enseadas e áreas marítimas abrigadas é classificada como:","o":["água doce","fluvial","lacustre","interior","mar fechado"],"a":3,"c":"Navegação interior: rios, lagos, canais, lagoas, baías, angras, enseadas e áreas marítimas abrigadas. É o limite do Arrais-Amador.","t":"Legislação","id":"9caf67b7"},{"q":"São circunstâncias agravantes às infrações:","o":["ser estrangeiro","pane seca","reincidência","poluição","danos"],"a":2,"c":"A reincidência é circunstância agravante: aumenta a penalidade aplicada.","t":"Legislação","id":"86ae8f42"},{"q":"São duas situações que geram o cancelamento da inscrição da embarcação:","o":["sua apreensão e a morte de seu proprietário","o naufrágio e o abandono","o nome igual a de outra já inscrita e sua apreensão","o não pagamento da anuidade e envolvimento em acidente","a morte de seu proprietário e a sua colisão, com morte acidental"],"a":1,"c":"A inscrição é cancelada quando a embarcação deixa de existir ou de ser usada: naufrágio (perda) e abandono.","t":"Legislação","id":"325ad749"},{"q":"Após lavrado o auto de infração, o infrator disporá de:","o":["30 (trinta) dias úteis de prazo para apresentar sua defesa","60 (sessenta) dias úteis de prazo para apresentar sua defesa","30 (trinta) dias corridos de prazo para apresentar sua defesa","15 (quinze) dias úteis de prazo para apresentar sua defesa","7 (sete) dias úteis para apresentar sua defesa"],"a":3,"c":"Depois do auto de infração, o infrator tem 15 dias úteis para apresentar defesa.","t":"Legislação","id":"1ac6b8a3"},{"q":"Além de outros fatores, a sobrevivência do náufrago depende do período de permanência em função da temperatura da água do mar. No que diz respeito à temperatura ambiente (temperatura do ar), seus efeitos sobre o pessoal estão intimamente ligados:","o":["aos sistemas frontais","as correntes marinhas","à pressão atmosférica","a velocidade do vento","as nuvens"],"a":3,"c":"O vento aumenta a perda de calor do corpo (sensação térmica). Quanto mais vento, maior o risco de hipotermia.","t":"Segurança e incêndio","id":"b3ece79b"},{"q":"Sempre que visualizamos o sangue, dizemos que a hemorragia é:","o":["Externa","Venosa","Interna","Arterial","Superficial"],"a":0,"c":"Se o sangue aparece do lado de fora, a hemorragia é externa. A interna não é visível e é percebida por sinais como palidez e choque.","t":"Primeiros socorros","id":"a8d3a725"},{"q":"Em uma queimadura de 3º grau:","o":["A pele fica avermelhada e levemente sensível","A pele foi completamente destruída","A superfície é macia e molhada","A característica é a presença de bolhas","Não há dor"],"a":1,"c":"1º grau: vermelhidão. 2º grau: bolhas. 3º grau: destruição de todas as camadas da pele; pode nem doer, porque os nervos foram atingidos.","t":"Primeiros socorros","id":"64ecc449"},{"q":"De acordo com o Regulamento Internacional Para Evitar Abalroamentos no Mar (RIPEAM), as luzes de bordos, verde a boreste e encarnada a bombordo, podem ser vistas num ângulo de:","o":["122,5° a partir da popa","132,5° a partir da proa","102,5° a partir da popa","112,5° a partir da proa","135,5° a partir da popa"],"a":3,"c":"Luz de bordo cobre 112,5°, da proa até 22,5° para ré do través. Somadas, as duas luzes de bordo cobrem os mesmos 225° da luz de mastro.","t":"Luzes, marcas e sinais sonoros","id":"ed9e6452","v":"luzes"},{"q":"Ao me deparar com um incêndio no painel elétrico da minha lancha devo preferencialmente utilizar um extintor de:","o":["gás halon","água pressurizada","CO2","pó químico","espuma"],"a":2,"c":"Equipamento elétrico (classe C) pede agente que não conduz eletricidade: CO2 é o preferido, pois não deixa resíduo.","t":"Segurança e incêndio","id":"11a7de15","v":"fogo"},{"q":"As partes curvas do costado de uma embarcação, nas imediações da popa, por boreste ou por bombordo, são chamadas de:","o":["alhetas","bocas","pés de galinha","bochechas","longarinas"],"a":0,"c":"Curvas do costado perto da popa são as alhetas; perto da proa são as bochechas.","t":"Nomenclatura e estrutura","id":"92137203","v":"casco"},{"q":"De acordo com o Regulamento Internacional Para Evitar Abalroamentos no Mar (RIPEAM), as marcas em forma de balões, cones etc... utilizadas pelos barcos para sinalizar durante o dia diversas condições são da cor:","o":["amarela","verde","branca","preta","vermelha"],"a":3,"c":"As marcas diurnas do RIPEAM (esferas, cones, cilindros, bicones) são sempre pretas.","t":"Luzes, marcas e sinais sonoros","id":"6d179193","v":"formas"},{"q":"Diz-se que um barco com muito peso na proa e popa e pouco peso a meia nau está correndo perigo de quebrar ao meio em caso de enfrentar ondas fortes e altas. Nesta situação diz-se que ele está com:","o":["trimado","desgovernado","aprumado","contra-alquebramento","alquebramento"],"a":4,"c":"Peso nas extremidades faz as pontas descerem e o meio subir: alquebramento. Peso no meio faz o contrário: contra-alquebramento (tosamento).","t":"Manobras e propulsão","id":"2b4f3ce8"},{"q":"Em caso de fratura exposta NÃO deveremos:","o":["conter a hemorragia","dar analgésicos","ministrar água para a vítima","imobilizar o membro fraturado","colocar o osso fraturado no lugar"],"a":4,"c":"Nunca tente recolocar o osso no lugar. Contenha o sangramento, cubra a ferida e imobilize o membro como está.","t":"Primeiros socorros","id":"1d8b1bd2"},{"q":"Havendo oito (8) embarcações fundeadas numa mesma enseada convém que tenhamos o cuidado de manter:","o":["vigilância dia e noite","espaço suficiente entre elas para que possam girar em redor das âncoras","as âncoras unhadas bem próximo uma das outras","as rabetas das lanchas levantadas para não tocar nas espias","distância adequada de terra"],"a":1,"c":"Cada embarcação fundeada gira em torno da própria âncora com vento e maré. Deixe espaço para que ninguém se choque no giro.","t":"Cabos, nós e fundeio","id":"520bb0b6"},{"q":"Quantas horas de treinamento em embarcações de esporte e/ou recreio ou similares o interessado deverá comprovar para habilitação na categoria de Arrais-Amador:","o":["7 horas","20 horas","6 horas","10 horas","3 horas"],"a":2,"c":"O material indica 6 horas de treinamento comprovado para Arrais-Amador. Confira a NORMAM vigente na sua Capitania.","t":"Legislação","id":"bac1e8e6"}]</script>
