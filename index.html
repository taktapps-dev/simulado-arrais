<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Simulado Arrais e Motonauta</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Coluna única de leitura, como uma carta náutica: régua de posição no topo, conteúdo em cartões sóbrios */
:root{
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#E8EEF4; --line:#D3DDE7; --line-strong:#AFC0D1;
  --fg:#0E2236; --muted:#55687C; --accent:#1B5A86; --accent-soft:#DCEAF5; --on-accent:#FFFFFF;
  --brass:#9A6B12; --brass-soft:#F6EBD3;
  --ok:#17784A; --ok-soft:#DDF2E6; --bad:#B3261E; --bad-soft:#FBE3E1;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08131F; --surface:#0F1E2E; --surface-2:#16283B; --line:#22384F; --line-strong:#36506B;
  --fg:#DCE7F1; --muted:#8FA5BA; --accent:#6CB4E4; --accent-soft:#143551; --on-accent:#06121D;
  --brass:#E0B15A; --brass-soft:#3A2C10; --ok:#4FCB8A; --ok-soft:#0F3524; --bad:#F2827A; --bad-soft:#401A18;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#08131F; --surface:#0F1E2E; --surface-2:#16283B; --line:#22384F; --line-strong:#36506B;
  --fg:#DCE7F1; --muted:#8FA5BA; --accent:#6CB4E4; --accent-soft:#143551; --on-accent:#06121D;
  --brass:#E0B15A; --brass-soft:#3A2C10; --ok:#4FCB8A; --ok-soft:#0F3524; --bad:#F2827A; --bad-soft:#401A18;
  color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
html,body{min-height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--fg);font:400 16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);font-weight:600;letter-spacing:.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2rem} h2{font-size:1.5rem} h3{font-size:1.15rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none;color:var(--accent)}
.brand>div{min-width:0;overflow:hidden}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{font:600 1.15rem/1 var(--f-display);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font:500 .7rem/1.2 var(--f-body);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.85rem}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:transparent}
.icon-btn:hover{background:var(--surface-2)}
main{padding-block:28px 64px}
.stack{display:flex;flex-direction:column;gap:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.eyebrow{font:500 .75rem/1 var(--f-body);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);font-weight:500}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.wide{width:100%}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid-sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.size{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 8px;text-align:center}
.size b{display:block;font:600 2rem/1 var(--f-display)}
.size span{font-size:.8rem;color:var(--muted)}
.size[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:13px 7px}
.size[aria-pressed="true"] b{color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
.seg button b{display:block;font-weight:600}
.seg button span{font-size:.85rem;color:var(--muted)}
.seg button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r);padding:12px 14px}
.stat span{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font:600 1.6rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
input[type=text]{width:100%;min-height:46px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font:inherit}
.err{color:var(--bad);font-size:.875rem}
.profiles{display:flex;flex-direction:column;gap:8px}
.profile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px}
.profile:hover{border-color:var(--line-strong);background:var(--surface-2)}
.avatar{width:38px;height:38px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);font:600 1rem var(--f-display)}
.profile div{min-width:0;flex:1}
.profile b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.profile small{color:var(--muted)}
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .25s}
.qtext{font-size:1.2rem;line-height:1.5;font-weight:500}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:12px 14px;line-height:1.45}
.opt:hover{border-color:var(--line-strong)}
.opt .l{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font:600 .9rem var(--f-display)}
.opt span:last-child{min-width:0;padding-top:2px}
.opt.sel{border:2px solid var(--accent);background:var(--accent-soft);padding:11px 13px}
.opt.sel .l{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.opt.right{border:2px solid var(--ok);background:var(--ok-soft);padding:11px 13px}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border:2px solid var(--bad);background:var(--bad-soft);padding:11px 13px}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt[disabled]{cursor:default}
.tip{border-radius:var(--r);background:var(--brass-soft);padding:12px 14px;font-size:.95rem}
.tip b{color:var(--brass)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.map button{height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font:500 .85rem var(--f-mono);font-variant-numeric:tabular-nums}
.map button.done{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent)}
.map button.flag{border:2px solid var(--brass)}
.map button.cur{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.map button.r{background:var(--ok-soft);border-color:var(--ok)}
.map button.w{background:var(--bad-soft);border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line-strong)}
.confirm{border:2px solid var(--brass);background:var(--brass-soft);border-radius:var(--r);padding:16px}
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.score b{font:600 4rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 12px;font-weight:600;font-size:.9rem}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.topics{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,2fr) auto;gap:8px 14px;align-items:center;font-size:.92rem}
.topics .bar{height:8px}
.trow{display:contents}
.topics .bar i.ok{background:var(--ok)} .topics .bar i.mid{background:var(--brass)} .topics .bar i.bad{background:var(--bad)}
.topics em{font-style:normal;font-family:var(--f-mono);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.plan{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.plan li{display:flex;gap:12px;align-items:flex-start}
.plan li svg{flex:none;margin-top:3px;color:var(--brass)}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:.9rem}
.filters button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.review{display:flex;flex-direction:column;gap:12px}
.review .opt{cursor:default}
.ans-line{display:flex;gap:8px;align-items:flex-start;border-radius:var(--r);padding:10px 12px;font-size:.95rem}
.ans-line.r{background:var(--ok-soft);color:var(--ok)} .ans-line.w{background:var(--bad-soft);color:var(--bad)} .ans-line.b{background:var(--surface-2);color:var(--muted)}
.ans-line span{color:var(--fg)}
.hist{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.hist th{text-align:left;font-weight:500;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:6px 8px;border-bottom:1px solid var(--line)}
.hist td{padding:9px 8px;border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
.spark text{fill:var(--muted);font:500 11px var(--f-mono)}
.seg3{grid-template-columns:repeat(3,minmax(0,1fr))}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--brass-soft);color:var(--brass);font-size:.75rem;font-weight:600;vertical-align:1px}
.clock{font:500 1rem var(--f-mono);font-variant-numeric:tabular-nums;color:var(--fg);background:var(--surface-2);border-radius:999px;padding:2px 10px}
.clock.low{color:var(--bad);background:var(--bad-soft)}
.illus{margin:0;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:#EEF3F7;color-scheme:light;
  --fg:#0E2236;--muted:#4E6276;--accent:#1B5A86;--accent-soft:#D3E4F1;--surface:#FFFFFF;--surface-2:#E3EBF2;--brass:#8A5E0C}
.btn.danger{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.danger-outline{color:var(--bad);border-color:var(--bad)}
.flash .qtext{font-size:1.3rem;min-height:5em}
a.btn{text-decoration:none;color:inherit}
.langwrap{position:relative}
.lang-btn{width:auto;padding:0 10px;gap:6px;font:600 .8rem var(--f-body);letter-spacing:.04em}
.langmenu{position:absolute;right:0;top:calc(100% + 6px);z-index:20;min-width:170px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.langmenu[hidden]{display:none}
.langmenu button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:8px;font-size:.95rem}
.langmenu button:hover,.langmenu button[aria-checked="true"]{background:var(--accent-soft);color:var(--accent)}
.orig{border:1px dashed var(--line-strong);border-radius:var(--r);padding:10px 14px;font-size:.92rem;color:var(--muted)}
.orig summary{cursor:pointer;font-weight:500;color:var(--accent)}
.orig p{margin:.5rem 0 0}
:lang(ja) body,:lang(ko) body{word-break:keep-all;overflow-wrap:anywhere}
@media (max-width:560px){
  .grid-sizes,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .seg,.seg3{grid-template-columns:1fr}
  .score b{font-size:3.2rem}
  .topics{display:flex;flex-direction:column;align-items:stretch;gap:12px}
  .trow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
  .trow .bar{grid-column:1/-1;order:3}
  .spark text{font-size:20px}
  h1{font-size:1.7rem}
  .chip .nm{display:none} .chip{padding:4px}
  .brand b{font-size:1.05rem} .brand svg{width:26px;height:26px}
  .chip .nm,.chip{white-space:nowrap}
  .card{padding:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="16" cy="16" r="13"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4"/><path d="M16 8l3 8-3 8-3-8z" fill="currentColor" stroke="none"/></svg>
    <div><b id="brandName">Simulado Arrais e Motonauta</b><small id="bankLine">Banco de 294 questões</small></div>
  </div>
  <button class="chip" id="userChip" hidden></button>
  <div class="langwrap"><button class="icon-btn lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false" aria-label="Idioma"></button>
    <div class="langmenu" id="langMenu" hidden role="menu"></div></div>
  <button class="icon-btn" id="themeBtn" aria-label="Alternar modo noturno"></button>
</div></header>

<main class="wrap" id="app" aria-live="polite"></main>

<script>
const LS_KEY = "simuladoNautico:v1";
const PASS = 0.5;
const SIZES = [40, 80, 120, 160];
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
let BANK = [];
let store = loadStore();
let run = null;

function loadStore() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || { profiles: {}, current: null }; }
  catch { return { profiles: {}, current: null }; }
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(store)); } catch {} if (typeof cloudOnSave === "function") cloudOnSave(); }
function me() { return store.profiles[store.current] || null; }

/* ---------- idioma: textos fixos passam pelo dicionário; modelos com {x} usam t() ---------- */
let LANG = store.lang || "pt";
const LOCALE = () => ({ pt: "pt-BR", en: "en-US", ja: "ja-JP", ko: "ko-KR" })[LANG];
const tr = (s) => (typeof s === "string" && LANG !== "pt" && typeof I18N !== "undefined" && I18N[LANG]?.[s]) || s;
const t = (s, p = {}) => tr(s).replace(/\{(\w+)\}/g, (m, k) => (k in p ? p[k] : m));

function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  const raw = "data-raw" in attrs;
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "html") el.innerHTML = v;
    else el.setAttribute(k, v === true ? "" : (k === "aria-label" || k === "placeholder" || k === "title") ? tr(v) : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(raw ? c : tr(String(c))));
  return el;
}
const ICON = {
  sun: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  moon: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>',
  flag: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  arrow: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  dot: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 2l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l5 5 9-10"/></svg>',
  x: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};
const iconEl = (name) => h("span", { html: ICON[name], "aria-hidden": "true", style: "display:inline-flex" });

/* ---------- tema ---------- */
function applyTheme() {
  const t = store.theme;
  if (t) document.documentElement.setAttribute("data-theme", t);
  const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  $("#themeBtn").innerHTML = dark ? ICON.sun : ICON.moon;
  $("#themeBtn").setAttribute("aria-label", tr(dark ? "Usar modo claro" : "Usar modo noturno"));
}
$("#themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  store.theme = cur === "dark" ? "light" : "dark"; save(); applyTheme();
});
</script>
<script type="application/json" id="banco">[{"q":"Qual parte da embarcação é chamada de proa?","o":["A extremidade traseira do casco.","O lado esquerdo olhando para vante.","A extremidade dianteira do casco.","A parte mais baixa do porão."],"a":2,"c":"Proa é a extremidade de vante. A extremidade oposta é a popa; bombordo e boreste designam os lados.","t":"Nomenclatura e estrutura","id":"838b61aa","v":"casco"},{"q":"A popa corresponde a qual região da embarcação?","o":["A extremidade dianteira do casco.","A parte mais larga do casco.","A linha que separa a obra viva da obra morta.","A extremidade traseira do casco."],"a":3,"c":"Popa é a parte de ré da embarcação. Em manobras, observar seu deslocamento lateral é essencial, pois ela varre o lado oposto ao da guinada.","t":"Nomenclatura e estrutura","id":"b2028c0a","v":"casco"},{"q":"Olhando da popa para a proa, qual é o lado de boreste?","o":["O lado direito da embarcação.","O lado esquerdo da embarcação.","O setor diretamente pela popa.","O setor diretamente pela proa."],"a":0,"c":"Boreste é sempre o lado direito quando se olha para vante; não muda com a posição de quem está a bordo.","t":"Nomenclatura e estrutura","id":"5f4e7f75","v":"casco"},{"q":"Olhando da popa para a proa, qual é o lado de bombordo?","o":["O lado direito da embarcação.","O lado esquerdo da embarcação.","O setor abaixo da quilha.","O setor acima do convés."],"a":1,"c":"Bombordo é o lado esquerdo olhando para vante. A luz lateral correspondente é encarnada (vermelha).","t":"Nomenclatura e estrutura","id":"568f807f","v":"casco"},{"q":"Na nomenclatura náutica, o que a boca da embarcação representa?","o":["A distância vertical entre a linha d'água e a quilha.","O comprimento entre proa e popa.","A maior largura do casco.","A altura do mastro principal."],"a":2,"c":"Boca é a largura do casco, normalmente considerada em sua maior seção. Não deve ser confundida com calado ou comprimento total.","t":"Nomenclatura e estrutura","id":"e12db04f","v":"casco"},{"q":"O que indica o calado de uma embarcação?","o":["A altura entre a linha d'água e o convés exposto.","A largura máxima do casco.","A distância vertical entre a linha d'água e a parte mais baixa do casco ou apêndice considerado.","A distância horizontal percorrida em uma hora."],"a":2,"c":"O calado informa quanto a embarcação se aprofunda na água e deve ser comparado com a profundidade disponível e a folga abaixo da quilha.","t":"Nomenclatura e estrutura","id":"c15340e2"},{"q":"O que é borda-livre?","o":["A parte do casco permanentemente submersa.","A distância entre a proa e o centro de gravidade.","A distância vertical entre a linha d'água e o convés de borda-livre.","A folga entre o leme e a hélice."],"a":2,"c":"Borda-livre é a altura de casco que permanece acima da água. Sobrecarga e alagamento reduzem essa reserva de segurança.","t":"Nomenclatura e estrutura","id":"7bb19646","v":"casco"},{"q":"Qual é a função estrutural básica da quilha?","o":["Formar o principal elemento longitudinal inferior do casco.","Servir apenas como apoio para defensas.","Substituir o leme nas guinadas.","Marcar a linha de flutuação máxima."],"a":0,"c":"A quilha funciona como uma espinha longitudinal do casco e contribui para sua resistência estrutural; em muitos cascos também influencia a estabilidade direcional.","t":"Nomenclatura e estrutura","id":"3e9a057b"},{"q":"A qual região se refere o termo porão de esgoto ou sentina?","o":["Ao ponto baixo interno onde podem se acumular água e outros líquidos.","Ao compartimento aberto de comando.","Ao espaço acima do convés principal.","Ao local externo destinado ao fundeio."],"a":0,"c":"A sentina deve ser inspecionada e mantida limpa. Água inesperada nesse ponto pode indicar vazamento ou falha de estanqueidade.","t":"Nomenclatura e estrutura","id":"81c1531b"},{"q":"O que é o espelho de popa?","o":["O painel que fecha a proa.","A superfície transversal que fecha a popa de muitos cascos.","A chapa que divide o tanque de combustível.","O reflexo luminoso produzido pela esteira."],"a":1,"c":"O espelho de popa é comum em lanchas e pode receber motor de popa, ferragens e outros componentes, conforme o projeto.","t":"Nomenclatura e estrutura","id":"6a267472","v":"casco"},{"q":"A linha d'água é definida como:","o":["A derrota planejada entre dois pontos.","A linha de interseção entre a superfície da água e o casco na condição considerada.","A linha central do convés.","A marca exclusiva das embarcações a vela."],"a":1,"c":"A posição da linha d'água varia com carga, trim e densidade da água. Ela separa, na condição observada, as partes emersas e imersas do casco.","t":"Nomenclatura e estrutura","id":"93280027"},{"q":"Uma embarcação ou objeto situado a sotavento está:","o":["No lado de onde o vento vem.","Exatamente a vante, independentemente do vento.","Sempre no lado de boreste.","No lado para o qual o vento sopra."],"a":3,"c":"Barlavento é o lado de onde vem o vento; sotavento é o lado para onde ele segue. Essa referência é útil em aproximações e resgates.","t":"Nomenclatura e estrutura","id":"5e56a6af","v":"casco"},{"q":"Qual nó forma uma alça fixa que não corre quando submetida a carga?","o":["Lais de guia.","No direito.","Volta do fiel.","No de escota."],"a":0,"c":"O lais de guia forma uma alça fixa e segura, muito usada em marinharia. Como todo nó, precisa ser confeccionado e conferido corretamente.","t":"Cabos, nós e fundeio","id":"390a761b"},{"q":"Qual é a principal finalidade do nó em oito na extremidade de um cabo?","o":["Unir permanentemente dois cabos de aço.","Formar uma alça ajustável para reboque.","Substituir uma emenda por costura.","Impedir que a extremidade escape por um olhal, moitão ou passagem."],"a":3,"c":"O nó em oito é um nó de parada. Ele cria volume na extremidade e reduz o risco de o cabo correr completamente por uma passagem.","t":"Cabos, nós e fundeio","id":"56aceec9"},{"q":"A volta do fiel e normalmente empregada para:","o":["Unir cabos de diâmetros muito diferentes sob grande carga.","Criar uma alça fixa de salvamento.","Prender rapidamente um cabo a um poste, balaustre ou objeto semelhante.","Encurtar a amarra da âncora sem recolhê-la."],"a":2,"c":"A volta do fiel e simples é útil para amarrações temporarias, mas pode necessitar de segurança adicional quando houver carga variável ou risco de afrouxamento.","t":"Cabos, nós e fundeio","id":"1172f424"},{"q":"Qual nó é apropriado para unir dois cabos, especialmente quando possuem bitolas diferentes?","o":["No em oito.","No de escota.","Lais de guia.","Volta redonda com dois cotes."],"a":1,"c":"O nó de escota e tradicionalmente usado para unir cabos, inclusive de diâmetros diferentes. O cabo mais fino deve trabalhar de modo correto no seio do mais grosso.","t":"Cabos, nós e fundeio","id":"e99e7a35"},{"q":"O nó direito é mais indicado para:","o":["Icar pessoas ou formar alça de salvamento.","Unir temporariamente cabos de mesma bitola em aplicações leves, sem carga critica.","Prender a âncora durante mau tempo.","Unir cabos muito diferentes sob carga alternada."],"a":1,"c":"O nó direito pode correr, capotar ou apertar excessivamente se mal empregado. Não deve ser escolhido para cargas críticas ou salvamento.","t":"Cabos, nós e fundeio","id":"2d96f3d8"},{"q":"Ao dar volta em um cunho, qual prática ajuda a manter a amarração firme e organizada?","o":["Completar voltas cruzadas e finalizar com o cote correto, sem excesso desnecessário de cabo.","Enrolar o cabo apenas em círculos paralelos.","Dar vários nós aleatorios sobre o cunho.","Deixar a extremidade solta sobre o convés molhado."],"a":0,"c":"A volta no cunho deve distribuir o esforco e permitir soltura controlada. Excesso de nos pode dificultar uma desatracação de emergência.","t":"Cabos, nós e fundeio","id":"5705c5b0"},{"q":"Para que serve a falcaça na ponta de um cabo de fibra?","o":["Aumentar o comprimento útil do cabo.","Evitar que os cordões se desfacam.","Transformar o cabo em corrente.","Medir automaticamente a profundidade."],"a":1,"c":"A falcaça organiza e protege a extremidade do cabo, reduzindo o desfiamento. Pode ser feita com linha apropriada ou solução compatível com o material.","t":"Cabos, nós e fundeio","id":"4bbec0ec"},{"q":"Em fundeio, o que representa a relação de filame?","o":["A relação entre o comprimento de amarra largado e a profundidade total considerada.","A relação entre boca e comprimento da embarcação.","A quantidade de âncoras dividida pelo número de tripulantes.","A distância entre duas boias laterais."],"a":0,"c":"Filame adequado faz a tração atuar mais horizontalmente sobre a âncora. Profundidade, altura do ponto de amarração, vento, corrente e espaço de giro devem ser considerados.","t":"Cabos, nós e fundeio","id":"62a26393"},{"q":"Em geral, aumentar o filame dentro de limites seguros produz qual efeito?","o":["Faz a âncora perder contato com o fundo.","Melhora a capacidade de unhar da âncora, ao reduzir o ângulo de tração.","Elimina o círculo de giro.","Dispensa a verificação do tipo de fundo."],"a":1,"c":"Mais amarra costuma favorecer a pega, mas também aumenta o raio de giro. O fundeio deve respeitar outras embarcações, perigos e profundidades.","t":"Cabos, nós e fundeio","id":"c0d9ca3e"},{"q":"Ao escolher um ponto de fundeio, qual conjunto de fatores é mais importante?","o":["Somente a distância visual até a praia.","Apenas a potência do motor.","Somente a cor da água no momento da chegada.","Profundidade, tipo de fundo, abrigo, maré, vento, corrente e espaço para girar."],"a":3,"c":"Um bom fundeio depende do ambiente e da capacidade do equipamento. Deve-se prever a variação da maré e o giro da embarcação.","t":"Cabos, nós e fundeio","id":"880480d3"},{"q":"Qual é a função principal dos espringues em uma atracação?","o":["Manter a embarcação exclusivamente afastada do cais.","Substituir todas as defensas.","Limitar o movimento longitudinal da embarcação ao longo do cais.","Medir a altura da maré."],"a":2,"c":"Espringues trabalham no sentido longitudinal e ajudam a impedir que a embarcação avance ou recue no cais. Lançantes e traveses cumprem funções diferentes.","t":"Cabos, nós e fundeio","id":"85538463"},{"q":"Os traveses, em uma amarração ao cais, atuam principalmente para:","o":["Impedir apenas o movimento para vante.","Manter a âncora enterrada.","Controlar o afastamento lateral entre a embarcação e o cais.","Girar o leme para boreste."],"a":2,"c":"Traveses são espias aproximadamente transversais. Devem ser ajustados com as demais espias, considerando maré e movimento local.","t":"Cabos, nós e fundeio","id":"01bef512"},{"q":"Qual é a finalidade das defensas durante a atracação?","o":["Absorver o contato e proteger casco e cais.","Prender permanentemente a embarcação ao fundo.","Substituir o colete salva-vidas.","Sinalizar embarcação sem governo."],"a":0,"c":"Defensas devem ser posicionadas na altura e nos pontos de contato previstos antes da aproximação. Elas não substituem o controle da manobra nem as espias.","t":"Cabos, nós e fundeio","id":"d1a70c4c"},{"q":"Por que um leme convencional perde eficiência quando quase não há movimento de água sobre ele?","o":["Porque a bússola deixa de indicar o norte.","Porque a âncora passa a atuar sobre o casco.","Porque a força hidrodinâmica que produz a guinada diminui.","Porque o motor aumenta automaticamente a rotação."],"a":2,"c":"O leme precisa de escoamento de água. Jato da hélice, seguimento e corrente podem alterar sua resposta, por isso a manobra deve ser antecipada.","t":"Manobras e propulsão","id":"1ca2aa35"},{"q":"Com seguimento avante, ao colocar o leme a boreste, qual resposta básica se espera?","o":["A proa guina para bombordo e a popa fica imóvel.","Toda a embarcação se desloca lateralmente para boreste sem girar.","A embarcação para imediatamente.","A proa guina para boreste e a popa tende a varrer para bombordo."],"a":3,"c":"O leme desvia o fluxo e gera momento de guinada. Em espaço limitado, e indispensável considerar a varredura da popa.","t":"Manobras e propulsão","id":"e9a5aca8"},{"q":"Em uma embarcação de um hélice de passo direito, qual tendência é comum ao dar máquina a ré?","o":["A popa sempre caminha para boreste sem exceção.","A proa e a popa permanecem alinhadas sem tendência lateral.","A embarcação guina apenas se a âncora estiver largada.","A popa tende a caminhar para bombordo, embora vento, corrente e casco possam modificar o efeito."],"a":3,"c":"O efeito transversal do hélice de passo direito, em marcha a ré, costuma levar a popa para bombordo. Deve ser observado na prática, pois varia entre embarcações.","t":"Manobras e propulsão","id":"58e86d0f"},{"q":"Em uma embarcação com dois hélices, uma forma de girar quase sobre o próprio eixo e:","o":["Colocar os dois motores na mesma rotação avante.","Usar um motor avante e o outro a ré, com potência moderada e controle.","Desligar os dois motores e travar o leme.","Fundear pela popa e acelerar ao máximo."],"a":1,"c":"Com máquinas em sentidos opostos, os empuxos criam um momento de giro. A manobra exige baixa potência, vigilância e espaço para a varredura do casco.","t":"Manobras e propulsão","id":"8887cadd"},{"q":"Sempre que possível, a aproximação final para atracar deve ser planejada:","o":["A favor do vento e da corrente, em alta velocidade.","Perpendicularmente ao cais, sem defensas.","Contra o vento ou a corrente predominante, usando o agente mais forte para controlar a velocidade.","Com o motor desligado desde grande distância."],"a":2,"c":"Aproximar-se contra a força dominante melhora o controle e permite reduzir o seguimento. O plano deve considerar espaço, profundidade e rota de escape.","t":"Manobras e propulsão","id":"1aa7d05c"},{"q":"Se o vento empurra a embarcação contra o cais durante a desatracação, qual recurso pode ajudar?","o":["Usar uma espia como espringue, defensas e máquina/leme de forma controlada para abrir uma extremidade.","Retirar todas as defensas antes de largar qualquer espia.","Acelerar forte avante com todas as espias presas.","Largar a âncora sobre o cais."],"a":0,"c":"O espringue pode servir de ponto de giro. A sequência deve ser combinada, com comunicação entre tripulantes e proteção por defensas.","t":"Manobras e propulsão","id":"22377a30"},{"q":"Ao pegar uma boia de amarração, qual aproximação oferece maior controle?","o":["Aproximar a favor da força dominante em velocidade elevada.","Aproximar lentamente contra o vento ou corrente dominante e chegar com pouco seguimento.","Passar a boia pela popa com o hélice engatado.","Colidir levemente com a boia para imobilizar o barco."],"a":1,"c":"A boia deve permanecer visível e longe do hélice. Um tripulante preparado recolhe o cabo quando a embarcação já está sob controle.","t":"Manobras e propulsão","id":"a95d5a3f"},{"q":"Ao perceber uma pessoa caindo na água, qual deve ser a primeira sequência de resposta?","o":["Entrar na cabine para procurar documentos.","Acelerar para afastar a embarcação do local.","Alertar 'homem ao mar', lançar flutuação, manter contato visual e iniciar manobra de retorno.","Largar a âncora sem avisar os demais."],"a":2,"c":"O alerta mobiliza a tripulação; a flutuação sustenta e marca o ponto; uma pessoa deve apontar continuamente para a vítima enquanto o condutor manobra.","t":"Manobras e propulsão","id":"7d7242d9"},{"q":"Na aproximação final a uma pessoa na água, o procedimento mais seguro e:","o":["Manter a hélice engatada para encostar mais rápido.","Chegar devagar, manter a pessoa à vista e colocar a propulsão em neutro ou desligá-la antes do recolhimento.","Aproximar de ré em alta rotação.","Pedir que a pessoa nade até a descarga do motor."],"a":1,"c":"A hélice ou o jato representam risco grave. A aproximação deve considerar vento e corrente e terminar sem empuxo perigoso junto a vítima.","t":"Manobras e propulsão","id":"0275c672"},{"q":"Por que a manobra a ré costuma exigir cautela adicional?","o":["Porque a embarcação deixa de sofrer efeito do vento.","Porque as luzes laterais trocam de cor.","Porque a bússola passa a indicar o sul.","A resposta do leme pode ser menor ou diferente, a visibilidade pior e a popa se torna a extremidade de ataque."],"a":3,"c":"Marcha a ré e recurso de manobra, não condição para navegar rapidamente. Use pouco seguimento, vigia e verificação frequente do setor de ré.","t":"Manobras e propulsão","id":"50b675da"},{"q":"Uma embarcação apresenta proa muito baixa por concentração de carga a vante. Qual correção é mais adequada?","o":["Redistribuir a carga de modo seguro, respeitando lotação e limites do projeto.","Aumentar a velocidade para esconder o problema.","Mover todos os coletes para a proa.","Esvaziar o tanque de água no convés."],"a":0,"c":"Distribuição inadequada altera o trim, a estabilidade e a capacidade de enfrentar ondas. A carga deve ser peada e mantida dentro dos limites autorizados.","t":"Manobras e propulsão","id":"8827faad"},{"q":"Ao navegar em planeio perto de outras embarcações ou margens, qual cuidado e indispensável?","o":["Manter a máxima velocidade para reduzir o tempo de passagem.","Cruzar a proa das embarcações lentas.","Reduzir a velocidade a tempo, controlar a esteira e preservar distância segura.","Desligar as luzes para evitar reflexos."],"a":2,"c":"A esteira pode causar danos, quedas e risco a pequenas embarcações. Velocidade segura inclui os efeitos produzidos sobre terceiros.","t":"Manobras e propulsão","id":"a21afda7"},{"q":"Em uma embarcação de dois motores, a perda de um deles exige:","o":["Reavaliar governabilidade, reduzir o plano de navegação e usar o motor restante com prudência.","Acelerar imediatamente o motor restante ao limite em qualquer situação.","Abandonar a embarcação sem avaliar riscos.","Travar o leme no centro e ignorar vento e corrente."],"a":0,"c":"A assimetria de empuxo altera a manobra. Informe a situação se necessário e escolha local seguro para reparo ou abrigo.","t":"Manobras e propulsão","id":"5ad22a72"},{"q":"Se a hélice ventila ou cavita durante a aceleração, qual sinal é comum?","o":["A rotação sobe sem ganho proporcional de empuxo, podendo ocorrer vibração.","A âncora unha com maior eficiência.","O calado aumenta instantaneamente em vários metros.","O rádio VHF muda de canal."],"a":0,"c":"Ar ou vapor nas pás reduz a eficiência. Deve-se aliviar a aceleração e investigar trim, imersão, danos, algas ou condições de operação.","t":"Manobras e propulsão","id":"01c94c14"},{"q":"Em espaço restrito, qual uso do acelerador é mais seguro?","o":["Manter aceleração máxima e corrigir apenas com o leme.","Alternar avante e ré sem passar por neutro.","Aplicar pulsos curtos e moderados, avaliando cada resposta antes da próxima ordem.","Confiar que as defensas corrigirão qualquer erro."],"a":2,"c":"Pequenas aplicações de potência limitam o seguimento e a energia de impacto. Ordens claras e pausa em neutro protegem transmissão e pessoas.","t":"Manobras e propulsão","id":"437a2c25"},{"q":"Segundo o RIPEAM, como deve ser mantida a vigilância a bordo?","o":["Somente por radar durante a noite.","De forma permanente, apropriada, visual e auditiva, usando também todos os meios disponíveis adequados.","Apenas quando houver outra embarcação visível.","Exclusivamente pelo condutor, sem ajuda de ninguém."],"a":1,"c":"Vigilância é obrigação contínua e serve para avaliar a situação e o risco de colisão. Distrações, ruido e pontos cegos devem ser controlados.","t":"RIPEAM - regras de governo","id":"683d2101"},{"q":"Qual fator deve ser considerado na escolha da velocidade de segurança?","o":["Visibilidade, tráfego, capacidade de manobra, vento, mar, corrente, perigos e limitações dos equipamentos.","Somente a potência máxima do motor.","Apenas o horário previsto de chegada.","Somente a experiência do condutor."],"a":0,"c":"Velocidade segura é aquela que permite agir eficazmente para evitar colisão e parar em distância apropriada as circunstâncias.","t":"RIPEAM - regras de governo","id":"f351b442"},{"q":"Uma marcação relativa de outra embarcação permanece praticamente constante enquanto a distância diminui. Isso indica:","o":["Que as embarcações certamente passarão afastadas.","Que a outra embarcação está fundeada.","Que não é preciso acompanhar a situação.","Risco de colisão, salvo avaliação segura em contrário."],"a":3,"c":"Marcação constante com distância diminuindo é um indício clássico de risco. Na dúvida, o RIPEAM orienta considerar que o risco existe.","t":"RIPEAM - regras de governo","id":"57ea2558"},{"q":"Como deve ser uma manobra destinada a evitar abalroamento?","o":["Positiva, feita com antecedência, ampla o bastante para ser percebida e resultar em passagem segura.","Com varias pequenas alterações sucessivas e tardias.","Sempre para bombordo, independentemente da situação.","Limitada a reduzir um pouco a rotação sem observar o resultado."],"a":0,"c":"Alterações claras de rumo ou velocidade facilitam a leitura pela outra embarcação. Depois de manobrar, deve-se conferir o efeito até estar passado e safo.","t":"RIPEAM - regras de governo","id":"1d13f747"},{"q":"Duas embarcações a propulsão mecânica aproximam-se roda a roda, com risco de colisão. O que cada uma deve fazer?","o":["Guinar para bombordo.","Guinar para boreste, de modo que passem por bombordo uma da outra.","Manter rumo e aumentar a velocidade.","Parar e fundear no mesmo local."],"a":1,"c":"Na situação de rumos diretamente opostos ou quase opostos, ambas alteram para boreste. A ação deve ser clara e tomada em tempo útil.","t":"RIPEAM - regras de governo","id":"e70d313e","v":"governo"},{"q":"Em rumos cruzados entre duas embarcações a motor, qual delas deve se manter fora do caminho?","o":["A que avista a outra por bombordo.","A que avista a outra por boreste.","A embarcação mais veloz, em qualquer caso.","A que estiver mais próxima da margem esquerda."],"a":1,"c":"Quem vê a outra por boreste é a embarcação de manobra e, se possível, deve evitar cruzar a proa da outra.","t":"RIPEAM - regras de governo","id":"feb81fec","v":"governo"},{"q":"Em uma situação de rumos cruzados, a embarcação que tem preferência deve inicialmente:","o":["Guinar imediatamente para bombordo.","Desligar todas as luzes de navegação.","Manter rumo e velocidade, vigiando continuamente a evolução do risco.","Assumir que a outra sempre manobrara corretamente."],"a":2,"c":"A embarcação que mantém deve acompanhar a situação. Ela pode agir quando ficar evidente que a outra não manobra e deve agir se a colisão não puder ser evitada apenas pela manobra da obrigada.","t":"RIPEAM - regras de governo","id":"55990423","v":"governo"},{"q":"Quando uma embarcação é considerada alcançadora de outra?","o":["Sempre que se aproxima pela proa da outra.","Quando se aproxima de direção situada mais de 22,5 graus para ré do través da embarcação alcançada.","Somente quando ambas estão sem seguimento.","Quando avista simultaneamente as duas luzes laterais da outra pela popa."],"a":1,"c":"À noite, a alcançadora normalmente vê apenas a luz de alcançado, sem as luzes laterais. Em caso de dúvida, deve considerar-se alcançadora.","t":"RIPEAM - regras de governo","id":"c7d05827","v":"luzes"},{"q":"A obrigação da embarcação alcançadora termina quando ela chega ao lado da alcançada?","o":["Sim; termina quando as proas ficam alinhadas.","Não; continua até estar definitivamente passada e safa.","Sim; termina quando emite um apito curto.","Não; somente termina depois de fundear."],"a":1,"c":"Uma alteração posterior de marcação não transforma a situação de ultrapassagem em cruzamento. A alcançadora permanece responsável até completar a passagem segura.","t":"RIPEAM - regras de governo","id":"6e96e20b","v":"apitos"},{"q":"Dois veleiros recebem vento por bordos diferentes e existe risco de colisão. Qual deve manobrar?","o":["O veleiro que recebe o vento por boreste.","O veleiro que recebe o vento por bombordo.","O veleiro situado a sotavento, sempre.","O veleiro de maior comprimento, sempre."],"a":1,"c":"Quando os ventos vem de bordos diferentes, o veleiro amurado a bombordo mantém-se fora do caminho do amurado a boreste.","t":"RIPEAM - regras de governo","id":"4603f735"},{"q":"Dois veleiros recebem vento pelo mesmo bordo. Qual deve se manter fora do caminho?","o":["O que está a sotavento.","O que tem menor calado.","O que está a barlavento.","O que estiver mais próximo do porto."],"a":2,"c":"Com vento pelo mesmo bordo, o veleiro de barlavento deve manobrar para o de sotavento. A posição e avaliada em relação ao vento.","t":"RIPEAM - regras de governo","id":"c56de601"},{"q":"Em visibilidade normal, uma embarcação a motor encontra um veleiro navegando. Em regra, quem deve se manter fora do caminho?","o":["O veleiro em qualquer circunstância.","A embarcação que estiver a sotavento.","A embarcação com maior velocidade registrada.","A embarcação a motor."],"a":3,"c":"A regra geral de responsabilidade coloca a embarcação a motor fora do caminho do veleiro, ressalvadas situações especiais como ultrapassagem e embarcações com capacidade de manobra restrita.","t":"RIPEAM - regras de governo","id":"d2eb8600","v":"governo"},{"q":"Um veleiro encontra uma embarcação engajada na pesca, com os sinais correspondentes. Em regra, o veleiro deve:","o":["Manter-se fora do caminho da embarcação engajada na pesca.","Exigir que a embarcação de pesca guine para boreste.","Manter rumo sem observar o risco.","Ultrapassar sempre pela proa."],"a":0,"c":"Em regra, o veleiro mantém-se fora do caminho de embarcações sem governo, com capacidade de manobra restrita e engajadas na pesca.","t":"RIPEAM - regras de governo","id":"7add7bf4"},{"q":"Uma embarcação engajada na pesca encontra outra sem governo. Qual é a conduta correta, quando possível?","o":["Manter-se fora do caminho da embarcação sem governo.","Manter rumo porque a pesca sempre tem prioridade absoluta.","Aproximar-se para cruzar a proa.","Emitir um apito curto e continuar sem alterar."],"a":0,"c":"A embarcação sem governo ocupa nível de prioridade superior porque uma circunstância excepcional a impede de manobrar como exigido.","t":"RIPEAM - regras de governo","id":"46aefb85","v":"apitos"},{"q":"Ao navegar em um canal estreito, qual posicionamento geral e exigido?","o":["Navegar pelo centro em qualquer situação.","Manter-se junto ao limite de bombordo.","Alternar de margem a cada curva.","Manter-se tão próximo quanto seguro e praticável do limite exterior do canal por boreste."],"a":3,"c":"A regra de canal estreito reduz conflitos de tráfego. Profundidade, corrente e condições locais continuam sendo consideradas.","t":"RIPEAM - regras de governo","id":"6dec17c5"},{"q":"Em um canal estreito, uma embarcação a vela ou com menos de 20 m deve:","o":["Exigir passagem por ter menor porte.","Fundear no eixo do canal para aguardar.","Cruzar repetidamente a via para ganhar barlavento.","Não atrapalhar a passagem de embarcação que só possa navegar com segurança dentro do canal."],"a":3,"c":"Pequenas embarcações e veleiros não devem impedir navios limitados ao canal. Isso não elimina a obrigação geral de evitar colisão.","t":"RIPEAM - regras de governo","id":"5769c496"},{"q":"É permitido cruzar um canal estreito quando essa manobra atrapalhar uma embarcação que só navega com segurança dentro dele?","o":["Sim, desde que a embarcação menor acelere.","Não; o cruzamento não deve impedir a passagem dessa embarcação.","Sim, quando realizado de bombordo para boreste.","Sim, se não houver sinal sonoro."],"a":1,"c":"O cruzamento deve ser planejado para não constranger o tráfego que depende do canal. Na dúvida, aguarde uma oportunidade segura.","t":"RIPEAM - regras de governo","id":"06ed3afd"},{"q":"Ao usar um esquema de separação de tráfego, a embarcação deve normalmente:","o":["Navegar contra o fluxo para reduzir distância.","Usar a zona de separação como faixa comum.","Seguir na faixa apropriada, no sentido geral do fluxo estabelecido.","Fundear na entrada da faixa sempre que desejar."],"a":2,"c":"Os esquemas organizam fluxos opostos. A entrada e a saída devem ser feitas com o menor ângulo praticável em relação ao fluxo.","t":"RIPEAM - regras de governo","id":"a6ec77db"},{"q":"Quando for necessário cruzar uma faixa de tráfego, qual rumo em relação ao fluxo é recomendado?","o":["Paralelo e em sentido contrário ao fluxo.","Em zigue-zague dentro da zona de separação.","Com o menor ângulo possível em relação ao fluxo.","O mais próximo possível de um ângulo reto com a direção geral do tráfego."],"a":3,"c":"Cruzar a aproximadamente 90 graus reduz o tempo dentro da faixa e torna a intenção mais clara para os demais navegantes.","t":"RIPEAM - regras de governo","id":"d7220379"},{"q":"Em visibilidade restrita, uma embarcação a motor deve manter as máquinas:","o":["Desligadas para reduzir ruido.","Prontas para manobra imediata e navegar em velocidade segura para as condições.","Sempre em potência máxima.","Engatadas a ré durante toda a travessia."],"a":1,"c":"Nevoeiro exige vigilância reforcada, uso adequado de radar se disponível, sinais sonoros e capacidade de reduzir ou parar o seguimento.","t":"RIPEAM - regras de governo","id":"c8dd497d"},{"q":"Em nevoeiro, o radar indica uma embarcação adiante do través. Se uma alteração de rumo for necessária, deve-se, em geral:","o":["Alterar sempre para bombordo.","Cruzar a proa do alvo em alta velocidade.","Ignorar o radar até avistar luzes.","Evitar alterar para bombordo, salvo se estiver alcançando a outra embarcação."],"a":3,"c":"A Regra 19 orienta evitar guinada para bombordo para alvo por ante a vante do través, exceto em ultrapassagem, e evitar guinar em direção a alvo pelo través ou a ré dele.","t":"RIPEAM - regras de governo","id":"e03ab7f9","v":"governo"},{"q":"Em visibilidade restrita, ao ouvir aparentemente por ante a vante do través o sinal de nevoeiro de outra embarcação, deve-se:","o":["Aumentar a velocidade para ultrapassar a área.","Guinar obrigatoriamente para bombordo.","Desligar o equipamento de som.","Reduzir ao mínimo a velocidade de governo, tirar todo o seguimento se necessário e navegar com extrema cautela."],"a":3,"c":"Sem contato visual, uma aproximação excessiva pode evoluir rapidamente. O RIPEAM exige cautela extrema até cessar o perigo.","t":"RIPEAM - regras de governo","id":"07716e8f"},{"q":"O termo embarcação sem governo identifica uma embarcação que:","o":["Está voluntariamente parada para recreação.","Navega apenas com vela em vento fraco.","Possui motor de pequena potência.","Por circunstância excepcional não pode manobrar como exigido e, portanto, não consegue se manter fora do caminho."],"a":3,"c":"Sem governo não significa simplesmente estar parado. É uma incapacidade excepcional de obedecer as regras de manobra.","t":"RIPEAM - regras de governo","id":"56e7054d"},{"q":"Uma embarcação com capacidade de manobra restrita é aquela que:","o":["Escolheu reduzir a velocidade por economia.","Pela natureza de seu trabalho tem a capacidade de manobrar limitada e não pode se manter fora do caminho como exigido.","Transporta apenas passageiros.","Tem comprimento inferior a 12 m."],"a":1,"c":"Exemplos incluem certas operações de dragagem, lançamento de cabos e reabastecimento em movimento. A restrição decorre do trabalho executado.","t":"RIPEAM - regras de governo","id":"a1733fe0"},{"q":"O que caracteriza uma embarcação restrita por seu calado?","o":["Embarcação a motor severamente limitada, pela relação entre calado e profundidade/largura disponível, em sua capacidade de desviar do rumo.","Qualquer veleiro em águas rasas.","Toda embarcação fundeada perto da praia.","Uma embarcação sem coletes suficientes."],"a":0,"c":"As demais embarcações, exceto as sem governo e com manobra restrita, devem evitar impedir sua passagem quando as circunstâncias permitirem.","t":"RIPEAM - regras de governo","id":"ff160866"},{"q":"Quais são as cores das luzes laterais de uma embarcação?","o":["Verde a boreste e encarnada a bombordo.","Encarnada a boreste e verde a bombordo.","Branca nos dois bordos.","Amarela a boreste e azul a bombordo."],"a":0,"c":"As luzes laterais permitem reconhecer o bordo avistado. Verde corresponde a boreste; encarnada, a bombordo.","t":"Luzes, marcas e sinais sonoros","id":"647d38f1","v":"luzes"},{"q":"Qual setor e coberto por uma luz de mastro?","o":["112,5 graus apenas no bordo de boreste.","225 graus, de vante até 22,5 graus para ré do través em cada bordo.","135 graus centrados na popa.","360 graus ao redor do horizonte."],"a":1,"c":"A luz de mastro é branca e ilumina o setor de vante. Seu arco e diferente dos setores das luzes laterais e de alcançado.","t":"Luzes, marcas e sinais sonoros","id":"fdaede09","v":"luzes"},{"q":"Qual é o setor da luz de alcançado?","o":["225 graus, centrados na proa.","112,5 graus somente por boreste.","360 graus ao redor do horizonte.","135 graus, centrados na popa, 67,5 graus para cada bordo."],"a":3,"c":"A luz de alcançado é branca e cobre o setor de ré. É a luz normalmente vista por quem se aproxima em situação de ultrapassagem.","t":"Luzes, marcas e sinais sonoros","id":"0772117c","v":"luzes"},{"q":"Uma embarcação a motor com menos de 50 m, em movimento à noite, normalmente exibe:","o":["Somente uma luz branca circular.","Uma luz de mastro, luzes laterais e luz de alcançado.","Duas luzes encarnadas em linha vertical.","Luz verde sobre luz branca e nenhuma lateral."],"a":1,"c":"Uma segunda luz de mastro a ré e mais alta é obrigatória a partir de 50 m e facultativa abaixo desse comprimento.","t":"Luzes, marcas e sinais sonoros","id":"852c7917","v":"luzes"},{"q":"Um veleiro em movimento à noite deve exibir, como conjunto básico:","o":["Uma luz de mastro branca obrigatória e duas amarelas.","Duas luzes encarnadas em linha vertical.","Luzes laterais e luz de alcançado.","Apenas uma luz branca circular em qualquer comprimento."],"a":2,"c":"Em veleiro com menos de 20 m, as laterais e a luz de alcançado podem ser combinadas em uma única lanterna no topo ou próximo ao topo do mastro.","t":"Luzes, marcas e sinais sonoros","id":"e0f870ce","v":"luzes"},{"q":"Qual alternativa simplificada pode ser usada por embarcação a motor com menos de 12 m?","o":["Somente a luz verde lateral.","Duas luzes amarelas verticais.","Uma luz encarnada circular sem laterais.","Uma luz branca circular e luzes laterais."],"a":3,"c":"Para pequenas embarcações a motor, a luz branca circular pode substituir separadamente luz de mastro e de alcançado, acompanhada das laterais.","t":"Luzes, marcas e sinais sonoros","id":"8b7af86c","v":"luzes"},{"q":"Uma embarcação com menos de 50 m fundeada deve exibir à noite e de dia, respectivamente:","o":["Luzes laterais e um cone preto.","Duas luzes encarnadas e dois cones.","Uma luz branca circular onde melhor possa ser vista é uma esfera preta.","Luz verde sobre branca e um cilindro."],"a":2,"c":"Embarcações maiores exibem luzes de fundeio separadas a vante e a ré. A marca diurna de fundeio é uma esfera.","t":"Luzes, marcas e sinais sonoros","id":"9be3cf1e","v":"luzes"},{"q":"Quais sinais adicionais identificam uma embarcação encalhada?","o":["Três luzes verdes e um cone.","Uma luz amarela e um cilindro.","Duas luzes brancas e dois losangos.","Duas luzes encarnadas circulares em linha vertical e três esferas pretas, além dos sinais de fundeio aplicáveis."],"a":3,"c":"O encalhe combina sinais de fundeio com os sinais de incapacidade decorrente do encalhe: vermelho sobre vermelho e três esferas.","t":"Luzes, marcas e sinais sonoros","id":"edfc33fc","v":"formas"},{"q":"Qual conjunto identifica embarcação sem governo?","o":["Duas luzes encarnadas circulares em linha vertical e, de dia, duas esferas pretas.","Verde sobre branca e dois cones.","Branca sobre encarnada e uma esfera.","Encarnada-branca-encarnada e um losango."],"a":0,"c":"Quando estiver com seguimento, a embarcação sem governo também exibe luzes laterais e de alcançado. O par vermelho indica a condição especial.","t":"Luzes, marcas e sinais sonoros","id":"a39803a4","v":"luzes"},{"q":"Qual conjunto identifica embarcação com capacidade de manobra restrita?","o":["Branca-encarnada-branca e três cones.","Encarnada-branca-encarnada em linha vertical e, de dia, esfera-losango-esfera.","Verde-branca-verde e uma esfera.","Duas amarelas e um cilindro."],"a":1,"c":"A sequência vermelho-branco-vermelho corresponde a esfera-losango-esfera. Outros sinais podem ser acrescidos conforme o trabalho e o movimento.","t":"Luzes, marcas e sinais sonoros","id":"6614f9d4","v":"formas"},{"q":"Uma embarcação engajada em pesca de arrasto exibe quais luzes circulares verticais?","o":["Verde sobre branca.","Encarnada sobre branca.","Branca sobre encarnada.","Amarela sobre verde."],"a":0,"c":"A mnemônica tradicional e 'verde sobre branca, arrasto em andamento'. Quando com seguimento, também exibe laterais e alcançado.","t":"Luzes, marcas e sinais sonoros","id":"3ea60e9b"},{"q":"Uma embarcação engajada em pesca que não seja de arrasto exibe:","o":["Verde sobre branca.","Duas brancas verticais.","Encarnada sobre branca, em luzes circulares verticais.","Branca sobre amarela."],"a":2,"c":"Se o aparelho de pesca se estender mais de 150 m horizontalmente, exibe ainda luz branca circular ou cone com vértice para cima na direção do aparelho.","t":"Luzes, marcas e sinais sonoros","id":"84baeb90"},{"q":"Uma embarcação de praticagem em serviço é reconhecida pelas luzes:","o":["Branca sobre encarnada.","Encarnada sobre branca.","Verde sobre branca.","Duas amarelas verticais."],"a":0,"c":"A embarcação de praticagem também exibe laterais e alcançado quando em movimento ou sinais de fundeio quando fundeada.","t":"Luzes, marcas e sinais sonoros","id":"64527826"},{"q":"Quando o comprimento do reboque excede 200 m, quantas luzes de mastro verticais o rebocador a motor exibe?","o":["Uma.","Duas.","Quatro encarnadas.","Três."],"a":3,"c":"Até 200 m são duas luzes de mastro verticais; acima de 200 m, três. Um losango diurno também sinaliza o reboque longo.","t":"Luzes, marcas e sinais sonoros","id":"3b4d539e","v":"luzes"},{"q":"Qual luz fica verticalmente acima da luz de alcançado em um rebocador?","o":["Uma luz lateral verde.","Uma luz de mastro encarnada.","Uma luz de reboque amarela com o mesmo setor da luz de alcançado.","Uma luz circular azul."],"a":2,"c":"A luz de reboque é amarela e tem as mesmas características de setor da luz de alcançado, ficando acima dela.","t":"Luzes, marcas e sinais sonoros","id":"76c0affe","v":"luzes"},{"q":"Em situação de embarcações à vista, um apito curto significa:","o":["Estou guinando para bombordo.","Estou operando propulsão a ré.","Estou fundeando.","Estou guinando para boreste."],"a":3,"c":"O sinal deve acompanhar a manobra: um curto para boreste, dois para bombordo e três para propulsão a ré.","t":"Luzes, marcas e sinais sonoros","id":"1d78bc56","v":"apitos"},{"q":"Em situação de embarcações à vista, dois apitos curtos significam:","o":["Estou guinando para boreste.","Estou guinando para bombordo.","Estou sem governo.","Pretendo fundear."],"a":1,"c":"Dois curtos comunicam alteração para bombordo. O sinal não substitui a obrigação de fazer uma manobra segura e perceptível.","t":"Luzes, marcas e sinais sonoros","id":"1e5604d8","v":"apitos"},{"q":"Em situação de embarcações à vista, três apitos curtos significam:","o":["Estou operando a propulsão a ré.","Estou guinando para boreste.","Estou guinando para bombordo.","Estou pedindo prático."],"a":0,"c":"Três curtos indicam que as máquinas estão operando a ré; não afirmam necessariamente que a embarcação já possui seguimento a ré.","t":"Luzes, marcas e sinais sonoros","id":"ca6c0a09","v":"apitos"},{"q":"Cinco ou mais apitos curtos e rápidos indicam:","o":["Concordância com uma ultrapassagem.","Chegada a um fundeadouro.","Mensagem de rotina no VHF.","Dúvida sobre a intenção ou a manobra da outra embarcação, ou percepção de que ela não age para evitar colisão."],"a":3,"c":"É um sinal de advertência. Deve-se reavaliar imediatamente risco, velocidade e necessidade de manobra.","t":"Luzes, marcas e sinais sonoros","id":"d5bb28e6","v":"apitos"},{"q":"Em visibilidade restrita, qual sinal uma embarcação a motor com seguimento deve emitir em intervalos de no máximo dois minutos?","o":["Um apito prolongado.","Dois apitos curtos.","Três apitos curtos.","Um apito curto seguido de um longo."],"a":0,"c":"Embarcação a motor sob máquinas, mas parada e sem seguimento, emite dois prolongados separados por cerca de dois segundos.","t":"Luzes, marcas e sinais sonoros","id":"20db00e2","v":"apitos"},{"q":"Na direção convencional do balizamento, o sentido usual de entrada e:","o":["Sempre do porto para o mar.","Sempre do norte para o sul.","Vindo do mar para o porto, ou acompanhando o sentido estabelecido para montante em vias interiores.","Definido pela cor do casco da embarcação."],"a":2,"c":"A direção convencional é a referência para interpretar sinais laterais. Em trechos especiais, deve-se consultar carta e publicações locais.","t":"Balizamento IALA B","id":"30162b5b"},{"q":"Entrando por um canal balizado na Região B, como é o sinal lateral de bombordo?","o":["Encarnado, cônico e ímpar; deve ser deixado por bombordo.","Amarelo, esférico e sem referência lateral.","Preto e encarnado, com duas esferas.","Verde, formato cilíndrico quando aplicável e numeração par, se houver; deve ser deixado por bombordo."],"a":3,"c":"Na Região B, bombordo é verde. A marca de tope é cilíndrica e a numeração, quando existente, é par.","t":"Balizamento IALA B","id":"aba265f0","v":"lateral"},{"q":"Entrando por um canal balizado na Região B, como é o sinal lateral de boreste?","o":["Verde, cilíndrico e par; deve ser deixado por boreste.","Branco e encarnado em faixas verticais.","Amarelo com marca de tope em X.","Encarnado, formato cônico quando aplicável e numeração ímpar, se houver; deve ser deixado por boreste."],"a":3,"c":"Na Região B, boreste é encarnado. A marca de tope é cônica, com vértice para cima, e a numeração é ímpar.","t":"Balizamento IALA B","id":"4671c730","v":"lateral"},{"q":"Uma marca encarnada com larga faixa horizontal verde indica, em uma bifurcação:","o":["Canal preferencial a boreste.","Perigo isolado.","Canal preferencial a bombordo.","Águas seguras em toda a volta."],"a":2,"c":"A cor predominante encarnada mostra que a marca e deixada por boreste na direção convencional; a faixa verde informa que o ramo preferencial segue por bombordo.","t":"Balizamento IALA B","id":"2f0a0feb","v":"perigo"},{"q":"Uma marca verde com larga faixa horizontal encarnada indica:","o":["Canal preferencial a boreste.","Canal preferencial a bombordo.","Novo perigo duplicado.","Área de fundeio obrigatório."],"a":0,"c":"A cor predominante verde identifica o lado de bombordo do canal; a faixa encarnada aponta a preferência pelo ramo de boreste.","t":"Balizamento IALA B","id":"1a060231","v":"pref"},{"q":"Qual é a finalidade de um sinal cardinal?","o":["Indicar apenas a margem direita de um canal.","Mostrar a distância exata até o porto.","Substituir todas as luzes de navegação das embarcações.","Indicar o quadrante - norte, leste, sul ou oeste - onde se encontram águas seguras em relação ao sinal."],"a":3,"c":"O nome do cardinal corresponde ao quadrante recomendado para passagem. Cores, cones e ritmo luminoso confirmam a identificação.","t":"Balizamento IALA B","id":"ca8e0f14","v":"cardinal"},{"q":"Como são os cones de tope de um sinal cardinal norte?","o":["Dois cones pretos com vértices voltados para baixo.","Dois cones pretos com os vértices voltados para cima.","Dois cones com as bases unidas.","Duas esferas pretas."],"a":1,"c":"No cardinal norte, o preto fica na parte superior e os dois cones apontam para cima, lembrando o topo da rosa dos ventos.","t":"Balizamento IALA B","id":"fa4091ba","v":"cardinal"},{"q":"Como é a marca de tope do sinal cardinal leste?","o":["Dois cones com os vértices voltados um para o outro.","Dois cones pretos com as bases voltadas uma para a outra.","Dois cones apontando para cima.","Uma esfera encarnada."],"a":1,"c":"No cardinal leste, os cones se afastam pelos vértices e formam visualmente um contorno largo, associado ao lado leste da rosa.","t":"Balizamento IALA B","id":"af441fc5","v":"cardinal"},{"q":"Como são os cones de tope do sinal cardinal sul?","o":["Dois cones pretos com os vértices voltados para baixo.","Dois cones com os vértices voltados para cima.","Dois cones com as bases unidas.","Um cilindro verde."],"a":0,"c":"No cardinal sul, o amarelo fica acima do preto e os dois cones apontam para baixo.","t":"Balizamento IALA B","id":"a4816f87","v":"cardinal"},{"q":"Como é a marca de tope do sinal cardinal oeste?","o":["Dois cones com as bases voltadas uma para a outra.","Dois cones apontando para baixo.","Dois cones pretos com os vértices voltados um para o outro.","Duas esferas encarnadas."],"a":2,"c":"Os vértices unidos lembram uma cintura estreita, mnemônica útil para oeste. A estrutura tem amarelo-preto-amarelo.","t":"Balizamento IALA B","id":"438f1e44","v":"cardinal"},{"q":"Qual ritmo luminoso identifica um sinal cardinal leste?","o":["Grupo de nove lampejos.","Grupo de seis mais um longo.","Grupo de três lampejos brancos rápidos ou muito rápidos.","Dois lampejos brancos a cada período."],"a":2,"c":"Os grupos 3, 6 e 9 remetem as posições do relógio para leste, sul e oeste; o norte usa lampejos rápidos continuos.","t":"Balizamento IALA B","id":"e888ec15","v":"cardinal"},{"q":"Qual ritmo luminoso identifica um sinal cardinal sul?","o":["Três lampejos rápidos.","Nove lampejos rápidos.","Grupo de seis lampejos brancos rápidos ou muito rápidos, seguido de um lampejo longo.","Um lampejo amarelo longo."],"a":2,"c":"O lampejo longo diferencia o cardinal sul e ajuda a evitar confusão com outros grupos luminosos.","t":"Balizamento IALA B","id":"0f8760b1","v":"cardinal"},{"q":"Qual ritmo luminoso identifica um sinal cardinal oeste?","o":["Grupo de nove lampejos brancos rápidos ou muito rápidos.","Grupo de três lampejos.","Grupo de seis mais um longo.","Luz branca fixa."],"a":0,"c":"O número nove corresponde ao oeste na mnemônica do relógio: leste 3, sul 6 mais longo e oeste 9.","t":"Balizamento IALA B","id":"3bb51f9e","v":"cardinal"},{"q":"Qual ritmo luminoso é usado pelo sinal cardinal norte?","o":["Lampejos brancos rápidos ou muito rápidos, sem agrupamento numérico característico.","Exatamente dois lampejos brancos.","Grupo de nove lampejos amarelos.","Morse A em luz encarnada."],"a":0,"c":"O cardinal norte usa sequência rápida ou muito rápida contínua. A marca diurna tem preto sobre amarelo.","t":"Balizamento IALA B","id":"a2d07b5a","v":"cardinal"},{"q":"O sinal de perigo isolado indica:","o":["O centro obrigatório de um canal.","Um perigo localizado, com águas navegáveis em toda a sua volta.","O lado de boreste de toda entrada de porto.","Uma área livre de qualquer perigo em grande extensão."],"a":1,"c":"É colocado sobre ou próximo ao perigo. Tem cor preta com faixa(s) encarnada(s), duas esferas pretas e luz branca em grupo de dois.","t":"Balizamento IALA B","id":"76b1507a","v":"perigo"},{"q":"Qual aparência caracteriza o sinal de águas seguras?","o":["Faixas horizontais pretas e encarnadas com duas esferas.","Estrutura toda amarela com X no tope.","Faixas verticais encarnadas e brancas, com esfera encarnada opcional no tope.","Estrutura verde com faixa encarnada."],"a":2,"c":"O sinal indica águas navegáveis ao redor, meio de canal, aterragem ou ponto de espera. Sua luz, quando existente, é branca.","t":"Balizamento IALA B","id":"3ab1a286","v":"seguras"},{"q":"Qual é a cor básica de um sinal especial?","o":["Amarela, com luz amarela se for luminoso.","Encarnada, obrigatoriamente cônica.","Verde, obrigatoriamente cilíndrica.","Preta com faixas encarnadas."],"a":0,"c":"Sinais especiais marcam áreas ou configurações descritas em documentos náuticos, como dragagem, recreação, cabos e áreas de fundeio.","t":"Balizamento IALA B","id":"e0011bc5","v":"especial"},{"q":"Como deve ser destacado um novo perigo ainda não suficientemente divulgado?","o":["Por uma única boia azul sem luz.","Retirando-se todas as marcas proximas.","Somente por aviso verbal entre navegantes.","Pelo menos um dos sinais usados deve ser duplicado por outro idêntico."],"a":3,"c":"A duplicação chama atenção para a novidade. Luzes cardinais ou laterais usadas devem ter ritmo rápido ou muito rápido.","t":"Balizamento IALA B","id":"2bbc556b"},{"q":"Qual marca de tope pode aparecer em um sinal especial?","o":["Duas esferas pretas.","Dois cones pretos apontando para cima.","Um X amarelo.","Uma esfera encarnada obrigatória."],"a":2,"c":"A marca em X é opcional e ajuda a reconhecer a finalidade especial. O formato do corpo não deve conflitar com outros sinais existentes.","t":"Balizamento IALA B","id":"2a4f8b76","v":"especial"},{"q":"Qual dos seguintes ritmos pode identificar uma luz de águas seguras?","o":["Luz branca em Morse A, além de ritmos como isofásico, ocultação ou lampejo longo a cada dez segundos.","Grupo de dois lampejos encarnados.","Luz amarela fixa obrigatória.","Grupo de nove lampejos verdes."],"a":0,"c":"A letra A em Morse é ponto-traço. A cor branca e as faixas verticais encarnadas e brancas diferenciam esse sinal.","t":"Balizamento IALA B","id":"0b57c10e","v":"seguras"},{"q":"Ao selecionar um colete salva-vidas para uma pessoa, qual critério é essencial?","o":["Usar modelo homologado, da classe adequada a navegação é compatível com o peso e o tamanho do usuário.","Escolher apenas pela cor do tecido.","Usar qualquer colete esportivo sem verificar homologação.","Preferir sempre o maior tamanho, mesmo que fique solto."],"a":0,"c":"O colete precisa ser apropriado ao usuário e permanecer ajustado. Um equipamento folgado, inadequado ou não homologado pode falhar justamente na emergência.","t":"Segurança e incêndio","id":"a24d03cf","v":"fogo"},{"q":"Onde os coletes salva-vidas devem permanecer durante a navegação?","o":["Dentro de compartimento trancado para evitar uso indevido.","No ponto mais baixo da sentina.","Em local sinalizado, seco e de acesso imediato, sem ficarem trancados ou soterrados por bagagem.","Embalados junto ao combustível, para economizar espaço."],"a":2,"c":"Em emergência, segundos importam. Todos a bordo devem saber onde estão os coletes e como vesti-los, de preferência antes da saída.","t":"Segurança e incêndio","id":"4a777640"},{"q":"Antes de levar um sinal pirotécnico a bordo, o que deve ser verificado?","o":["Somente a cor externa da embalagem.","A possibilidade de testa-lo dentro da cabine.","Se pode ser guardado solto perto de fonte de calor.","Validade, integridade, homologação, instruções de uso e forma segura de armazenamento."],"a":3,"c":"Pirotécnicos vencidos, danificados ou mal armazenados são perigosos e podem não funcionar. O uso deve seguir as instruções do fabricante e ocorrer apenas em situação real de emergência.","t":"Segurança e incêndio","id":"b933d1af"},{"q":"Para que serve principalmente um sinal fumígeno laranja?","o":["Iluminar continuamente o interior da cabine.","Indicar a posição de uma embarcação ou pessoa em perigo, sobretudo durante o dia.","Apagar incêndio de combustível.","Substituir a luz de navegação de boreste."],"a":1,"c":"A fumaça laranja cria uma referência visual diurna e também pode ajudar equipes de busca a perceber a direção do vento.","t":"Segurança e incêndio","id":"a607ca99","v":"fogo"},{"q":"Qual é a principal vantagem de um foguete com paraquedas e luz encarnada?","o":["Marcar com precisão a profundidade sob a quilha.","Produzir fumaça apenas sob a água.","Servir como extintor portátil.","Alcançar grande altura e permanecer visível por mais tempo, favorecendo a detecção a distância."],"a":3,"c":"O foguete com paraquedas é um sinal de socorro de maior alcance visual. Deve ser lancado com cautela, observando vento, pessoas e obstáculos.","t":"Segurança e incêndio","id":"75193f44","v":"fogo"},{"q":"Qual combinação é reconhecida como sinal visual de perigo?","o":["Uma bandeira verde sobre um cone amarelo.","Uma bandeira quadrada com uma esfera, ou objeto semelhante a esfera, acima ou abaixo dela.","Duas bandeiras azuis lado a lado.","Um cilindro preto sob uma bandeira triangular branca."],"a":1,"c":"Esse é um dos sinais internacionais de perigo. A existência de um sinal não impede o uso simultâneo de outros meios, como MAYDAY, EPIRB ou pirotécnicos, quando disponíveis.","t":"Segurança e incêndio","id":"52e17956"},{"q":"Quando abandonar uma embarcação em emergência?","o":["Ao primeiro defeito mecânico, mesmo sem perigo.","Antes de transmitir qualquer pedido de socorro.","Somente quando permanecer a bordo representar risco maior, seguindo o comando e levando os meios de salvatagem possíveis.","Sempre que a embarcação ficar sem governo por poucos minutos."],"a":2,"c":"A embarcação normalmente oferece maior proteção e é mais fácil de localizar do que pessoas na água. Abandona-la e medida extrema.","t":"Segurança e incêndio","id":"ad9069cd"},{"q":"Uma pequena embarcação emborca, continua flutuando e não há perigo imediato de incêndio. Qual conduta favorece o resgate?","o":["Nadar sozinho até a margem, mesmo sem saber a distância.","Mergulhar repetidamente sob o casco sem necessidade.","Retirar o colete para nadar mais rápido.","Permanecer junto ao casco, apoiar-se nele e evitar nadar sem destino."],"a":3,"c":"O casco é um alvo maior para busca e pode fornecer flutuação. Só se deve abandona-lo quando houver ameaça concreta ou uma alternativa claramente mais segura.","t":"Segurança e incêndio","id":"f4a1c899","v":"fogo"},{"q":"Em uma balsa salva-vidas, para que serve a âncora flutuante?","o":["Reduzir a deriva e ajudar a manter a balsa orientada em relação ao mar e ao vento.","Medir automaticamente a salinidade.","Elevar a balsa acima das ondas.","Substituir o kit de reparos."],"a":0,"c":"A âncora flutuante cria arrasto na água, limita a deriva e pode melhorar o comportamento da balsa em mar agitado.","t":"Segurança e incêndio","id":"9547cf2f"},{"q":"Por que não se deve beber água do mar em uma situação de sobrevivência?","o":["Porque o excesso de sal agrava a desidratação e pode comprometer o organismo.","Porque ela provoca hipotermia instantanea.","Porque ela sempre contem combustível.","Porque elimina totalmente a sensação de sede."],"a":0,"c":"Os rins precisam eliminar o sal ingerido e podem exigir mais água do que a bebida forneceu. A água potável deve ser racionada com critério, sem suspender indevidamente a hidratação.","t":"Segurança e incêndio","id":"d1097b8c"},{"q":"Pessoas com colete aguardam resgate em água fria. Qual procedimento reduz a perda de calor?","o":["Nadar continuamente em alta intensidade.","Retirar o colete para aproximar os joelhos.","Separar o grupo para ocupar uma área maior.","Manter o corpo o mais imóvel possível, proteger regiões de maior perda e agrupar-se quando seguro."],"a":3,"c":"A posição de redução de perda de calor e o agrupamento diminuem a exposição. Movimentos desnecessários aceleram a troca de água junto ao corpo.","t":"Segurança e incêndio","id":"4e08b057"},{"q":"Quais elementos formam o triângulo do fogo?","o":["Combustível, comburente e calor.","Água, espuma e gás carbônico.","Fumaça, cinza e chama.","Pressão, umidade e eletricidade."],"a":0,"c":"A extinção ocorre ao eliminar ou reduzir um dos elementos essenciais: resfriar, abafar ou retirar o combustível, conforme o tipo de incêndio.","t":"Segurança e incêndio","id":"98d55dca","v":"fogo"},{"q":"Qual material e típico de incêndio classe A?","o":["Líquidos inflamáveis, como gasolina.","Equipamento elétrico energizado.","Sólidos comuns que deixam resíduos, como madeira, papel e tecido.","Oleo de cozinha em equipamento industrial, exclusivamente."],"a":2,"c":"Incêndios classe A envolvem materiais sólidos comuns. O agente extintor deve ser escolhido sem criar risco elétrico ou espalhar outro combustível presente.","t":"Segurança e incêndio","id":"d373a263","v":"fogo"},{"q":"Um derramamento de gasolina pega fogo. A ocorrência é classificada principalmente como incêndio de classe:","o":["A, por deixar brasas de madeira.","C, apenas porque ocorreu em uma embarcação.","B, por envolver líquido inflamável.","D, por envolver metal combustível."],"a":2,"c":"Em líquidos inflamáveis, um jato compacto de água pode espalhar o combustível. Empregam-se agentes e técnicas adequados a classe B.","t":"Segurança e incêndio","id":"e5838e14","v":"fogo"},{"q":"Um painel elétrico energizado está em chamas. Qual classificação e cuidado inicial são adequados?","o":["Classe C enquanto estiver energizado; cortar a energia se for seguro e usar agente não condutor apropriado.","Classe A; lançar água diretamente sem desligar.","Classe B; abrir o painel e tocar nos cabos.","Classe D; cobrir com pano molhado."],"a":0,"c":"A eletricidade cria risco de choque. Depois da desenergização, o incêndio passa a ser tratado conforme o material efetivamente queimando.","t":"Segurança e incêndio","id":"156f142b","v":"fogo"},{"q":"Por que um jato de água não deve ser dirigido a gasolina em chamas ou a instalação elétrica energizada?","o":["Porque a água aumenta sempre o teor de oxigênio.","Pode espalhar o combustível e, no caso elétrico, conduzir corrente e causar choque.","Porque a água transforma qualquer fogo em classe D.","Porque todo extintor de água explode ao ar livre."],"a":1,"c":"A escolha do agente e parte decisiva do combate. Além de extinguir, é preciso evitar propagação, choque e perda da rota de escape.","t":"Segurança e incêndio","id":"397613da","v":"fogo"},{"q":"Há suspeita de fogo no compartimento fechado do motor. Qual ação é mais segura?","o":["Abrir a tampa de uma vez para observar melhor.","Acelerar o motor para consumir o combustível.","Lançar gasolina sobre o foco para abafar.","Parar o motor, cortar combustível e eletricidade quando possível e aplicar o agente pela abertura própria, evitando abrir totalmente o compartimento."],"a":3,"c":"Abrir totalmente pode fornecer oxigênio e provocar uma labareda. O combate deve preservar a rota de fuga e considerar a necessidade de pedir socorro.","t":"Segurança e incêndio","id":"a9913891"},{"q":"Ao perceber forte cheiro de combustível antes da partida, qual deve ser a conduta?","o":["Dar partida imediatamente para testar o sistema.","Acender uma chama para localizar o vazamento.","Não acionar o motor nem equipamentos que produzam centelha; fechar a fonte, ventilar e localizar o vazamento com segurança.","Fechar toda ventilação e ligar o carregador de baterias."],"a":2,"c":"Vapores de combustível podem formar mistura explosiva, especialmente em compartimentos baixos e fechados. A causa precisa ser eliminada antes da partida.","t":"Segurança e incêndio","id":"1e55290d"},{"q":"Ao usar um extintor portátil, onde o agente deve ser dirigido?","o":["Somente na parte mais alta da fumaça.","Para o teto, de costas para a saída.","Contra pessoas proximas para resfria-las.","Na base das chamas, com movimentos de varredura e mantendo uma rota de escape."],"a":3,"c":"A descarga deve atingir a zona de combustão. A aproximação depende do agente, do vento, do alcance e da intensidade; se o fogo crescer, priorize evacuar e pedir socorro.","t":"Segurança e incêndio","id":"c03358e4","v":"fogo"},{"q":"Qual risco acompanha o uso de CO2 em compartimento pequeno e pouco ventilado?","o":["Formação inevitável de água fervente.","Aumento permanente da pressão atmosférica externa.","Conversão do incêndio em material radioativo.","Redução do oxigênio disponível para respiração, exigindo retirada e ventilação segura antes da reentrada."],"a":3,"c":"O CO2 abafa o fogo, mas também pode criar atmosfera asfixiante. Ninguém deve permanecer ou reentrar sem avaliar as condições.","t":"Segurança e incêndio","id":"189b22f3","v":"fogo"},{"q":"No início de um incêndio a bordo, qual medida ajuda a limitar sua alimentação?","o":["Abrir todos os tanques de combustível.","Aumentar a ventilação de qualquer compartimento em chamas.","Transferir materiais inflamáveis para junto do foco.","Interromper, se for seguro, o fornecimento de combustível e a energia do setor afetado."],"a":3,"c":"Isolar fontes de energia
