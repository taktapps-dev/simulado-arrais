ll craft. Safe speed includes the effects produced on others."},{"id":"5ad22a72","q":"On a twin-engine vessel, losing one engine requires:","o":["Reassessing manoeuvrability, scaling back the passage plan and using the remaining engine prudently.","Immediately running the remaining engine at full power in any situation.","Abandoning the vessel without assessing the risks.","Locking the rudder amidships and ignoring wind and current."],"c":"Asymmetric thrust changes how the vessel handles. Report the situation if necessary and choose a safe place for repairs or shelter."},{"id":"01c94c14","q":"If the propeller ventilates or cavitates during acceleration, what sign is common?","o":["The rpm rises without a proportional gain in thrust, and vibration may occur.","The anchor digs in more effectively.","The draft instantly increases by several metres.","The VHF radio changes channel."],"c":"Air or vapour on the blades reduces efficiency. Ease off the throttle and investigate trim, immersion, damage, weed or operating conditions."},{"id":"437a2c25","q":"In a confined space, which use of the throttle is safest?","o":["Keep full throttle and correct only with the rudder.","Shift between ahead and astern without pausing in neutral.","Apply short, moderate bursts, assessing each response before the next command.","Trust the fenders to correct any mistake."],"c":"Small applications of power limit headway and impact energy. Clear commands and a pause in neutral protect the transmission and people."},{"id":"683d2101","q":"According to RIPEAM (COLREGs), how must a lookout be kept on board?","o":["Only by radar at night.","At all times, properly, by sight and hearing, also using all available appropriate means.","Only when another vessel is in sight.","Exclusively by the operator, with no help from anyone."],"c":"Keeping a lookout is a continuous obligation used to assess the situation and the risk of collision. Distractions, noise and blind spots must be managed."},{"id":"f351b442","q":"Which factors must be considered when choosing a safe speed?","o":["Visibility, traffic, manoeuvrability, wind, sea, current, hazards and equipment limitations.","Only the maximum engine power.","Only the expected time of arrival.","Only the operator's experience."],"c":"A safe speed is one that allows effective action to avoid collision and stopping within a distance appropriate to the circumstances."},{"id":"57ea2558","q":"The relative bearing of another vessel remains practically constant while the distance decreases. This indicates:","o":["That the vessels will certainly pass well clear.","That the other vessel is at anchor.","That there is no need to monitor the situation.","Risk of collision, unless a sound assessment shows otherwise."],"c":"A steady bearing with decreasing range is a classic sign of risk. When in doubt, RIPEAM (COLREGs) says to assume that the risk exists."},{"id":"1d13f747","q":"What should a manoeuvre to avoid collision be like?","o":["Positive, made in ample time, large enough to be readily noticed and resulting in a safe passing distance.","A series of small, late, successive alterations.","Always to port, whatever the situation.","Limited to slightly reducing rpm without checking the result."],"c":"Clear alterations of course or speed make them easier for the other vessel to read. After manoeuvring, check the effect until the other vessel is finally past and clear."},{"id":"e70d313e","q":"Two power-driven vessels are meeting head-on with risk of collision. What should each one do?","o":["Turn to port.","Turn to starboard, so that each passes on the port side of the other.","Hold course and increase speed.","Stop and anchor in the same spot."],"c":"When on reciprocal or nearly reciprocal courses, both alter to starboard. The action must be clear and taken in good time."},{"id":"feb81fec","q":"In a crossing situation between two power-driven vessels, which one must keep out of the way?","o":["The one that sees the other on its port side.","The one that sees the other on its starboard side.","The faster vessel, in all cases.","The one closer to the left bank."],"c":"The vessel that has the other on its starboard side is the give-way vessel and, if possible, should avoid crossing ahead of the other."},{"id":"55990423","q":"In a crossing situation, the stand-on vessel should initially:","o":["Turn to port immediately.","Switch off all navigation lights.","Keep its course and speed, continuously watching how the risk develops.","Assume the other will always manoeuvre correctly."],"c":"The stand-on vessel must monitor the situation. It may act once it becomes apparent that the other is not taking action, and must act if collision cannot be avoided by the give-way vessel's action alone."},{"id":"c7d05827","q":"When is a vessel considered to be overtaking another?","o":["Whenever it approaches the other from ahead.","When it approaches from a direction more than 22.5 degrees abaft the beam of the vessel being overtaken.","Only when both have no way on.","When it sees both of the other's sidelights at the same time from astern."],"c":"At night, the overtaking vessel normally sees only the sternlight, without the sidelights. If in doubt, it must assume it is overtaking."},{"id":"6e96e20b","q":"Does the overtaking vessel's obligation end when it draws level with the vessel being overtaken?","o":["Yes; it ends when the bows are in line.","No; it continues until it is finally past and clear.","Yes; it ends when it sounds one short blast.","No; it only ends after anchoring."],"c":"A later change of bearing does not turn an overtaking situation into a crossing one. The overtaking vessel remains responsible until it has completed a safe pass."},{"id":"4603f735","q":"Two sailing vessels have the wind on different sides and there is a risk of collision. Which one must give way?","o":["The one with the wind on the starboard side.","The one with the wind on the port side.","The one to leeward, always.","The longer one, always."],"c":"When the wind is on different sides, the vessel on the port tack keeps out of the way of the one on the starboard tack."},{"id":"c56de601","q":"Two sailing vessels have the wind on the same side. Which one must keep out of the way?","o":["The one to leeward.","The one with the shallower draft.","The one to windward.","The one closer to port."],"c":"With the wind on the same side, the windward vessel must keep out of the way of the leeward one. The position is judged relative to the wind."},{"id":"d2eb8600","q":"In normal visibility, a power-driven vessel meets a sailing vessel under way. As a rule, which one must keep out of the way?","o":["The sailing vessel, in all circumstances.","The vessel to leeward.","The vessel with the higher recorded speed.","The power-driven vessel."],"c":"The general rule of responsibilities requires the power-driven vessel to keep out of the way of the sailing vessel, except in special situations such as overtaking and vessels restricted in their ability to manoeuvre."},{"id":"7add7bf4","q":"A sailing vessel meets a vessel engaged in fishing that is showing the corresponding signals. As a rule, the sailing vessel must:","o":["Keep out of the way of the vessel engaged in fishing.","Demand that the fishing vessel turn to starboard.","Hold course without assessing the risk.","Always pass ahead of it."],"c":"As a rule, a sailing vessel keeps out of the way of vessels not under command, restricted in their ability to manoeuvre and engaged in fishing."},{"id":"46aefb85","q":"A vessel engaged in fishing meets a vessel not under command. What is the correct conduct, when possible?","o":["Keep out of the way of the vessel not under command.","Hold course, because fishing always has absolute priority.","Close in to cross ahead of it.","Sound one short blast and carry on unchanged."],"c":"A vessel not under command has higher priority because an exceptional circumstance prevents it from manoeuvring as required."},{"id":"6dec17c5","q":"When navigating in a narrow channel, what general positioning is required?","o":["Navigate in the middle in all situations.","Keep close to the port-side limit.","Switch sides at every bend.","Keep as near to the outer limit of the channel on your starboard side as is safe and practicable."],"c":"The narrow-channel rule reduces traffic conflicts. Depth, current and local conditions must still be taken into account."},{"id":"5769c496","q":"In a narrow channel, a sailing vessel or a vessel of less than 20 m must:","o":["Demand right of way because it is smaller.","Anchor in the middle of the channel to wait.","Cross the fairway repeatedly to gain to windward.","Not impede the passage of a vessel that can safely navigate only within the channel."],"c":"Small vessels and sailing vessels must not impede ships confined to the channel. This does not remove the general obligation to avoid collision."},{"id":"06ed3afd","q":"Is it permitted to cross a narrow channel when doing so would impede a vessel that can navigate safely only within it?","o":["Yes, as long as the smaller vessel speeds up.","No; the crossing must not impede that vessel's passage.","Yes, when crossing from port to starboard.","Yes, if no sound signal is given."],"c":"The crossing must be planned so as not to hamper traffic that depends on the channel. When in doubt, wait for a safe opportunity."},{"id":"a6ec77db","q":"When using a traffic separation scheme, a vessel should normally:","o":["Navigate against the flow to shorten the distance.","Use the separation zone as a common lane.","Proceed in the appropriate lane, in the general direction of traffic flow for that lane.","Anchor at the lane entrance whenever it wishes."],"c":"Schemes organise opposing traffic flows. Joining and leaving should be done at as small an angle to the flow as practicable."},{"id":"d7220379","q":"When it is necessary to cross a traffic lane, what heading relative to the flow is recommended?","o":["Parallel to and opposite the flow.","Zigzagging within the separation zone.","At the smallest possible angle to the flow.","As nearly as practicable at right angles to the general direction of traffic."],"c":"Crossing at about 90 degrees reduces the time spent in the lane and makes the intention clearer to other mariners."},{"id":"c8dd497d","q":"In restricted visibility, a power-driven vessel must keep its engines:","o":["Shut down to reduce noise.","Ready for immediate manoeuvre and proceed at a safe speed for the conditions.","Always at full power.","Engaged astern for the whole passage."],"c":"Fog requires a heightened lookout, proper use of radar if available, sound signals and the ability to reduce or take off all way."},{"id":"e03ab7f9","q":"In fog, radar shows a vessel forward of the beam. If an alteration of course is necessary, you should generally:","o":["Always alter to port.","Cross ahead of the target at high speed.","Ignore the radar until lights are sighted.","Avoid altering to port, unless you are overtaking the other vessel."],"c":"Rule 19 advises avoiding an alteration to port for a target forward of the beam, except when overtaking, and avoiding an alteration toward a target abeam or abaft the beam."},{"id":"07716e8f","q":"In restricted visibility, on hearing another vessel's fog signal apparently forward of the beam, you should:","o":["Increase speed to get through the area.","Turn to port as a matter of course.","Switch off the sound-signalling equipment.","Reduce speed to the minimum needed to keep steerage way, take all way off if necessary and navigate with extreme caution."],"c":"Without visual contact, a close-quarters situation can develop quickly. RIPEAM (COLREGs) requires extreme caution until the danger is over."},{"id":"56e7054d","q":"The term vessel not under command identifies a vessel that:","o":["Has voluntarily stopped for recreation.","Is sailing only under sail in light wind.","Has a low-powered engine.","Through some exceptional circumstance is unable to manoeuvre as required and is therefore unable to keep out of the way."],"c":"Not under command does not simply mean stopped. It is an exceptional inability to comply with the steering and sailing rules."},{"id":"a1733fe0","q":"A vessel restricted in her ability to manoeuvre is one that:","o":["Has chosen to slow down to save fuel.","From the nature of her work is restricted in her ability to manoeuvre and cannot keep out of the way as required.","Carries passengers only.","Is less than 12 m in length."],"c":"Examples include certain dredging operations, cable laying and replenishment under way. The restriction arises from the work being carried out."},{"id":"ff160866","q":"What characterises a vessel constrained by her draft?","o":["A power-driven vessel severely restricted in her ability to deviate from her course because of her draft in relation to the available depth/width of water.","Any sailing vessel in shallow water.","Any vessel anchored near the beach.","A vessel without enough life jackets."],"c":"Other vessels, except those not under command and those restricted in their ability to manoeuvre, should avoid impeding her passage when circumstances allow."},{"id":"647d38f1","q":"What are the colours of a vessel's sidelights?","o":["Green to starboard and red to port.","Red to starboard and green to port.","White on both sides.","Yellow to starboard and blue to port."],"c":"Sidelights show which side of the vessel is being seen. Green corresponds to starboard; red to port."},{"id":"fdaede09","q":"What sector is covered by a masthead light?","o":["112.5 degrees on the starboard side only.","225 degrees, from right ahead to 22.5 degrees abaft the beam on each side.","135 degrees centred on the stern.","360 degrees all round the horizon."],"c":"The masthead light is white and shines over the forward sector. Its arc differs from the sectors of the sidelights and the sternlight."},{"id":"0772117c","q":"What is the sector of the sternlight?","o":["225 degrees, centred on the bow.","112.5 degrees on the starboard side only.","360 degrees all round the horizon.","135 degrees, centred on the stern, 67.5 degrees to each side."],"c":"The sternlight is white and covers the sector astern. It is the light normally seen by a vessel approaching in an overtaking situation."},{"id":"852c7917","q":"A power-driven vessel of less than 50 m, under way at night, normally shows:","o":["Only one all-round white light.","A masthead light, sidelights and a sternlight.","Two red lights in a vertical line.","A green light over a white light and no sidelights."],"c":"A second masthead light, abaft of and higher than the first, is mandatory from 50 m and optional below that length."},{"id":"e0f870ce","q":"A sailing vessel under way at night must show, as the basic set:","o":["A mandatory white masthead light and two yellow lights.","Two red lights in a vertical line.","Sidelights and a sternlight.","Only one all-round white light, whatever her length."],"c":"On a sailing vessel of less than 20 m, the sidelights and sternlight may be combined in one lantern at or near the top of the mast."},{"id":"8b7af86c","q":"What simplified alternative may be used by a power-driven vessel of less than 12 m?","o":["Only the green sidelight.","Two yellow lights in a vertical line.","An all-round red light with no sidelights.","An all-round white light and sidelights."],"c":"For small power-driven vessels, an all-round white light may replace the separate masthead light and sternlight, together with the sidelights."},{"id":"9be3cf1e","q":"A vessel of less than 50 m at anchor must show, at night and by day respectively:","o":["Sidelights and a black cone.","Two red lights and two cones.","An all-round white light where it can best be seen, and a black ball.","A green light over a white light, and a cylinder."],"c":"Larger vessels show separate anchor lights forward and aft. The day shape for a vessel at anchor is a ball."},{"id":"edfc33fc","q":"What additional signals identify a vessel aground?","o":["Three green lights and a cone.","A yellow light and a cylinder.","Two white lights and two diamonds.","Two all-round red lights in a vertical line and three black balls, in addition to the applicable anchor signals."],"c":"A vessel aground combines the anchor signals with the signals for the incapacity caused by grounding: red over red and three balls."},{"id":"a39803a4","q":"Which set identifies a vessel not under command?","o":["Two all-round red lights in a vertical line and, by day, two black balls.","Green over white and two cones.","White over red and one ball.","Red-white-red and a diamond."],"c":"When making way, a vessel not under command also shows sidelights and a sternlight. The pair of red lights indicates the special condition."},{"id":"6614f9d4","q":"Which set identifies a vessel restricted in her ability to manoeuvre?","o":["White-red-white and three cones.","Red-white-red in a vertical line and, by day, ball-diamond-ball.","Green-white-green and one ball.","Two yellow lights and a cylinder."],"c":"The red-white-red sequence corresponds to ball-diamond-ball. Other signals may be added depending on the work and on whether she is moving."},{"id":"3ea60e9b","q":"A vessel engaged in trawling shows which all-round lights in a vertical line?","o":["Green over white.","Red over white.","White over red.","Yellow over green."],"c":"The traditional mnemonic is 'green over white, trawling tonight'. When making way, she also shows sidelights and a sternlight."},{"id":"84baeb90","q":"A vessel engaged in fishing other than trawling shows:","o":["Green over white.","Two white lights in a vertical line.","Red over white, as all-round lights in a vertical line.","White over yellow."],"c":"If the fishing gear extends more than 150 m horizontally, she also shows an all-round white light or a cone apex upwards in the direction of the gear."},{"id":"64527826","q":"A pilot vessel on duty is recognised by the lights:","o":["White over red.","Red over white.","Green over white.","Two yellow lights in a vertical line."],"c":"A pilot vessel also shows sidelights and a sternlight when under way, or anchor signals when at anchor."},{"id":"3b4d539e","q":"When the length of the tow exceeds 200 m, how many masthead lights in a vertical line does the power-driven towing vessel show?","o":["One.","Two.","Four red ones.","Three."],"c":"Up to 200 m there are two masthead lights in a vertical line; over 200 m, three. A diamond shape by day also signals a long tow."},{"id":"76c0affe","q":"Which light is placed vertically above the sternlight on a towing vessel?","o":["A green sidelight.","A red masthead light.","A yellow towing light with the same sector as the sternlight.","An all-round blue light."],"c":"The towing light is yellow and has the same sector characteristics as the sternlight, placed above it."},{"id":"1d78bc56","q":"When vessels are in sight of one another, one short blast means:","o":["I am altering my course to port.","I am operating astern propulsion.","I am anchoring.","I am altering my course to starboard."],"c":"The signal must accompany the manoeuvre: one short blast for starboard, two for port and three for astern propulsion."},{"id":"1e5604d8","q":"When vessels are in sight of one another, two short blasts mean:","o":["I am altering my course to starboard.","I am altering my course to port.","I am not under command.","I intend to anchor."],"c":"Two short blasts announce an alteration to port. The signal does not replace the obligation to make a safe and readily noticeable manoeuvre."},{"id":"ca6c0a09","q":"When vessels are in sight of one another, three short blasts mean:","o":["I am operating astern propulsion.","I am altering my course to starboard.","I am altering my course to port.","I am requesting a pilot."],"c":"Three short blasts indicate that the engines are working astern; they do not necessarily mean the vessel already has sternway."},{"id":"d5bb28e6","q":"Five or more short and rapid blasts indicate:","o":["Agreement to being overtaken.","Arrival at an anchorage.","A routine VHF message.","Doubt about the other vessel's intentions or manoeuvre, or a belief that she is not taking action to avoid collision."],"c":"It is a warning signal. Risk, speed and the need to manoeuvre must be reassessed immediately."},{"id":"20db00e2","q":"In restricted visibility, what signal must a power-driven vessel making way sound at intervals of not more than two minutes?","o":["One prolonged blast.","Two short blasts.","Three short blasts.","One short blast followed by one long blast."],"c":"A power-driven vessel under way but stopped and making no way through the water sounds two prolonged blasts about two seconds apart."},{"id":"30162b5b","q":"In the conventional direction of buoyage, the usual direction of entry is:","o":["Always from the harbour to the sea.","Always from north to south.","Coming from seaward toward the harbour, or following the established upstream direction on inland waterways.","Determined by the colour of the vessel's hull."],"c":"The conventional direction is the reference for interpreting lateral marks. In special stretches, consult the chart and local publications."},{"id":"aba265f0","q":"Entering a buoyed channel in IALA Region B, what does the port-hand lateral mark look like?","o":["Red, conical and odd-numbered; it must be left to port.","Yellow, spherical and with no lateral meaning.","Black and red, with two balls.","Green, cylindrical in shape when applicable and even-numbered, if numbered; it must be left to port."],"c":"In Region B, port is green. The topmark is a cylinder and the numbering, when present, is even."},{"id":"4671c730","q":"Entering a buoyed channel in IALA Region B, what does the starboard-hand lateral mark look like?","o":["Green, cylindrical and even-numbered; it must be left to starboard.","White and red in vertical stripes.","Yellow with an X-shaped topmark.","Red, conical in shape when applicable and odd-numbered, if numbered; it must be left to starboard."],"c":"In Region B, starboard is red. The topmark is a cone, point upward, and the numbering is odd."},{"id":"2f0a0feb","q":"At a fork in the channel, a red mark with a broad green horizontal band indicates:","o":["Preferred channel to starboard.","Isolated danger.","Preferred channel to port.","Safe water all around."],"c":"The predominant red colour shows that the mark is left to starboard in the conventional direction; the green band shows that the preferred branch continues to port."},{"id":"1a060231","q":"A green mark with a broad red horizontal band indicates:","o":["Preferred channel to starboard.","Preferred channel to port.","Duplicated new danger.","Mandatory anchoring area."],"c":"The predominant green colour identifies the port side of the channel; the red band points to the preferred starboard branch."},{"id":"ca8e0f14","q":"What is the purpose of a cardinal mark?","o":["To indicate only the right bank of a channel.","To show the exact distance to the harbour.","To replace all of a vessel's navigation lights.","To indicate the quadrant - north, east, south or west - in which safe water lies relative to the mark."],"c":"The name of the cardinal mark corresponds to the quadrant recommended for passing. Colours, cones and light rhythm confirm the identification."},{"id":"fa4091ba","q":"What are the topmark cones of a north cardinal mark like?","o":["Two black cones with points facing down.","Two black cones with points facing up.","Two cones joined base to base.","Two black balls."],"c":"On the north cardinal, the black is at the top and both cones point upward, recalling the top of the compass rose."},{"id":"af441fc5","q":"What is the topmark of an east cardinal mark like?","o":["Two cones with points facing each other.","Two black cones with their bases facing each other.","Two cones pointing upward.","A red ball."],"c":"On the east cardinal, the cones point away from each other and visually form a wide outline, associated with the east side of the compass rose."},{"id":"a4816f87","q":"What are the topmark cones of a south cardinal mark like?","o":["Two black cones with points facing down.","Two cones with points facing up.","Two cones joined base to base.","A green cylinder."],"c":"On the south cardinal, the yellow is above the black and both cones point downward."},{"id":"438f1e44","q":"What is the topmark of a west cardinal mark like?","o":["Two cones with their bases facing each other.","Two cones pointing downward.","Two black cones with points facing each other.","Two red balls."],"c":"The joined points resemble a narrow waist, a useful mnemonic for west. The structure is yellow-black-yellow."},{"id":"e888ec15","q":"Which light rhythm identifies an east cardinal mark?","o":["A group of nine flashes.","A group of six plus one long flash.","A group of three quick or very quick white flashes.","Two white flashes in each period."],"c":"The groups 3, 6 and 9 correspond to the clock-face positions for east, south and west; north uses continuous quick flashes."},{"id":"0f8760b1","q":"Which light rhythm identifies a south cardinal mark?","o":["Three quick flashes.","Nine quick flashes.","A group of six quick or very quick white flashes, followed by one long flash.","One long yellow flash."],"c":"The long flash distinguishes the south cardinal and helps avoid confusion with other light groups."},{"id":"3bb51f9e","q":"Which light rhythm identifies a west cardinal mark?","o":["A group of nine quick or very quick white flashes.","A group of three flashes.","A group of six plus one long flash.","A fixed white light."],"c":"The number nine corresponds to west in the clock mnemonic: east 3, south 6 plus a long flash, and west 9."},{"id":"a2d07b5a","q":"Which light rhythm is used by a north cardinal mark?","o":["Quick or very quick white flashes, with no characteristic numbered grouping.","Exactly two white flashes.","A group of nine yellow flashes.","Morse A in a red light."],"c":"The north cardinal uses a continuous quick or very quick sequence. The day mark is black over yellow."},{"id":"76b1507a","q":"The isolated danger mark indicates:","o":["The mandatory centre of a channel.","A localised danger with navigable water all around it.","The starboard side of every harbour entrance.","A large area free of any danger."],"c":"It is placed on or near the danger. It is black with one or more red bands, has two black balls as a topmark and shows a white light in groups of two flashes."},{"id":"3ab1a286","q":"What appearance characterizes the safe water mark?","o":["Horizontal black and red bands with two spheres.","An all-yellow structure with an X topmark.","Vertical red and white stripes, with an optional red sphere topmark.","A green structure with a red band."],"c":"The mark indicates navigable water all around, mid-channel, landfall or a waiting point. Its light, when fitted, is white."},{"id":"e0011bc5","q":"What is the basic color of a special mark?","o":["Yellow, with a yellow light if lit.","Red, necessarily conical.","Green, necessarily cylindrical.","Black with red bands."],"c":"Special marks indicate areas or features described in nautical documents, such as dredging, recreation, cables and anchorage areas."},{"id":"2bbc556b","q":"How should a new danger that has not yet been sufficiently announced be marked?","o":["By a single unlit blue buoy.","By removing all nearby marks.","Only by verbal warning between mariners.","At least one of the marks used should be duplicated by an identical one."],"c":"Duplication draws attention to the new danger. Cardinal or lateral lights used should have a quick or very quick rhythm."},{"id":"2a4f8b76","q":"Which topmark may appear on a special mark?","o":["Two black spheres.","Two black cones pointing upward.","A yellow X.","A mandatory red sphere."],"c":"The X-shaped topmark is optional and helps identify the special purpose. The shape of the body must not conflict with other existing marks."},{"id":"0b57c10e","q":"Which of the following rhythms may identify a safe water light?","o":["White light in Morse A, as well as rhythms such as isophase, occulting or one long flash every ten seconds.","Group of two red flashes.","Mandatory fixed yellow light.","Group of nine green flashes."],"c":"The letter A in Morse is dot-dash. The white color and the vertical red and white stripes distinguish this mark."},{"id":"a24d03cf","q":"When selecting a life jacket for a person, which criterion is essential?","o":["Use an approved model, of the class appropriate to the navigation and compatible with the user's weight and size.","Choose only by the color of the fabric.","Use any sports vest without checking approval.","Always prefer the largest size, even if it is loose."],"c":"The life jacket must suit the user and stay properly fitted. Loose, unsuitable or unapproved equipment may fail precisely in an emergency."},{"id":"4a777640","q":"Where should life jackets be kept while underway?","o":["Inside a locked compartment to prevent misuse.","At the lowest point of the bilge.","In a marked, dry place with immediate access, not locked away or buried under luggage.","Packed together with the fuel to save space."],"c":"In an emergency, seconds matter. Everyone on board should know where the life jackets are and how to put them on, preferably before departure."},{"id":"b933d1af","q":"Before taking a pyrotechnic signal on board, what should be checked?","o":["Only the outer color of the packaging.","Whether it can be tested inside the cabin.","Whether it can be stored loose near a heat source.","Expiry date, condition, approval, instructions for use and a safe way of storing it."],"c":"Expired, damaged or poorly stored pyrotechnics are dangerous and may not work. They must be used according to the manufacturer's instructions and only in a real emergency."},{"id":"a607ca99","q":"What is an orange smoke signal mainly used for?","o":["Continuously lighting the inside of the cabin.","Indicating the position of a vessel or person in distress, especially during the day.","Putting out a fuel fire.","Replacing the starboard navigation light."],"c":"Orange smoke creates a daytime visual reference and can also help search teams see the wind direction."},{"id":"75193f44","q":"What is the main advantage of a parachute rocket with a red light?","o":["Accurately marking the depth under the keel.","Producing smoke only underwater.","Serving as a portable fire extinguisher.","Reaching a great height and remaining visible longer, making detection from a distance easier."],"c":"The parachute rocket is a distress signal with a longer visual range. It should be launched carefully, taking wind, people and obstacles into account."},{"id":"52e17956","q":"Which combination is recognized as a visual distress signal?","o":["A green flag above a yellow cone.","A square flag with a ball, or anything resembling a ball, above or below it.","Two blue flags side by side.","A black cylinder below a white triangular flag."],"c":"This is one of the international distress signals. Using one signal does not prevent the simultaneous use of other means, such as MAYDAY, EPIRB or pyrotechnics, when available."},{"id":"ad9069cd","q":"When should a vessel be abandoned in an emergency?","o":["At the first mechanical failure, even without danger.","Before transmitting any distress call.","Only when staying on board represents a greater risk, following the skipper's command and taking whatever survival equipment is possible.","Whenever the vessel loses steering for a few minutes."],"c":"The vessel usually offers more protection and is easier to locate than people in the water. Abandoning it is an extreme measure."},{"id":"f4a1c899","q":"A small vessel capsizes, stays afloat and there is no immediate danger of fire. Which course of action favors rescue?","o":["Swim alone to the shore, even without knowing the distance.","Dive repeatedly under the hull without need.","Take off the life jacket to swim faster.","Stay with the hull, hold on to it and avoid swimming aimlessly."],"c":"The hull is a larger target for searchers and can provide flotation. It should only be left when there is a real threat or a clearly safer alternative."},{"id":"9547cf2f","q":"In a life raft, what is the sea anchor (drogue) for?","o":["Reducing drift and helping keep the raft oriented in relation to the sea and wind.","Automatically measuring salinity.","Lifting the raft above the waves.","Replacing the repair kit."],"c":"The sea anchor creates drag in the water, limits drift and can improve the raft's behavior in rough seas."},{"id":"d1097b8c","q":"Why should seawater not be drunk in a survival situation?","o":["Because the excess salt worsens dehydration and can harm the body.","Because it causes instant hypothermia.","Because it always contains fuel.","Because it completely eliminates the feeling of thirst."],"c":"The kidneys must eliminate the ingested salt and may require more water than the drink provided. Drinking water should be rationed sensibly, without improperly stopping hydration."},{"id":"4e08b057","q":"People wearing life jackets are waiting for rescue in cold water. Which procedure reduces heat loss?","o":["Swim continuously at high intensity.","Take off the life jacket to bring the knees closer.","Split up the group to cover a larger area.","Keep the body as still as possible, protect the areas of greatest heat loss and huddle together when safe."],"c":"The heat-escape-lessening position and huddling reduce exposure. Unnecessary movements speed up the exchange of water next to the body."},{"id":"98d55dca","q":"Which elements make up the fire triangle?","o":["Fuel, oxidizer and heat.","Water, foam and carbon dioxide.","Smoke, ash and flame.","Pressure, humidity and electricity."],"c":"Extinction occurs by removing or reducing one of the essential elements: cooling, smothering or removing the fuel, depending on the type of fire."},{"id":"d373a263","q":"Which material is typical of a class A fire?","o":["Flammable liquids, such as gasoline.","Energized electrical equipment.","Ordinary solids that leave residue, such as wood, paper and fabric.","Cooking oil in industrial equipment, exclusively."],"c":"Class A fires involve ordinary solid materials. The extinguishing agent must be chosen without creating an electrical hazard or spreading other fuel present."},{"id":"e5838e14","q":"A gasoline spill catches fire. The occurrence is mainly classified as a fire of class:","o":["A, because it leaves wood embers.","C, only because it happened on a vessel.","B, because it involves a flammable liquid.","D, because it involves a combustible metal."],"c":"With flammable liquids, a solid jet of water can spread the fuel. Agents and techniques suited to class B are used."},{"id":"156f142b","q":"An energized electrical panel is on fire. Which classification and initial precaution are appropriate?","o":["Class C while energized; cut the power if it is safe and use a suitable non-conductive agent.","Class A; throw water directly without switching off.","Class B; open the panel and touch the cables.","Class D; cover it with a wet cloth."],"c":"Electricity creates a risk of shock. Once de-energized, the fire is treated according to the material actually burning."},{"id":"397613da","q":"Why should a jet of water not be directed at burning gasoline or at an energized electrical installation?","o":["Because water always increases the oxygen content.","It can spread the fuel and, in the electrical case, conduct current and cause a shock.","Because water turns any fire into class D.","Because every water extinguisher explodes in the open air."],"c":"Choosing the agent is a decisive part of firefighting. Besides extinguishing, you must avoid spreading the fire, electric shock and losing the escape route."},{"id":"a9913891","q":"A fire is suspected in the closed engine compartment. Which action is safest?","o":["Open the hatch all at once to see better.","Rev the engine to burn off the fuel.","Pour gasoline on the fire to smother it.","Stop the engine, cut off fuel and electricity when possible and apply the agent through the proper opening, avoiding fully opening the compartment."],"c":"Opening fully can supply oxygen and cause a flare-up. Firefighting must preserve the escape route and consider the need to call for help."},{"id":"1e55290d","q":"On noticing a strong smell of fuel before starting, what should be done?","o":["Start immediately to test the system.","Light a flame to locate the leak.","Do not start the engine or any equipment that produces sparks; shut off the source, ventilate and locate the leak safely.","Close all ventilation and switch on the battery charger."],"c":"Fuel vapors can form an explosive mixture, especially in low, closed compartments. The cause must be eliminated before starting."},{"id":"c03358e4","q":"When using a portable fire extinguisher, where should the agent be directed?","o":["Only at the highest part of the smoke.","At the ceiling, with your back to the exit.","At nearby people to cool them down.","At the base of the flames, with sweeping movements and keeping an escape route."],"c":"The discharge must reach the combustion zone. How close to get depends on the agent, wind, range and intensity; if the fire grows, prioritize evacuating and calling for help."},{"id":"189b22f3","q":"What risk comes with using CO2 in a small, poorly ventilated compartment?","o":["Inevitable formation of boiling water.","Permanent increase in external atmospheric pressure.","Conversion of the fire into radioactive material.","Reduction of the oxygen available for breathing, requiring evacuation and safe ventilation before re-entry."],"c":"CO2 smothers the fire, but it can also create an asphyxiating atmosphere. No one should stay or re-enter without assessing the conditions."},{"id":"b007c3ee","q":"At the start of a fire on board, which measure helps limit what feeds it?","o":["Open all fuel tanks.","Increase ventilation in any compartment on fire.","Move flammable materials next to the fire.","If it is safe, cut off the fuel supply and the power to the affected area."],"c":"Isolating energy and fuel sources can prevent the fire from growing. This should be done without passing through smoke or losing the escape route."},{"id":"dd66c3c0","q":"Water starts entering the hull through minor damage. What is an appropriate initial response?","o":["Switch off all communications and continue the trip.","Gather everyone on the lower side.","Put on life jackets, identify and reduce the inflow, start pumping out and head for a safe place while calling for help if necessary.","Open other compartments so the water spreads out."],"c":"Damage control combines people's safety, plugging the leak, pumping and prudent navigation. Stability and pump capacity must be monitored."},{"id":"75f12cf2","q":"The vessel runs aground unexpectedly. Before trying to refloat, the operator should:","o":["Check for injuries, leaks, position, bottom, tide and stability, avoiding any maneuver that worsens the damage.","Put it in reverse at full power without inspection.","Move everyone to the bow immediately.","Drill the hull to check the depth."],"c":"Pulling the vessel off without assessment can enlarge an opening that was resting against the bottom. The decision takes into account the tide, available help and environmental risk."},{"id":"50a650cd","q":"A person falls into the water. What is the most appropriate immediate response?","o":["Everyone should look inside the vessel.","Speed up in a straight line and only come back later.","Jump into the water without a life jacket and without designating another operator.","Shout the alarm, keep visual contact, throw flotation and begin a recovery maneuver safely."],"c":"Continuously pointing at the person avoids losing sight of them. The approach must control the propeller, wind, current and risk to the rescuers."},{"id":"a965b043","q":"What should a safety briefing before departure include?","o":["Only the estimated time of arrival.","Location and use of life jackets and fire extinguishers, emergency procedures, communications, the vessel's limits and basic crew duties.","Only the operator's phone password.","A promise that no equipment will be needed."],"c":"A short briefing reduces response time and allows someone else to help if the operator becomes incapacitated."},{"id":"e3be1f32","q":"What is the first step when finding a casualty on board?","o":["Check that the scene is safe and protect yourself, the casualty and others before giving care.","Move the casualty immediately, in any situation.","Offer water before assessing consciousness.","Take off the rescuer's life jacket to work more freely."],"c":"The rescuer must not become another casualty. After controlling hazards, check responsiveness and breathing and call for help."},{"id":"5d401810","q":"A person is unconscious, breathing normally and there is no suspicion of trauma. While waiting for help, you should:","o":["Leave them on their back and offer food.","Place them in the recovery position and continuously monitor their breathing.","Sit them up without support.","Start chest compressions despite normal breathing."],"c":"The recovery position helps keep the airway open and allows secretions to drain. If trauma is suspected, move the person only when necessary for safety or the airway."},{"id":"8ba9e054","q":"A casualty is unresponsive and not breathing normally. Which sequence is appropriate?","o":["Wait ten minutes before acting.","Give fluids and keep them seated.","First look for an ankle fracture.","Call for help, get an AED, start CPR and follow the instructions of the device and the emergency service."],"c":"Agonal breathing is not normal. Early recognition, high-quality CPR and the AED increase the chance of survival."},{"id":"c2fd0285","q":"In adult CPR, which combination matches the usual guidance for a trained rescuer?","o":["Ten compressions per minute and one breath per cycle.","Compressions on the abdomen only, without chest recoil.","Compressions at 100 to 120 per minute, about 5 to 6 cm deep, and cycles of 30 compressions to 2 breaths.","Cycles of 5 compressions to 30 breaths."],"c":"The hands go in the center of the chest, with full recoil between compressions and minimal interruptions. Anyone unable to give breaths should at least keep up compressions and follow the emergency dispatcher's guidance."},{"id":"ed40b265","q":"What is the initial measure to control major external bleeding?","o":["Repeatedly remove the first dressing to look at the wound.","Offer an alcoholic drink to reduce the pain.","Vigorously massage around the injury.","Apply firm direct pressure with a clean dressing or cloth and call for help."],"c":"If the dressing becomes soaked, keep up the pressure and add more material on top. Severe bleeding may require additional resources and techniques by a trained person."},{"id":"8ab458b4","q":"An object is embedded in a casualty's body. What should be done?","o":["Pull it out quickly and wash the inside of the wound.","Push it in until it is completely covered.","Break it off flush with the skin without stabilizing it.","Do not remove the object; stabilize it in place and seek urgent care."],"c":"Removal can increase bleeding and internal injury. The object should only be handled by a qualified team, except in extreme cases where it is needed to allow life-saving care."},{"id":"dd174a00","q":"When a fracture of a limb is suspected, you should:","o":["Force it into alignment until the pain goes away.","Keep the limb in the position found, immobilize it without restricting circulation and seek care.","Ask the person to walk to test it.","Massage the deformity directly."],"c":"Immobilize the joints above and below when possible and check color, temperature and sensation before and after. An open fracture requires protecting the wound."},{"id":"021a8a84","q":"After a fall with suspected spinal injury, which course of action is safest?","o":["Sit the casualty up to check their balance.","Avoid unnecessary movement, stabilize the head and neck and call for specialized help.","Drag them by the arms to another compartment without need.","Repeatedly turn the head to test mobility."],"c":"The casualty should only be moved without proper technique if there is a greater immediate danger, such as fire or sinking."},{"id":"1d06f695","q":"What initial care is indicated for a recent, small thermal burn?","o":["Apply ice directly to the skin.","Apply butter, toothpaste or fuel.","Burst all the blisters.","Cool with clean running water for about 20 minutes, remove jewelry that is not stuck and cover loosely."],"c":"Cool running water limits the injury; ice and home remedies can make the damage worse. Extensive, deep burns or burns to critical areas require urgent care."},{"id":"66a35c70","q":"A chemical gets into the eyes. What is the appropriate immediate response?","o":["Neutralize it with another chemical without knowing the substance.","Rub the eyes with a dry cloth.","Keep the eyes closed without rinsing.","Flush with plenty of clean water, holding the eyelids open, and seek medical advice."],"c":"Early flushing dilutes and removes the contaminant. Contact lenses should be removed if they come out easily, without delaying the rinsing."},{"id":"417df74c","q":"During a seizure, which procedure is correct?","o":["Forcefully hold down the arms and legs.","Move dangerous objects away, protect the head, time the seizure and do not restrain the movements or put anything in the mouth.","Put an object between the teeth.","Offer water while the person is convulsing."],"c":"After the seizure, check breathing and place in the recovery position if appropriate. A prolonged or repeated seizure, one with trauma, or a first-ever seizure requires urgent help."},{"id":"9a29e07e","q":"A conscious adult is choking and cannot speak, cough or breathe. For a trained rescuer, which course of action is indicated?","o":["Give five blows between the shoulder blades and five abdominal thrusts, alternating them and calling for help.","Give water and tell the person to lie down.","Blindly put your fingers into the mouth.","Wait for the obstruction to clear without intervening."],"c":"If the person loses consciousness, start the CPR sequence and look for the object only when it is visible. Pregnant women and very obese people require an adapted technique."},{"id":"c660d969","q":"A casualty has pale, cold skin, weakness and signs of shock. Until help arrives, you should:","o":["Make them walk to stimulate circulation.","Give them an alcoholic drink.","Stand them up with arms raised.","Lay them down, keep them warm, control visible causes and not offer food or drink."],"c":"Shock can accompany bleeding, trauma or other emergencies. The position should be adapted if there is breathing difficulty, trauma or risk of vomiting."},{"id":"db0062b4","q":"A person shows confusion, very hot skin and altered consciousness after heat exposure. This suggests severe heatstroke. What should be done?","o":["Cover them with several blankets and prevent ventilation.","Call emergency services and begin rapid cooling with the means available, monitoring breathing.","Offer alcohol and leave them alone.","Wait for the temperature to drop without acting."],"c":"Neurological changes with hyperthermia are an emergency. Remove excess clothing and cool without creating additional risk; do not give fluids to a person with altered consciousness."},{"id":"42097a62","q":"When rescuing a submerged person, which priority protects both the rescuer and the casualty?","o":["Enter the water without flotation, even without training.","Carry out the rescue without unnecessary exposure, check breathing and start CPR and use the AED when indicated.","Hold the casualty up by the arms and wait.","Try to remove water from the lungs before checking breathing."],"c":"Use reaching, a line, a buoy or a vessel whenever possible. Absence of breathing requires breaths and compressions according to training; CPR should not be delayed by trying to drain water."},{"id":"d4d37ba9","q":"What basic information does the needle of a magnetic compass provide?","o":["The exact depth below the keel.","The true wind speed.","The distance covered since departure.","The direction of magnetic north, used as a reference for determining courses."],"c":"The magnetic compass does not point directly to true north. Course, magnetic variation and compass deviation must be understood to use it correctly."},{"id":"cf396f55","q":"What is the difference between magnetic variation and compass deviation?","o":["Variation is the angle between true and magnetic north; deviation is the error caused by the vessel's own magnetism.","Variation is caused by the engine, and deviation only by the tide.","They are different names for the same speed.","Variation measures depth, and deviation measures wind."],"c":"Variation depends on place and time and is shown on charts. Deviation varies with the installation and the heading, and must be known through comparison or a deviation table."},{"id":"9a0d8697","q":"The GNSS receiver shows an accurate position on the screen. Which practice remains mandatory?","o":["Doing without visual lookout.","Navigating without regard to chart updates.","Keeping a lookout and cross-checking the position with the chart, depth and other available means.","Increasing speed in poor visibility."],"c":"GNSS can suffer from configuration errors, signal loss or power failure. It assists navigation but does not replace lookout, planning and assessment of the surroundings."},{"id":"a5c961a1","q":"As a rule, what data does the echo sounder or depth sounder provide?","o":["The height of the clouds above the vessel.","The true course without correction.","The vertical distance between the transducer and the bottom, according to the calibration adopted.","The current speed at any depth."],"c":"The reading may be referenced to the transducer, the waterline or the keel, depending on the offset. The operator needs to know this setting and keep a safety margin."},{"id":"4aa649e1","q":"What is the engine tachometer for?","o":["Indicating wind speed.","Indicating engine speed, usually in revolutions per minute.","Measuring depth.","Pointing to magnetic north."],"c":"Engine speed helps operate within the recommended range and can reveal abnormal load or a fault when compared with usual speed and conditions."},{"id":"443c31ba","q":"Which quantity is associated with the odometer or nautical log equipment?","o":["Atmospheric pressure and weather trend.","Height of the astronomical tide.","Distance covered and, depending on the equipment, the vessel's speed through the water.","Internal engine temperature."],"c":"The system can display accumulated distance and speed. Current and leeway explain differences between speed through the water and GNSS speed over ground."},{"id":"549f034f","q":"The anemometer is used to measure:","o":["The depth below the hull.","Wind speed.","The rotation of the propeller shaft.","The magnetic variation on the chart."],"c":"Wind direction and strength help assess maneuvering, waves and weather developments. The reading on board may be apparent wind, affected by the vessel's movement."},{"id":"cdb697b9","q":"A continuous, sharp drop in the pressure shown by the barometer may indicate:","o":["A guarantee of clear skies for several days.","An automatic lowering of the tide.","The approach of a low-pressure system and possible worsening weather.","A certain failure of the compass."],"c":"The barometric trend should be analyzed together with clouds, wind, the official forecast and local conditions. A single reading does not replace the overall picture."},{"id":"b5004097","q":"Which cloud is often associated with thunderstorms, squalls, heavy rain and lightning?","o":["Isolated, thin cirrus.","Cumulonimbus.","Low stratus without vertical development.","Lenticular cloud, necessarily without wind."],"c":"Cumulonimbus has great vertical development and can produce sudden changes. Seek shelter early; do not wait for the storm to reach the vessel."},{"id":"88a2d7a3","q":"Fog forms and quickly reduces visibility. The operator should:","o":["Increase speed to get out sooner.","Proceed at a safe speed, keep a sharper lookout, use appropriate signals and equipment and seek a safe place if necessary.","Turn off the lights and VHF.","Simply follow the wake of another vessel."],"c":"In restricted visibility, risk may exist before visual contact. RIPEAM (COLREGs) requires fog signals, engines ready for immediate maneuver and extreme caution."},{"id":"8262a21a","q":"What is the Beaufort scale for?","o":["Converting magnetic course to true.","Classifying life jackets.","Estimating wind force from its strength and its observable effects at sea and on land.","Calculating the age of the moon."],"c":"The Beaufort scale relates numbers to wind ranges and to the appearance of the surface. It is useful for observation but does not replace forecasts and instruments."},{"id":"73fb87d8","q":"What do high water and low water mean?","o":["High water is the maximum level of a tide; low water is the following or preceding minimum level.","High water is strong wind; low water is calm.","High water is a southward current; low water, northward.","They are two water temperature scales."],"c":"Predicted times and heights appear in the Tide Tables for reference locations. Weather conditions can alter the observed levels."},{"id":"445f80ea","q":"In general terms, what are the tidal currents that accompany the rise and the fall of the water level called?","o":["Drift and leeway.","Windward and leeward.","Flood and ebb, respectively.","High water and neap."],"c":"Flood and ebb describe the horizontal movement associated with the tidal cycle. The moment of slack water does not necessarily coincide with high or low water."},{"id":"05faeb8d","q":"What is the tidal range in a given cycle?","o":["The distance between two lateral buoys.","The maximum speed allowed in the channel.","The angle between true and magnetic north.","The difference in height between a high water and the associated low water."],"c":"The range varies with the lunar phase, local geometry and other factors. It should not be confused with the height of tide referenced to the chart datum."},{"id":"fcb63bf7","q":"In which phases of the Moon do spring tides, with larger ranges, generally occur?","o":["New moon and full moon.","First and last quarters.","Only at apogee, regardless of the phase.","In any phase, always with the same range."],"c":"At syzygy, the Sun, Earth and Moon are roughly aligned and the tide-generating effects reinforce each other. The local response may occur with a delay."},{"id":"7f1ec04c","q":"In which phases do neap tides, with smaller ranges, generally occur?","o":["New moon and full moon.","First and last quarters.","Only during eclipses.","Only in summer."],"c":"At quadrature, the directions of the solar and lunar effects are roughly perpendicular and the range tends to be smaller."},{"id":"de13f8df","q":"In many semidiurnal locations, the next day's high water occurs about 50 minutes later. How should this information be used?","o":["As an exact rule for any port in the world.","To skip checking the depth.","To calculate the wind automatically.","Only as a general notion; for navigation, consult the official Tide Table for the location and date."],"c":"The lunar cycle explains the average delay, but the actual regime may be semidiurnal, diurnal or mixed and be subject to local and weather effects."},{"id":"fcc2fba7","q":"The chart shows a depth of 1.8 m and the height of tide at the moment is 0.7 m. Ignoring other corrections, what is the estimated depth?","o":["1.1 m.","1.8 m.","2.5 m.","0.7 m."],"c":"The height of tide is added to the charted depth when both use the same reference level: 1.8 + 0.7 = 2.5 m. Draft and a safety margin must still be subtracted."},{"id":"8685b246","q":"Partially filled tanks can reduce stability through which effect?","o":["Magnetic variation effect.","Free surface effect, because the liquid shifts and virtually raises the center of gravity.","Sternlight effect.","Cavitation effect of a stationary rudder."],"c":"The transverse movement of the liquid reduces the righting ability. Whenever possible, avoid having many slack tanks and keep liquid loads under control."},{"id":"abd509b7","q":"Which load distribution tends to improve the stability of a small vessel?","o":["Weight high and concentrated on one side.","All passengers standing at the bow.","Weight low, centered and well secured, respecting the capacity and the manufacturer's limits.","Heavy objects loose on deck."],"c":"Raising or shifting the center of gravity sideways increases list and the risk of capsizing. Cargo and people must be distributed and secured."},{"id":"d58c9279","q":"What is the international calling and distress channel in maritime VHF radiotelephony?","o":["Channel 06, on the 121.5 MHz frequency.","Channel 70 for routine voice conversations.","Channel 16, on the 156.8 MHz frequency.","Channel 09 in any country and circumstance."],"c":"Channel 16 is used for distress, urgency, safety and initial calls. After routine contact, the conversation should move to an appropriate working channel."},{"id":"1bd3ca68","q":"Before transmitting on VHF, the operator should:","o":["Press the PTT for several minutes without speaking.","Make routine calls during a MAYDAY.","Use made-up coded language.","Listen to the channel, confirm there is no priority traffic and prepare a short, clear message."],"c":"Listening avoids interfering with existing traffic. Speak slowly, identify your station and clear the channel as soon as possible."},{"id":"7446d94c","q":"After establishing a routine call on channel 16, what is the normal practice?","o":["Keep the whole social conversation on channel 16.","Agree on and switch to a suitable working channel, freeing channel 16.","Switch to channel 70 and talk by voice.","Turn off the radio before the other station answers."],"c":"The calling and distress channel must remain available for priority traffic. The working channel must be permitted for the purpose and the area."},{"id":"98a2fd88","q":"When is the procedure word MAYDAY used?","o":["When there is grave and imminent danger to a vessel or person and immediate assistance is required.","To request routine weather information.","To report a small delay with no risk.","To test the microphone before leaving."],"c":"MAYDAY has the highest priority. A false call ties up search resources and can put other lives at risk."},{"id":"1f02c525","q":"When is the procedure word PAN PAN appropriate?","o":["For an urgent message about the safety of a person or vessel, without amounting to grave and imminent danger.","Only after an immediate abandonment.","To announce a wind forecast intended for everyone.","To reserve a channel for a private conversation."],"c":"PAN PAN has priority over ordinary messages but ranks below MAYDAY. If the situation develops into grave and imminent danger, the classification must be raised."},{"id":"249ecca9","q":"Which procedure word introduces an important navigational or meteorological safety message?","o":["MAYDAY RELAY in every situation.","SECURITE.","PAN PAN MÉDICO, necessarily.","OVER AND OUT as the initial call."],"c":"SECURITE announces a safety warning. In general, the call is made on the calling channel and the details follow on an indicated channel, according to the applicable procedure."},{"id":"d39bae1e","q":"Which details should appear in a distress message, as far as possible?","o":["Only the operator's first name.","Only the engine brand.","Price and purchase date of the vessel.","Identification, position, nature of the distress, assistance required, persons on board and other useful information."],"c":"A clear, repeated position with the correct reference is decisive. If time is short, transmit identification, position and nature of the distress first."},{"id":"4c32d8ef","q":"On hearing a MAYDAY not addressed to them, the operator should:","o":["Start a routine conversation on the same channel.","Delete the position received.","Keep silent, write down the information and stand by; respond or relay if the authority or the situation requires it and they can help.","Broadcast music to check range."],"c":"Distress traffic has absolute priority. A coast station or another vessel may coordinate communications and impose silence."},{"id":"7c78dc8d","q":"What is maritime VHF channel 70 reserved for?","o":["Voice conversations between passengers.","Continuous music broadcasting.","Digital Selective Calling - DSC, not routine voice communication.","Remote control of the outboard motor."],"c":"DSC equipment can send digital alerts, including identity and position when correctly integrated and configured."},{"id":"bab5397f","q":"The practical range of a handheld VHF radio is mainly influenced by:","o":["Line of sight, antenna height and quality, power, obstacles and battery condition.","Moon phase as the only factor.","The color of the vessel's hull.","The amount of drinking water on board."],"c":"VHF propagates mainly by line of sight. A higher, unobstructed antenna usually extends range; a handheld unit must be charged and protected from water."},{"id":"b68f8014","q":"What is the basic limit of the Arrais-Amador (recreational skipper) license?","o":["Operating any ship on the open sea without limit.","Operating sport and recreational vessels within inland navigation limits, except personal watercraft.","Operating only personal watercraft on the high seas.","Professionally commanding a merchant ship."],"c":"The license is for amateurs and does not authorize professional activity. Personal watercraft (jet skis) require the Motonauta (personal watercraft operator) category, under the rules in force."},{"id":"e216e684","q":"What does the Motonauta (personal watercraft operator) category authorize?","o":["Operating merchant ships in ocean navigation.","Piloting any professional passenger vessel.","Operating personal watercraft within inland navigation limits, for sport and recreation.","Exempting the personal watercraft from registration and equipment."],"c":"Motonauta is a license specific to personal watercraft and does not make the operator a professional mariner."},{"id":"a819c9a8","q":"While operating, how must the Carteira de Habilitação de Amador (amateur boating license) be available?","o":["Necessarily kept at home.","Valid and accessible for presentation to inspection, in the format accepted by the Autoridade Marítima (Maritime Authority).","Replaced only by a fuel receipt.","Waived when there are passengers."],"c":"The operator must hold a license compatible with the vessel and the navigation area. An expired document or an unsuitable category does not meet the requirement."},{"id":"70e3e5b3","q":"Under LESTA (Waterway Traffic Safety Law), which duty of the master relates to accidents and hazards to navigation?","o":["Hide any damage to avoid inspection.","Modify buoys on their own initiative.","Wait until the end of the year to report an urgent hazard.","Report to the Autoridade Marítima (Maritime Authority) accidents, incidents and deficiencies in aids to navigation or obstacles encountered."],"c":"Timely reporting allows action, investigation and warnings to other mariners. The master must also comply with, and enforce, safety rules."},{"id":"14010766","q":"Which option presents an administrative safety measure provided for in LESTA (Waterway Traffic Safety Law)?","o":["Seizure of the license certificate or preventing the vessel from leaving, as the case may be.","Automatic arrest imposed by the inspector without due process.","Loss of ownership of any personal property.","Mandatory monthly fee charged by the marina."],"c":"An administrative measure aims to protect people, the vessel, traffic and the environment in the face of risk or irregularity. It is not necessarily the same as the penalty at the end of the proceedings."},{"id":"e1738d11","q":"Which administrative penalties may result from an infringement of LESTA (Waterway Traffic Safety Law)?","o":["Fine, suspension, cancellation of the license and demolition of works or improvements, depending on the classification.","Only a verbal warning.","Only a charge for a new registration.","Exclusively detention imposed by the Capitania (Harbour Master's Office)."],"c":"The penalty depends on the infringement and the administrative proceedings, without prejudice to other civil or criminal liability where applicable."},{"id":"3569c018","q":"Operating a vessel without holding a compatible license constitutes:","o":["Permitted conduct if the trip lasts less than an hour.","An infringement provided for in RLESTA (LESTA Regulations), subject to the applicable measures and penalties.","A regular situation whenever there is a life jacket on board.","Only a contractual failure on the marina's part."],"c":"License, category and area must be compatible with the operation. Lending the vessel does not transfer this responsibility."},{"id":"aaae6a8b","q":"Navigating with mandatory safety equipment that is incomplete, inoperative or expired may result in:","o":["Automatic authorization to proceed to any destination.","An infringement and the vessel being prevented from leaving, or other measures, depending on the risk and the classification.","Replacement of the equipment by a mobile phone.","Exemption because it is a recreational vessel."],"c":"The mandatory list depends on the classification, area and characteristics of the vessel. Checking expiry dates and operation before leaving avoids risk and penalties."},{"id":"d77533a5","q":"Carrying more people than the authorized capacity is dangerous because:","o":["It always improves stability by increasing weight.","It is allowed as long as nobody is seated.","It exceeds the vessel's limit and can reduce freeboard, stability and the ability to respond.","It only changes fuel consumption, with no effect on safety."],"c":"The capacity takes into account the design and safety conditions. Overloading can worsen flooding, compromise load distribution and hinder abandonment."},{"id":"b8468bc3","q":"What consequence does RLESTA (LESTA Regulations) provide for operating a vessel while drunk or after using narcotic or toxic substances?","o":["Suspension of the license for up to 120 days, with cancellation in case of repeat offense, without prejudice to other liability.","Only an unrecorded verbal recommendation.","Automatic conversion of the license into a professional one.","No consequence for inland navigation."],"c":"Alcohol and drugs impair judgment, balance, reaction time and lookout. The prohibition protects all water users."},{"id":"0f3bec1d","q":"From what distance from the baseline may a personal watercraft start operating at high speed, unless a more restrictive local rule applies?","o":["From 20 meters.","From 50 meters.","Only after 2 nautical miles.","From 200 meters from the baseline."],"c":"The strip near beaches, shores and facilities concentrates swimmers and access maneuvers. Local rules, prohibited areas and buoyage must be respected."},{"id":"0f241b11","q":"How should a personal watercraft cross between the shore or beach and the area where it is allowed to operate?","o":["Along the most perpendicular path possible to the baseline and at a speed below 3 knots.","In a zigzag and at the highest possible speed.","Parallel to the beach, less than 50 meters from swimmers.","With repeated accelerations to make waves."],"c":"A slow, direct crossing reduces time in the sensitive strip and makes the movement predictable. Keep a lookout for swimmers and other vessels."},{"id":"a3198e39","q":"During what period is personal watercraft operation permitted?","o":["During daytime, between sunrise and sunset, subject to safety conditions.","At any time, as long as the headlight is on.","Only between midnight and dawn.","At night only with a handheld flashlight."],"c":"Personal watercraft must not operate at night. Visibility, weather and local restrictions can still make a daytime outing unsafe."},{"id":"355824f4","q":"Which life jacket classes are currently accepted for the operator and passenger of a personal watercraft?","o":["Class III or class V approved for this purpose.","Only ocean-use class I.","Any unapproved buoyancy aid.","A generic automatic inflatable life jacket, without checking the class."],"c":"Operator and passenger must wear the appropriate life jacket during operation. Fit, approval and condition must be checked."},{"id":"1e7046ea","q":"Where should the engine cut-off device (safety key/lanyard) be attached while operating?","o":["Loose inside the storage compartment.","To the operator, according to the system and the manufacturer's manual, so the engine stops in case of a fall.","Attached only to the passenger.","Tied to the handlebar without contact with the operator."],"c":"The safety lanyard must actually detach and trigger the cut-off if the operator falls. Test the system according to the manual before departure."},{"id":"a7da3cb1","q":"Which passenger position is prohibited on a moving personal watercraft?","o":["In front of the operator.","On the proper seat behind the operator.","In the position specified by the manufacturer.","Behind the operator, within the capacity."],"c":"The operator needs to control the handlebar, throttle and field of view. The passenger must stay on the authorized seat, behind the operator, with feet on the footrests."},{"id":"0f177580","q":"May a 6-year-old child be carried on a personal watercraft?","o":["Yes, if seated in front of the operator.","Yes, without a life jacket when the sea is calm.","Yes, provided the personal watercraft is of any size.","No; carrying a child under 7 years old is prohibited."],"c":"The age restriction applies regardless of the operator's experience. Capacity, life jacket and position rules still apply to everyone else."},{"id":"42a085a2","q":"A 9-year-old child exceeds the general minimum age limit for passengers. What precaution remains essential?","o":["Let the child operate the personal watercraft without a license.","Seat the child in front of the operator to make supervision easier.","Carry the child only if they can safely occupy the position behind the operator, wear a properly fitted life jacket and comply with capacity and local rules.","Skip the life jacket because the child is already over 7 years old."],"c":"The minimum age does not automatically make carrying the child safe. The operator must assess the child's size, foot support, life jacket fit and water conditions, and confirm any local rules and the guardian's permission."},{"id":"8feb679c","q":"Why can fully releasing the throttle during a turn make many personal watercraft harder to control?","o":["Because the handlebar mechanically locks during any deceleration.","Because the compass shuts off the engine.","Because the sea anchor is deployed automatically.","Because the propulsion jet also produces the steering force, which decreases when power is removed."],"c":"Steering ability depends on the design and the propulsion. Anticipate the maneuver, keep your distance and know the deceleration and control features of the model you are using."},{"id":"c4103e0b","q":"After capsizing, how should a personal watercraft be turned upright?","o":["Always clockwise, for any model.","In the direction indicated on the hull or in the manufacturer's manual.","By pulling on the key lanyard with the engine running.","By rolling it repeatedly in both directions."],"c":"Rolling it the wrong way can let water into the engine on some models. Before operating, the operator should know the specific procedure."},{"id":"ed94f601","q":"There is vegetation stuck in the intake grate of the personal watercraft. What should be done before removing it?","o":["Turn off the engine, remove the safety key and wait for it to stop completely, following the manual.","Keep the engine revving and put your hand in the intake.","Ask the passenger to reach the moving impeller.","Swap the battery cables with the engine running."],"c":"The jet pump can cause serious injury. Never bring hands, feet, hair or clothing near the intake or the nozzle with the engine running."},{"id":"4a5ea341","q":"What is the safest point to reboard a personal watercraft after a fall?","o":["Over the bow, using the handlebar as a step.","From the nozzle side with the engine revving.","From any point, keeping the impeller running.","The point designated by the manufacturer, usually over the stern, with the engine off."],"c":"Reboarding at the intended area reduces the risk of capsizing again and of contact with the propulsion. Climb on one person at a time and redistribute the weight."},{"id":"72eaff64","q":"What should a pre-departure inspection of a personal watercraft include?","o":["Only the outward appearance of the seat.","Only the fuel level, ignoring leaks.","Hull, drain plugs, fuel, leaks, battery, controls, safety key, life jackets, weather and navigation area.","Removing the safety lanyard so as not to lose it."],"c":"Use the manufacturer's checklist and manual. Plan range with a reserve, share your route and do not leave if there is a control failure, a leak or unsuitable weather."},{"id":"fa901622","q":"What is the current minimum training workload for Motonauta (personal watercraft operator) set out in the regulations?","o":["Only ten minutes of practice.","Eight hours exclusively in the classroom.","Sixty minutes of theoretical instruction and sixty minutes of practical instruction.","No training before the exam."],"c":"The certificate must result from training by an entity or professional qualified under NORMAM-212/DPC (Brazilian Maritime Authority standards). Meeting the minimum does not replace responsible practice."},{"id":"e299b354","q":"How is the Motonauta (personal watercraft operator) written exam structured according to the official syllabus?","o":["One hundred essay questions in eight hours.","Ten oral questions with no minimum score.","Twenty multiple-choice questions, a maximum duration of one hour and thirty minutes and a minimum score of 5 out of 10.","Forty questions in thirty minutes, with a minimum score of 9."],"c":"The syllabus is in Annex 3-C of NORMAM-212/DPC (Brazilian Maritime Authority standards). The Autoridade Marítima (Maritime Authority) may update procedures, so candidates should confirm the instructions of the Capitania (Harbour Master's Office) where they will take the exam."},{"id":"bb0a4f71","q":"In a \"head-on\" situation, that is, __________________, the vessels must maneuver as follows:","o":["bow to bow, both alter course, each to her own starboard","bow to bow, both alter course to opposite sides","crossing, both alter course to starboard","crossing, both alter course to opposite sides","overtaking, the overtaking vessel must maneuver"],"c":"Head-on situation: bow to bow, both alter course to starboard (to the right)."},{"id":"f7943ef3","q":"A vessel towing with a tow line less than 200 meters long must display:","o":["two red lights on the mast","one white light on the mast","three white lights on the mast","two white lights on the mast","four white lights on the mast"],"c":"Tow \u003c 200 m: 2 white lights in a vertical line on the mast."},{"id":"b2d556a3","q":"If during the day I sight a vessel with a black ball on the mast, she will be:","o":["not under command","stopped with engines ready (hove to)","at anchor","engaged in trawling","engaged in dredging"],"c":"One black ball (sphere) on the mast indicates a vessel at anchor."},{"id":"19f21993","q":"At night, a flashing green light was sighted and, according to the nautical chart, the vessel was approaching a harbour entrance. What would be the probable shape of this mark?","o":["Pyramidal.","Cubic.","Spherical.","Cylindrical.","Conical."],"c":"Brazil uses IALA Region B: when entering port, the green mark is to port and is cylindrical (can); the red mark is to starboard and is conical. Corrected: the original material stated \"conical\"."},{"id":"4a136f7e","q":"In river buoyage, the left bank is understood to be the bank:","o":["located on the right side of the current flow","located to starboard of the vessel","located to port of the vessel","located on the left side of someone going upriver","located on the left side of someone going downriver"],"c":"The left bank is on the left side of someone going downriver (towards the mouth)."},{"id":"74037c7d","q":"The safe water mark means:","o":["waters without circulation","policed waters","navigable waters","boundary waters","shallow waters"],"c":"Safe water marks indicate that there is navigable water all around the mark."},{"id":"4b5011b2","q":"The main mooring lines are:","o":["heaving lines, spring lines and breast lines","head/stern lines, spring lines and heaving lines","head/stern lines, spring lines and breast lines","bow and stern spring lines and heaving lines","bow and stern head/stern lines and breast lines"],"c":"Head/stern lines (longitudinal), spring lines (longitudinal/checking movement) and breast lines (transverse)."},{"id":"283355c2","q":"A single-propeller vessel, with counterclockwise rotation, rudder amidships, and moving ahead tends to turn to:","o":["port very quickly","starboard slowly","starboard quickly","port slowly","starboard very slowly"],"c":"A left-handed (counterclockwise) propeller going ahead tends to push the stern to starboard and the bow to port."},{"id":"f356018b","q":"When two vessels navigate in a narrow channel on opposite courses, approaching each other, the correct maneuver for both if there is risk of collision is:","o":["the vessel going up the channel must maneuver to port and the other must maneuver to starboard","the vessel going up the channel must maneuver to starboard and the other must maneuver to port","the vessel going down the channel must maneuver to starboard and the other must keep her course","both must keep further toward the bank on their own starboard side","both must keep starboard to starboard"],"c":"In narrow channels, the golden rule is to keep as close as possible to the starboard bank."},{"id":"66591a9c","q":"To weigh anchor and leave an anchorage we should:","o":["heave in the anchor, with engine slow ahead, if the anchor chain is \"leading aft\" of the vessel","heave in the anchor, with engine slow ahead, if the anchor chain is taut leading forward","heave in the anchor, with engine slow ahead, if the anchor chain is perpendicular to the vessel","heave in the anchor, with engine slow astern","heave in the anchor, watching the position of the anchor chain in relation to the bow"],"c":"Weighing anchor (raising the anchor) requires constant attention to the position of the anchor chain so as not to strain the windlass."},{"id":"fe80bf2f","q":"The extinguishing agent carbon dioxide (CO2) has as its main and secondary functions, respectively:","o":["smothering and isolating","smothering and cooling","cooling and smothering","isolating and cooling","cooling and isolating"],"c":"CO2 extinguishes mainly by smothering (removing O2) and secondarily by cooling."},{"id":"a21434df","q":"A consequence for a person of excessive heat in humid, poorly ventilated places is:","o":["sunstroke","hypothermia","hydration","Frostbite","Heatstroke"],"c":"Heatstroke (intermação) is caused by excessive heat in enclosed/humid places (unlike sunstroke, which comes from direct sun)."},{"id":"caff95af","q":"One of the listed symptoms that does NOT accompany cardiac arrest:","o":["dilated pupils","flushing of the face","rapid drop in body temperature","loss of consciousness","pallor"],"c":"In cardiac arrest, the face becomes pale or bluish (c
