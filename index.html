ed on class \"C\" fires are identified by a blue circle."},{"i":324,"x":"Fire extinguishers used on class \"D\" fires are identified by a yellow star."},{"i":325,"x":"The best extinguishing agent for class \"A\" and \"B\" fires, although available in limited quantity on board, is foam."},{"i":326,"x":"A disadvantage of the Dry Chemical Powder (PQS) fire extinguisher is that its residue can damage electronic equipment."},{"i":327,"x":"Ether and benzine are considered volatile fuels."},{"i":328,"x":"The oldest method of putting out fires, whose universal agent is water, is called cooling."},{"i":329,"x":"Fires on board are commonly caused by poorly specified electrical material, such as circuit breakers that cause large sparks."},{"i":330,"x":"Combustion can be classified according to its speed as complete, incomplete, spontaneous and explosion."},{"i":331,"x":"Steam can be used as an extinguishing agent, by smothering."},{"i":332,"x":"An example of a fuel without an oxidizer would be wood."},{"i":333,"x":"Fires of fuels that contain an oxidizer in their inner structure can only be extinguished by cooling."},{"i":334,"x":"The main and secondary functions of the foam extinguishing agent are smothering and cooling, respectively."},{"i":335,"x":"There are three methods of heat transfer, namely: radiation, conduction and convection."},{"i":336,"x":"Any material capable of combustion, such as wood, paper, cloth, oakum and paint, is called Fuel."},{"i":337,"x":"The main and secondary functions of the carbon dioxide (CO2) extinguishing agent are smothering and cooling, respectively."},{"i":338,"x":"Analysing solid fuels, we can say that the greater the fragmentation of the material, the greater the speed of combustion."},{"i":339,"x":"The appropriate places to store fuel on board vessels are the compartments below the waterline."},{"i":340,"x":"The fire extinguishing method by which oxygen is removed from the combustion is known as smothering."},{"i":341,"x":"Do not forget: the most efficient method of fighting fires is to prevent them from starting, that is, prevention, keeping them from happening."},{"i":342,"x":"Volatile fuels are said to be those that release gases at normal ambient temperatures."},{"i":343,"x":"One of the main precautions the amateur navigator must take with fire extinguishers on board is to keep them available and within their expiry date."},{"i":344,"x":"The foam fire extinguisher is the only extinguisher that we need to invert (turn upside down) for it to work properly."},{"i":345,"x":"The life jacket must be kept on board to be put on if the vessel has to be abandoned."},{"i":346,"x":"A life jacket should not be used as a toy, backrest or pillow."},{"i":347,"x":"Sport and recreational vessels classified for inland navigation must mandatorily carry 01 lifebuoy (with a buoyant line) and class III life jackets (one for each person on board)."},{"i":348,"x":"The life jacket must be worn fastened to the body, with the buoyant part to the front."},{"i":349,"x":"The number of life jackets on board must meet the maximum number of persons on board."},{"i":350,"x":"Life jackets must be kept in an easily accessible place in case of need, and never tied to the vessel."},{"i":351,"x":"Inflatable life jackets should be inflated once already in the water."},{"i":352,"x":"When abandoning the vessel because of an uncontrollable fire, if there is oil on the water surface, you should jump against the current."},{"i":353,"x":"To get away from the stricken vessel as quickly as possible, you should swim against the current and, if necessary, underwater, until clear of the oil hazard on the surface."},{"i":354,"x":"If there is no oil leak or fire risk near the vessel, you should move away from it by swimming with the current."},{"i":355,"x":"Abandoning ship by jumping over the side must always be done on the windward side, then swimming against the wind direction; that is, when we jump into the water in an abandon-ship operation (action), we must do so from windward."},{"i":356,"x":"Abandoning from windward is justified because that is where oil slicks will be smallest and the drift caused by the wind will make the vessel move away faster."},{"i":357,"x":"When abandoning the vessel, we must not jump on top of the life raft."},{"i":358,"x":"Some hazards to the vessel in inland waters are: floating logs, floating tree trunks, rocks and sandbanks."},{"i":359,"x":"For the safety of the vessel, several checks must be made before going out to navigate, such as navigation lights, life-saving equipment and firefighting equipment."},{"i":360,"x":"We must never exceed the permitted limit of persons on board."},{"i":361,"x":"The vessel's stability is impaired when there is excess weight in the upper parts of the vessel or poor weight distribution in relation to the sides of the vessel. We must never submerge the minimum flotation limit mark."},{"i":362,"x":"The lifebuoy must be secured in a place from which it can be easily removed."},{"i":363,"x":"The best way to jump into the water wearing a life jacket is with the legs straight and the feet together."},{"i":364,"x":"To improvise floating material in case of shipwreck, we should use tyres, large cans, barrels, logs or large pieces of wood."},{"i":365,"x":"A person should try to abandon the vessel wearing suitable clothing and with life-saving equipment."},{"i":366,"x":"If the number of survivors is greater than the life rafts available, a rotation should be planned among all those in good physical condition for staying inside the raft."},{"i":367,"x":"When there is a rotation in the life raft, and for the greater comfort of those in the raft, clothes should be exchanged so that those in the raft always keep dry clothes."},{"i":368,"x":"The line securing the life raft to the vessel should only be cut when everyone has already boarded the raft."},{"i":369,"x":"The canopy of the life raft is orange to make it easier to sight."},{"i":370,"x":"Modern rations are mostly in the form of sugar."},{"i":371,"x":"Among other factors, a survivor's survival depends on the time spent in the water as a function of the sea water temperature. As for the ambient temperature (air temperature), its effects on people are closely linked to wind speed."},{"i":372,"x":"When you want to turn back and navigate on the opposite course exactly over the wake (the track left by the propeller), the turning manoeuvre to use is the Boutakow Turn."},{"i":373,"x":"Likewise, when someone falls into the water, that is, in a \"man overboard\" situation, to return on exactly the opposite course over the wake left by the propeller, the Boutakow Turn should be used."},{"i":374,"x":"The life raft is kept in a closed canister and inflates with a special device, to be used by survivors."},{"i":375,"x":"Life rafts are contained in fibreglass canisters placed in their own cradles located on the open decks. To use one, the canister must be thrown into the sea and, after it falls into the water, the line must be hauled in until some resistance is felt, at which point a strong pull must be given, which will release the discharge of the CO2 cylinders that will inflate the raft in about 30 seconds."},{"i":376,"x":"Life rafts must be serviced every 12 months."},{"i":377,"x":"In a shipwreck, the adverse conditions and the limited resources of all kinds require special care with health. It is necessary to save energy, avoid exertion and not talk unnecessarily. It is advisable, however, to move regularly in order to maintain blood circulation."},{"i":378,"x":"The device used by a survivor to attract attention during the day is called a smoke signal (fumígeno)."},{"i":379,"x":"The device used by a survivor to attract attention at night is called a pyrotechnic rocket."},{"i":380,"x":"When boarding the life raft, we should avoid putting weight on one side only, so that it does not capsize."},{"i":381,"x":"Class III life jackets are required on sport and/or recreational vessels only for those operating within harbours (inland harbour waters)."},{"i":382,"x":"In shipwrecks, the amount of water stipulated by the Brazilian Navy is 700 ml per man per day (2 cans)."},{"i":383,"x":"A buoyant line with a hand loop must be tied to the lifebuoy to make it easier to rescue someone who has fallen into the water."},{"i":384,"x":"Class III life rafts are used on vessels operating in restricted waters."},{"i":385,"x":"In case of nausea, take seasickness medication right away and stay lying down. Vomiting represents a great loss of water for the body."},{"i":386,"x":"Lack of bowel movements is a common phenomenon among shipwreck survivors, given the scarcity of food."},{"i":387,"x":"Vessels used in inland navigation are exempt from carrying survival craft."}]</script>
<script type="application/json" id="banco-ja">[{"id":"838b61aa","q":"船舶のどの部分を船首（proa）と呼びますか？","o":["船体の後端。","前方を向いたときの左側。","船体の前端。","船倉の最も低い部分。"],"c":"船首は前方の端です。反対側の端は船尾で、左舷と右舷は船の両側を指します。"},{"id":"b2028c0a","q":"船尾（popa）は船舶のどの部分にあたりますか？","o":["船体の前端。","船体の最も幅の広い部分。","水線下部と水線上部を分ける線。","船体の後端。"],"c":"船尾は船舶の後方の部分です。操船時には、船尾が回頭方向と反対側へ振れるため、その横移動に注意することが重要です。"},{"id":"5f4e7f75","q":"船尾から船首を見たとき、右舷（boreste）はどちら側ですか？","o":["船舶の右側。","船舶の左側。","真後ろの方向。","真正面の方向。"],"c":"右舷は前方を向いたときの常に右側です。船上の人の位置によって変わることはありません。"},{"id":"568f807f","q":"船尾から船首を見たとき、左舷（bombordo）はどちら側ですか？","o":["船舶の右側。","船舶の左側。","キール（竜骨）の下の区域。","甲板の上の区域。"],"c":"左舷は前方を向いたときの左側です。対応する舷灯は赤です。"},{"id":"e12db04f","q":"船舶用語で、船幅（boca）とは何を表しますか？","o":["水線とキールの間の垂直距離。","船首から船尾までの長さ。","船体の最大幅。","メインマストの高さ。"],"c":"船幅は船体の幅で、通常は最も広い断面で測ります。喫水や全長と混同しないようにしましょう。"},{"id":"c15340e2","q":"船舶の喫水（calado）は何を示しますか？","o":["水線から露天甲板までの高さ。","船体の最大幅。","水線から船体または対象となる付属物の最も低い部分までの垂直距離。","1時間に進む水平距離。"],"c":"喫水は船舶がどれだけ水中に沈んでいるかを示し、利用できる水深やキール下の余裕と比較する必要があります。"},{"id":"7bb19646","q":"乾舷（borda-livre）とは何ですか？","o":["常に水中にある船体部分。","船首から重心までの距離。","水線から乾舷甲板までの垂直距離。","舵とプロペラの間の隙間。"],"c":"乾舷は水面上に残る船体の高さです。過積載や浸水はこの安全上の余裕を減らします。"},{"id":"3e9a057b","q":"キール（竜骨、quilha）の基本的な構造上の役割は何ですか？","o":["船体下部の主要な縦通部材となること。","防舷材の支えとしてのみ機能すること。","回頭時に舵の代わりをすること。","最大喫水線を示すこと。"],"c":"キールは船体の縦方向の背骨のように働き、構造強度に寄与します。多くの船体では針路安定性にも影響します。"},{"id":"81c1531b","q":"ビルジ（porão de esgoto / sentina）とは、どの区域を指しますか？","o":["水やその他の液体がたまる可能性のある船内の低い部分。","開放型の操縦区画。","主甲板より上の空間。","錨泊のための船外の場所。"],"c":"ビルジは点検し、清潔に保つ必要があります。ここに予期しない水がある場合は、漏水や水密性の不良が考えられます。"},{"id":"6a267472","q":"トランサム（espelho de popa）とは何ですか？","o":["船首をふさぐパネル。","多くの船体で船尾をふさぐ横方向の面。","燃料タンクを仕切る板。","航跡によって生じる光の反射。"],"c":"トランサムはモーターボートによく見られ、設計に応じて船外機、金具その他の部品を取り付けることがあります。"},{"id":"93280027","q":"水線（linha d'água）の定義はどれですか？","o":["2地点間の計画航路。","対象となる状態における水面と船体の交線。","甲板の中心線。","帆船だけにある標示。"],"c":"水線の位置は積載量、トリム、水の密度によって変わります。観察した状態で、船体の水面上の部分と水面下の部分を分けます。"},{"id":"5e56a6af","q":"風下（sotavento）にある船舶や物体はどこにありますか？","o":["風が吹いてくる側。","風に関係なく、真正面。","常に右舷側。","風が吹いていく側。"],"c":"風上（barlavento）は風が吹いてくる側、風下は風が吹いていく側です。この基準は接近や救助の際に役立ちます。"},{"id":"390a761b","q":"荷重がかかっても締まらない固定の輪を作る結び方はどれですか？","o":["もやい結び（Lais de guia／ボーライン）。","本結び（Nó direito／リーフノット）。","巻き結び（Volta do fiel／クラブヒッチ）。","一重つなぎ（Nó de escota／シートベンド）。"],"c":"もやい結びは固定された安全な輪を作り、操船・ロープワークで広く使われます。どの結び方も正しく作り、確認する必要があります。"},{"id":"56aceec9","q":"ロープの端に作る8の字結びの主な目的は何ですか？","o":["2本のワイヤーロープを恒久的につなぐこと。","曳航用の調整可能な輪を作ること。","スプライス（編み継ぎ）の代わりにすること。","ロープの端がアイ、滑車、通し穴から抜けるのを防ぐこと。"],"c":"8の字結びはストッパーノットです。端にこぶを作り、ロープが通し穴から完全に抜けてしまう危険を減らします。"},{"id":"1172f424","q":"巻き結び（volta do fiel）は通常、何に使われますか？","o":["大きな荷重下で太さの大きく異なるロープをつなぐこと。","固定された救助用の輪を作ること。","ロープを杭、手すりなどにすばやく結び付けること。","錨鎖を巻き上げずに短くすること。"],"c":"単純な巻き結びは一時的な係留に便利ですが、荷重が変動する場合や緩む危険がある場合は、追加の留めが必要になることがあります。"},{"id":"e99e7a35","q":"特に太さの異なる2本のロープをつなぐのに適した結び方はどれですか？","o":["8の字結び。","一重つなぎ（Nó de escota／シートベンド）。","もやい結び。","ラウンドターン・ツーハーフヒッチ（Volta redonda com dois cotes）。"],"c":"一重つなぎは、太さの異なるロープも含め、ロープ同士をつなぐのに昔から使われています。細いロープが太いロープの輪の中で正しく働くようにします。"},{"id":"2d96f3d8","q":"本結び（nó direito）が最も適しているのはどれですか？","o":["人を吊り上げたり、救助用の輪を作ったりすること。","重要な荷重のかからない軽い用途で、同じ太さのロープを一時的につなぐこと。","荒天時に錨を固定すること。","交互に荷重がかかる状態で、太さの大きく異なるロープをつなぐこと。"],"c":"本結びは誤って使うと滑ったり、形が崩れたり、締まりすぎたりします。重要な荷重や救助には選ぶべきではありません。"},{"id":"5705c5b0","q":"クリートにロープを掛けるとき、係留を確実で整った状態に保つ方法はどれですか？","o":["8の字状に交差させて巻き、正しいヒッチで仕上げ、不要に多くのロープを使わない。","ロープを平行な円状に巻くだけにする。","クリートの上に適当な結び目をいくつも作る。","ロープの端を濡れた甲板の上に放置する。"],"c":"クリートへの掛け方は、力を分散させ、制御しながら解けるようにします。結び目が多すぎると緊急離岸が難しくなることがあります。"},{"id":"4bbec0ec","q":"繊維ロープの端に施すホイッピング（falcaça）は何のためですか？","o":["ロープの有効長を伸ばすため。","ストランドがほどけるのを防ぐため。","ロープを鎖に変えるため。","水深を自動的に測るため。"],"c":"ホイッピングはロープの端を整えて保護し、ほつれを減らします。適切な糸や素材に合った方法で施します。"},{"id":"62a26393","q":"錨泊において、スコープ比（relação de filame）とは何を表しますか？","o":["繰り出した錨鎖の長さと、考慮すべき総水深との比。","船幅と船の長さの比。","錨の数を乗組員数で割ったもの。","2つの側面標識のブイ間の距離。"],"c":"適切なスコープにより、錨にかかる引張力がより水平に働きます。水深、係留点の高さ、風、潮流、振れ回りの範囲を考慮する必要があります。"},{"id":"c0d9ca3e","q":"一般に、安全な範囲内でスコープを増やすとどのような効果がありますか？","o":["錨が海底から離れる。","引張角度が小さくなり、錨の把駐力が向上する。","振れ回り円がなくなる。","底質の確認が不要になる。"],"c":"錨鎖を多く出すと一般に効きがよくなりますが、振れ回り半径も大きくなります。錨泊では他の船舶、危険物、水深に配慮しなければなりません。"},{"id":"880480d3","q":"錨泊地を選ぶとき、最も重要な要素の組み合わせはどれですか？","o":["海岸までの目視距離だけ。","エンジン出力だけ。","到着時の水の色だけ。","水深、底質、遮蔽、潮汐、風、潮流、振れ回りの余地。"],"c":"良い錨泊は環境と装備の能力によって決まります。潮汐の変化と船の振れ回りを予測する必要があります。"},{"id":"85538463","q":"着岸時のスプリングライン（espringue）の主な役割は何ですか？","o":["船舶を岸壁から離しておくことだけ。","すべての防舷材の代わりになること。","岸壁に沿った船舶の前後方向の動きを制限すること。","潮位を測ること。"],"c":"スプリングラインは前後方向に働き、船舶が岸壁で前進・後退するのを防ぎます。船首・船尾ライン（lançantes）や横もやい（traveses）は別の役割を持ちます。"},{"id":"01bef512","q":"岸壁係留での横もやい（traveses）は主に何のために働きますか？","o":["前方への動きだけを防ぐ。","錨を海底に食い込ませておく。","船舶と岸壁の間の横方向の離れを制御する。","舵を右舷に切る。"],"c":"横もやいはほぼ横方向に張る係留索です。潮汐や現地の動きを考慮し、ほかの係留索と合わせて調整します。"},{"id":"d1a70c4c","q":"着岸時の防舷材（defensas）の目的は何ですか？","o":["接触の衝撃を吸収し、船体と岸壁を保護すること。","船舶を海底に恒久的に固定すること。","救命胴衣の代わりになること。","運転不自由船であることを示すこと。"],"c":"防舷材は接近前に、想定される接触点に合った高さと位置に配置します。操船の制御や係留索の代わりにはなりません。"},{"id":"1ca2aa35","q":"通常の舵は、舵の周りに水の流れがほとんどないとき、なぜ効きが悪くなるのですか？","o":["コンパスが北を示さなくなるから。","錨が船体に作用し始めるから。","回頭を生む流体力が小さくなるから。","エンジンの回転数が自動的に上がるから。"],"c":"舵には水の流れが必要です。プロペラ流、行き足、潮流によって舵の効きが変わるため、操船は早めに行う必要があります。"},{"id":"e9a5aca8","q":"前進の行き足があるとき、舵を右舷に切ると、基本的にどのような反応が予想されますか？","o":["船首は左舷へ回頭し、船尾は動かない。","船舶全体が回頭せずに右舷方向へ横移動する。","船舶はすぐに停止する。","船首は右舷へ回頭し、船尾は左舷側へ振れる傾向がある。"],"c":"舵は水流をそらして回頭モーメントを生みます。狭い場所では、船尾の振れを考慮することが不可欠です。"},{"id":"58e86d0f","q":"右回りプロペラの1軸船で後進をかけると、どのような傾向がよく見られますか？","o":["船尾は例外なく常に右舷側へ動く。","船首と船尾は一直線のまま、横方向の傾向はない。","錨を入れているときだけ回頭する。","船尾は左舷側へ動く傾向があるが、風、潮流、船体によって効果が変わることがある。"],"c":"右回りプロペラの横圧力は、後進時に一般に船尾を左舷側へ押します。船によって異なるため、実際に確認しておく必要があります。"},{"id":"8887cadd","q":"2軸の船舶で、ほぼその場で回転する方法は次のどれですか？","o":["両方のエンジンを同じ回転数で前進にする。","一方のエンジンを前進、もう一方を後進にし、出力を抑えて制御する。","両方のエンジンを止めて舵を固定する。","船尾から錨を入れて全開にする。"],"c":"エンジンを逆方向に使うと、推力が回転モーメントを生みます。この操船には低出力、見張り、船体が振れる余地が必要です。"},{"id":"1aa7d05c","q":"可能な限り、着岸のための最終接近はどのように計画すべきですか？","o":["風と潮流に乗って高速で。","防舷材なしで岸壁に直角に。","卓越する風または潮流に向かって、強いほうの外力を利用して速力を制御しながら。","遠くからエンジンを止めて。"],"c":"支配的な外力に向かって接近すると制御しやすくなり、行き足を小さくできます。計画では余地、水深、退避経路を考慮します。"},{"id":"22377a30","q":"離岸時に風が船舶を岸壁に押し付けている場合、どのような方法が役立ちますか？","o":["係留索の1本をスプリングラインとして使い、防舷材を当て、エンジンと舵を制御しながら使って一端を岸壁から離す。","係留索を解く前に防舷材をすべて外す。","係留索をすべて付けたまま前進全開にする。","岸壁の上に錨を落とす。"],"c":"スプリングラインは回転の支点として使えます。乗組員間で手順を打ち合わせ、意思疎通を図り、防舷材で保護しながら行います。"},{"id":"a95d5a3f","q":"係留ブイを取るとき、最も制御しやすい接近方法はどれですか？","o":["支配的な外力に乗って高速で接近する。","卓越する風または潮流に向かってゆっくり接近し、行き足をわずかにして到着する。","プロペラを入れたまま、ブイを船尾側に通す。","船を止めるためにブイに軽くぶつける。"],"c":"ブイは見える位置に保ち、プロペラから離しておきます。船舶が制御された状態になってから、準備した乗組員がロープを取ります。"},{"id":"7d7242d9","q":"人が水中に落ちるのを見たとき、最初に取るべき一連の対応はどれですか？","o":["書類を探しにキャビンに入る。","加速してその場から離れる。","「落水者（マンオーバーボード）」と知らせ、浮力のある物を投げ、目を離さずに監視し、引き返す操船を始める。","ほかの人に知らせずに錨を入れる。"],"c":"大声で知らせることで乗組員が動き、投げた浮具が落水者を支えて位置の目印になります。操縦者が操船する間、1人が落水者を指さし続けます。"},{"id":"0275c672","q":"水中の人への最終接近で、最も安全な手順はどれですか？","o":["早く寄せるためにプロペラを入れたままにする。","ゆっくり近づき、人を視界に入れたまま、引き上げる前に推進装置を中立にするか停止する。","高回転で後進しながら接近する。","エンジンの排気口まで泳いでくるよう求める。"],"c":"プロペラやジェット噴流は重大な危険です。風と潮流を考慮して接近し、落水者のそばで危険な推力が出ない状態で終えます。"},{"id":"50b675da","q":"後進での操船に、なぜ特に注意が必要なのですか？","o":["船舶が風の影響を受けなくなるから。","舷灯の色が入れ替わるから。","コンパスが南を示すようになるから。","舵の効きが弱くなったり変わったりし、視界も悪くなり、船尾が進行方向の先端になるから。"],"c":"後進は操船の手段であり、速く航行するための状態ではありません。行き足を小さくし、見張りを置き、後方を頻繁に確認しましょう。"},{"id":"8827faad","q":"前方に荷物が集中して船首が大きく沈んでいます。最も適切な修正はどれですか？","o":["定員と設計上の制限を守りながら、安全に荷物を配置し直す。","問題を隠すために速力を上げる。","救命胴衣をすべて船首に移す。","甲板上で水タンクを空にする。"],"c":"不適切な配置はトリム、復原性、波への対応能力を変えます。荷物は固縛し、許可された範囲内に保つ必要があります。"},{"id":"a21afda7","q":"他の船舶や岸の近くを滑走状態で航行するとき、欠かせない注意はどれですか？","o":["通過時間を短くするため最大速力を保つ。","低速船の船首前方を横切る。","早めに減速し、引き波を抑え、安全な距離を保つ。","反射を避けるために灯火を消す。"],"c":"引き波は損傷や転倒を招き、小型船に危険を及ぼします。安全な速力には、他者に与える影響も含まれます。"},{"id":"5ad22a72","q":"2基エンジンの船舶で1基が故障した場合、何が必要ですか？","o":["操縦性を再評価し、航行計画を縮小し、残ったエンジンを慎重に使う。","どんな状況でも、残ったエンジンをすぐに限界まで上げる。","危険を評価せずに船舶を放棄する。","舵を中央で固定し、風と潮流を無視する。"],"c":"推力が左右非対称になると操船が変わります。必要に応じて状況を通報し、修理や避難のための安全な場所を選びましょう。"},{"id":"01c94c14","q":"加速中にプロペラがベンチレーションやキャビテーションを起こした場合、よく見られる兆候はどれですか？","o":["回転数は上がるが推力がそれに見合って増えず、振動が出ることがある。","錨の把駐効率が上がる。","喫水が瞬時に数メートル増える。","VHF無線のチャンネルが変わる。"],"c":"翼に空気や蒸気が入ると効率が下がります。スロットルを緩め、トリム、没水深度、損傷、藻、運転条件を調べる必要があります。"},{"id":"437a2c25","q":"狭い場所で、最も安全なスロットルの使い方はどれですか？","o":["最大出力を保ち、舵だけで修正する。","中立を経ずに前進と後進を切り替える。","短く控えめに出力をかけ、反応を確かめてから次の操作をする。","どんな失敗も防舷材が補ってくれると考える。"],"c":"小刻みに出力をかけることで、行き足と衝突エネルギーを抑えられます。明確な指示と中立での一時停止が、変速機と人を守ります。"},{"id":"683d2101","q":"国際海上衝突予防規則（RIPEAM/COLREG）によると、船上の見張りはどのように行うべきですか？","o":["夜間にレーダーだけで行う。","視覚・聴覚により、利用できる適切なすべての手段も用いて、常時適切に行う。","他の船舶が見えるときだけ行う。","誰の助けも借りず、操縦者だけで行う。"],"c":"見張りは継続的な義務であり、状況と衝突の危険を判断するために行います。注意散漫、騒音、死角を管理する必要があります。"},{"id":"f351b442","q":"安全な速力を選ぶとき、考慮すべき要素はどれですか？","o":["視界、交通量、操縦性能、風、海況、潮流、危険物、装備の制約。","エンジンの最大出力だけ。","到着予定時刻だけ。","操縦者の経験だけ。"],"c":"安全な速力とは、衝突を避けるために有効な動作がとれ、状況に応じた適切な距離で停止できる速力です。"},{"id":"57ea2558","q":"他の船舶の相対方位がほとんど変わらず、距離が縮まっています。これは何を示しますか？","o":["両船は確実に離れて通過する。","相手船は錨泊している。","状況を監視する必要はない。","安全であると確実に判断できない限り、衝突の危険がある。"],"c":"距離が縮まりながら方位が変わらないのは、衝突の危険を示す典型的な兆候です。疑わしい場合、RIPEAMは危険があるものとみなすよう求めています。"},{"id":"1d13f747","q":"衝突を避けるための動作はどのようにすべきですか？","o":["積極的に、十分に余裕のある時期に、相手が気付く大きさで行い、安全な距離で通過できるようにする。","小さな変更を何度も遅れて行う。","状況にかかわらず、常に左舷へ変える。","結果を確認せず、回転数を少し下げるだけにする。"],"c":"針路や速力をはっきり変えると、相手船が読み取りやすくなります。動作後は、完全に通過して安全になるまで効果を確認します。"},{"id":"e70d313e","q":"2隻の動力船が行会いの状態で接近し、衝突の危険があります。それぞれ何をすべきですか？","o":["左舷へ変針する。","互いに左舷対左舷で通過するよう、右舷へ変針する。","針路を保ち、増速する。","停止して同じ場所に錨泊する。"],"c":"真向かいまたはほぼ真向かいに行き会う状況では、両船とも右舷へ変針します。動作ははっきりと、時機を失せずに行います。"},{"id":"feb81fec","q":"2隻の動力船が横切りの関係にあるとき、どちらが相手の進路を避けるべきですか？","o":["相手船を左舷側に見る船。","相手船を右舷側に見る船。","どんな場合でも速いほうの船。","左岸に近いほうの船。"],"c":"相手船を右舷側に見る船が避航船で、やむを得ない場合を除き、相手船の船首方向を横切ってはなりません。"},{"id":"55990423","q":"横切りの状況で、保持船はまず何をすべきですか？","o":["すぐに左舷へ変針する。","すべての航海灯を消す。","針路と速力を保ち、危険の推移を継続して監視する。","相手船が常に正しく避航すると考える。"],"c":"保持船は状況を見守らなければなりません。相手船が避航していないことが明らかになれば動作をとることができ、避航船の動作だけでは衝突を避けられない場合は動作をとらなければなりません。"},{"id":"c7d05827","q":"船舶が他の船舶の追い越し船とみなされるのはどのような場合ですか？","o":["相手船の船首側から接近するときは常に。","追い越される船の正横後22.5度を超える後方から接近するとき。","両船とも行き足がないときだけ。","相手船の両舷灯を船尾側から同時に見るとき。"],"c":"夜間、追い越し船には通常、相手船の船尾灯だけが見え、舷灯は見えません。疑わしい場合は、自船を追い越し船とみなさなければなりません。"},{"id":"6e96e20b","q":"追い越し船の義務は、追い越される船の横に並んだ時点で終わりますか？","o":["はい。両船の船首がそろった時点で終わる。","いいえ。完全に追い越して安全になるまで続く。","はい。短音1回を鳴らした時点で終わる。","いいえ。錨泊して初めて終わる。"],"c":"その後に方位が変わっても、追い越しの状況が横切りの状況に変わるわけではありません。追い越し船は、安全に追い越しを終えるまで責任を負います。"},{"id":"4603f735","q":"2隻の帆船が異なる舷に風を受けており、衝突の危険があります。どちらが避航すべきですか？","o":["右舷に風を受けている帆船。","左舷に風を受けている帆船。","常に風下側の帆船。","常に長さの長いほうの帆船。"],"c":"異なる舷に風を受けている場合、左舷に風を受けている帆船（左舷開き）が、右舷に風を受けている帆船の進路を避けます。"},{"id":"c56de601","q":"2隻の帆船が同じ舷に風を受けています。どちらが相手の進路を避けるべきですか？","o":["風下側の帆船。","喫水の浅いほうの帆船。","風上側の帆船。","港に近いほうの帆船。"],"c":"同じ舷に風を受けている場合、風上側の帆船が風下側の帆船を避けます。位置は風を基準に判断します。"},{"id":"d2eb8600","q":"通常の視界で、動力船が航行中の帆船と出会いました。原則として、どちらが相手の進路を避けるべきですか？","o":["どんな状況でも帆船。","風下側にいる船舶。","記録上の速力が大きい船舶。","動力船。"],"c":"一般的な責任規定では、動力船が帆船の進路を避けます。ただし、追い越しや操縦性能制限船などの特別な状況は除きます。"},{"id":"7add7bf4","q":"帆船が、所定の信号を表示している漁ろう中の船舶と出会いました。原則として、帆船はどうすべきですか？","o":["漁ろう中の船舶の進路を避ける。","漁船に右舷へ変針するよう求める。","危険を確認せずに針路を保つ。","常に相手の船首側を追い越す。"],"c":"原則として、帆船は運転不自由船、操縦性能制限船、漁ろう中の船舶の進路を避けます。"},{"id":"46aefb85","q":"漁ろう中の船舶が運転不自由船と出会いました。可能な場合、正しい行動はどれですか？","o":["運転不自由船の進路を避ける。","漁ろうは常に絶対的な優先権を持つので、針路を保つ。","船首前方を横切るために接近する。","短音1回を鳴らし、変更せずに進む。"],"c":"運転不自由船は、例外的な事情により規則どおりに操船できないため、より上位の優先順位にあります。"},{"id":"6dec17c5","q":"狭い水道を航行するとき、一般にどのような位置取りが求められますか？","o":["どんな状況でも中央を航行する。","左舷側の端に寄る。","カーブごとに岸を変える。","安全かつ実行可能な限り、水道の右舷側の外側の端に寄って航行する。"],"c":"狭い水道の規則は交通の衝突を減らします。水深、潮流、現地の状況も引き続き考慮します。"},{"id":"5769c496","q":"狭い水道で、帆船または長さ20 m未満の船舶はどうすべきですか？","o":["小さいことを理由に通航を要求する。","水道の中央線上に錨泊して待つ。","風上に上るために水道を何度も横切る。","水道内でしか安全に航行できない船舶の通航を妨げない。"],"c":"小型船や帆船は、水道に制約される船舶を妨げてはなりません。ただし、衝突を避ける一般的な義務がなくなるわけではありません。"},{"id":"06ed3afd","q":"狭い水道を横切ることが、その水道内でしか安全に航行できない船舶を妨げる場合、横切ってもよいですか？","o":["はい。小さいほうの船舶が加速すれば。","いいえ。横切ることでその船舶の通航を妨げてはならない。","はい。左舷側から右舷側へ横切る場合は。","はい。音響信号がなければ。"],"c":"横切りは、水道に依存する交通を妨げないよう計画します。疑わしい場合は、安全な機会を待ちましょう。"},{"id":"a6ec77db","q":"分離通航方式を利用するとき、船舶は通常どうすべきですか？","o":["距離を短くするために流れに逆らって航行する。","分離帯を共用の通航路として使う。","適切な通航路を、定められた交通の流れの一般的な方向に進む。","いつでも通航路の入口に錨泊する。"],"c":"分離通航方式は、反対方向の流れを整理するものです。通航路への出入りは、流れに対してできる限り小さな角度で行います。"},{"id":"d7220379","q":"通航路を横断する必要がある場合、流れに対してどのような針路が推奨されますか？","o":["流れと平行で、逆方向。","分離帯の中をジグザグに。","流れに対してできる限り小さな角度で。","交通の一般的な方向に対してできる限り直角に近い角度で。"],"c":"ほぼ90度で横断すると、通航路内にいる時間が短くなり、他の船舶にも意図が分かりやすくなります。"},{"id":"c8dd497d","q":"視界制限状態では、動力船の機関はどのようにしておくべきですか？","o":["騒音を減らすために停止しておく。","直ちに操船できるよう準備し、状況に適した安全な速力で航行する。","常に最大出力にしておく。","横断中ずっと後進に入れておく。"],"c":"霧の中では、見張りの強化、レーダーがあれば適切な使用、音響信号、行き足を落とすか止められる能力が求められます。"},{"id":"e03ab7f9","q":"霧の中で、レーダーが正横より前方に船舶を探知しました。変針が必要な場合、一般にどうすべきですか？","o":["常に左舷へ変針する。","高速で目標の船首前方を横切る。","灯火が見えるまでレーダーを無視する。","相手船を追い越す場合を除き、左舷への変針を避ける。"],"c":"第19条は、正横より前方の目標に対しては、追い越す場合を除いて左舷への変針を避け、正横または正横より後方の目標に向かって変針することを避けるよう定めています。"},{"id":"07716e8f","q":"視界制限状態で、他の船舶の霧中信号が正横より前方から聞こえたと思われる場合、どうすべきですか？","o":["その区域を抜けるために増速する。","必ず左舷へ変針する。","音響装置を切る。","針路を保てる最小限の速力に落とし、必要なら行き足を完全に止め、極めて慎重に航行する。"],"c":"目視できない状態では、接近しすぎると状況が急速に悪化することがあります。RIPEAMは、危険がなくなるまで極めて慎重に行動するよう求めています。"},{"id":"56e7054d","q":"運転不自由船（embarcação sem governo）とは、どのような船舶ですか？","o":["レクリエーションのために自ら停止している船舶。","弱い風の中、帆だけで航行している船舶。","低出力のエンジンを持つ船舶。","例外的な事情により規則どおりに操船できず、そのため他の船舶の進路を避けることができない船舶。"],"c":"運転不自由とは、単に停止していることではありません。操船規則に従うことが例外的にできない状態を指します。"},{"id":"a1733fe0","q":"操縦性能制限船とはどのような船舶ですか？","o":["経済性のために減速を選んだ船舶。","作業の性質上、操縦性能が制限され、規則どおりに他の船舶の進路を避けることができない船舶。","旅客だけを運ぶ船舶。","長さ12 m未満の船舶。"],"c":"例として、しゅんせつ作業、ケーブル敷設、航行中の補給などがあります。制限は行っている作業から生じます。"},{"id":"ff160866","q":"喫水制限船の特徴はどれですか？","o":["喫水と利用できる水深・幅との関係から、針路を変える能力が著しく制限されている動力船。","浅い水域にいるすべての帆船。","海岸近くに錨泊しているすべての船舶。","救命胴衣が足りない船舶。"],"c":"運転不自由船と操縦性能制限船を除くその他の船舶は、状況が許す限り、喫水制限船の通航を妨げないようにします。"},{"id":"647d38f1","q":"船舶の舷灯の色はどれですか？","o":["右舷が緑、左舷が赤。","右舷が赤、左舷が緑。","両舷とも白。","右舷が黄、左舷が青。"],"c":"舷灯によって、見えているのがどちらの舷かが分かります。緑が右舷、赤が左舷です。"},{"id":"fdaede09","q":"マスト灯が照らす範囲はどれですか？","o":["右舷側だけの112.5度。","225度で、船首方向から各舷の正横後22.5度まで。","船尾を中心とした135度。","水平線全周の360度。"],"c":"マスト灯は白色で、前方の範囲を照らします。その照射範囲は舷灯や船尾灯の範囲とは異なります。"},{"id":"0772117c","q":"船尾灯（luz de alcançado）の照射範囲はどれですか？","o":["船首を中心とした225度。","右舷側だけの112.5度。","水平線全周の360度。","船尾を中心とした135度で、各舷に67.5度ずつ。"],"c":"船尾灯は白色で、後方の範囲を照らします。追い越しの状況で接近する船舶から通常見える灯火です。"},{"id":"852c7917","q":"長さ50 m未満の動力船が夜間に航行中の場合、通常何を表示しますか？","o":["白色の全周灯1個だけ。","マスト灯1個、舷灯、船尾灯。","垂直線上に赤色灯2個。","白色灯の上に緑色灯、舷灯なし。"],"c":"後方のより高い位置の2個目のマスト灯は、長さ50 m以上では義務で、それ未満では任意です。"},{"id":"e0f870ce","q":"夜間に航行中の帆船は、基本的な組み合わせとして何を表示しなければなりませんか？","o":["必須の白色マスト灯1個と黄色灯2個。","垂直線上に赤色灯2個。","舷灯と船尾灯。","長さにかかわらず白色の全周灯1個だけ。"],"c":"長さ20 m未満の帆船では、舷灯と船尾灯をマストの頂部またはその付近に1個の灯器にまとめて表示できます。"},{"id":"8b7af86c","q":"長さ12 m未満の動力船が使える簡略化した表示はどれですか？","o":["緑色の舷灯だけ。","垂直の黄色灯2個。","舷灯なしの赤色全周灯1個。","白色の全周灯1個と舷灯。"],"c":"小型の動力船では、白色の全周灯1個がマスト灯と船尾灯を別々に表示する代わりになり、これに舷灯を加えます。"},{"id":"9be3cf1e","q":"錨泊中の長さ50 m未満の船舶は、夜間と昼間にそれぞれ何を表示しなければなりませんか？","o":["舷灯と黒色円すい形象物1個。","赤色灯2個と円すい形象物2個。","最もよく見える場所に白色の全周灯1個、および黒色の球形形象物1個。","白色灯の上に緑色灯、および円筒形象物1個。"],"c":"大型の船舶は、前部と後部に別々の停泊灯を表示します。昼間の錨泊の形象物は球形形象物です。"},{"id":"edfc33fc","q":"乗り揚げている船舶を示す追加の信号はどれですか？","o":["緑色灯3個と円すい形象物1個。","黄色灯1個と円筒形象物1個。","白色灯2個とひし形形象物2個。","垂直線上に赤色の全周灯2個と黒色の球形形象物3個（該当する錨泊の信号に加えて）。"],"c":"乗り揚げは、錨泊の信号に、乗り揚げによる操船不能を示す信号（赤の上に赤、球形形象物3個）を組み合わせます。"},{"id":"a39803a4","q":"運転不自由船を示す組み合わせはどれですか？","o":["垂直線上に赤色の全周灯2個、昼間は黒色の球形形象物2個。","白色灯の上に緑色灯、円すい形象物2個。","赤色灯の上に白色灯、球形形象物1個。","赤・白・赤の灯火とひし形形象物1個。"],"c":"行き足がある場合、運転不自由船は舷灯と船尾灯も表示します。赤2個の組み合わせが特別な状態を示します。"},{"id":"6614f9d4","q":"操縦性能制限船を示す組み合わせはどれですか？","o":["白・赤・白の灯火と円すい形象物3個。","垂直線上に赤・白・赤の灯火、昼間は球形・ひし形・球形の形象物。","緑・白・緑の灯火と球形形象物1個。","黄色灯2個と円筒形象物1個。"],"c":"赤・白・赤の灯火は、球形・ひし形・球形の形象物に対応します。作業や航行状態に応じて、ほかの信号が追加されることがあります。"},{"id":"3ea60e9b","q":"トロールにより漁ろうしている船舶は、どの垂直の全周灯を表示しますか？","o":["白色灯の上に緑色灯。","白色灯の上に赤色灯。","赤色灯の上に白色灯。","緑色灯の上に黄色灯。"],"c":"伝統的な覚え方は「白の上に緑、トロール作業中」です。行き足がある場合は、舷灯と船尾灯も表示します。"},{"id":"84baeb90","q":"トロール以外の漁ろうに従事している船舶は何を表示しますか？","o":["白色灯の上に緑色灯。","垂直の白色灯2個。","垂直線上の全周灯で、白色灯の上に赤色灯。","黄色灯の上に白色灯。"],"c":"漁具が水平に150 mを超えて延びている場合は、さらに漁具の方向に白色の全周灯1個、または頂点を上にした円すい形象物1個を表示します。"},{"id":"64527826","q":"業務中の水先船は、どの灯火で識別されますか？","o":["赤色灯の上に白色灯。","白色灯の上に赤色灯。","白色灯の上に緑色灯。","垂直の黄色灯2個。"],"c":"水先船は、航行中は舷灯と船尾灯も表示し、錨泊中は錨泊の信号も表示します。"},{"id":"3b4d539e","q":"引き船列の長さが200 mを超える場合、動力船である引き船は垂直のマスト灯を何個表示しますか？","o":["1個。","2個。","赤色灯4個。","3個。"],"c":"200 mまでは垂直のマスト灯2個、200 mを超えると3個です。昼間はひし形形象物1個でも長い引き船列を示します。"},{"id":"76c0affe","q":"引き船で、船尾灯の垂直上方に置かれる灯火はどれですか？","o":["緑色の舷灯。","赤色のマスト灯。","船尾灯と同じ照射範囲を持つ黄色の引き船灯。","青色の全周灯。"],"c":"引き船灯は黄色で、船尾灯と同じ照射範囲の特性を持ち、その上方に置かれます。"},{"id":"1d78bc56","q":"互いに視野の内にある状況で、短音1回は何を意味しますか？","o":["針路を左舷に変えている。","後進推進を行っている。","錨泊しようとしている。","針路を右舷に変えている。"],"c":"信号は操船と合わせて行います。短音1回は右舷、2回は左舷、3回は後進推進です。"},{"id":"1e5604d8","q":"互いに視野の内にある状況で、短音2回は何を意味しますか？","o":["針路を右舷に変えている。","針路を左舷に変えている。","運転不自由である。","錨泊するつもりである。"],"c":"短音2回は左舷への変針を伝えます。信号は、安全で分かりやすい操船を行う義務の代わりにはなりません。"},{"id":"ca6c0a09","q":"互いに視野の内にある状況で、短音3回は何を意味しますか？","o":["後進推進を行っている。","針路を右舷に変えている。","針路を左舷に変えている。","水先人を要請している。"],"c":"短音3回は機関を後進にかけていることを示します。船舶がすでに後方への行き足を持っているとは限りません。"},{"id":"d5bb28e6","q":"短く急速な汽笛5回以上は何を示しますか？","o":["追い越しへの同意。","錨泊地への到着。","VHFでの定例連絡。","相手船の意図や動作に疑問がある、または相手船が衝突を避けるための動作をとっていないと思われること。"],"c":"これは警告信号です。直ちに危険、速力、操船の必要性を評価し直さなければなりません。"},{"id":"20db00e2","q":"視界制限状態で、行き足のある動力船が2分を超えない間隔で鳴らすべき信号はどれですか？","o":["長音1回。","短音2回。","短音3回。","短音1回に続けて長音1回。"],"c":"機関を使用しているが停止して行き足のない動力船は、約2秒の間隔で長音2回を鳴らします。"},{"id":"30162b5b","q":"航路標識（balizamento）の慣行的方向で、通常の進入方向はどれですか？","o":["常に港から海へ。","常に北から南へ。","海から港へ向かう方向、または内水路では上流へ向かう定められた方向。","船体の色によって決まる。"],"c":"慣行的方向は側面標識を読み取る基準です。特別な区間では、海図や現地の刊行物を確認する必要があります。"},{"id":"aba265f0","q":"IALA B地域で航路標識のある水道に進入するとき、左舷の側面標識はどのようなものですか？","o":["赤、円すい形、奇数番号。左舷側に見て通過する。","黄、球形、側面の意味はない。","黒と赤で、球形2個。","緑、該当する場合は円筒形、番号があれば偶数。左舷側に見て通過する。"],"c":"IALA B地域では左舷標識は緑です。頭標は円筒形で、番号がある場合は偶数です。"},{"id":"4671c730","q":"IALA B地域で航路標識のある水道に進入するとき、右舷の側面標識はどのようなものですか？","o":["緑、円筒形、偶数番号。右舷側に見て通過する。","白と赤の縦じま。","黄で、X字形の頭標。","赤、該当する場合は円すい形、番号があれば奇数。右舷側に見て通過する。"],"c":"IALA B地域では右舷標識は赤です。頭標は頂点を上にした円すい形で、番号は奇数です。"},{"id":"2f0a0feb","q":"分岐点で、太い緑の横帯が1本入った赤い標識は何を示しますか？","o":["優先航路は右舷側。","孤立障害標識。","優先航路は左舷側。","周囲全体が安全水域。"],"c":"主となる赤色は、慣行的方向でこの標識を右舷側に見て通過することを示し、緑の帯は優先航路が左舷側に続くことを示します。"},{"id":"1a060231","q":"太い赤の横帯が1本入った緑の標識は何を示しますか？","o":["優先航路は右舷側。","優先航路は左舷側。","新たな危険の重複表示。","錨泊義務区域。"],"c":"主となる緑色は水道の左舷側を示し、赤の帯は右舷側の航路が優先であることを示します。"},{"id":"ca8e0f14","q":"方位標識（sinal cardinal）の目的は何ですか？","o":["水道の右岸だけを示すこと。","港までの正確な距離を示すこと。","船舶のすべての航海灯の代わりになること。","標識に対して安全な水域がある象限（北・東・南・西）を示すこと。"],"c":"方位標識の名称は、通過が推奨される象限に対応します。色、円すい形の頭標、灯火のリズムで識別を確認します。"},{"id":"fa4091ba","q":"北方位標識の頭標の円すい形はどのようなものですか？","o":["頂点を下に向けた黒い円すい形2個。","頂点を上に向けた黒い円すい形2個。","底面を合わせた円すい形2個。","黒い球形2個。"],"c":"北方位標識では黒が上部にあり、2個の円すい形は上を向いています。羅針図の上（北）を連想させます。"},{"id":"af441fc5","q":"東方位標識の頭標はどのようなものですか？","o":["頂点を向かい合わせた円すい形2個。","底面を向かい合わせた黒い円すい形2個。","上を向いた円すい形2個。","赤い球形1個。"],"c":"東方位標識では、2個の円すい形が頂点を外側に向けて離れ、幅の広い輪郭に見えます。これを羅針図の東側と結び付けて覚えます。"},{"id":"a4816f87","q":"南方位標識の頭標の円すい形はどのようなものですか？","o":["頂点を下に向けた黒い円すい形2個。","頂点を上に向けた円すい形2個。","底面を合わせた円すい形2個。","緑の円筒形1個。"],"c":"南方位標識では黄が黒の上にあり、2個の円すい形は下を向いています。"},{"id":"438f1e44","q":"西方位標識の頭標はどのようなものですか？","o":["底面を向かい合わせた円すい形2個。","下を向いた円すい形2個。","頂点を向かい合わせた黒い円すい形2個。","赤い球形2個。"],"c":"頂点が合わさった形は細いくびれを思わせ、西を覚えるのに役立ちます。標体の色は黄・黒・黄です。"},{"id":"e888ec15","q":"東方位標識を示す灯火のリズムはどれですか？","o":["9回の群閃光。","6回の閃光に長閃光1回。","白色の急閃光または超急閃光の3回の群。","1周期ごとに白色閃光2回。"],"c":"3、6、9の群は、時計の位置で東・南・西に対応します。北は連続する急閃光を使います。"},{"id":"0f8760b1","q":"南方位標識を示す灯火のリズムはどれですか？","o":["3回の急閃光。","9回の急閃光。","白色の急閃光または超急閃光の6回の群に続けて長閃光1回。","黄色の長閃光1回。"],"c":"長閃光によって南方位標識を区別でき、他の群閃光との混同を防ぎます。"},{"id":"3bb51f9e","q":"西方位標識を示す灯火のリズムはどれですか？","o":["白色の急閃光または超急閃光の9回の群。","3回の群閃光。","6回の閃光に長閃光1回。","白色の不動光。"],"c":"時計による覚え方では、9が西にあたります。東は3、南は6と長閃光、西は9です。"},{"id":"a2d07b5a","q":"北方位標識に使われる灯火のリズムはどれですか？","o":["特定の回数の群を持たない、白色の急閃光または超急閃光。","ちょうど2回の白色閃光。","黄色の9回の群閃光。","赤色光のモールス符号A。"],"c":"北方位標識は連続する急閃光または超急閃光を使います。昼間の標識は黄の上に黒です。"},{"id":"76b1507a","q":"孤立障害標識（sinal de perigo isolado）は何を示しますか？","o":["水道の必須の中央。","周囲全体が航行可能な水域である、局所的な危険。","すべての港口の右舷側。","広い範囲にわたって危険がまったくない区域。"],"c":"危険の上またはその近くに設置されます。黒地に赤の横帯、黒い球形2個の頭標、白色の2回群閃光を持ちます。"},{"id":"3ab1a286","q":"安全水域標識の外観の特徴はどれですか？","o":["黒と赤の横縞で、2個の球形の頭標を持つ。","全体が黄色で、頭標はX字形。","赤と白の縦縞で、頭標として赤い球1個を付けることがある（任意）。","緑色の構造物に赤い帯が1本ある。"],"c":"この標識は、周囲が可航水域であること、航路の中央、陸地初認（アプローチ）地点または待機地点を示します。灯火がある場合、その色は白です。"},{"id":"e0011bc5","q":"特殊標識の基本色は何ですか？","o":["黄色。灯火がある場合も黄色の光。","赤で、必ず円錐形。","緑で、必ず円筒形。","黒に赤の帯。"],"c":"特殊標識は、しゅんせつ区域、レクリエーション区域、ケーブル、錨泊区域など、水路図誌に記載された区域や施設を示します。"},{"id":"2bbc556b","q":"まだ十分に周知されていない新たな障害物（新危険物）はどのように示すべきですか？","o":["灯火のない青いブイ1個だけで示す。","付近の標識をすべて撤去する。","航行者同士の口頭連絡だけで示す。","使用する標識のうち少なくとも1つを、同一の標識をもう1つ設置して二重にする。"],"c":"二重設置により新たな危険であることへの注意を促します。方位標識や側面標識の灯火を使う場合は、急閃光または超急閃光としなければなりません。"},{"id":"2a4f8b76","q":"特殊標識に付けられることがある頭標はどれですか？","o":["黒い球2個。","上向きの黒い円錐2個。","黄色のX字形。","赤い球1個（必須）。"],"c":"X字形の頭標は任意ですが、特殊な目的の標識であることを識別しやすくします。標識本体の形状は、既存の他の標識と紛らわしいものであってはなりません。"},{"id":"0b57c10e","q":"安全水域標識の灯火を識別できる灯質はどれですか？","o":["モールス符号Aの白光。そのほか等明暗光、明暗光、10秒ごとの長閃光などの灯質。","赤の2閃光の群閃光。","黄色の不動光（必須）。","緑の9閃光の群閃光。"],"c":"モールス符号のAは「・－」（短・長）です。白い灯色と、赤白の縦縞によってこの標識を見分けます。"},{"id":"a24d03cf","q":"ある人のために救命胴衣を選ぶとき、欠かせない基準はどれですか？","o":["認定（型式承認）を受けたもので、航行区域に適したクラスであり、着用者の体重と体格に合ったものを使用する。","生地の色だけで選ぶ。","認定の有無を確認せず、任意のスポーツ用ベストを使用する。","ゆるくなっても、常に最も大きいサイズを選ぶ。"],"c":"救命胴衣は着用者に適し、体にしっかり合っていなければなりません。ゆるい、不適切な、または認定を受けていない装備は、まさに緊急時に機能しないおそれがあります。"},{"id":"4a777640","q":"航行中、救命胴衣はどこに置いておくべきですか？","o":["不正使用を防ぐため、施錠された収納庫の中。","ビルジの最も低い場所。","表示された、乾燥した、すぐに取り出せる場所。施錠したり荷物の下に埋もれさせたりしない。","スペース節約のため、燃料と一緒に梱包しておく。"],"c":"緊急時には数秒が重要です。乗船者全員が救命胴衣の場所と着用方法を、できれば出航前に知っておくべきです。"},{"id":"b933d1af","q":"火工品（信号紅炎など）を船内に持ち込む前に、何を確認すべきですか？","o":["包装の外側の色だけ。","キャビン内で試しに使えるかどうか。","熱源の近くにばらばらに保管できるかどうか。","有効期限、破損の有無、認定、使用方法、安全な保管方法。"],"c":"期限切れ、破損、または不適切に保管された火工品は危険で、作動しないおそれもあります。使用はメーカーの説明に従い、実際の緊急時にのみ行います。"},{"id":"a607ca99","q":"オレンジ色の発煙信号の主な用途は何ですか？","o":["キャビン内を継続的に照らすこと。","特に日中、遭難している船舶や人の位置を示すこと。","燃料火災を消火すること。","右舷の航海灯の代わりにすること。"],"c":"オレンジ色の煙は日中の目視目標となり、捜索隊が風向を把握する助けにもなります。"},{"id":"75193f44","q":"赤色光を発する落下傘付き信号ロケットの主な利点は何ですか？","o":["キール（竜骨）下の水深を正確に示すこと。","水中でのみ煙を出すこと。","携帯用消火器として使えること。","高く上がり、より長く見え続けるため、遠方から発見されやすいこと。"],"c":"落下傘付き信号ロケットは、視認距離の大きい遭難信号です。風、人、障害物に注意して慎重に打ち上げなければなりません。"},{"id":"52e17956","q":"遭難の視覚信号として認められている組み合わせはどれですか？","o":["黄色の円錐の上に緑の旗。","方形旗と、その上または下に球または球に似たもの。","青い旗2枚を横に並べたもの。","白い三角旗の下に黒い円筒形。"],"c":"これは国際的な遭難信号の一つです。ある信号を使っていても、MAYDAY、EPIRB、火工品など、利用できる他の手段を同時に使うことは妨げられません。"},{"id":"ad9069cd","q":"緊急時、船舶を放棄するのはどのようなときですか？","o":["危険がなくても、最初の機関故障が起きたとき。","いかなる救助要請も発信する前。","船内にとどまることのほうが危険が大きい場合に限り、指揮に従い、持ち出せる救命設備を持って放棄する。","数分間でも操舵不能になったときはいつでも。"],"c":"通常、船舶は人をより良く守り、水中にいる人よりも発見されやすいものです。船舶の放棄は最終手段です。"},{"id":"f4a1c899","q":"小型船が転覆しましたが浮いており、差し迫った火災の危険はありません。救助につながる行動はどれですか？","o":["距離がわからなくても、一人で岸まで泳ぐ。","必要もないのに船体の下に何度も潜る。","速く泳ぐために救命胴衣を脱ぐ。","船体のそばにとどまり、船体につかまり、あてもなく泳がない。"],"c":"船体は捜索の目標として大きく、浮力も得られます。船体を離れるのは、具体的な脅威があるか、明らかにより安全な選択肢がある場合だけです。"},{"id":"9547cf2f","q":"救命いかだのシーアンカー（浮き錨）は何のためにありますか？","o":["漂流を抑え、いかだを波や風に対して一定の向きに保つのを助ける。","塩分濃度を自動で測る。","いかだを波の上に持ち上げる。","修理キットの代わりになる。"],"c":"シーアンカーは水中で抵抗を生み、漂流を抑え、荒れた海でのいかだの挙動を改善することがあります。"},{"id":"d1097b8c","q":"サバイバル状況で海水を飲んではいけないのはなぜですか？","o":["塩分過多により脱水が悪化し、体に深刻な害を及ぼすおそれがあるから。","すぐに低体温症を引き起こすから。","必ず燃料が混じっているから。","のどの渇きを完全になくしてしまうから。"],"c":"腎臓は摂取した塩分を排出しなければならず、飲んだ量以上の水分が必要になることがあります。飲料水は慎重に配分しますが、不必要に水分補給を止めてはいけません。"},{"id":"4e08b057","q":"救命胴衣を着けた人々が冷たい水中で救助を待っています。体温の損失を減らす方法はどれですか？","o":["全力で泳ぎ続ける。","膝を引き寄せるために救命胴衣を脱ぐ。","広い範囲を占めるようにグループを分散させる。","体をできるだけ動かさず、熱を失いやすい部位を守り、安全であれば身を寄せ合う。"],"c":"熱損失を抑える姿勢（HELP姿勢）や身を寄せ合う姿勢（ハドル）は、露出を減らします。不必要な動きは体の周りの水の入れ替わりを早めます。"},{"id":"98d55dca","q":"火の三要素（燃焼の三要素）を構成するものはどれですか？","o":["可燃物、酸素供給体（支燃物）、熱。","水、泡、二酸化炭素。","煙、灰、炎。","圧力、湿度、電気。"],"c":"消火は、火災の種類に応じて、冷却、窒息、可燃物の除去により、必須要素のいずれかを取り除くか減らすことで行います。"},{"id":"d373a263","q":"A類火災（普通火災）の典型的な物質はどれですか？","o":["ガソリンなどの引火性液体。","通電中の電気機器。","木材、紙、布など、燃えかすを残す一般的な固体。","業務用設備の食用油のみ。"],"c":"A類火災は一般的な固体物質が燃える火災です。消火剤は、感電の危険を生じさせたり、その場にある他の可燃物を広げたりしないものを選ばなければなりません。"},{"id":"e5838e14","q":"こぼれたガソリンに火がつきました。この火災は主に何類火災に分類されますか？","o":["A類。木材のおき火が残るため。","C類。船舶上で発生したというだけの理由で。","B類。引火性液体が関係しているため。","D類。可燃性金属が関係しているため。"],"c":"引火性液体の場合、棒状の放水は燃料を広げるおそれがあります。B類に適した消火剤と方法を用います。"},{"id":"156f142b","q":"通電中の配電盤が燃えています。適切な分類と最初の注意はどれですか？","o":["通電中はC類。安全であれば電源を遮断し、適切な非導電性の消火剤を使う。","A類。電源を切らずに直接放水する。","B類。配電盤を開けて配線に触れる。","D類。濡れた布で覆う。"],"c":"電気は感電の危険を生みます。電源遮断後は、実際に燃えている物質に応じて火災を扱います。"},{"id":"397613da","q":"燃えているガソリンや通電中の電気設備に棒状放水を向けてはいけないのはなぜですか？","o":["水は必ず酸素濃度を上げるから。","燃料を広げるおそれがあり、電気の場合は電流を伝えて感電を招くおそれがあるから。","水はどんな火災もD類に変えてしまうから。","水消火器はすべて屋外で爆発するから。"],"c":"消火剤の選択は消火活動の決定的な要素です。消すことに加え、延焼、感電、避難経路の喪失を防ぐ必要があります。"},{"id":"a9913891","q":"密閉された機関室で火災の疑いがあります。最も安全な行動はどれですか？","o":["よく見るためにハッチを一気に開ける。","燃料を使い切るためにエンジンの回転を上げる。","窒息させるために火元にガソリンをかける。","エンジンを止め、可能であれば燃料と電気を遮断し、専用の開口部から消火剤を放射して、区画を全開にしないようにする。"],"c":"全開にすると酸素が供給され、炎が噴き出すおそれがあります。消火活動では避難経路を確保し、救助要請の必要性も考慮します。"},{"id":"1e55290d","q":"エンジン始動前に強い燃料の臭いに気づいたとき、どうすべきですか？","o":["システムを試すためにすぐ始動する。","漏れを探すために火をつける。","エンジンや火花を出す機器を作動させず、燃料源を閉じ、換気し、安全に漏れ箇所を探す。","換気をすべて止め、バッテリー充電器をつける。"],"c":"燃料の蒸気は、特に低く閉ざされた区画で爆発性の混合気を作ることがあります。始動前に原因を取り除かなければなりません。"},{"id":"c03358e4","q":"携帯用消火器を使うとき、消火剤はどこに向けるべきですか？","o":["煙の最も高い部分だけ。","出口に背を向けて天井に向ける。","近くの人を冷やすためにその人に向ける。","炎の根元に向け、掃くように動かし、避難経路を確保しておく。"],"c":"放射は燃焼している部分に届かなければなりません。接近の仕方は消火剤、風、到達距離、火勢によります。火が大きくなったら、避難と救助要請を優先してください。"},{"id":"189b22f3","q":"狭く換気の悪い区画でCO2を使う際に伴う危険はどれですか？","o":["必ず熱湯が生じる。","外気圧が恒久的に上昇する。","火災が放射性物質に変わる。","呼吸に使える酸素が減るため、退避し、再進入前に安全に換気する必要がある。"],"c":"CO2は火を窒息消火しますが、窒息性の雰囲気を作ることもあります。状況を評価せずにとどまったり再進入したりしてはいけません。"},{"id":"b007c3ee","q":"船内火災の初期段階で、火への燃料供給を抑えるのに役立つ措置はどれですか？","o":["すべての燃料タンクを開ける。","燃えている区画の換気を強める。","可燃物を火元の近くへ移す。","安全であれば、影響を受けた区域への燃料供給と電源を遮断する。"],"c":"電源や燃料源を遮断すると、火の拡大を防げることがあります。この作業は煙の中を通ったり避難経路を失ったりせずに行わなければなりません。"},{"id":"dd66c3c0","q":"小さな損傷から船体に浸水し始めました。適切な初期対応はどれですか？","o":["通信をすべて切って航行を続ける。","全員を低い側の舷に集める。","救命胴衣を着用し、浸水箇所を特定して浸水を減らし、排水ポンプを作動させ、必要なら救助を求めながら安全な場所へ向かう。","水が分散するように他の区画を開放する。"],"c":"損傷制御（ダメージコントロール）は、人の安全、浸水箇所のふさぎ（防水）、排水、慎重な航行を組み合わせたものです。復原性とポンプの能力を監視しなければなりません。"},{"id":"75f12cf2","q":"船舶が予期せず座礁しました。離礁を試みる前に、操縦者は何をすべきですか？","o":["負傷者、漏水、位置、底質、潮汐、復原性を確認し、損傷を悪化させる操船を避ける。","点検せずに全速後進をかける。","全員をすぐに船首へ移動させる。","水深を確かめるために船体に穴を開ける。"],"c":"状況を把握せずに船を引き出すと、海底に押さえられていた破口を広げるおそれがあります。判断には潮汐、得られる支援、環境リスクを考慮します。"},{"id":"50a650cd","q":"人が水中に落ちました。最も適切な直後の対応はどれですか？","o":["全員が船内を見る。","直進で加速し、後で戻る。","救命胴衣を着けず、他の操縦者も指名せずに水に飛び込む。","大声で警報を発し、落水者から目を離さず、浮力のあるものを投げ、安全に救助のための操船を始める。"],"c":"落水者を指さし続けることで見失うのを防ぎます。接近時は、プロペラ、風、潮流、救助する側の危険を管理しなければなりません。"},{"id":"a965b043","q":"出航前の安全説明（ブリーフィング）には何を含めるべきですか？","o":["到着予定時刻だけ。","救命胴衣と消火器の場所と使い方、緊急時の手順、通信、船舶の限界、乗組員の基本的な役割。","操縦者の電話のパスワードだけ。","装備は一切必要にならないという約束。"],"c":"短い説明でも対応時間を短縮でき、操縦者が行動不能になった場合に他の人が手助けできるようになります。"},{"id":"e3be1f32","q":"船内で傷病者を発見したとき、最初にすべきことは何ですか？","o":["救護の前に現場の安全を確認し、自分自身、傷病者、周囲の人を守る。","どんな状況でも、すぐに傷病者を動かす。","意識を確認する前に水を与える。","動きやすくするために救助者の救命胴衣を脱ぐ。"],"c":"救助者が新たな傷病者になってはいけません。危険を管理した後、反応と呼吸を確認し、助けを呼びます。"},{"id":"5d401810","q":"意識はないが普段どおりの呼吸をしており、外傷の疑いはありません。助けを待つ間、どうすべきですか？","o":["仰向けのままにして食べ物を与える。","回復体位（側臥位）にし、呼吸を絶えず観察する。","支えなしで座らせる。","普段どおりの呼吸があっても胸骨圧迫を始める。"],"c":"回復体位は気道の確保を助け、分泌物を排出しやすくします。外傷の疑いがある場合は、安全や気道確保のために必要なときだけ動かしてください。"},{"id":"8ba9e054","q":"傷病者が反応せず、普段どおりの呼吸をしていません。適切な手順はどれですか？","o":["行動する前に10分待つ。","飲み物を与えて座らせておく。","まず足首の骨折を探す。","助けを呼び、AED（DEA）を手配し、RCP（心肺蘇生、CPR）を開始し、機器と救急指令の指示に従う。"],"c":"死戦期呼吸は普段どおりの呼吸ではありません。早期の認識、質の高い心肺蘇生、AEDが生存の可能性を高めます。"},{"id":"c2fd0285","q":"成人の心肺蘇生で、訓練を受けた救助者に対する一般的な指針に合う組み合わせはどれですか？","o":["1分間に10回の圧迫と、各サイクルごとに1回の人工呼吸。","腹部のみを圧迫し、胸を元に戻さない。","1分間に100〜120回、深さ約5〜6 cmの圧迫と、圧迫30回に人工呼吸2回のサイクル。","圧迫5回に人工呼吸30回のサイクル。"],"c":"手は胸の中央に置き、圧迫の間は胸を完全に元に戻し、中断を最小限にします。人工呼吸ができない人は、少なくとも圧迫を続け、救急指令医の指示に従います。"},{"id":"ed40b265","q":"大量の外出血を止めるための最初の措置はどれですか？","o":["傷を見るために最初のガーゼを何度もはがす。","痛みを和らげるためにアルコール飲料を与える。","傷の周りを強くマッサージする。","ガーゼや清潔な布で傷口を強く直接圧迫し、助けを呼ぶ。"],"c":"ガーゼが血で染みたら、圧迫を続けたまま上から重ねます。大量出血には、訓練を受けた人による追加の資材や技術が必要になることがあります。"},{"id":"8ab458b4","q":"傷病者の体に物が刺さっています。どうすべきですか？","o":["すばやく引き抜いて傷の中を洗う。","完全に埋まるまで押し込む。","固定せずに皮膚の際で折る。","刺さった物は抜かず、周囲を固定して、至急処置を受けさせる。"],"c":"引き抜くと出血や内部の損傷が増えるおそれがあります。救命処置のためにやむを得ない場合を除き、刺さった物は資格のある救急隊のみが扱うべきです。"},{"id":"dd174a00","q":"手足の骨折が疑われる場合、どうすべきですか？","o":["痛みが消えるまで無理にまっすぐにする。","発見したときの位置のまま、血行を締めつけないように固定し、医療機関で処置を受けさせる。","確かめるために歩かせる。","変形した部分を直接マッサージする。"],"c":"可能であれば上下の関節を含めて固定し、固定の前後で色、温度、感覚を確認します。開放骨折では傷口の保護が必要です。"},{"id":"021a8a84","q":"転落後、脊椎の損傷が疑われます。最も安全な対応はどれですか？","o":["バランスを確かめるために座らせる。","不必要に動かさず、頭と首を固定し、専門の救急隊を呼ぶ。","必要もないのに腕を引っ張って別の区画へ移す。","可動性を確かめるために何度も頭を回す。"],"c":"火災や沈没など、より大きな危険が差し迫っている場合を除き、適切な技術なしに傷病者を動かしてはいけません。"},{"id":"1d06f695","q":"小さく新しい熱傷（やけど）に対する初期対応として適切なのはどれですか？","o":["氷を直接皮膚に当てる。","バター、歯磨き粉、燃料を塗る。","水ぶくれをすべて破る。","清潔な流水で約20分冷やし、貼りついていない装飾品を外し、締めつけずに覆う。"],"c":"冷たい流水は損傷を抑えますが、氷や民間療法は損傷を悪化させるおそれがあります。広範囲、深い、または重要な部位のやけどは至急の処置が必要です。"},{"id":"66a35c70","q":"化学物質が目に入りました。適切な直後の対応はどれですか？","o":["物質がわからないまま、別の化学物質で中和する。","乾いた布で目をこする。","洗わずに目を閉じておく。","まぶたを開いたまま大量のきれいな水で洗い流し、医師の指示を受ける。"],"c":"早期の洗眼は汚染物質を薄め、取り除きます。コンタクトレンズは簡単に外れる場合は外しますが、洗眼を遅らせてはいけません。"},{"id":"417df74c","q":"けいれん発作中の正しい対応はどれですか？","o":["腕と脚を強く押さえつける。","危険な物を遠ざけ、頭を守り、時間を計り、動きを押さえず、口に何も入れない。","歯の間に物をはさむ。","もがいている間に水を飲ませる。"],"c":"発作が治まったら呼吸を確認し、適切であれば回復体位にします。発作が長引く、繰り返す、外傷を伴う、または初めての発作であれば、至急救助を求めます。"},{"id":"9a29e07e","q":"意識のある成人が窒息し、話すことも咳をすることも呼吸することもできません。訓練を受けた救助者の対応として適切なのはどれですか？","o":["肩甲骨の間を5回たたく背部叩打と5回の腹部突き上げを交互に行い、助けを呼ぶ。","水を飲ませて横にさせる。","手探りで口の中に指を入れる。","何もせずに閉塞が治まるのを待つ。"],"c":"意識を失った場合は心肺蘇生の手順を開始し、異物は見えるときだけ取り除きます。妊婦や著しい肥満の人には方法を変える必要があります。"},{"id":"c660d969","q":"傷病者の皮膚が青白く冷たく、脱力しており、ショックの徴候があります。救助が来るまでの間、どうすべきですか？","o":["血行を促すために無理に歩かせる。","アルコール飲料を与える。","腕を上げて立たせる。","寝かせて保温し、目に見える原因に対処し、飲食物は与えない。"],"c":"ショックは出血、外傷、その他の緊急事態に伴うことがあります。呼吸困難、外傷、嘔吐のおそれがある場合は、体位を調整しなければなりません。"},{"id":"db0062b4","q":"暑さにさらされた後、混乱、非常に熱い皮膚、意識の変化が見られます。これは重症の熱中症（熱射病）を示唆します。どうすべきですか？","o":["毛布を何枚もかけ、風通しを妨げる。","救急に通報し、利用できる手段ですぐに体を冷やし始め、呼吸を観察する。","アルコールを与えて一人にしておく。","何もせずに体温が下がるのを待つ。"],"c":"高体温に神経症状を伴う場合は緊急事態です。余分な衣服を脱がせ、新たな危険を生じさせないように冷やします。意識に異常がある人に飲み物を与えてはいけません。"},{"id":"42097a62","q":"水没した人の救助で、救助者と傷病者の両方を守る優先事項はどれですか？","o":["訓練を受けていなくても、浮力のあるものを持たずに水に入る。","不必要に自分を危険にさらさずに引き上げ、呼吸を確認し、必要に応じて心肺蘇生とAEDを開始する。","腕を持って吊り上げたまま待つ。","呼吸を確認する前に肺から水を出そうとする。"],"c":"できる限り、手を伸ばす、ロープ、浮き具、船舶を使ってください。呼吸がなければ、訓練に従って人工呼吸と胸骨圧迫が必要です。水を出そうとして心肺蘇生を遅らせてはいけません。"},{"id":"d4d37ba9","q":"磁気コンパスの針が示す基本的な情報は何ですか？","o":["キール（竜骨）下の正確な水深。","真風速。","出発からの航走距離。","磁北の方向。針路を決める基準として使われる。"],"c":"磁気コンパスは真北を直接指すわけではありません。正しく使うには、針路、偏差（磁気偏差）、自差を理解しておく必要があります。"},{"id":"cf396f55","q":"偏差（磁気偏差）と自差の違いは何ですか？","o":["偏差は真北と磁北の間の角度、自差は船舶自体の磁気によって生じる誤差。","偏差はエンジン、自差は潮汐だけによって生じる。","同じ速度を表す別の名前である。","偏差は水深を、自差は風を測る。"],"c":"偏差は場所と時期によって変わり、海図に記載されています。自差は取り付け状態と針路によって変わり、比較や自差表で把握しておかなければなりません。"},{"id":"9a0d8697","q":"GNSS受信機の画面に正確な位置が表示されています。それでも欠かせない対応はどれですか？","o":["目視による見張りをやめる。","海図の更新を考慮せずに航行する。","見張りを続け、海図、水深、その他利用できる手段で位置を確認する。","視界の悪いときに速力を上げる。"],"c":"GNSSは設定の誤り、信号の喪失、電源の故障が起こり得ます。航行の補助にはなりますが、見張り、計画、周囲の状況判断の代わりにはなりません。"},{"id":"a5c961a1","q":"音響測深機（エコーサウンダー）は、通常どのようなデータを示しますか？","o":["船舶上の雲の高さ。","補正なしの真針路。","採用した校正に応じた、送受波器（トランスデューサー）から海底までの垂直距離。","任意の深さでの潮流の速さ。"],"c":"表示値は、オフセットの設定により、送受波器、喫水線、キール（竜骨）のいずれかを基準とします。操縦者はこの設定を把握し、安全余裕を確保する必要があります。"},{"id":"4aa649e1","q":"エンジンのタコメーター（回転計）は何のためにありますか？","o":["風速を示す。","エンジンの回転数を、通常は毎分回転数（rpm）で示す。","水深を測る。","磁北を示す。"],"c":"回転数は推奨範囲内での運転に役立ち、通常の速力や状況と比べることで、異常な負荷や故障を見つける手がかりにもなります。"},{"id":"443c31ba","q":"航程計（ログ）に関係する量はどれですか？","o":["気圧と天候の傾向。","天文潮の潮高。","航走距離と、機器によっては対水速力。","エンジンの内部温度。"],"c":"このシステムは積算距離と速力を表示できます。対水速力とGNSSの対地速力の違いは、潮流や風圧流によって説明されます。"},{"id":"549f034f","q":"風速計（アネモメーター）は何を測るために使われますか？","o":["船体下の水深。","風速。","推進軸の回転数。","海図に記載された偏差（磁気偏差）。"],"c":"風向と風の強さは、操船、波、気象の変化を判断するのに役立ちます。船上での測定値は、船舶の動きの影響を受けた見かけの風であることがあります。"},{"id":"cdb697b9","q":"気圧計が示す気圧が継続的に大きく下がっている場合、何を示している可能性がありますか？","o":["数日間の快晴が保証されている。","潮位が自動的に下がる。","低気圧の接近と、天候が悪化する可能性。","コンパスが必ず故障する。"],"c":"気圧の傾向は、雲、風、公式の予報、現地の状況と合わせて判断しなければなりません。一度の読み取りだけで総合的な情報の代わりにはなりません。"},{"id":"b5004097","q":"雷雨、突風、強い雨、落雷としばしば関係する雲はどれですか？","o":["単独の薄い巻雲（Cirrus）。","積乱雲（Cumulonimbus）。","鉛直方向に発達しない低い層雲（Stratus）。","必ず無風のレンズ雲。"],"c":"積乱雲は鉛直方向に大きく発達し、急激な変化をもたらすことがあります。早めに避難し、嵐が船舶に到達するのを待ってはいけません。"},{"id":"88a2d7a3","q":"霧が発生し、視界が急速に悪くなりました。操縦者はどうすべきですか？","o":["早く抜け出すために速力を上げる。","安全な速力とし、見張りを強化し、適切な信号と機器を使い、必要なら安全な場所へ向かう。","灯火とVHFを切る。","他船の航跡だけを追う。"],"c":"視界制限状態では、目視で確認する前から危険が存在することがあります。RIPEAM（国際海上衝突予防規則、RIPEAM/COLREG）は、霧中信号、機関の即時操作準備、最大限の注意を求めています。"},{"id":"8262a21a","q":"ビューフォート風力階級は何のためにありますか？","o":["磁針路を真針路に換算する。","救命胴衣を分類する。","風の強さと、海上や陸上で観察できる影響から風力を推定する。","月齢を計算する。"],"c":"ビューフォート階級は、数値を風速の範囲や海面の様子と対応させています。観察には便利ですが、気象情報や計器の代わりにはなりません。"},{"id":"73fb87d8","q":"高潮（満潮）と低潮（干潮）とは何ですか？","o":["高潮は潮汐の最高水位、低潮はその後または前の最低水位。","高潮は強風、低潮は無風。","高潮は南向きの潮流、低潮は北向きの潮流。","水温を表す2つの尺度。"],"c":"予測される時刻と潮高は、基準地点ごとに潮汐表（Tabelas das Marés）に掲載されています。気象条件によって実際の水位が変わることがあります。"},{"id":"445f80ea","q":"一般に、水位の上昇に伴う潮流と下降に伴う潮流は、それぞれ何と呼ばれますか？","o":["漂流と風圧流。","風上と風下。","それぞれ上げ潮流（満ち潮）と下げ潮流（引き潮）。","高潮と小潮。"],"c":"上げ潮流と下げ潮流は、潮汐の周期に伴う水平方向の動きを表します。転流（流れがなくなる時刻）は、必ずしも高潮や低潮と一致しません。"},{"id":"05faeb8d","q":"ある周期における潮差（潮汐の振幅）とは何ですか？","o":["2つの側面標識の間の距離。","航路の最高許容速力。","真北と磁北の間の角度。","高潮とそれに対応する低潮との高さの差。"],"c":"潮差は月齢、地形、その他の要因によって変わります。基本水準面から測った潮高と混同してはいけません。"},{"id":"fcb63bf7","q":"一般に、潮差が大きい大潮は月のどの位相で起こりますか？","o":["新月と満月。","上弦と下弦。","位相にかかわらず、遠地点のときだけ。","どの位相でも常に同じ潮差。"],"c":"大潮のときは太陽、地球、月がほぼ一直線に並び、潮汐を起こす力が強め合います。現地での反応には遅れが生じることがあります。"},{"id":"7f1ec04c","q":"一般に、潮差が小さい小潮はどの位相で起こりますか？","o":["新月と満月。","上弦と下弦。","日食・月食のときだけ。","夏だけ。"],"c":"小潮のときは太陽と月の作用の方向がほぼ直角になり、潮差が小さくなる傾向があります。"},{"id":"de13f8df","q":"半日周潮の多くの場所では、翌日の高潮はおよそ50分遅れて起こります。この情報はどのように使うべきですか？","o":["世界中のどの港にも当てはまる正確な規則として。","水深の確認を省くために。","風を自動的に計算するために。","一般的な目安としてのみ使い、航行にはその場所と日付の公式の潮汐表を参照する。"],"c":"月の周期で平均的な遅れは説明できますが、実際の潮汐は半日周潮、日周潮、混合潮のいずれかであり、地形や気象の影響も受けます。"},{"id":"fcc2fba7","q":"海図の水深が1,8 m、その時刻の潮高が0,7 mです。他の補正を無視すると、推定水深はいくらですか？","o":["1,1 m。","1,8 m。","2,5 m。","0,7 m。"],"c":"両者が同じ基準面を用いている場合、海図の水深に潮高を加えます：1,8 + 0,7 = 2,5 m。さらに喫水と安全余裕を差し引く必要があります。"},{"id":"8685b246","q":"一部だけ満たされたタンクは、どのような効果によって復原性を低下させることがありますか？","o":["偏差（磁気偏差）の効果。","自由水影響（自由表面効果）。液体が移動し、重心が見かけ上高くなるため。","船尾灯の効果。","止まった舵のキャビテーション効果。"],"c":"液体の横方向の移動は復原力を低下させます。できるだけ、満たされていないタンクを多く作らず、液体の積載を管理してください。"},{"id":"abd509b7","q":"小型船の復原性を高める傾向がある積載の配分はどれですか？","o":["重量を高い位置に置き、片舷に集中させる。","乗客全員を船首で立たせる。","重量を低く中央に置き、しっかり固縛し、定員とメーカーの制限を守る。","重い物を甲板上に固定せずに置く。"],"c":"重心を上げたり横にずらしたりすると、傾斜と転覆の危険が増します。荷物と人は分散させ、固定しなければなりません。"},{"id":"d58c9279","q":"海上VHF無線電話の国際的な呼出しおよび遭難用チャンネルはどれですか？","o":["チャンネル06、周波数121,5 MHz。","通常の音声通話用のチャンネル70。","チャンネル16、周波数156,8 MHz。","どの国でもどの状況でもチャンネル09。"],"c":"チャンネル16は遭難、緊急、安全通信、最初の呼出しに使われます。通常の通信で相手と連絡がついたら、適切な作業用チャンネルに移らなければなりません。"},{"id":"1bd3ca68","q":"VHFで送信する前に、通信士は何をすべきですか？","o":["話さずに数分間PTTを押し続ける。","MAYDAYの最中に通常の呼出しをする。","自作の暗号を使う。","チャンネルを聴守し、優先通信がないことを確認し、短く明確な通報を準備する。"],"c":"聴守することで、既存の通信を妨害しないようにします。ゆっくり話し、局名を名乗り、できるだけ早くチャンネルを空けてください。"},{"id":"7446d94c","q":"チャンネル16で通常の呼出しが成立した後、通常どうしますか？","o":["雑談をすべてチャンネル16で続ける。","適切な作業用チャンネルを取り決めて移り、チャンネル16を空ける。","チャンネル70に移って音声で話す。","相手局が応答する前に無線機を切る。"],"c":"呼出しおよび遭難用チャンネルは、優先通信のために空けておかなければなりません。作業用チャンネルは、その目的と海域で使用が認められたものでなければなりません。"},{"id":"98a2fd88","q":"手続き用語MAYDAYはどのような場合に使いますか？","o":["船舶または人に重大かつ差し迫った危険があり、直ちに援助が必要な場合。","通常の気象情報を求める場合。","危険のない小さな遅れを知らせる場合。","出航前にマイクを試す場合。"],"c":"MAYDAYは最も優先度が高い通信です。虚偽の呼出しは捜索資源を浪費させ、他の人命を危険にさらすおそれがあります。"},{"id":"1f02c525","q":"手続き用語PAN PANが適切なのはどのような場合ですか？","o":["重大かつ差し迫った危険には当たらないが、人または船舶の安全に関する緊急の通報をする場合。","直ちに船舶を放棄した後に限る。","全局向けに風の予報を知らせる場合。","私的な会話用のチャンネルを確保する場合。"],"c":"PAN PANは通常の通報より優先されますが、MAYDAYより下位です。状況が重大かつ差し迫った危険へと悪化した場合は、区分を引き上げなければなりません。"},{"id":"249ecca9","q":"航行安全や気象に関する重要な通報の前に付ける手続き用語はどれですか？","o":["あらゆる状況でMAYDAY RELAY。","SECURITE。","必ずPAN PAN MÉDICO。","最初の呼出しとしてOVER AND OUT。"],"c":"SECURITEは安全通報を予告します。一般に、呼出しは呼出し用チャンネルで行い、詳細は該当する手順に従って指定されたチャンネルで送ります。"},{"id":"d39bae1e","q":"遭難通報には、可能な限りどのような情報を含めるべきですか？","o":["操縦者の名だけ。","エンジンのメーカーだけ。","船舶の価格と購入日。","識別（船名・呼出符号など）、位置、危険の性質、必要な援助、乗船者数、その他の有用な情報。"],"c":"正しい基準に基づく明確な位置を繰り返し伝えることが決定的に重要です。時間が限られている場合は、識別、位置、危険の性質を最初に送信してください。"},{"id":"4c32d8ef","q":"自局宛てではないMAYDAYを受信したとき、通信士はどうすべきですか？","o":["同じチャンネルで通常の通話を始める。","受信した位置を消す。","沈黙を守り、情報を記録して待機する。当局や状況が求め、援助できる場合は応答または中継する。","到達距離を確かめるために音楽を流す。"],"c":"遭難通信は絶対的な優先権を持ちます。海岸局や他の船舶が通信を統制し、沈黙を命じることがあります。"},{"id":"7c78dc8d","q":"海上VHFのチャンネル70は何のために確保されていますか？","o":["乗客同士の音声通話。","音楽の連続送信。","デジタル選択呼出し（DSC）。通常の音声通信用ではない。","船外機の遠隔操作。"],"c":"DSC機器は、正しく接続・設定されていれば、識別番号や位置を含むデジタル警報を送信できます。"},{"id":"bab5397f","q":"携帯型VHF無線機の実用的な通信距離に主に影響するものはどれですか？","o":["見通し線、アンテナの高さと品質、出力、障害物、バッテリーの状態。","唯一の要因としての月の位相。","船体の色。","船内の飲料水の量。"],"c":"VHFは主に見通し線で伝わります。アンテナが高く障害物がないほど通常は距離が伸びます。携帯型は充電しておき、水から保護しなければなりません。"},{"id":"b68f8014","q":"Arrais-Amador（小型船舶操縦免許）の基本的な範囲はどれですか？","o":["外洋であらゆる船舶を無制限に操縦できる。","内水航行の範囲内で、スポーツ・レクリエーション用船舶を操縦できる（水上オートバイを除く）。","外洋で水上オートバイだけを操縦できる。","商船の船長として職業的に指揮をとれる。"],"c":"この免許はアマチュア用であり、職業的な活動は認められません。水上オートバイには、現行規則に基づきMotonauta（水上オートバイ免許）の区分が必要です。"},{"id":"e216e684","q":"Motonauta（水上オートバイ免許）の区分では何が認められますか？","o":["外洋航行で商船を操縦すること。","あらゆる職業用旅客船を操縦すること。","スポーツ・レクリエーション活動として、内水航行の範囲内で水上オートバイを操縦すること。","水上オートバイの登録や装備を不要にすること。"],"c":"Motonautaは水上オートバイ専用の免許であり、操縦者を職業船員（aquaviário）にするものではありません。"},{"id":"a819c9a8","q":"操縦中、アマチュア操縦免許証（Carteira de Habilitação de Amador）はどのような状態にしておくべきですか？","o":["必ず自宅に保管しておく。","有効であり、Autoridade Marítima（海事当局）が認める形式で、検査時に提示できるようにしておく。","燃料の領収書だけで代用する。","乗客がいる場合は不要。"],"c":"操縦者は、船舶と航行区域に適合した免許を持っていなければなりません。期限切れの免許証や不適切な区分では要件を満たしません。"},{"id":"70e3e5b3","q":"LESTAによれば、事故や航行上の危険に関する船長の義務はどれですか？","o":["検査を避けるため、損傷を隠す。","自分の判断でブイを動かす。","緊急の危険を年末まで報告しない。","事故、事象、航行援助施設の不備や発見した障害物を、Autoridade Marítima（海事当局）に通報する。"],"c":"速やかな報告により、対策、調査、他の航行者への警告が可能になります。船長はまた、安全規則を守り、守らせなければなりません。"},{"id":"14010766","q":"LESTAに定められた安全のための行政措置はどれですか？","o":["場合に応じて、免許証の押収または船舶の出航差し止め。","手続きなしに検査官が行う自動的な逮捕。","あらゆる私物の所有権の喪失。","マリーナによる月額料金の強制徴収。"],"c":"行政措置は、危険や違反に直面した際に、人、船舶、交通、環境を守ることを目的とします。手続きの結果科される罰則とは必ずしも同じではありません。"},{"id":"e1738d11","q":"LESTA違反によって科され得る行政罰はどれですか？","o":["該当する規定に応じて、罰金、免許の停止・取消し、工作物や施設の撤去。","口頭注意のみ。","新たな登録料の徴収のみ。","Capitania（港湾局）による拘留のみ。"],"c":"罰則は違反の内容と行政手続きによって決まり、該当する場合は民事上・刑事上の責任も妨げられません。"},{"id":"3569c018","q":"適合する免許を持たずに船舶を操縦することは、何に当たりますか？","o":["航行が1時間未満なら認められる行為。","RLESTAに定められた違反であり、該当する措置と罰則の対象となる。","救命胴衣が船内にあれば常に適法な状態。","マリーナとの契約上の不備にすぎない。"],"c":"免許、区分、区域は、操縦に適合していなければなりません。船舶を貸しても、この責任は移りません。"},{"id":"aaae6a8b","q":"必要な安全設備が不足している、作動しない、または期限切れの状態で航行すると、どうなる可能性がありますか？","o":["どの目的地へも進む許可が自動的に与えられる。","危険の程度と該当規定に応じて、違反とされ、出航差し止めその他の措置がとられる。","設備を携帯電話で代用できる。","レクリエーション用船舶なので免除される。"],"c":"必要な設備の一覧は、船舶の区分、区域、特性によって異なります。出航前に有効期限と作動状態を点検すれば、危険と違反処分を避けられます。"},{"id":"d77533a5","q":"認められた定員を超えて人を乗せることが危険なのはなぜですか？","o":["重量が増えるので、常に復原性が向上する。","誰も座らなければ認められる。","船舶の限界を超え、乾舷、復原性、対応能力を低下させるおそれがある。","燃料消費が変わるだけで、安全には影響しない。"],"c":"定員は設計と安全条件を考慮して決められています。定員超過は浸水を悪化させ、積載配分を損ない、退船を困難にするおそれがあります。"},{"id":"b8468bc3","q":"酒に酔った状態、または麻薬・有害物質の使用後に船舶を操縦した場合、RLESTAはどのような結果を定めていますか？","o":["最大120日間の免許停止。再違反の場合は取消し。他の責任も妨げられない。","記録の残らない口頭での勧告のみ。","免許が自動的に職業用に切り替わる。","内水航行では何の結果もない。"],"c":"アルコールや薬物は、判断力、平衡感覚、反応時間、見張りを損ないます。この禁止は、水域を利用するすべての人を守るためのものです。"},{"id":"0f3bec1d","q":"より厳しい地域の規則がない限り、水上オートバイは基線からどの距離を超えると高速航行を始められますか？","o":["20メートルから。","50メートルから。","2海里を過ぎてから。","基線から200メートルから。"],"c":"海岸、岸辺、施設に近い帯状の水域には、遊泳者や出入りのための操船が集中します。地域の規則、禁止区域、航路標識を守らなければなりません。"},{"id":"0f241b11","q":"岸辺や海岸と、水上オートバイの航行が認められた区域との間は、どのように通過すべきですか？","o":["基線に対してできるだけ直角な経路で、3ノット未満の速力で通過する。","ジグザグに、できるだけ高速で通過する。","海岸と平行に、遊泳者から50メートル未満の距離で通過する。","波を立てるために加速を繰り返す。"],"c":"ゆっくり直進して横切ることで、敏感な水域にいる時間を短くし、動きを予測しやすくします。遊泳者や他の船舶への見張りを続けてください。"},{"id":"a3198e39","q":"水上オートバイの航行が認められているのはどの時間帯ですか？","o":["日中、日の出から日没までの間で、安全な条件が満たされている場合。","ライトが点灯していればいつでも。","真夜中から夜明けまでの間だけ。","夜間、携帯用ライトがある場合だけ。"],"c":"水上オートバイは夜間に運航してはいけません。日中であっても、視界、気象、地域の規制によっては出航が安全でない場合があります。"},{"id":"355824f4","q":"水上オートバイの操縦者と同乗者に、現在認められている救命胴衣のクラスはどれですか？","o":["その用途のために認定されたクラスIIIまたはクラスV。","外洋用のクラスIのみ。","認定のない任意の浮力補助具。","クラスを確認しない汎用の自動膨張式救命胴衣。"],"c":"操縦者と同乗者は、運航中、適切な救命胴衣を着用しなければなりません。体への合い具合、認定、保守状態を確認する必要があります。"},{"id":"1e7046ea","q":"操縦中、エンジン停止装置（安全キー）はどこに接続しておくべきですか？","o":["小物入れの中に外したまま置いておく。","落水したときにエンジンが止まるよう、装置の仕組みとメーカーのマニュアルに従って操縦者に接続する。","同乗者だけに取り付ける。","操縦者に接続せず、ハンドルに結んでおく。"],"c":"安全コード（ランヤード）は、操縦者が落水したときに確実に外れて停止装置を作動させなければなりません。出航前にマニュアルに従って装置を試験してください。"},{"id":"a7da3cb1","q":"走行中の水上オートバイで禁止されている同乗者の位置はどれですか？","o":["操縦者の前。","操縦者の後ろの専用シート。","メーカーが定めた位置。","定員内で、操縦者の後ろ。"],"c":"操縦者はハンドル、スロットル、視界を管理しなければなりません。同乗者は認められたシートに、操縦者の後ろで、足を足置きに乗せて座っていなければなりません。"},{"id":"0f177580","q":"6歳の子どもを水上オートバイに乗せることはできますか？","o":["はい。操縦者の前に乗せれば可能。","はい。海が穏やかなら救命胴衣なしで可能。","はい。水上オートバイの大きさに関係なく可能。","いいえ。7歳未満の子どもを乗せることは禁止されている。"],"c":"年齢制限は操縦者の経験にかかわらず適用されます。定員、救命胴衣、乗車位置の規則は、他の人にも引き続き適用されます。"},{"id":"42a085a2","q":"9歳の子どもは同乗者の一般的な最低年齢を超えています。それでも欠かせない注意はどれですか？","o":["免許なしで水上オートバイを操縦させる。","見守りやすいように操縦者の前に乗せる。","操縦者の後ろの位置に安全に座れ、体に合った救命胴衣を着用し、定員と地域の規則を守る場合に限り乗せる。","7歳を超えているので救命胴衣を不要とする。"],"c":"最低年齢を満たしても、自動的に安全になるわけではありません。操縦者は、体格、足が足置きに届くか、救命胴衣の合い具合、水面の状況を判断し、地域の規則や保護者の許可も確認しなければなりません。"},{"id":"8feb679c","q":"多くの水上オートバイで、旋回中にスロットルを完全に戻すと操縦が難しくなるのはなぜですか？","o":["減速するたびにハンドルが機械的にロックされるから。","コンパスがエンジンを止めるから。","シーアンカー（浮き錨）が自動的に投下されるから。","推進用のジェット噴流が操舵力も生み出しており、出力を下げるとそれが弱まるから。"],"c":"操舵能力は設計と推進方式によって異なります。操船を早めに行い、距離をとり、使用する機種の減速・制御機能を知っておいてください。"},{"id":"c4103e0b","q":"転覆した後、水上オートバイはどのように起こすべきですか？","o":["どの機種でも常に時計回りに。","船体またはメーカーのマニュアルに示された方向に。","エンジンをかけたまま、キーのコードを引っ張って。","両方向に繰り返し回して。"],"c":"誤った方向に回すと、機種によってはエンジン内に水が入るおそれがあります。運航前に、操縦者は機種ごとの手順を知っておかなければなりません。"},{"id":"ed94f601","q":"水上オートバイの吸水口グリルに水草が絡まっています。取り除く前に何をすべきですか？","o":["マニュアルに従い、エンジンを止め、安全キーを外し、完全に停止するのを待つ。","エンジンの回転を上げたまま、吸水口に手を入れる。","同乗者に回転中のインペラーへ手を伸ばしてもらう。","エンジンをかけたままバッテリーケーブルを逆につなぐ。"],"c":"ウォータージェットポンプは重大なけがを引き起こすおそれがあります。エンジン作動中は、手、足、髪、衣服を吸水口や噴射口に決して近づけないでください。"},{"id":"4a5ea341","q":"落水後、水上オートバイに再乗艇するのに最も安全な位置はどこですか？","o":["船首から、ハンドルを足がかりにして。","エンジンの回転を上げたまま、噴射口側から。","インペラーを回したまま、どこからでも。","メーカーが指定した位置。通常は船尾から、エンジンを止めた状態で。"],"c":"指定された場所から再乗艇すると、再び転覆する危険や推進装置に触れる危険が減ります。一人ずつ乗り込み、重量を配分し直してください。"},{"id":"72eaff64","q":"水上オートバイの出航前点検には何を含めるべきですか？","o":["シートの外観だけ。","漏れを無視して、燃料の量だけ。","船体、ドレンプラグ、燃料、漏れ、バッテリー、操縦装置、安全キー、救命胴衣、気象、航行区域。","なくさないように安全コードを外しておくこと。"],"c":"メーカーのチェックリストとマニュアルを使ってください。予備を含めて航続距離を計画し、行程を知らせ、操縦装置の故障、漏れ、不適切な気象条件がある場合は出航しないでください。"},{"id":"fa901622","q":"規則に定められた、Motonauta（水上オートバイ免許）の講習の現在の最低時間はどれですか？","o":["実技10分のみ。","座学のみで8時間。","学科講習60分と実技講習60分。","試験前の講習は不要。"],"c":"修了証明は、NORMAM-212/DPCに従い、資格を持つ機関または指導者による講習を受けて発行されなければなりません。最低時間を満たしても、責任ある実地練習が不要になるわけではありません。"},{"id":"e299b354","q":"公式プログラムによると、Motonautaの筆記試験はどのような構成ですか？","o":["記述式100問、8時間。","口頭10問、合格最低点なし。","多肢選択式20問、最長1時間30分、合格点は10点満点中5点。","30分で40問、合格最低点9点。"],"c":"プログラムはNORMAM-212/DPCの付属書（Anexo）3-Cに記載されています。Autoridade Marítima（海事当局）は手続きを更新することがあるため、受験者は受験するCapitania dos Portos（港湾局）の案内を確認してください。"},{"id":"bb0a4f71","q":"「行会い」（roda a roda）の状況、すなわち __________________ の場合、船舶は次のように操船しなければなりません。","o":["船首と船首が向き合い、両船ともそれぞれ自船の右舷側へ変針する","船首と船首が向き合い、両船とも互いに反対の舷側へ変針する","横切りの状況で、両船とも右舷側へ変針する","横切りの状況で、両船とも互いに反対の舷側へ変針する","追い越しの状況で、追い越し船が操船しなければならない"],"c":"行会いの状況：船首と船首が向き合い、両船とも右舷（右）へ変針します。"},{"id":"f7943ef3","q":"曳航索の長さが200メートル未満の曳航船は、何を表示しなければなりませんか。","o":["マストに赤灯2個","マストに白灯1個","マストに白灯3個","マストに白灯2個","マストに白灯4個"],"c":"曳航索200m未満：マストに白灯2個を垂直線上に表示します。"},{"id":"b2d556a3","q":"昼間、マストに黒色の球形形象物を1個掲げた船舶を見かけた場合、その船舶は次のどの状態にありますか。","o":["運転不自由","機関を使用して停留中","錨泊中","トロール漁に従事中","浚渫作業に従事中"],"c":"マストに黒色の球形形象物（球）1個は、錨泊中の船舶を示します。"},{"id":"19f21993","q":"夜間、緑色の明滅する灯火が見え、海図によって港の入口に近づいていることが確認されました。この標識の形状として考えられるのはどれですか。","o":["角錐形。","立方体形。","球形。","円筒形。","円錐形。"],"c":"ブラジルではIALA B地域が適用されます。入港する際、緑の標識は左舷側にあり円筒形です。赤の標識は右舷側にあり円錐形です。訂正：元の資料では「円錐形」とされていました。"},{"id":"4a136f7e","q":"河川の航路標識において、左岸とは次のどの岸をいいますか。","o":["流れの右側にある岸","船舶の右舷側にある岸","船舶の左舷側にある岸","川を遡る人から見て左側にある岸","川を下る人から見て左側にある岸"],"c":"左岸とは、川を下る人（河口に向かう人）から見て左側の岸です。"},{"id":"74037c7d","q":"安全水域標識（águas seguras）が意味するものはどれですか。","o":["流れのない水域","警備されている水域","航行可能な水域","境界の水域","浅い水域"],"c":"安全水域標識は、標識の周囲全体が航行可能な水域であることを示します。"},{"id":"4b5011b2","q":"主な係留索はどれですか。","o":["ヒービングライン、スプリングライン、ブレストライン","ヘッド／スターンライン、スプリングライン、ヒービングライン","ヘッド／スターンライン（lançantes）、スプリングライン（espringues）、ブレストライン（traveses）","船首と船尾のスプリングライン、ヒービングライン","船首と船尾のヘッド／スターンライン、ブレストライン"],"c":"Lançantes（縦方向）、Espringues（スプリングライン：縦方向・前後移動の制止）、Traveses（ブレストライン：横方向）です。"},{"id":"283355c2","q":"プロペラが1基で反時計回りに回転し、舵を中央にして前進している船舶は、どちらへ回頭する傾向がありますか。","o":["左舷へ非常に速く","右舷へゆっくり","右舷へ速く","左舷へゆっくり","右舷へ非常にゆっくり"],"c":"左ピッチ（反時計回り）のプロペラで前進すると、船尾が右舷へ、船首が左舷へ振られる傾向があります。"},{"id":"f356018b","q":"2隻の船舶が狭い水道を反対方向に航行して接近している場合、衝突のおそれがあるときの両船の正しい操船はどれですか。","o":["水道を遡航している船舶は左舷へ、もう一方は右舷へ操船する","水道を遡航している船舶は右舷へ、もう一方は左舷へ操船する","水道を下航している船舶は右舷へ操船し、もう一方は針路を保持する","両船とも自船の右舷側の岸寄りに寄る","両船とも右舷対右舷で航過する"],"c":"狭い水道での基本原則は、できる限り右舷側の岸寄りを航行することです。"},{"id":"66591a9c","q":"錨地から抜錨する際には、どうすべきですか。","o":["錨鎖が船の後方へ「伸びて」いる場合、機関を微速前進にしながら錨を巻き上げていく","錨鎖が前方へ張っている場合、機関を微速前進にしながら錨を巻き上げていく","錨鎖が船体に対して直角になっている場合、機関を微速前進にしながら錨を巻き上げていく","機関を微速後進にしながら錨を巻き上げていく","船首に対する錨鎖の位置を確認しながら錨を巻き上げていく"],"c":"抜錨（錨を揚げること）の際は、揚錨機に無理な力がかからないよう、錨鎖の位置に常に注意を払う必要があります。"},{"id":"fe80bf2f","q":"消火剤である二酸化炭素（CO2）の主な作用と副次的な作用は、それぞれ何ですか。","o":["窒息と隔離","窒息と冷却","冷却と窒息","隔離と冷却","冷却と隔離"],"c":"CO2は主に窒息作用（O2を取り除く）で消火し、副次的に冷却作用で消火します。"},{"id":"a21434df","q":"湿気が多く換気の悪い場所での過度な熱によって人体に生じるものはどれですか。","o":["日射病","低体温症","水分補給","凍傷","熱射病（Intermação）"],"c":"熱射病（Intermação）は閉め切った場所や湿気の多い場所での過度な熱によって起こります（直射日光による日射病とは異なります）。"},{"id":"caff95af","q":"次に挙げる症状のうち、心停止に伴わないものはどれですか。","o":["瞳孔の散大","顔面の紅潮","体温の急速な低下","意識の消失","顔面蒼白"],"c":"心停止では顔面は蒼白またはチアノーゼ（青紫色）になり、紅潮（赤くなる）することはありません。"},{"id":"b96cafd0","q":"止血（hemostasia）の方法のうち、傷病者への害が最も少ないものはどれですか。","o":["止血帯","緊縛","絞扼","切断","圧迫"],"c":"直接圧迫は、より強硬な手段の前に行う、最も簡単で負担の少ない方法です。"},{"id":"c3f13bbe","q":"救命胴衣はどのように保管しておくべきですか。","o":["安全な場所に施錠して保管する","緊急時に使用できるよう、主甲板上に固定せずに置いておく","風雨から守るため、船舶に縛り付けて密閉された場所に保管する","必要なときに取り出しやすい場所に置き、決して船舶に縛り付けない","船舶の倉庫または居住区画に保管する"],"c":"救命胴衣はすぐに取り出せる状態にしておき、決して縛り付けたり施錠したりしてはいけません。"},{"id":"3933da59","q":"違反者は、違反通知書（auto de infração）を受け取った後、何日以内に弁明を提出できますか。","o":["5日","20日","10日","15日","12日"],"c":"違反通知書を受け取った後の事前弁明の期限は15日です。"},{"id":"8148a5ee","q":"環境、乗組員、第三者、または水上交通の安全に損害を与えるおそれのある不備がある外国船舶は、何を命じられることがありますか。","o":["検疫に入ること","乗組員を本国へ送還すること","Autoridade Marítima（海事当局）が定める罰金を支払うこと","管轄水域から退去すること","責任誓約書に署名すること"],"c":"主権と安全の観点から、Autoridade Marítima（海事当局）はブラジル管轄水域（AJB）からの退去を命じることができます。"},{"id":"48c8df11","q":"帆船（veleiro）の免許を取得するための最低年齢と必要な条件はどれですか。","o":["16歳で、ヨットクラブ、組織化されたマリーナ、またはボーイスカウト団体に所属していること。","8歳で、ヨットクラブ、組織化されたマリーナ、または海洋スカウト団体に所属していること。","12歳で、Capitania dos Portos（港湾局）の試験に合格していること。","18歳で、NORMAM 211に従って免許を取得していること。","10歳で、Capitania dos Portos（港湾局）の試験に合格していること。"],"c":"帆船（子ども・青少年）：8歳以上で、海事関連団体に所属していることが条件です。"},{"id":"35ea555e","q":"船の長さ方向のいずれかの位置で、舷側において水面から主甲板（通常は甲板）までを測った垂直距離を何といいますか。","o":["ブルワーク（Borda Falsa）","乾舷（Borda Livre）","没水部（Obras Vivas）","防舷材（Verdugo）","半舷（Meia Borda）"],"c":"乾舷とは、喫水線から甲板までの距離です。"},{"id":"c1ffe62a","q":"船首付近の右舷側または左舷側にある、舷側の湾曲した部分を何といいますか。","o":["船尾側の舷側（クォーター）","船幅","縦通材","船首側の舷側（バウ）","甲板"],"c":"船首側の「湾曲部」がバウ（bochechas）、船尾側の湾曲部がクォーター（alhetas）です。"},{"id":"ff8f1b9c","q":"次のうち、正しいものはどれですか。","o":["泡は腐食性が強いため、ガソリン火災の消火には使用できない","水は発火温度を下げるので、ガソリン火災の消火に水を使用できる","海水はガソリンを溶かして速やかに混ざり合い、火災を消す","泡は非常に冷たいため、冷却作用によってガソリン火災を消す","ガソリンの発火温度は水の温度よりも低いため、ガソリン火災の消火に水を使用することはできない"],"c":"液体燃料（B類火災）に水をかけると、消火するどころか火を広げてしまいます。"},{"id":"2ee95428","q":"国際海上衝突予防規則（RIPEAM/COLREG）によれば、球形形象物（球）、円錐形などの形象物はいつ表示しなければなりませんか。","o":["昼間または夜間","夜間のみ","昼間のみ","視界制限時のみ","操船中の場合"],"c":"形象物（幾何学的な形）は昼間に表示するものです。夜間は灯火を使用します。"},{"id":"521a9fd7","q":"国際海上衝突予防規則（RIPEAM/COLREG）によれば、狭い水道で、ある船が自船を追い越そうとして長音2回と短音1回を鳴らしました。同意する場合、自船はどうすべきですか。","o":["相手船は自船の左舷側を追い越すので、長音4回を鳴らして右舷へ変針する","4回の汽笛（長音、短音、長音、短音）を鳴らし、自船の右舷側を安全に追い越せるよう操船する","相手船は自船の左舷側を追い越すつもりなので、針路と速力を一定に保つ","相手船は自船の右舷側を追い越すつもりなので、針路と速力を一定に保つ","相手船は自船の左舷側を追い越すので、長音1回を鳴らし、右舷へ変針して減速する"],"c":"長音2回と短音1回：右舷側を追い越す意図を示します。同意：長音・短音・長音・短音です。"},{"id":"2eda24ca","q":"国際海上衝突予防規則（RIPEAM/COLREG）によれば、衝突のおそれがある状況において、操船する義務のない船舶を何と呼びますか。","o":["優先権のない船舶","操船する船舶","優先権のある船舶","操船する義務のある船舶","追い越される船"],"c":"操船しない船舶は「優先権のある」船舶、すなわち保持船（針路・速力を保持する船）です。"},{"id":"e412fa95","q":"次のうち、スポーツ・レクリエーション用船舶の事故発生に最も寄与しないものはどれですか。","o":["無免許者による船舶の操縦","船舶のあらゆる設備の整備不良","航行予定の海域での霧の発生","離岸前の操縦者の飲酒","船舶の速力超過"],"c":"霧は自然の要因です。それ以外（飲酒、無免許など）は直接的な人為的ミスです。"},{"id":"65f4d368","q":"中型船舶が沿岸航行を行う場合、NORMAM-211の規定によれば、次のうち搭載が不要なものはどれですか。","o":["救命いかだ。","磁気コンパス。","汽笛。","錨（アンカー）。","火工品（信号用）。"],"c":"中型（24mまで）の沿岸航行では、支援・救助用の船舶がある場合、救命いかだは不要です。"},{"id":"5a478a51","q":"航行中の船上で、骨折した脚を固定するために即席で使えるものは何ですか。","o":["ハリヤードとボーライン（係船索）。","舵板とホーサー。","何らかの硬い材料と布の帯。","舵輪のスポークと錨鎖。","船尾材と布の帯。"],"c":"応急手当：硬い材料と布のひもで副木（添え木）を即席で作ります。"},{"id":"ec8f4639","q":"内陸水路で、オレンジ色の四角い標板に黒色で「R」の文字が描かれているものを見た場合、それは何を意味しますか。","o":["引き返せ","航行制限","転回禁止","進むべき針路","減速"],"c":"オレンジ色の標板に黒の「R」＝減速（Redução de Velocidade）です。"},{"id":"00115d5a","q":"GPS（全地球測位システム）と呼ばれる機器が、どの大きさの船舶でも義務とされないのは、次のどの場合ですか。","o":["外洋を航行しているとき","外洋でスポーツフィッシングをしているとき","内水航行をしているとき","沿岸航行をしているとき","錨泊しているとき"],"c":"内水航行（河川、湖、湾）では、GPSは義務的な搭載品ではありません。"},{"id":"fee6b113","q":"日射病の正しい手当てとして、どうすべきですか。","o":["入浴や冷たい湿布で体を冷やす","コーヒーや紅茶などの軽い刺激物を与える","迷った場合は人工呼吸を行う","患者を座らせるか立たせる","乾いた毛布で体を温かく保つ"],"c":"日射病の手当ては、体温を徐々に下げることが中心です。"},{"id":"04d41153","q":"平穏水域で内水航行を行う場合、赤色の手持ち信号灯（facho manual）1個の搭載が義務となるのは、次のどれだけですか。","o":["大型船舶","公的機関の船舶","零細漁業の船舶","小型船","帆船"],"c":"手持ち信号灯は、平穏水域であっても大型船舶（ヨット）には義務付けられています。"},{"id":"b6f15673","q":"溺れた人への応急手当において、手当てを始める際の傷病者の正しい体位はどれですか。","o":["仰向けに寝かせ、頭を横に向ける","うつ伏せに寝かせ、頭を横に向ける","どの体位でも手当てを行うことができる","横向きに寝かせ、頭を下に向ける","頭をまっすぐにして立たせるか座らせる"],"c":"仰向けに寝かせて頭を横に向けると、最初に水や吐物を排出しやすくなります。"},{"id":"377701fb","q":"連邦法9.537/97（LESTA）および政令第2.596/98号（RLESTA）によれば、ブラジルにおけるAutoridade Marítima（海事当局）はどれですか。","o":["Marinha do Brasil（ブラジル海軍）","Capitania dos Portos（港湾局）","港湾沿岸局（Diretoria de Portos e Costas, DPC）","運輸省","国家水資源庁"],"c":"ブラジルにおけるAutoridade Marítima（海事当局）は、Marinha do Brasil（ブラジル海軍）の司令官が担います。"},{"id":"a0d18cb4","q":"理論上、緊急時にすばやく回頭するために舵に与える理想的な角度は、およそ何度ですか。","o":["希望する舷側へ10°","希望する舷側へ60°","希望する舷側へ35°","希望する舷側へ45°","希望する舷側へ90º"],"c":"舵が最も効率よく働く角度は、一般に30°から35°の間です。"},{"id":"fe6b4686","q":"レジャーダイビング（mergulho amador）の支援のため操縦性能が制限されている船舶は、昼間、何を表示しなければなりませんか。","o":["「Charlie」旗を表示し、白い斜めの帯の入った緑色の旗を表示することができる","「Oscar」旗を表示し、緑の斜めの帯の入った赤色の旗を表示することができる","「Mike」旗","「Alfa」旗を表示し、白い斜めの帯の入った赤色の旗を表示することができる","「Zulu」旗を表示し、緑の斜めの帯の入った赤色の旗を表示しなければならない"],"c":"ダイビング：A旗（国際信号旗のAlfa）または白い帯の入った赤色の旗です。"},{"id":"f2e48822","q":"右ピッチのプロペラを1基持つ船舶が、舵を左舷いっぱいに取り、停止状態からプロペラを反時計回りに回転させた場合、船首はどうなりますか。","o":["後方へ進む","右舷へゆっくり回頭する","反時計回りに円を描く","左舷へ速く回頭する","時計回りに円を描く"],"c":"右ピッチのプロペラで後進（反時計回り）すると、船尾は左舷へ、船首は右舷へ振られます。"},{"id":"e5482aa3","q":"第1度熱傷（やけど）の特徴として現れるものはどれですか。","o":["皮膚がむける","水ぶくれ","黒く焦げた穴","皮膚表面の発赤","触覚の消失"],"c":"第1度：発赤（例：日焼け）。第2度：水ぶくれ。第3度：組織の破壊。"},{"id":"9b528514","q":"口対口人工呼吸と心臓マッサージを併用する方法で、傷病者の体のどの部位に心臓マッサージを行うのが正しいですか。","o":["背中の中央。","腹部の下3分の1。","胸骨の下3分の1。","尺骨の下3分の1。","肋骨の中央。"],"c":"心臓マッサージは胸骨（胸の中央）の上で行います。"},{"id":"5255e199","q":"水分摂取が不十分なことによる脱水状態を示す症状の一つはどれですか。","o":["めまい","のどの渇き","呼吸困難","けいれん","唾液が出ない"],"c":"脱水の第一の、そして最もわかりやすい症状はのどの渇きです。"},{"id":"9f65ff9a","q":"水道や河川、特に狭いところでは、大型船舶（20メートルを超えるもの）は小型船に対して何を持っていますか。","o":["自船の右舷側を相手のために空けておく","相手の状況にかかわらず自船の針路と速力を保持する","優先権","操船する義務","常に右舷へ操船する義務"],"c":"狭い水道では、小型船（20m未満）は、水道内でしか安全に航行できない大型船の通航を妨げてはなりません。そのため大型船に優先権があります。"},{"id":"272e1924","q":"長音の汽笛の長さはどれくらいですか。","o":["4〜6秒","1秒","2秒","1分","3秒"],"c":"短音は約1秒、長音は4〜6秒です。"},{"id":"0ffc09c5","q":"追い越し船とみなされるのは、他の船舶にどのように接近する船舶ですか。","o":["相手船と反対方向から、より速い速力で","相手船と同じ方向へ、より遅い速力で","相手船の正横後67.5度を超える方向から、より速い速力で","相手船と反対方向から、より遅い速力で","相手船の正横後22.5度を超える方向から、より速い速力で"],"c":"追い越し船とは、相手船の正横後22.5°を超える方向から、より速い速力で接近する船です。夜間は、相手船の船尾灯（船尾）しか見えない位置にあります。"},{"id":"8188ef15","q":"夜間、最もよく見える場所に赤色の全周灯2個を垂直線上に表示している船舶は、どのような船舶ですか。","o":["水道内にいる","運転不自由","付近にダイバーがいる","錨泊中","操縦性能制限"],"c":"垂直線上の赤色全周灯2個は運転不自由船を示します。昼間は、これに相当するものとして黒色の球形形象物2個を表示します。"},{"id":"5688782d","q":"「航行中（em movimento）」という用語は、次のどの船舶すべてに適用されますか。","o":["錨泊している","係留されている","錨泊、陸岸への係留、または乗揚げのいずれもしていない","乗り揚げている","着岸している"],"c":"RIPEAMによれば、錨泊、陸岸への係留、乗揚げのいずれもしていない船舶は、たとえ停止していても航行中です。"},{"id":"1f1ef914","q":"長音2回に続く短音1回は何を意味しますか。","o":["機関を停止している","後進している","貴船の左舷側を追い越す意図がある","貴船の右舷側を追い越す意図がある","どちらの舷側からでも追い越す意図がある"],"c":"狭い水道では：長音2回と短音1回＝貴船の右舷側を追い越す意図、長音2回と短音2回＝左舷側を追い越す意図です。"},{"id":"fb697d99","q":"無灯浮標（bóia cega）について正しいものはどれですか。","o":["断続的な光を発する","光を発しない","非常に速い光を発する","黄色の光を発する","白色の光を発する"],"c":"無灯浮標とは灯火のない浮標です。昼間に、色、形状、頭標によってのみ識別されます。"},{"id":"ab1de4c5","q":"昼間の標識の識別は、何によって行いますか。","o":["形状と色のみ","頭標、色、音","頭標、形状、色","頭標、色、大きさ","頭標と色のみ"],"c":"昼間、標識は頭標、形状、色の3つの要素で識別します。夜間は灯火の色と光り方（リズム）で識別します。"},{"id":"4d740626","q":"優先航路が左舷側にあることを示す航路標識の灯色は何色ですか。","o":["緑","青","白","黄","赤"],"c":"優先航路が左舷側にある標識は、緑の帯が入った赤の標識です。IALA B地域では灯色は主となる色に従い、赤になります。"},{"id":"0eb51097","q":"通常、錨泊する際に使用する錨鎖の長さを決める簡単な目安はどれですか。","o":["最低でもその場所の水深の2倍","最低でもその場所の水深の4倍","最低でもその場所の水深の3倍","最低でもその場所の水深の1.5倍","最低でもその場所の水深の6倍"],"c":"実用的な目安：最低でもその場所の水深の3倍の錨鎖を繰り出します。荒天時や底質が悪い場合は、さらに増やします。"},{"id":"e160e8a0","q":"荒れた海で大きな波を乗り越えるには、エンジンの加速と減速をどのように行うべきですか。","o":["波を上るときに減速し、下る前に加速する","波を上るときに加速し、下るときも加速し続ける","上りでも下りでも加速しない","波の上りでも下りでも速力を一定に保つ","波を上るときに加速し、下る前に減速する"],"c":"行き足を失わないよう波を上るときに加速し、次の波に船首が突っ込まないよう下る前に減速します。"},{"id":"3ab973cd","q":"人が水中に落ちた場合、すなわち「落水者（マンオーバーボード）の状況」で、プロペラが残した航跡の上を正確に反対針路で戻るには、何を使うべきですか。","o":["「レーストラック」ターン","ウィリアムソン・ターン","プーチン操船","ブタコフ・ターン","ゼマン操船"],"c":"ブタコフ・ターンは船舶を反対針路に向け、自船の航跡をたどって落水地点まで戻らせます。"},{"id":"d7d1c3f0","q":"C類火災とはどれですか。","o":["消火剤の存在下で発生するもの","可燃性の固体物質で発生するもの","可燃性の液体で発生するもの","電気機器で発生するもの","可燃性の金属で発生するもの"],"c":"A類＝固体（おき火と灰が残る）、B類＝可燃性液体、C類＝通電中の電気機器、D類＝自然発火性金属です。"},{"id":"afd43eb1","q":"繊維質または固体の物質が関わり、残留物としておき火や灰を残す火災を何といいますか。","o":["「C」類火災","「E」類火災","「A」類火災","「B」類火災","「D」類火災"],"c":"おき火や灰を残す固体物質（木材、紙、布）はA類です。主に水による冷却で消火します。"},{"id":"4f90437d","q":"泡消火器を使用するには、どうすべきですか。","o":["レバーを握り、噴射を炎に向ける","作動バルブを開く","安全ピンを抜き、電気機器に向ける","レバーを握り、可燃性液体に向ける","消火器をふたを下にしてひっくり返し、噴射を炎の根元に向ける"],"c":"化学泡消火器は、ふたを下にしてひっくり返すことで薬剤が混ざり作動します。噴射は炎の根元に向けます。"},{"id":"6f7331b7","q":"傷の主な合併症は何ですか。","o":["出血と発熱","水ぶくれと出血","感染とやけど","出血と感染","水ぶくれとやけど"],"c":"傷の二大リスクは出血（血液の喪失）と感染です。そのため、出血を止め、傷を保護します。"},{"id":"1eedc7a5","q":"自船の誰かが海に落ちた場合、どうすべきですか。","o":["消防に電話する","救命浮環を投げ、落水者から目を離さず、操船している人に知らせる","短音3回を鳴らす","A旗（Alfa）を掲げる","長音2回を鳴らす"],"c":"まず救命浮環を投げ、次に落水者を常に視界に入れておき、操船している人に知らせます。"},{"id":"715bbe76","q":"救命いかだの天幕（カバー）はどのようなものですか。","o":["海になじむ青色","風雨に耐えるガラス繊維製","サメを遠ざける黄色の帆布","熱を吸収しにくい白色","発見しやすいオレンジ色"],"c":"オレンジ色や黄色は海との対比が最も大きく、救助側から発見されやすくなります。"},{"id":"f60f447d","q":"乗船して船舶の運航業務に従事する船員（aquaviário）またはアマチュア操縦者を何といいますか。","o":["アマチュア操縦者","旅客","乗組員","船員（aquaviário）","船舶所有者（運航者）"],"c":"乗組員とは、船上で船舶の運航業務に従事する人です。旅客は船上での職務を持ちません。"},{"id":"782cb100","q":"酒に酔った状態で船舶を操縦した場合の罰則はどれですか。","o":["免許証の60日以内の停止","免許証の120日以内の停止。再犯の場合、違反者は免許証取消しの処分を受ける","免許証の90日以内の停止","免許証の取消し","免許証の無期限停止"],"c":"飲酒（酩酊）：免許証の最長120日の停止。再犯の場合は取消しとなります。"},{"id":"71ad5559","q":"救命いかだのシーアンカー（浮き錨）を水中に入れておくのは、何を減らすためですか。","o":["波の高さ","風","漂流速度","転覆の可能性","サメの危険"],"c":"シーアンカー（ドローグ）はいかだの漂流を減らし、捜索が開始される遭難地点の近くにいかだをとどめます。"},{"id":"bf08b2fd","q":"「B」類火災に使用する消火器は、何によって識別されますか。","o":["黄色の星","青色の円","赤色の四角","青色の三角","緑色の三角"],"c":"火災分類の記号：A＝緑の三角、B＝赤の四角、C＝青の円、D＝黄色の星です。"},{"id":"646c152a","q":"（動力付きの）レジャーボート上で、最も危険で最も燃えやすく、したがって特別な注意が必要な可燃物はどれですか。","o":["ガラス繊維。","木材。","紙類。","配電盤。","液体燃料。"],"c":"液体燃料（ガソリン）は可燃性の蒸気を発生させ、ビルジ（船底）にたまります。始動前に区画を換気してください。"},{"id":"1137ef1a","q":"罰則加重の対象となる再犯とは、同じ違反をどれだけ以内の期間に繰り返すことですか。","o":["1か月","6か月","9か月","12か月","3か月"],"c":"再犯とは、同じ違反を12か月以内に繰り返すことです。罰則が加重されます。"},{"id":"9c97e5d2","q":"国際海上衝突予防規則（RIPEAM/COLREG）によれば、昼間、喫水により操縦が制限されている船舶は、マストにどの形象物を掲げなければなりませんか。","o":["青色の円錐形1個。","黒色の球2個。","黒色の球1個。","青色の球1個。","黒色の円筒形1個。"],"c":"喫水制限船：昼間は黒色の円筒形1個、夜間は赤色の全周灯3個を垂直線上に表示します。"},{"id":"fbf7dec9","q":"救命胴衣の使用に関して、出航前に行うことが望ましいのはどれですか。","o":["救命胴衣を即席で作ること","子どもと大人の人数を数えること","救命胴衣の使い方を実演すること","他の船から救命胴衣を借りること","乗船者の人数を数えること"],"c":"出航前に、救命胴衣の置き場所と着用方法を全員に実演して見せましょう。緊急時には覚える時間はありません。"},{"id":"99732c14","q":"燃料との化学反応において、最も一般的な支燃物はどれですか。","o":["水素","酸素","窒素","二酸化炭素","ヘリウムガス"],"c":"燃焼の三要素：可燃物、支燃物、熱。一般的な支燃物は空気中の酸素です。"},{"id":"bb65db08","q":"化学泡消火器は、基本的にどのような原理で火元に作用しますか。","o":["窒息","除去","連鎖反応の抑制","冷却","拡散"],"c":"泡は可燃物を酸素から遮断する層を作ります。窒息による消火です。"},{"id":"3d855b1f","q":"次のうち、航海灯を使用する状況でないものはどれですか。","o":["夜間、船舶が漂流している（a matroca）とき","船舶が岸壁に着岸しているとき","夜間","必要なとき","視界制限時"],"c":"航海灯は日没から日出までの間と視界制限時に使用します。岸壁に着岸している船舶には不要です。"},{"id":"b994289c","q":"できる限り船尾近く、または船尾板（トランサム）に設置され、後方から来る者にのみ見える、水平135°の範囲を照らす白色の連続灯を何といいますか。","o":["曳航灯","マスト灯","船尾灯","舷灯","船尾の灯火（luz de popa）"],"c":"船尾灯は白色で船尾にあり、135°の範囲を照らします。後方から来る船に見える灯火です。"},{"id":"815071a3","q":"長さ12メートル未満のスポーツ・レクリエーション用船舶は、通常何を表示しますか。","o":["舷灯と船首の黄色灯1個","舷灯（緑と赤）と船首先端の白灯1個","両色灯（緑と赤の舷灯を組み合わせたもの）と白色の全周灯1個","白色の全周灯1個のみ","舷灯（緑と赤）のみ"],"c":"12m未満では、両色灯（組み合わせた舷灯）と、マスト灯・船尾灯の代わりとなる白色の全周灯1個を使用することが認められています。"},{"id":"13c64eb4","q":"船舶のマストに設置され、正横または船首方向から来る者に見える、水平225°の範囲を照らす白色の連続灯を何といいますか。","o":["船首灯","マスト灯","船尾灯","航空灯","衝突灯"],"c":"マスト灯は白色で船体中心線上にあり、船首から各舷の正横後22.5°までの225°の範囲を照らします。"},{"id":"25c4e0b2","q":"右舷側の浮標は、夜間に何色の光を発しますか。","o":["緑","赤","黄","青","白"],"c":"IALA B地域（ブラジル）：右舷標識は赤色・円錐形で赤色の灯火、左舷標識は緑色・円筒形で緑色の灯火です。訂正：元の資料では「緑」とされていましたが、これはIALA A地域のものです。"},{"id":"83ffe153","q":"潜水作業中の船舶は、何を表示しなければなりませんか。","o":["G旗（Golf）","A旗（Alfa）","D旗（Delta）","M旗（Maik）","B旗（Bravo）"],"c":"A旗（白と青）＝水中にダイバーがいます。距離を保ち、ゆっくり通過してください。"},{"id":"4522d6b2","q":"船上で火災が発生した場合、消火にあたるにはどの位置に立つべきですか。","o":["炎と煙の風下に立つ。","船首または船尾に立つ。","煙の流れる方向の左舷側に立つ。","炎と煙の風上に立つ。","船体中央に立つ。"],"c":"風上（風が吹いてくる側）から消火します。煙と熱は自分から遠ざかっていきます。"},{"id":"6094f465","q":"水は、次のどの火災に使用できる消火剤ですか。","o":["可燃性の金属","可燃性の固体物質","電動機","航海機器","可燃性の液体"],"c":"水は冷却作用で消火し、A類（固体）に適しています。電気、可燃性液体、金属には使用しないでください。"},{"id":"262db5cb","q":"船上で火災が発生した場合、次のうち適切でない対応はどれですか。","o":["船上にある持ち運び式消火器を使って消火を試みる。","爆発の危険があるため、消火を試みずに直ちに船舶を放棄する。","炎が人から遠ざかるように船舶を変針させる。","人を炎の風上に移動させ、救命胴衣を着用させる。","他の船舶に自船が危険な状況にあることを知らせる。"],"c":"消火を試みずに放棄するのは不適切です。まず消火を試み、人を風上に移動させて救命胴衣を着用させ、救助を求めます。"},{"id":"d4d0bac9","q":"「D」類火災の消火剤はどれですか。","o":["機械泡","水","化学泡","粉末消火剤（ドライケミカル）","CO2"],"c":"自然発火性金属（D類）には専用の粉末消火剤が必要です。水は金属と反応して火災を悪化させるおそれがあります。"},{"id":"2eb43342","q":"感電している傷病者を電流から引き離すために使用してはならない材料はどれですか。","o":["陶磁器の部品。","木片。","タイヤの切れ端。","金属の部品。","プラスチックの部品。"],"c":"金属は電気を通します。木材、ゴム、プラスチックなど、乾いた絶縁性の材料を使用してください。"},{"id":"00c48265","q":"次のうち、スポーツ・レクリエーション用船舶に義務付けられている救命設備でないものはどれですか。","o":["救命浮環","救命艇","救命胴衣","火工品（信号用）","救命いかだ"],"c":"救命艇（baleeira）は大型船舶の救命ボートであり、スポーツ・レクリエーション用船舶には義務付けられていません。"},{"id":"9caf67b7","q":"河川、湖、運河、潟湖、湾、入り江、小湾、遮蔽された海域とされる内陸水路で行う航行は、どのように分類されますか。","o":["淡水","河川航行","湖沼航行","内水航行","閉鎖海"],"c":"内水航行：河川、湖、運河、潟湖、湾、入り江、小湾、遮蔽された海域。これがArrais-Amador（小型船舶操縦免許）の航行範囲の限界です。"},{"id":"86ae8f42","q":"違反の加重事由となるものはどれですか。","o":["外国人であること","燃料切れ","再犯","汚染","損害"],"c":"再犯は加重事由であり、科される罰則が重くなります。"},{"id":"325ad749","q":"船舶の登録抹消となる2つの状況はどれですか。","o":["押収と所有者の死亡","沈没と放棄","既に登録されている他の船舶と同じ名称であることと押収","年会費の未払いと事故への関与","所有者の死亡と、事故による死者を伴う衝突"],"c":"船舶が存在しなくなった場合、または使用されなくなった場合に登録は抹消されます：沈没（滅失）と放棄です。"},{"id":"1ac6b8a3","q":"違反通知書（auto de infração）が作成された後、違反者に与えられるものはどれですか。","o":["弁明を提出するための30営業日の期限","弁明を提出するための60営業日の期限","弁明を提出するための30暦日の期限","弁明を提出するための15営業日の期限","弁明を提出するための7営業日の期限"],"c":"違反通知書の作成後、違反者は15営業日以内に弁明を提出できます。"},{"id":"b3ece79b","q":"他の要因に加え、遭難者の生存は海水温に応じた水中での滞在時間に左右されます。気温（空気の温度）に関しては、人への影響は何と密接に関係していますか。","o":["前線系","海流","気圧","風速","雲"],"c":"風は体からの熱の損失を増やします（体感温度）。風が強いほど低体温症の危険が高まります。"},{"id":"a8d3a725","q":"血液が目に見える場合、その出血を何といいますか。","o":["外出血","静脈性出血","内出血","動脈性出血","表在性出血"],"c":"血液が外に見えていれば外出血です。内出血は目に見えず、顔面蒼白やショックなどの兆候で気づきます。"},{"id":"64ecc449","q":"第3度熱傷（やけど）では、どうなりますか。","o":["皮膚が赤くなり、軽い痛みがある","皮膚が完全に破壊されている","表面が柔らかく湿っている","水ぶくれがあるのが特徴である","痛みがない"],"c":"第1度：発赤。第2度：水ぶくれ。第3度：皮膚のすべての層が破壊され、神経が損傷しているため痛みを感じないこともあります。"},{"id":"ed9e6452","q":"国際海上衝突予防規則（RIPEAM/COLREG）によれば、舷灯（右舷は緑、左舷は赤）は、どの角度で見えますか。","o":["船尾から122.5°","船首から132.5°","船尾から102.5°","船首から112.5°","船尾から135.5°"],"c":"舷灯は船首から正横後22.5°までの112.5°の範囲を照らします。2つの舷灯を合わせると、マスト灯と同じ225°になります。"},{"id":"11a7de15","q":"自分のモーターボートの配電盤で火災が発生した場合、優先的に使用すべき消火器はどれですか。","o":["ハロンガス","加圧水","CO2","粉末消火剤","泡"],"c":"電気機器（C類）には電気を通さない消火剤が必要です。残留物を残さないCO2が最適です。"},{"id":"92137203","q":"船尾付近の右舷側または左舷側にある、舷側の湾曲した部分を何といいますか。","o":["船尾側の舷側（クォーター）","船幅","ブライドル（pés de galinha）","船首側の舷側（バウ）","縦通材"],"c":"船尾付近の舷側の湾曲部がクォーター（alhetas）、船首付近がバウ（bochechas）です。"},{"id":"6d179193","q":"国際海上衝突予防規則（RIPEAM/COLREG）によれば、昼間に船舶がさまざまな状態を示すために使用する球形形象物、円錐形などの形象物は何色ですか。","o":["黄","緑","白","黒","赤"],"c":"RIPEAMの昼間の形象物（球、円錐形、円筒形、鼓形）はすべて黒色です。"},{"id":"2b4f3ce8","q":"船首と船尾に重量が多く、船体中央部の重量が少ない船は、強く高い波を受けると中央から折れる危険があるといわれます。この状態を何といいますか。","o":["トリム調整済み","操舵不能","直立（正立）","サギング（contra-alquebramento）","ホギング（alquebramento）"],"c":"両端に重量があると両端が下がり中央が持ち上がります：ホギング（alquebramento）。中央に重量があると逆になります：サギング（contra-alquebramento）。"},{"id":"1d8b1bd2","q":"開放骨折の場合、してはならないことはどれですか。","o":["出血を止める","鎮痛剤を与える","傷病者に水を与える","骨折した手足を固定する","骨折した骨を元の位置に戻す"],"c":"骨を元の位置に戻そうとしては決していけません。出血を止め、傷を覆い、手足をそのままの状態で固定します。"},{"id":"520bb0b6","q":"同じ入り江に8隻の船舶が錨泊している場合、どのような点に注意すべきですか。","o":["昼夜の見張り","各船が錨を中心に振れ回れるよう、船同士の間に十分な間隔をとる","錨を互いに非常に近い位置に掛ける","係留索に触れないよう、ボートのドライブ（ラベタ）を上げておく","陸岸から適切な距離"],"c":"錨泊中の船舶は、風や潮流によって自船の錨を中心に振れ回ります。振れ回りの際に衝突しないよう間隔を空けましょう。"},{"id":"bac1e8e6","q":"Arrais-Amador（小型船舶操縦免許）の取得のために、申請者はスポーツ・レクリエーション用船舶または類似の船舶で何時間の訓練を証明しなければなりませんか。","o":["7時間","20時間","6時間","10時間","3時間"],"c":"資料ではArrais-Amador（小型船舶操縦免許）には6時間の訓練の証明が必要とされています。所轄のCapitania dos Portos（港湾局）で現行のNORMAMを確認してください。"}]</script>
<script type="application/json" id="cartoes-ja">[{"i":0,"x":"船舶、乗組員、旅客および乗組員以外の専門職の安全のためのすべての資材・設備は、事前にDiretoria de Portos e Costas（DPC、港湾沿岸局）の承認を受けなければなりません。"},{"i":1,"x":"Inspeção Naval（海上検査）は、Capitania、Delegacia、Agênciaが行う行政的な活動であり、DPCが規則の監督者としての役割を果たすのを補佐します。"},{"i":2,"x":"アマチュア免許の停止または押収の対象となる行為は次のとおりです：無免許者に船舶の操縦を任せること、酒に酔った状態またはあらゆる種類の有害物質の影響下で船舶を操縦すること、船舶を旅客や貨物の商業輸送に使用すること、または船舶を犯罪に使用すること。"},{"i":3,"x":"NORMAM-03では、アマチュアを次のように定義しています：スポーツおよび/またはレクリエーション用の船舶を非職業的に操縦するため、Autoridade Marítima（海事当局）により認定された免許を持つすべての者。"},{"i":4,"x":"Veleiro（帆船免許）は、内水航行の範囲内で、エンジン推進のない帆船を操縦できます（最低年齢8歳、ヨットクラブ、整備されたマリーナ、または海洋スカウト団体に所属している必要があります）。"},{"i":5,"x":"Motonauta（水上オートバイ免許）は、内水航行の範囲内で水上オートバイを操縦できます（最低年齢18歳）。"},{"i":6,"x":"Arrais-Amador（小型船舶操縦免許）は、内水航行の範囲内で船舶を操縦できます（最低年齢18歳）。"},{"i":7,"x":"Mestre-Amador（沿岸航行免許）は、沿岸航行の範囲内で、国内港と外国港の間で船舶を操縦できます。"},{"i":8,"x":"Capitão-Amador（外洋航行免許）は、沿岸からの距離の制限なく、つまり地理的な制限なしに、国内港と外国港の間で船舶を操縦できます。"},{"i":9,"x":"アマチュア免許証の有効期間は10年で、試験を受けることなく更新できます。"},{"i":10,"x":"海上、港内または内水航路において人命が危険にさらされていることを知った者は誰でも、できるだけ速やかにその事実をAutoridade Marítima（海事当局）に通報しなければなりません。"},{"i":11,"x":"アマチュアの免許が取り消されるのは次の場合です：免許証が停止されているにもかかわらず船舶を操縦しているところを発見された場合、免許証の停止を繰り返した場合。"},{"i":12,"x":"アマチュアの試験の実施を担当する機関は、Capitania dos Portos（港湾局）およびその下部機関（DelegaciaおよびAgência）です。"},{"i":13,"x":"規則の遵守を監督するCapitania dos Portos（港湾局）の部署は、Inspeção Naval（海上検査）です。"},{"i":14,"x":"スポーツ・レクリエーション用船舶の所有者とは、その船舶を自分の名義で登録した者です。"},{"i":15,"x":"船舶の登録はTribunal Marítimo（海事裁判所）で行われ、Provisão de Registro de Propriedade Marítima（PRPM、海上所有権登録証）が発行されます。"},{"i":16,"x":"長さ24メートル以上かつ総トン数（AB）100を超えるすべての船舶は、Tribunal Marítimo（海事裁判所）への登録が義務付けられています。"},{"i":17,"x":"海事当局は、違反に起因する債務を負っている者に関するあらゆる書類や行政手続きの進行を、その債務が完済されるまで停止します。"},{"i":18,"x":"海水浴客専用区域を航行すると、免許証が最大60日間停止されることがあります。"},{"i":19,"x":"海岸の利用の規制は市町村の権限です。"},{"i":20,"x":"RLESTAに定められた範囲内で、罰金の額および免許証の停止期間を定める権限は、海事当局の代表者にあります。"},{"i":21,"x":"船舶の運航において船上で職務を行う乗船中のAquaviário（船員）またはアマチュアは、Tripulante（乗組員）と呼ばれます。"},{"i":22,"x":"船舶を安全に運航するために必要な最少の乗組員数は「Tripulação de Segurança（安全配員）」と呼ばれます。"},{"i":23,"x":"船舶押収の原因となった不備が期限内に是正されない場合、その船舶は競売にかけられるか、国（União）の財産に編入されます。"},{"i":24,"x":"船舶押収の原因となった不備を是正し、競売や国（União）の財産への編入を避けるためにLESTAが定める期限は90日です。"},{"i":25,"x":"船舶の押収が起こり得る3つの状況は、保存状態が極めて悪い場合、商業的に使用された場合、および安全区域を航行した場合です。"},{"i":26,"x":"違反者は、違反通知書を受け取った後、15日以内に弁明を提出することができます。"},{"i":27,"x":"酒に酔った状態で船舶を操縦した場合の罰則は、免許証の最大120日間の停止です。再犯の場合、違反者は免許証取消しの処分を受けます。"},{"i":28,"x":"酒に酔った状態、または麻薬・有害物質を使用した後に船舶を操縦することは、法律で定める犯罪に当たらない場合、免許証の最大120日間の停止となります。再犯の場合は免許証の取消しとなります。"},{"i":29,"x":"同一の違反を繰り返した場合、罰金または免許証停止の処分であれば、その処分を定める条文が別の手続きを定めていない限り、罰則は2倍、3倍というように順次倍加されます。"},{"i":30,"x":"NORMAM-03では、定員を、乗組員を含めて乗船が認められる最大人数と定義しています。"},{"i":31,"x":"LESTAによれば、航路標識に損害を与えた違反者は、それを修復する義務を負います。"},{"i":32,"x":"RLESTAによれば、航路標識に損害を与えた違反者は、罰金または免許証の最大60日間の停止の対象となります。"},{"i":33,"x":"石油プラットフォームからの最小錨泊距離は500メートルです。"},{"i":34,"x":"波が砕ける線、または湖や潟の場合は水面が始まる線を、基線（linha base）と呼びます。"},{"i":35,"x":"NORMAM-03で定められた航行区分区域において、オールまたは帆で推進する船舶は、基線から100メートル以上離れた水域を航行できます。"},{"i":36,"x":"NORMAM-03で定められた航行区分区域において、エンジン推進の船舶、水上スキーやパラセーリングの曳航、広告パネルの曳航は、基線から200メートル以上離れた水域を航行できます。"},{"i":37,"x":"すべての船舶は、Capitania dos Portos（港湾局）またはその下部機関（DelegaciaおよびAgência）に登録しなければなりません。"},{"i":38,"x":"罰則の等級付けにおける再犯とは、12か月以内の期間に同一の違反を繰り返すことです。"},{"i":39,"x":"再犯は、違反の加重事由となります。"},{"i":40,"x":"輸入された救命設備を船上で使用するには、所有者はDiretoria de Portos e Costas（DPC）で認証を受けなければなりません。"},{"i":41,"x":"内水用に分類された船舶は、どのArrais-Amador（小型船舶操縦免許）保持者でも操縦できます。"},{"i":42,"x":"外洋用に分類された船舶が、その区分の水域を航行する場合、Capitão-Amador（外洋航行免許）保持者のみが操縦できます。"},{"i":43,"x":"航行に出る前に、航行計画または出航通知を提出することが義務付けられています。"},{"i":44,"x":"押収された船舶は、Autoridade Marítima（海事当局）が指定する場所に収容されなければなりません。"},{"i":45,"x":"安全区域とは、航行および錨泊が禁止された区域です。"},{"i":46,"x":"船上のすべての人は、船長の権限に従います。"},{"i":47,"x":"船長は、その職務の遂行にあたり、人、船舶および輸送貨物の安全を確保するため、いかなる人に対しても下船を命じることができます。"},{"i":48,"x":"エンジン推進または帆走の船舶は、管轄の海事当局が反対の規定を定めていない場合、錨泊するために基線に接近することができます。すべての接近は基線に対して垂直に、3（三）ノットを超えない速力で行い、海水浴客の安全を守らなければなりません。"},{"i":49,"x":"外洋航行に分類された船舶が内水を航行している場合、救命設備および航海用具に関する最低搭載基準は、港内・内水航行のものが求められます。"},{"i":50,"x":"Termo de Responsabilidade（責任誓約書）とは、スポーツおよび/またはレクリエーション用船舶の所有者が、自船の運航状態について責任を負うことを約する書類です。"},{"i":51,"x":"RLESTAによれば、海路、または海路と内水航路を利用して、ブラジル領内の港や地点の間で行われる航行は、cabotagem（沿岸航行・内航）と呼ばれます。"},{"i":52,"x":"RLESTAによれば、ブラジルの港と外国の港の間で行われる航行は、longo curso（遠洋航行）に分類されます。"},{"i":53,"x":"河川、湖、運河、潟、湾、入江、小湾および遮蔽された海域を内水航路とみなし、そこで行われる航行は内水航行に分類されます。"},{"i":54,"x":"NORMAM-03によれば、操縦免許の提示が免除されるのは、スポーツおよび/またはレクリエーション活動やスポーツの実践に使用される浮遊器具およびエンジンのない小型船の操縦者のみです。"},{"i":55,"x":"許可された速度を超えて航行すると、罰金または最大30日間の免許停止が科されます。"},{"i":56,"x":"水温は、船舶の操船条件を変えない要因です。"},{"i":57,"x":"舵は金属製または木製の構造物で、船舶に方向を与え、定められた針路を保つことを目的としています。"},{"i":58,"x":"プロペラは羽根を持つ金属製の構造物で、縦方向の軸を介してエンジンに連結され、自らが回転することで船舶を推進させます。"},{"i":59,"x":"錨（アンカー）は海底に食い込むことのできる金属製の部品で、船舶が錨泊した状態、つまり位置から移動しない状態を保てるようにします。"},{"i":60,"x":"錨を錨鎖庫または船舶の甲板につなぎ止めるための鎖またはロープを、錨鎖（amarra）と呼びます。"},{"i":61,"x":"錨泊や抜錨の作業は、常に風、潮流、潮汐の状態を観察し、最も優勢なものに船を立てる（整列させる）ようにして行わなければなりません。"},{"i":62,"x":"良い錨地の条件として必要でないものの一つは、許可された区域外に錨泊しないよう空間が限られていることです。"},{"i":63,"x":"着岸するには、一般的に、岸壁に45°の角度で接近し、できるだけ早く船首索を渡し、舵を岸壁と反対の舷にとって船尾を岸壁側へ寄せます。"},{"i":64,"x":"主な係留索は、lançante（船首索・船尾索）、espringue（スプリング）、través（横索）です。"},{"i":65,"x":"「espia（係留索）」は、船舶を着岸させる作業（動作）に使用される係留用のロープです。"},{"i":66,"x":"船舶を着岸させる場所に流れがある場合は、その効果を利用して流れに向かって着岸し、前方に向かう（前方方向の）ロープと後方に向かうロープを1本ずつ渡します。"},{"i":67,"x":"船舶を離岸させるには、一般的に、後方のロープを放し、船尾を開くように操船し、舵の効果を利用して船尾を岸壁から離してから、前方のロープを放します。"},{"i":68,"x":"船首からの流れがある場合、離岸はより容易で、まず前方のロープを緩め、後方のロープは張ったままにします。"},{"i":69,"x":"アンカーブイ（bóia de arinque）は、錨が海底のどこにあるかを示すために使用されます。"},{"i":70,"x":"着岸中の船舶が後方へ下がるのを防ぐ役割を持つロープは、船首のlançante（船首索）と呼ばれます。"},{"i":71,"x":"船舶から岸壁に対して垂直に出る係留索は、través（横索）と呼ばれます。"},{"i":72,"x":"右回り（時計回り）のプロペラを1基持つ船舶が、舵を中央にして後進している場合、船首はゆっくりと右舷へ回頭します。"},{"i":73,"x":"左回り（反時計回り）のプロペラを1基持つ船舶が、舵を中央にして前進している場合、ゆっくりと左舷へ回頭する傾向があります。"},{"i":74,"x":"右回り（時計回り）のプロペラを1基持つ船舶が、舵を右舷にとって後進している場合、船首はゆっくりと右舷へ回頭します。"},{"i":75,"x":"操船における抜錨（suspender）とは、錨を揚げて船舶を錨泊地から出すことです。"},{"i":76,"x":"Danforth型アンカーは、スポーツ・レクリエーション用船舶に最も一般的に搭載されている錨です。"},{"i":77,"x":"舵は基本的に、舵軸（madre）、舵柄（cana）、舵板（porta）に分けられます。"},{"i":78,"x":"風または潮流が岸壁に対して垂直な状況で、風上側から接近して着岸する場合は、船舶を岸壁と平行にし、行き脚を小さくして接近します。"},{"i":79,"x":"風または潮流が岸壁に対して垂直な状況で、風下側から接近して着岸する場合は、船舶を岸壁に対して約45°の角度にして接近します。"},{"i":80,"x":"風または潮流が岸壁と平行な状況で着岸する場合は、常に風または潮流に逆らう向きで、岸壁に対して鋭角で接近します。"},{"i":81,"x":"風も潮流もない状況で岸壁を離れるには、舵を岸壁と反対側にとり、機関を微速前進にして、前方に向かっている船尾の係留索以外のすべての係留索を放します。"},{"i":82,"x":"風と潮流が船首方向から来る状況で岸壁を離れるには、船尾にある前方に向かう係留索以外のすべての係留索を放し、舵を岸壁と反対側に保ちます。"},{"i":83,"x":"風と潮流が船尾方向から来る状況で岸壁を離れるには、船首にある後方に向かう係留索以外のすべての係留索を放し、舵を岸壁の方向に保ちます。"},{"i":84,"x":"Danforth型アンカーでレジャーボートを錨泊させる場合は、底質が硬い砂の錨地を避けるべきです。"},{"i":85,"x":"通常の錨泊で繰り出す錨鎖の量を決める簡単な規則は、最低でもその場所の水深の3倍です。"},{"i":86,"x":"荒天の恐れがある場合や錨泊が長時間に及ぶ場合、船舶が位置から外れないよう安全に錨鎖を繰り出す規則は、その場所の水深の5倍です。好天時は水深の3倍です。"},{"i":87,"x":"船舶を係留するためにブイを取るには、ブイに船首を向け、行き脚を小さくして接近します。"},{"i":88,"x":"「tença（底質）」とは、海底の種類（底の性質－泥、岩、砂、砂利、軟泥など）のことです。"},{"i":89,"x":"船舶の振れ回り範囲が限られる区域での錨泊は避けるべきです。"},{"i":90,"x":"錨鎖が前方に張っている場合、錨地から抜錨するには、機関を微速前進にしながら錨を揚げていきます。"},{"i":91,"x":"互いに視認できる状態にある船舶間で、確実に衝突のおそれがあるといえるのは、方位が一定で距離が縮まっている状況です。"},{"i":92,"x":"視界制限状態（霧や煙）では、衝突のおそれのある状況で他船の存在を探知した船舶は、他船の動作にかかわらず、十分に余裕をもって避航動作をとらなければなりません。"},{"i":93,"x":"錨泊するには、機関を後進に切り替え、船が後方へ下がり始めたときに錨を投下します。"},{"i":94,"x":"2基のプロペラを持つ船舶で、一方を後進、もう一方を前進とし同じ回転数にした場合、その船舶は後進しているプロペラと同じ舷へ船首を回す傾向があります。"},{"i":95,"x":"潮流と風がある中で錨泊する場合、船舶の甲板上に高い構造物があるときは、風に船首を向けるべきです。"},{"i":96,"x":"2隻の船舶が狭い水道を反対方向に航行して接近している場合、両船ともそれぞれ自船の右舷側の岸寄りを航行しなければなりません。"},{"i":97,"x":"完全に正しい対応関係は次のとおりです：右舷（boreste）－船舶の右側、左舷（bombordo）－船舶の左側、前方（vante）－前にある、後方（ré）－後ろにある。"},{"i":98,"x":"「航行中（em movimento）」という用語は、錨泊しておらず、陸岸に係留されておらず、乗り揚げてもいないすべての船舶に適用されます。"},{"i":99,"x":"「操縦性能制限船」という用語は、その作業の性質により操縦能力が制限されている船舶を指します。"},{"i":100,"x":"夜間に、垂直線上に並んだ3個の赤色全周灯を表示している大型船舶を見かけたら注意してください。それは喫水により操縦性能が制限されている船舶（喫水制限船）です。"},{"i":101,"x":"「帆船（embarcação a vela）」という用語は、推進機関がある場合にそれを使用していない限り、帆走しているあらゆる船舶を指します。"},{"i":102,"x":"船舶が風、潮汐または潮流に流され、錨が海底を引きずられている状態を、走錨（garrando）しているといいます。"},{"i":103,"x":"船舶が推進力を失い、操船できず、風や潮に流されている状態を、漂流（à matroca）しているといいます。"},{"i":104,"x":"旋回性能の観点から、2基プロペラの船舶が1基プロペラの船舶に比べて優れている点は、操舵に対するプロペラの影響が相殺され、船舶が舵の作用のみを受けることです。"},{"i":105,"x":"荒れた海で大きな波を乗り越えるには、エンジンを次のように加減速します：波を登るときに加速し、下る前に減速します。"},{"i":106,"x":"船舶を岸壁や桟橋に係留する、またはつなぎ止める動作を、着岸する（atracar）といいます。"},{"i":107,"x":"標準とされる一定の舵角で舵を一方の舷にとり、一定の標準速力で船舶が描く曲線を、「標準旋回圏（Curva de Giro Padrão）」といいます。"},{"i":108,"x":"通常の状況では、船舶のプロペラが右回り（時計回り）に回転すると、水を後方へ押し出し、船舶を前方へ推進させます。"},{"i":109,"x":"船舶の長さ方向の任意の位置で、舷側において測った水面から主要な甲板面（通常は甲板）までの距離を、「乾舷（Borda Livre）」といいます。"},{"i":110,"x":"船首付近の右舷側および左舷側の舷側の曲面部分は、bochecha（船首側の舷側（バウ））と呼ばれます（左舷バウおよび右舷バウ）。"},{"i":111,"x":"船尾付近の右舷側および左舷側の舷側の曲面部分は、alheta（船尾側の舷側（クォーター））と呼ばれます（左舷クォーターおよび右舷クォーター）。"},{"i":112,"x":"船舶が2基のエンジン（2本の軸と2基のプロペラ）を持つ場合、一方のプロペラの回転数がもう一方より低いと、船舶は回転数の低いプロペラの舷の方へ向かう傾向があります。"},{"i":113,"x":"船舶のタンクが半分の量で、船倉にかなりの量の水がある場合、その船舶の復原性は確実に「自由水影響（superfície livre）」を受けています。"},{"i":114,"x":"船体中央部に重量が多く、船首と船尾の重量が少ない船舶は、中央で折れることがあります。この状態を、船舶がサギング（contra-alquebramento）の状態にあるといいます。"},{"i":115,"x":"船舶に乗って船尾に立ち、船首の方を向いているとき、右側が右舷であるといえます。"},{"i":116,"x":"左（左舷）または右（右舷）へ操作する（回す）と舵を動かす回転部品は、舵輪（roda de leme または timão）と呼ばれます。"},{"i":117,"x":"岸壁や桟橋に固定され、着岸時に船舶の係留索をつなぎ止めるために使われる部品を、係船柱（cabeço、ビット）と呼びます。"},{"i":118,"x":"船舶の部位には、甲板、舷側、キール（竜骨）、船首側の舷側（バウ）、船尾側の舷側（クォーター）があります。"},{"i":119,"x":"国際海上衝突予防規則（RIPEAM/COLREG）は、国際的な航法規則、灯火・形象物および音響信号を用いて、海上での衝突を防止することを目的としています。"},{"i":120,"x":"国際海上衝突予防規則（RIPEAM/COLREG）に違反すると、免許証が最大60日間停止されることがあります。"},{"i":121,"x":"行会い、つまり船首と船首が向き合う状況では、各船はそれぞれ自船の右舷側へ避航（変針）しなければなりません。"},{"i":122,"x":"横切りの状況では、他船を自船の左舷側に見る船舶、つまり他船の緑灯が見える船舶に航行の優先権があります。"},{"i":123,"x":"帆船は、動力船に対して操船上の優先権があります。"},{"i":124,"x":"帆船とモーターボートが横切りの状態で航行していました。航行の優先権を持つ帆船は避航せず、モーターボートに急速に接近しながら、モーターボートが変針するのを待ちました。2隻は衝突しました。次のように結論づけられます：モーターボートは事故を避けるために避航しなかった点で誤っていましたが、帆船も責任を免れることはできません。なぜなら、避航義務のある他船が避航しない場合、優先権を持つ船舶も衝突を避けるための動作をとらなければならないからです。"},{"i":125,"x":"すべての操船は、十分に余裕をもって、明確かつ大きく行い、他船に対して動きの変化があったことを示さなければなりません。"},{"i":126,"x":"2隻のスポーツ・レクリエーション用モーターボートが河川を反対方向に航行している場合、流れに乗って下ってくる船舶は川の中央に位置し、もう一方の船舶は自船の右舷側の岸寄りに位置します。流れに乗って下ってくる船舶に優先権があります。"},{"i":127,"x":"狭い水道では、船舶
