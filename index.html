yanosis), never flushed (red)."},{"id":"b96cafd0","q":"The method of stopping bleeding (hemostasis) that causes the least harm to the victim is:","o":["tourniquet","garroting","strangulation","amputation","compression"],"c":"Direct compression is the simplest and least aggressive method before drastic measures."},{"id":"c3f13bbe","q":"The life jacket should be kept:","o":["locked in a safe place","on the main deck, loose, to be used in an emergency","tied to the vessel and in a well-closed place, to protect it from the weather","in an easily accessible place in case of need, and never tied to the vessel","in a storeroom of the vessel or in the accommodation compartment"],"c":"Life jackets must be accessible and never tied down or locked away."},{"id":"3933da59","q":"After receiving the notice of infraction (auto de infração), an offender may submit a defense within:","o":["5 days","20 days","10 days","15 days","12 days"],"c":"The deadline for the prior defense after the notice of infraction is 15 days."},{"id":"8148a5ee","q":"A foreign vessel presenting irregularities that pose a threat of damage to the environment, the crew, third parties or the safety of waterway traffic may be ordered to:","o":["go into quarantine","repatriate the crew","pay a fine set by the Autoridade Marítima (Maritime Authority)","leave the jurisdictional waters","sign a statement of responsibility"],"c":"For reasons of sovereignty and safety, the Autoridade Marítima (Maritime Authority) may order the vessel to leave Brazilian jurisdictional waters (AJB)."},{"id":"48c8df11","q":"What is the minimum age and the necessary condition for the sailboat (Veleiro) qualification?","o":["16 years and must be a member of a nautical club, organized marina or scout group.","08 years and must be a member of a nautical club, organized marina or sea scout group.","12 years and must be qualified in an exam at the Capitania dos Portos (Harbour Master's Office).","18 years and must be qualified in accordance with NORMAM 211.","10 years and must be qualified in an exam at the Capitania dos Portos (Harbour Master's Office)."],"c":"Veleiro (sailboat, children/youth): from 8 years old and a member of a nautical organization."},{"id":"35ea555e","q":"The vertical distance from the water surface to the main deck (usually the weather deck), measured at any point along the boat's length at the hull side, is known as:","o":["Bulwark","Freeboard","Underwater body (quickwork)","Rubbing strake","Half bulwark"],"c":"Freeboard is the distance from the waterline to the deck."},{"id":"c1ffe62a","q":"The curved parts of a vessel's hull side near the bow, on the starboard or port side, are called:","o":["quarters","beams","stringers","bows (shoulders of the bow)","deck"],"c":"The \"curves\" at the bow are the bows (bochechas); those at the stern are the quarters (alhetas)."},{"id":"ff8f1b9c","q":"Indicate which of the alternatives below is CORRECT:","o":["foam cannot be used to fight a gasoline fire because it is very corrosive","we can use water to fight a gasoline fire because water lowers the ignition temperature","seawater dissolves gasoline and mixes with it quickly, putting out the fire","foam fights a gasoline fire by cooling because foam is very cold","we cannot use water to fight a gasoline fire because the ignition temperature of gasoline is lower than the temperature of the water"],"c":"Water on a liquid fuel fire (Class B) spreads the fire instead of putting it out."},{"id":"2ee95428","q":"According to the International Regulations for Preventing Collisions at Sea (RIPEAM / COLREGs), shapes such as balls (spheres), cones, etc. must be displayed:","o":["during the day or night","only at night","only during the day","only in restricted visibility","when maneuvering"],"c":"Shapes (geometric day shapes) are for daytime display. At night, lights are used."},{"id":"521a9fd7","q":"According to the International Regulations for Preventing Collisions at Sea (RIPEAM / COLREGs), in a narrow channel, a boat is overtaking me and sounds two prolonged blasts and one short blast. If I agree, my boat must:","o":["sound four prolonged blasts and alter course to starboard, as she will overtake me on my port side","sound four blasts (prolonged, short, prolonged, short) and maneuver, allowing safe overtaking on my starboard side","keep course and speed constant, as she intends to overtake me on my port side","keep course and speed constant, as she intends to overtake me on my starboard side","sound one prolonged blast, alter course to starboard and reduce speed, as she will overtake me on my port side"],"c":"Two prolonged and one short: intention to overtake on your starboard side. Agreement: Prolonged-Short-Prolonged-Short."},{"id":"2eda24ca","q":"According to the International Regulations for Preventing Collisions at Sea (RIPEAM / COLREGs), in a situation of risk of collision, the vessel that is NOT required to maneuver is called the vessel:","o":["without right of way","maneuvering","that has the right of way","required to maneuver (give-way)","being overtaken"],"c":"The one that does not maneuver is the one that \"has the right of way\", i.e. the stand-on vessel (keeps course/speed)."},{"id":"e412fa95","q":"Among the alternatives below, indicate the one that LEAST contributes to accidents on sport and recreational vessels:","o":["vessel operated by an unqualified person","poor maintenance of all the vessel's equipment","occurrence of fog in the area to be navigated","operators drinking alcoholic beverages before casting off","excessive vessel speed"],"c":"Fog is a natural factor; the others (alcohol, lack of qualification) are direct human errors."},{"id":"65f4d368","q":"On medium-sized vessels in coastal navigation, which of the items below is not required according to NORMAM-211?","o":["Life raft.","Magnetic compass.","Whistle.","Anchor.","Pyrotechnic device."],"c":"For coastal navigation on medium-sized vessels (up to 24 m), the life raft is not required if there is a support/rescue craft."},{"id":"5a478a51","q":"On a moving boat, what can be improvised to immobilize a fractured leg?","o":["A halyard and painters.","The rudder blade and a mooring line.","Some piece of rigid material and strips of cloth.","The wheel spokes and the anchor chain.","A sternpost and strips of cloth."],"c":"First aid: improvise splints with rigid material and cloth ties."},{"id":"ec8f4639","q":"On an inland waterway, when we come across a square orange panel with the letter R painted in black, it means:","o":["return","navigation restriction","no return","course to follow","reduce speed"],"c":"Orange panel with a black \"R\" = Reduce Speed."},{"id":"00115d5a","q":"The equipment called GPS (Global Positioning System) is not mandatory for vessels of any size when they are:","o":["navigating on the high seas","practicing offshore sport fishing","practicing inland navigation","practicing coastal navigation","at anchor"],"c":"In inland navigation (rivers, lakes, bays), GPS is not a mandatory equipment item."},{"id":"fee6b113","q":"For the correct treatment of sunstroke we should:","o":["cool the body with a bath or cool compresses","give mild stimulants such as coffee or black tea","if in doubt, apply artificial respiration","place the patient sitting or standing","keep the body warm using dry blankets"],"c":"Treatment of sunstroke focuses on lowering body temperature gradually."},{"id":"04d41153","q":"When practicing inland navigation in sheltered waters, one red hand flare will be mandatory only for:","o":["large vessels","government agency vessels","artisanal fishing vessels","small craft","sailing vessels"],"c":"Hand flares are mandatory for large vessels (yachts) even in sheltered waters."},{"id":"b6f15673","q":"Regarding first aid for a drowning victim, the correct positioning of the patient to begin care is:","o":["lay them on their back with the head turned to the side","lay them face down with the head turned to the side","the procedure can be applied in any position","lay them on their side with the head facing down","stand or sit them up with the head upright"],"c":"Laying them on their back with the head to the side initially helps expel water/vomit."},{"id":"377701fb","q":"According to Federal Law 9.537/97 (LESTA) and Decree No. 2.596/98 (RLESTA), the Autoridade Marítima (Maritime Authority) in Brazil is the:","o":["Marinha do Brasil (Brazilian Navy)","Capitania dos Portos (Harbour Master's Office)","Diretoria de Portos e Costas (Directorate of Ports and Coasts)","Ministry of Transport","National Water Agency"],"c":"The Autoridade Marítima (Maritime Authority) in Brazil is exercised by the Commander of the Marinha do Brasil (Brazilian Navy)."},{"id":"a0d18cb4","q":"Theoretically, the ideal rudder angle to apply to obtain a quick turn in an emergency situation is around:","o":["10° to the desired side","60° to the desired side","35° to the desired side","45° to the desired side","90º to the desired side"],"c":"The angle of maximum rudder efficiency is generally between 30° and 35°."},{"id":"fe6b4686","q":"Every vessel restricted in her ability to maneuver while supporting recreational diving must, during daytime, display:","o":["the \"Charlie\" flag and may display the green flag with a white diagonal stripe","the \"Oscar\" flag and may display the red flag with a green diagonal stripe","the \"Mike\" flag","the \"Alfa\" flag and may display the red flag with a white diagonal stripe","the \"Zulu\" flag and must display the red flag with a green diagonal stripe"],"c":"Diving: Alfa flag (International Code) or red flag with a white stripe."},{"id":"f2e48822","q":"A vessel with one propeller (right-handed pitch), rudder hard to port, starting from a stop, with the propeller turning counterclockwise, the bow will:","o":["Go astern","turn slowly to starboard","make counterclockwise circles","turn quickly to port","make clockwise circles"],"c":"Right-handed propeller going astern (counterclockwise): the stern goes to port and the bow to starboard."},{"id":"e5482aa3","q":"A 1st-degree burn is characterized by the appearance of:","o":["peeling skin","blisters","blackened holes","superficial redness of the skin","lack of sensitivity to touch"],"c":"1st degree: redness (e.g. sunburn). 2nd degree: blisters. 3rd degree: tissue destruction."},{"id":"9b528514","q":"Using the mouth-to-mouth method with cardiac massage, where on the victim's body is the correct place to apply cardiac massage (chest compressions)?","o":["In the middle of the back.","Lower third of the abdomen.","Lower third of the sternum (breastbone).","On the lower third of the ulna.","In the middle of the ribs."],"c":"The massage is applied over the sternum (center of the chest)."},{"id":"5255e199","q":"One of the symptoms that identify a state of dehydration due to inadequate water intake is:","o":["Dizziness","Thirst","Dyspnea","Convulsion","Absence of salivation"],"c":"The primary and most obvious symptom of dehydration is thirst."},{"id":"9f65ff9a","q":"In a channel or river, especially narrow ones, the larger vessel (over 20 meters) has, in relation to the small craft:","o":["to leave her starboard side free for the other","to keep her course and speed regardless of the other's situation","the right of way","to maneuver","to always maneuver to starboard"],"c":"In narrow channels, small craft (under 20 m) must not impede the passage of the larger vessel, which can only navigate safely within the channel. That is why the larger vessel has the right of way."},{"id":"272e1924","q":"A prolonged blast lasts:","o":["4 to 6 seconds","1 second","2 seconds","1 minute","3 seconds"],"c":"A short blast lasts about 1 second; a prolonged blast lasts 4 to 6 seconds."},{"id":"0ffc09c5","q":"A vessel shall be deemed to be overtaking when she approaches another coming:","o":["from the opposite direction of the other and at greater speed","in the same direction as the other and at lower speed","from a direction more than 67.5 degrees abaft the latter's beam and at greater speed","from the opposite direction of the other and at lower speed","from a direction more than 22.5 degrees abaft the latter's beam and at greater speed"],"c":"The overtaking vessel is the one approaching from more than 22.5° abaft the other's beam, at greater speed. At night she would see only the other's sternlight."},{"id":"8188ef15","q":"A vessel at night showing two all-round red lights in a vertical line, where they can best be seen, is a vessel:","o":["in the channel","not under command","with divers in the area","at anchor","restricted in her ability to maneuver"],"c":"Two all-round red lights in a vertical line indicate a vessel not under command. By day, the equivalent is two black balls."},{"id":"5688782d","q":"The term \"underway\" applies to all vessels that:","o":["are at anchor","are made fast","are not at anchor, made fast to the shore, or aground","are aground","are berthed"],"c":"Under RIPEAM (COLREGs), every vessel that is not at anchor, made fast to the shore, or aground is underway, even if she is stopped."},{"id":"1f1ef914","q":"Two prolonged blasts followed by one short blast mean:","o":["I am stopping engines","I am going astern","I intend to overtake you on your port side","I intend to overtake you on your starboard side","I intend to overtake you on either side"],"c":"In a narrow channel: two prolonged and one short = I intend to overtake you on your starboard side; two prolonged and two short = on your port side."},{"id":"fb697d99","q":"An unlit buoy:","o":["shows intermittent lights","shows no lights","shows very quick lights","shows yellow lights","shows white lights"],"c":"An unlit buoy (bóia cega) has no light. It is identified only by day, by its color, shape and topmark."},{"id":"ab1de4c5","q":"Identification of marks during the day is done by:","o":["only shape and color","topmark, color and sound","topmark, shape and color","topmark, color and size","only topmark and color"],"c":"By day, a mark is identified by three elements: topmark, shape and color. At night, by the color and rhythm of the light."},{"id":"4d740626","q":"The color of the light shown by a preferred channel to port mark is:","o":["green","blue","white","yellow","red"],"c":"Preferred channel to port is a red mark with a green band. In IALA Region B the light follows the predominant color: red."},{"id":"0eb51097","q":"The simple rule for determining the amount of anchor chain normally used for anchoring is:","o":["at least 2 times the local depth","at least 4 times the local depth","at least 3 times the local depth","at least 1.5 times the local depth","at least 6 times the local depth"],"c":"Rule of thumb: pay out at least 3 times the local depth. In bad weather or poor holding ground, increase it."},{"id":"e160e8a0","q":"In rough seas, to get over large waves, the engine should be accelerated and decelerated as follows:","o":["decelerate going up and accelerate before going down","accelerate when climbing the wave and keep accelerating going down","accelerate neither going up nor going down","keep a constant speed both going up and coming down the wave","accelerate going up and decelerate before going down"],"c":"Accelerate going up the wave so as not to lose way, and reduce before going down, so the bow does not dive into the next wave."},{"id":"3ab973cd","q":"When someone falls into the water, that is, a \"man overboard situation\", to return on exactly the opposite course along the wake left by the propeller, one should use the:","o":["\"Race Track\" turn","Williamson turn","Putin maneuver","Butakov turn","Zemane maneuver"],"c":"The Butakov turn puts the vessel on the opposite course, returning along her own wake to the point where the person fell."},{"id":"d7d1c3f0","q":"A class C fire is one:","o":["that occurs in the presence of an extinguishing agent","that occurs in flammable solid materials","that occurs in flammable liquids","that occurs in electrical equipment","that occurs in flammable metals"],"c":"Class A = solids (embers and ash); B = flammable liquids; C = energized electrical equipment; D = pyrophoric metals."},{"id":"afd43eb1","q":"Fires involving fibrous or solid materials that leave embers or ash as residue are called:","o":["Class \"C\" fires","Class \"E\" fires","Class \"A\" fires","Class \"B\" fires","Class \"D\" fires"],"c":"Solid materials that leave embers and ash (wood, paper, fabric) form class A. They are fought mainly with water, by cooling."},{"id":"4f90437d","q":"To use the foam extinguisher, one must:","o":["squeeze the trigger and direct the jet at the flames","open the activation valve","remove the safety pin and direct it at the electrical equipment","squeeze the trigger and direct it at the flammable liquids","turn the extinguisher upside down, cap facing down, and direct the jet at the base of the flames"],"c":"The chemical foam extinguisher is activated by turning it upside down, which mixes the chemicals. Direct the jet at the base of the flames."},{"id":"6f7331b7","q":"The main complications of a wound are:","o":["bleeding and fever","blisters and bleeding","infection and burn","bleeding and infection","blisters and burns"],"c":"The two greatest risks of a wound are hemorrhage (blood loss) and infection. Therefore: stop the bleeding and protect the injury."},{"id":"1eedc7a5","q":"When someone from your vessel falls overboard you must:","o":["call the fire department","throw a lifebuoy, keep the person in sight and have whoever is at the helm notified","sound 3 short blasts","hoist the Alfa flag","sound 2 prolonged blasts"],"c":"First throw a lifebuoy, then keep the victim in sight at all times and notify whoever is at the helm."},{"id":"715bbe76","q":"The canopy of the life raft is:","o":["blue to match the sea","fiberglass to withstand the weather","yellow canvas to keep sharks away","white so it heats up little","orange to make sighting easier"],"c":"Orange and yellow give the greatest contrast with the sea and make it easier for rescuers to spot."},{"id":"f60f447d","q":"A waterway professional (aquaviário) or amateur who performs duties on board in the operation of the vessel:","o":["amateur","passenger","crew member","waterway professional (aquaviário)","shipowner"],"c":"A crew member is someone who performs duties on board, in the operation of the vessel. A passenger has no duty on board."},{"id":"782cb100","q":"The penalty for operating a vessel while intoxicated is:","o":["suspension of the Certificate of Qualification for up to sixty days","suspension of the Certificate of Qualification for up to one hundred and twenty days. A repeat offense will subject the offender to the penalty of cancellation of the Certificate of Qualification","suspension of the Certificate of Qualification for up to ninety days","cancellation of the Certificate of Qualification","permanent suspension of the Certificate of Qualification"],"c":"Intoxication: suspension of the certificate of qualification for up to 120 days; a repeat offense leads to cancellation."},{"id":"71ad5559","q":"The sea anchors of life rafts must be kept in the water in order to reduce:","o":["the height of the waves","the wind","the drift speed","the possibility of capsizing","the risk of sharks"],"c":"The sea anchor (drogue) reduces the raft's drift and keeps it near the site of the sinking, where the search will begin."},{"id":"bf08b2fd","q":"Extinguishers used on class \"B\" fires are identified by:","o":["a yellow star","a blue circle","a red square","a blue triangle","a green triangle"],"c":"Class symbols: A = green triangle; B = red square; C = blue circle; D = yellow star."},{"id":"646c152a","q":"On board your (motorized) leisure boat, which fuel is the most dangerous and most likely to catch fire, therefore requiring special care:","o":["Fiberglass.","Wood.","Paper.","Electrical panels.","Liquid fuels."],"c":"Liquid fuels (gasoline) release flammable vapors that accumulate in the bilge. Ventilate the compartment before starting the engine."},{"id":"1137ef1a","q":"A repeat offense, for the purpose of increasing the penalty, is the repetition of the same infraction within a period equal to or less than:","o":["one month","six months","nine months","twelve months","three months"],"c":"A repeat offense is repeating the same infraction within 12 months. It increases the penalty."},{"id":"9c97e5d2","q":"According to the International Regulations for Preventing Collisions at Sea (RIPEAM / COLREGs), a ship that, during the day, is constrained by her draft must hoist which shapes on the mast:","o":["A blue cone.","Two black balls.","One black ball.","One blue ball.","A black cylinder."],"c":"Constrained by her draft: by day a black cylinder; at night three all-round red lights in a vertical line."},{"id":"fbf7dec9","q":"Regarding the use of life jackets, before a trip it is advisable to carry out:","o":["improvisation of life jackets","a count of children and adults","a demonstration of how to use the life jackets","borrowing a life jacket from another boat","a count of the people on board"],"c":"Before departing, show everyone where the life jackets are and how to put them on. In an emergency there is no time to learn."},{"id":"99732c14","q":"The most common oxidizer in a chemical reaction with fuel is:","o":["hydrogen","oxygen","nitrogen","carbon dioxide","helium gas"],"c":"Fire triangle: fuel, oxidizer and heat. The common oxidizer is the oxygen in the air."},{"id":"bb65db08","q":"The chemical foam extinguisher acts on the fire basically by the principle of:","o":["smothering","removal","breaking the chain reaction","cooling","spreading"],"c":"The foam forms a layer that isolates the fuel from oxygen: extinction by smothering."},{"id":"3d855b1f","q":"The situations below are those in which I use navigation lights, except:","o":["at night with the vessel adrift","with the vessel berthed at the quay","at night","when necessary","in restricted visibility"],"c":"Navigation lights are used from sunset to sunrise and in restricted visibility. A vessel berthed at the quay does not need them."},{"id":"b994289c","q":"A continuous white light placed as nearly as practicable at the stern, or on the transom, visible only from astern, over a horizontal arc of 135°, is called:","o":["towing light","masthead light","sternlight","sidelight","aft light"],"c":"The sternlight is white, located at the stern and covers 135°. It is the light seen by someone approaching from astern."},{"id":"815071a3","q":"Sport and recreational vessels less than 12 meters in length normally display:","o":["sidelights and a yellow light at the bow","sidelights (green and red) and a white light at the stem","combined sidelights (green and red) and an all-round white light","only one all-round white light","only the sidelights (green and red)"],"c":"Below 12 m it is permitted to use combined sidelights and an all-round white light, which replaces the masthead light and sternlight."},{"id":"13c64eb4","q":"A continuous white light, placed on the vessel's mast, visible from abeam or ahead over a horizontal arc of 225°, is called:","o":["bow light","masthead light","sternlight","aviation light","collision light"],"c":"The masthead light is white, placed on the centerline and covers 225°, from right ahead to 22.5° abaft the beam on each side."},{"id":"25c4e0b2","q":"At night, the starboard buoy shows a light of color:","o":["green","red","yellow","blue","white"],"c":"IALA Region B (Brazil): the starboard mark is red, conical, with a red light; the port mark is green, cylindrical, with a green light. Corrected: the original material stated \"green\", which is IALA Region A."},{"id":"83ffe153","q":"A vessel engaged in diving operations must display:","o":["the Golf flag","the Alfa flag","the Delta flag","the Mike flag","the Bravo flag"],"c":"Alfa flag (white and blue) = I have a diver down; keep well clear at slow speed."},{"id":"4522d6b2","q":"With a fire on board, what is your position to fight the flames:","o":["I stay to leeward of the flames and smoke.","I stay at the bow or the stern.","I stay to port, downwind with the smoke.","I stay to windward of the flames and smoke.","I stay amidships."],"c":"Fight the fire from windward (where the wind comes from): the smoke and heat go away from you."},{"id":"6094f465","q":"Water is an extinguishing agent that can be used on fires in:","o":["flammable metals","flammable solid material","electric motors","navigation equipment","flammable liquids"],"c":"Water acts by cooling and is indicated for class A (solids). Do not use it on electrical equipment, flammable liquids or metals."},{"id":"262db5cb","q":"Which of the procedures below will not be appropriate when a fire occurs on board the vessel:","o":["Try to fight the fire using the portable extinguisher on board.","Abandon the vessel immediately without trying to fight the fire due to the risk of explosion.","Turn the vessel so that the flames move away from the people.","Place the people to windward of the flames and have them put on life jackets.","Inform other vessels of your situation of danger."],"c":"Abandoning without trying to fight the fire is inappropriate. First try to fight it, place people to windward with life jackets on and call for help."},{"id":"d4d0bac9","q":"The extinguishing agent for class \"D\" fires is:","o":["mechanical foam","water","chemical foam","Dry chemical powder","CO2"],"c":"Pyrophoric metals (class D) require special dry chemical powder. Water can react with the metal and worsen the fire."},{"id":"2eb43342","q":"Which of the materials below should not be used to move the victim away from contact with electric current:","o":["A piece of porcelain.","A piece of wood.","A piece of tire.","A piece of metal.","A piece of plastic."],"c":"Metal conducts electricity. Use dry insulating materials such as wood, rubber or plastic."},{"id":"00c48265","q":"The following are lifesaving equipment required on sport and recreational vessels, except:","o":["lifebuoy","lifeboat","life jacket","pyrotechnic","life raft"],"c":"A lifeboat (baleeira) is the survival craft of large ships and is not required for sport and recreational vessels."},{"id":"9caf67b7","q":"Navigation carried out on inland waterways, considered as such rivers, lakes, canals, lagoons, bays, inlets, coves and sheltered maritime areas, is classified as:","o":["fresh water","riverine","lacustrine","inland","closed sea"],"c":"Inland navigation: rivers, lakes, canals, lagoons, bays, inlets, coves and sheltered maritime areas. It is the limit of the Arrais-Amador (recreational skipper) license."},{"id":"86ae8f42","q":"Aggravating circumstances for infractions are:","o":["being a foreigner","running out of fuel","repeat offense","pollution","damage"],"c":"A repeat offense is an aggravating circumstance: it increases the penalty applied."},{"id":"325ad749","q":"Two situations that lead to cancellation of a vessel's registration are:","o":["her seizure and the death of her owner","sinking and abandonment","a name identical to that of another already registered and her seizure","non-payment of the annual fee and involvement in an accident","the death of her owner and her collision, with accidental death"],"c":"Registration is canceled when the vessel ceases to exist or to be used: sinking (loss) and abandonment."},{"id":"1ac6b8a3","q":"After the notice of infraction (auto de infração) is issued, the offender will have:","o":["30 (thirty) business days to submit a defense","60 (sixty) business days to submit a defense","30 (thirty) calendar days to submit a defense","15 (fifteen) business days to submit a defense","7 (seven) business days to submit a defense"],"c":"After the notice of infraction, the offender has 15 business days to submit a defense."},{"id":"b3ece79b","q":"Among other factors, the survival of a shipwrecked person depends on the time spent in the water as a function of the sea water temperature. As for the ambient temperature (air temperature), its effects on people are closely linked:","o":["to frontal systems","to ocean currents","to atmospheric pressure","to wind speed","to clouds"],"c":"Wind increases the body's heat loss (wind chill). The more wind, the greater the risk of hypothermia."},{"id":"a8d3a725","q":"Whenever we can see the blood, we say the hemorrhage is:","o":["External","Venous","Internal","Arterial","Superficial"],"c":"If the blood appears on the outside, the hemorrhage is external. Internal hemorrhage is not visible and is noticed through signs such as pallor and shock."},{"id":"64ecc449","q":"In a 3rd-degree burn:","o":["The skin becomes reddened and slightly sensitive","The skin has been completely destroyed","The surface is soft and wet","The characteristic is the presence of blisters","There is no pain"],"c":"1st degree: redness. 2nd degree: blisters. 3rd degree: destruction of all layers of the skin; it may not even hurt, because the nerves have been affected."},{"id":"ed9e6452","q":"According to the International Regulations for Preventing Collisions at Sea (RIPEAM / COLREGs), the sidelights, green to starboard and red to port, can be seen over an angle of:","o":["122.5° from the stern","132.5° from the bow","102.5° from the stern","112.5° from the bow","135.5° from the stern"],"c":"A sidelight covers 112.5°, from right ahead to 22.5° abaft the beam. Together, the two sidelights cover the same 225° as the masthead light."},{"id":"11a7de15","q":"When faced with a fire in the electrical panel of my motorboat, I should preferably use an extinguisher of:","o":["halon gas","pressurized water","CO2","dry chemical powder","foam"],"c":"Electrical equipment (class C) calls for an agent that does not conduct electricity: CO2 is preferred, since it leaves no residue."},{"id":"92137203","q":"The curved parts of a vessel's hull side near the stern, on the starboard or port side, are called:","o":["quarters","beams","crow's feet","bows (shoulders of the bow)","stringers"],"c":"The curves of the hull side near the stern are the quarters (alhetas); near the bow they are the bows (bochechas)."},{"id":"6d179193","q":"According to the International Regulations for Preventing Collisions at Sea (RIPEAM / COLREGs), the shapes in the form of balls, cones, etc. used by boats to signal various conditions during the day are colored:","o":["yellow","green","white","black","red"],"c":"RIPEAM (COLREGs) day shapes (balls, cones, cylinders, diamonds) are always black."},{"id":"2b4f3ce8","q":"A boat with a lot of weight at the bow and stern and little weight amidships is said to be in danger of breaking in half when facing strong, high waves. In this situation she is said to be:","o":["trimmed","out of control","upright","sagging","hogging"],"c":"Weight at the ends makes the ends drop and the middle rise: hogging (alquebramento). Weight in the middle does the opposite: sagging (contra-alquebramento / tosamento)."},{"id":"1d8b1bd2","q":"In the case of an open (compound) fracture we should NOT:","o":["stop the bleeding","give painkillers","give the victim water","immobilize the fractured limb","put the fractured bone back in place"],"c":"Never try to put the bone back in place. Stop the bleeding, cover the wound and immobilize the limb as it is."},{"id":"520bb0b6","q":"With eight (8) vessels anchored in the same cove, we should take care to maintain:","o":["watch day and night","enough space between them so that they can swing around their anchors","the anchors dug in very close to one another","the motorboats' outdrives raised so as not to touch the mooring lines","adequate distance from shore"],"c":"Each anchored vessel swings around her own anchor with wind and tide. Leave space so that no one collides while swinging."},{"id":"bac1e8e6","q":"How many hours of training on sport and/or recreational or similar vessels must the applicant prove to qualify in the Arrais-Amador (recreational skipper) category:","o":["7 hours","20 hours","6 hours","10 hours","3 hours"],"c":"The material indicates 6 hours of proven training for Arrais-Amador. Check the current NORMAM at your Capitania dos Portos (Harbour Master's Office)."}]</script>
<script type="application/json" id="cartoes-en">[{"i":0,"x":"All material and equipment intended for the safety of the vessel, crew members, passengers and non-crew professionals must be previously approved by the Diretoria de Portos e Costas (DPC, Directorate of Ports and Coasts)."},{"i":1,"x":"Naval Inspection (Inspeção Naval) is an administrative activity carried out by the Capitanias (Harbour Master's Offices), Delegacias and Agências, which assist the DPC in its role of enforcing the regulations."},{"i":2,"x":"The following conduct may lead to suspension or seizure of the amateur's licence: handing over the operation of the vessel to an unlicensed person; operating a vessel while drunk or under the influence of any kind of toxic substance; using the vessel for commercial transport of passengers or cargo; or using the vessel to commit a crime."},{"i":3,"x":"NORMAM-03 defines an amateur (amador) as: anyone holding a licence certified by the Autoridade Marítima (Maritime Authority) to operate sport and/or recreational vessels on a non-professional basis."},{"i":4,"x":"The Veleiro (Sailor licence) is qualified to operate sailing vessels without engine propulsion, within the limits of inland navigation (minimum age 8, and must be a member of a nautical club, organized marina or sea scouts group)."},{"i":5,"x":"The Motonauta (personal watercraft operator) is qualified to operate personal watercraft (jet skis) within the limits of inland navigation (minimum age 18)."},{"i":6,"x":"The Arrais-Amador (amateur skipper) is qualified to operate vessels within the limits of inland navigation (minimum age 18)."},{"i":7,"x":"The Mestre-Amador (amateur master) is qualified to operate vessels between national and foreign ports, within the limits of coastal navigation."},{"i":8,"x":"The Capitão-Amador (amateur captain) is qualified to operate vessels between national and foreign ports, with no limit on distance from the coast, that is, with no geographic limits."},{"i":9,"x":"Amateur licences are valid for 10 years and are renewable without mandatory examinations."},{"i":10,"x":"Any person who becomes aware of human life in danger at sea, in ports or on inland waterways must report it to the Autoridade Marítima (Maritime Authority) as quickly as possible."},{"i":11,"x":"An amateur's licence will be cancelled when: he is found operating a vessel while his licence is already suspended; or he has a repeated suspension of the licence."},{"i":12,"x":"The body responsible for conducting amateur examinations is the Capitania dos Portos (Harbour Master's Office) and its subordinate bodies (Delegacias and Agências)."},{"i":13,"x":"The department of the Capitania dos Portos (Harbour Master's Office) that enforces compliance with the regulations is the Naval Inspection (Inspeção Naval)."},{"i":14,"x":"The owner of a sport and recreational vessel is the person who registered the vessel in his or her name."},{"i":15,"x":"Vessel registration is done at the Tribunal Marítimo (Maritime Court), with the issuance of the Provisão de Registro de Propriedade Marítima (PRPM, Maritime Property Registration Certificate)."},{"i":16,"x":"All vessels with a length of 24 metres or more and a gross tonnage (GT) greater than 100 must be registered with the Tribunal Marítimo (Maritime Court)."},{"i":17,"x":"The maritime authority will halt the processing of any document or administrative act in the interest of anyone who owes a debt arising from an infraction until it is paid."},{"i":18,"x":"Navigating in an area reserved for bathers may lead to suspension of the licence for up to 60 days."},{"i":19,"x":"Regulating the use of beaches is the responsibility of the municipalities."},{"i":20,"x":"The prerogative of setting the amount of the fine and the period of suspension of the licence, within the limits set by the RLESTA, belongs to the representative of the maritime authority."},{"i":21,"x":"A waterway worker (aquaviário) or amateur who performs duties on board, embarked, in the operation of the vessel is called a Crew Member (Tripulante)."},{"i":22,"x":"The minimum number of crew members needed to operate the vessel safely is called the \"Safe Manning\" (Tripulação de Segurança)."},{"i":23,"x":"If the irregularity that led to the seizure of the vessel is not remedied within the due period, the vessel will be auctioned or incorporated into Federal Government (União) property."},{"i":24,"x":"The period set by the LESTA for remedying an irregularity that led to the seizure of the vessel, so that it is not subject to auction or incorporation into Federal Government property, is 90 days."},{"i":25,"x":"Three situations that may lead to seizure of the vessel are: when it is in very poor condition, when it is used commercially, and when it navigates in safety areas."},{"i":26,"x":"After receiving the notice of infraction, an offender may submit a defence within 15 days."},{"i":27,"x":"The penalty for operating a vessel while drunk is suspension of the licence for up to 120 days. A repeat offence subjects the offender to cancellation of the licence."},{"i":28,"x":"Operating a vessel while drunk or after using a narcotic or toxic substance, when it does not constitute a crime under the law, results in suspension of the licence for up to 120 days. A repeat offence results in cancellation of the licence."},{"i":29,"x":"Repetitions of the same infraction, in the case of a fine or suspension of the licence, unless the article imposing it establishes another procedure, result in the penalty being multiplied by two, three and so on."},{"i":30,"x":"NORMAM-03 defines capacity (lotação) as the maximum number of persons authorized to be on board, including the crew."},{"i":31,"x":"According to the LESTA, damage caused to aids to navigation obliges the offender to repair them."},{"i":32,"x":"According to the RLESTA, causing damage to aids to navigation subjects the offender to a fine or suspension of the licence for up to 60 days."},{"i":33,"x":"The minimum anchoring distance from an oil platform is 500 metres."},{"i":34,"x":"The line where the waves break or, in the case of lakes and lagoons, where the water surface begins, is called the baseline (linha base)."},{"i":35,"x":"Considering the selective navigation areas defined by NORMAM-03, vessels using oar or sail propulsion may navigate from 100 metres off the baseline."},{"i":36,"x":"Considering the selective navigation areas defined by NORMAM-03, motor-propelled vessels, water-ski towing, parasailing and advertising banners may navigate from 200 metres off the baseline."},{"i":37,"x":"Every vessel must be enrolled at the Capitania dos Portos (Harbour Master's Office) or its subordinate bodies (Delegacias and Agências)."},{"i":38,"x":"Repeat offence, for the purpose of grading penalties, is the repetition of the same infraction within a period of 12 months or less."},{"i":39,"x":"Repeat offence is an aggravating circumstance for infractions."},{"i":40,"x":"Regarding imported life-saving equipment, to use it on board the owner must have it approved (homologated) by the Diretoria de Portos e Costas (DPC)."},{"i":41,"x":"A vessel classified for inland waters may be operated by any Arrais-Amador (amateur skipper)."},{"i":42,"x":"A vessel classified for the high seas, when navigating in an area of its class, may only be operated by a Capitão-Amador (amateur captain)."},{"i":43,"x":"Submitting the navigation plan or departure notice before going out to sea is mandatory."},{"i":44,"x":"A seized vessel must be taken to a place determined by the Autoridade Marítima (Maritime Authority)."},{"i":45,"x":"Safety areas are areas where navigation and anchoring are prohibited."},{"i":46,"x":"All persons on board are subject to the authority of the Master (Comandante)."},{"i":47,"x":"The master, in the exercise of his duties and to ensure the safety of persons, the vessel and the cargo carried, may order any person to disembark."},{"i":48,"x":"Motor or sail-propelled vessels may approach the baseline to anchor, provided there is no contrary provision established by the competent maritime authority. Every approach must be made perpendicular to the baseline and at a speed not exceeding 3 (three) knots, preserving the safety of bathers."},{"i":49,"x":"When a vessel classified for open-sea (high seas) navigation is navigating in inland waters, its minimum life-saving and navigation equipment requirement will be that of inland harbour navigation."},{"i":50,"x":"The Statement of Responsibility (Termo de Responsabilidade) is the document in which the owner of a sport and/or recreational vessel assumes responsibility for the operating condition of the vessel."},{"i":51,"x":"According to the RLESTA, navigation between ports or points of Brazilian territory, using the sea route or the sea route and inland waterways, is called cabotage (coastal trade) navigation."},{"i":52,"x":"According to the RLESTA, navigation between Brazilian and foreign ports is classified as long-haul (longo curso)."},{"i":53,"x":"Navigation carried out on inland waterways, considered as rivers, lakes, canals, lagoons, bays, coves, inlets and sheltered maritime areas, is classified as inland."},{"i":54,"x":"According to NORMAM-03, only operators of floating devices and of non-motorized small craft, when used for sport and/or recreation or for sports practice, are exempt from presenting a nautical licence."},{"i":55,"x":"Navigating at a speed higher than permitted will result in a fine or suspension of the licence for up to 30 days."},{"i":56,"x":"Water temperature is a factor that does NOT alter the vessel's manoeuvring conditions."},{"i":57,"x":"The rudder is a metal or wooden structure whose purpose is to steer the vessel and keep it on the set course."},{"i":58,"x":"The propeller is a metal structure with blades that moves the vessel through its own rotation, coupled to an engine by a longitudinal shaft."},{"i":59,"x":"Anchors are metal pieces capable of gripping the bottom, allowing the vessel to remain anchored, that is, without moving from its position."},{"i":60,"x":"The chain or rope that secures the anchor to the chain locker or to the vessel's deck is called the anchor chain/rode (amarra)."},{"i":61,"x":"Anchoring or weighing anchor must always be done taking into account wind, current and tide conditions, trying to head into (align with) whichever is predominant."},{"i":62,"x":"One condition that is NOT necessary to characterize a good anchorage is having limited space so as not to anchor outside the permitted area."},{"i":63,"x":"To berth, as a general rule, approach the quay at an angle of 45°, so as to pass a bow line as soon as possible, putting the rudder to the side opposite the quay to swing the stern towards it."},{"i":64,"x":"The main mooring lines are head/stern lines (lançantes), spring lines (espringues) and breast lines (traveses)."},{"i":65,"x":"\"Espias\" are mooring lines used in the operation (action) of berthing a vessel."},{"i":66,"x":"If there is a current where a vessel is going to berth, we should take advantage of its effect and berth against the current, passing one line leading (in the direction) forward and another leading aft."},{"i":67,"x":"To unberth the vessel, as a general rule, we should cast off the aft lines, manoeuvring to open the stern, use the rudder effect to move the stern away, and then cast off the forward lines."},{"i":68,"x":"With a current on the bow, unberthing is easier, first slackening the forward lines and keeping the aft lines taut."},{"i":69,"x":"The anchor buoy (bóia de arinque) is used to indicate where the anchor lies on the bottom."},{"i":70,"x":"The line whose function is to prevent a berthed vessel from moving aft is called the head line (lançante de proa)."},{"i":71,"x":"The mooring line that leaves the vessel perpendicular to the quay is called a breast line (través)."},{"i":72,"x":"In a single-propeller vessel with clockwise rotation, rudder amidships, moving astern, the bow will swing slowly to starboard."},{"i":73,"x":"A single-propeller vessel with anticlockwise rotation, rudder amidships, and moving ahead tends to swing slowly to port."},{"i":74,"x":"In a single-propeller vessel with clockwise rotation, rudder to starboard, moving astern, the bow will swing slowly to starboard."},{"i":75,"x":"Weighing anchor (suspender), as a manoeuvre, means leaving the anchoring spot with the vessel, hauling in the anchor."},{"i":76,"x":"The Danforth anchor is the most common on board sport and recreational vessels."},{"i":77,"x":"Basically, the rudder is divided into: rudder stock (madre), tiller (cana) and blade (porta)."},{"i":78,"x":"When berthing with wind or current perpendicular to the quay, approaching from windward, you should approach with the vessel parallel to the quay, with little headway."},{"i":79,"x":"When berthing with wind or current perpendicular to the quay, approaching from leeward, you should approach with the vessel at an angle of approximately 45° to the quay."},{"i":80,"x":"When berthing with wind or current parallel to the quay, you should always approach with the vessel against the wind or current, at an acute angle to the quay."},{"i":81,"x":"To leave the quay with no wind and no current, put the rudder away from the quay and the engine slow ahead, and cast off all mooring lines except the aft one leading forward."},{"i":82,"x":"To leave a quay with wind and current on the bow, I should cast off all mooring lines except the one leading forward at the stern, keeping the rudder away from the quay."},{"i":83,"x":"To leave a quay with wind and current from astern, I should cast off all mooring lines except the one leading aft at the bow, keeping the rudder towards the quay."},{"i":84,"x":"A leisure boat should be anchored with the Danforth anchor avoiding anchorages with a hard sand holding ground (tença)."},{"i":85,"x":"The simple rule for determining how much anchor chain/rode to pay out in normal anchoring is at least 3 times the local depth."},{"i":86,"x":"When there is a risk of bad weather or the anchoring will be very long, the rule for paying out the anchor chain/rode so that the vessel safely stays in position is 5 times the local depth. In good weather it is 3 times the local depth."},{"i":87,"x":"To pick up a buoy in order to moor a vessel, we should approach it bow-on, with little headway."},{"i":88,"x":"\"Tença\" (holding ground) is the type of bottom (quality of the bottom: mud, rock, sand, gravel, silt, etc.)."},{"i":89,"x":"You should avoid anchoring in an area where the vessel's swinging room is limited."},{"i":90,"x":"To weigh anchor from an anchorage, we should haul in the anchor with the engine slow ahead, if the anchor chain/rode is taut leading forward."},{"i":91,"x":"For a risk of collision to definitely exist between vessels in sight of one another, the situation must show a constant bearing and decreasing distance."},{"i":92,"x":"In restricted visibility (fog and smoke), the vessel that detects the presence of another in a risk-of-collision situation must manoeuvre in good time, regardless of the other vessel's manoeuvre."},{"i":93,"x":"To anchor, you should reverse the engine and, when the vessel is moving astern, let go the anchor."},{"i":94,"x":"When, in a twin-propeller vessel, one propeller goes astern and the other ahead at the same speed, the vessel tends to swing its bow to the same side as the propeller going astern."},{"i":95,"x":"To anchor with current and wind, you should head into the wind if the vessel has a tall structure on deck."},{"i":96,"x":"When two vessels navigate in a narrow channel on opposite courses, approaching each other, both must keep to the bank on their starboard side."},{"i":97,"x":"A completely correct correlation is: Starboard (Boreste) – right side of the vessel; Port (Bombordo) – left side of the vessel; Forward (A Vante) – at the front; and Aft (A Ré) – at the back."},{"i":98,"x":"The term \"underway\" applies to all vessels that are not at anchor, made fast to the shore, or aground."},{"i":99,"x":"The term \"vessel restricted in her ability to manoeuvre\" means a vessel which, due to the nature of its work, is restricted in its ability to manoeuvre."},{"i":100,"x":"If you sight a large vessel at night displaying three all-round red lights in a vertical line, be careful, as you are facing a vessel constrained by her draft."},{"i":101,"x":"The term \"sailing vessel\" means any vessel under sail provided that its propelling machinery, if fitted, is not being used."},{"i":102,"x":"When the vessel is carried by the wind, tide or current, dragging its anchor along the bottom, it is said to be dragging (garrando)."},{"i":103,"x":"When a vessel is without propulsion, unable to manoeuvre and being carried by the winds and tides, it is said to be adrift (à matroca)."},{"i":104,"x":"An advantage of twin-propeller vessels over single-propeller ones, from a manoeuvring point of view, is that the propeller effects on steering cancel each other out, leaving the vessel only under the action of the rudder."},{"i":105,"x":"In rough seas, to overcome large waves, you should accelerate and decelerate the engine as follows: accelerate on the way up and decelerate before the descent."},{"i":106,"x":"The action of mooring or securing a vessel to a quay or pier is called berthing (atracar)."},{"i":107,"x":"The curve a vessel makes when the rudder is put to one side at a certain standard angle and at a certain standard speed is called the \"Standard Turning Circle\"."},{"i":108,"x":"In normal situations, when a vessel's propeller turns to the right (clockwise), it pushes the water backward (aft) and drives the vessel forward."},{"i":109,"x":"\"Freeboard\" (Borda Livre) is the distance from the water surface to the main deck (usually the deck), measured at any point along the vessel's length on the side (hull side)."},{"i":110,"x":"The curved parts of the vessel's side near the bow, on starboard and on port, are called the bows (shoulders of the bow) (port bow and starboard bow)."},{"i":111,"x":"The curved parts of the vessel's side near the stern, on starboard and on port, are called the quarters (port quarter and starboard quarter)."},{"i":112,"x":"If the vessel has two engines (two shafts and two propellers) and one propeller turns at a lower speed than the other, the vessel tends to go towards the side of the propeller with the lower speed."},{"i":113,"x":"If a vessel's tanks are half full and there is a considerable volume of water in the bilge, the vessel's stability will certainly be suffering from the \"free surface\" effect."},{"i":114,"x":"A vessel with a lot of weight amidships and little weight at the bow and stern may break in the middle. In this situation the vessel is said to be sagging (contra-alquebramento)."},{"i":115,"x":"Being on board a vessel, positioned at the stern and facing the bow, it can be stated that on your right will be the starboard side."},{"i":116,"x":"The rotating part which, when turned to the left (port) or right (starboard), moves the rudder is called the steering wheel or helm (roda de leme or timão)."},{"i":117,"x":"Bollards (cabeços) are the fittings fixed to quays and piers used to secure the vessels' mooring lines when berthing."},{"i":118,"x":"The following are parts of a vessel: deck, side (hull side), keel, bows (shoulders of the bow), quarters."},{"i":119,"x":"The purpose of the COLREGs (RIPEAM) is to prevent collisions at sea, using international navigation rules, lights and shapes, as well as sound signals."},{"i":120,"x":"Failing to comply with the COLREGs (RIPEAM) may lead to suspension of the licence for up to 60 days."},{"i":121,"x":"In a head-on situation, that is, bow to bow, the vessels must manoeuvre (alter course), each to her own starboard."},{"i":122,"x":"In a crossing situation, the vessel that sees the other on her port side, that is, the one that sees the other vessel's green light, has the right of way."},{"i":123,"x":"A sailing vessel has right of way over a motor vessel."},{"i":124,"x":"A sailboat and a motorboat were navigating on crossing courses. Having the right of way, the sailboat did not manoeuvre and waited for the motorboat to alter course while rapidly approaching it. The two vessels collided. We can conclude that: although the motorboat was wrong in not manoeuvring to avoid the accident, the sailboat cannot be exempted from blame, because the vessel with the right of way must manoeuvre to avoid the collision if the other, which is obliged to manoeuvre, does not do so."},{"i":125,"x":"Every manoeuvre must be made in a clear and positive way, well in advance, showing the other vessel that there has been a change in movement."},{"i":126,"x":"On a river where two sport and recreational motorboats are navigating on opposite courses, the vessel coming downstream (with the current) should position itself in the middle of the river and the other on its starboard bank, with the one coming downstream having the right of way."},{"i":127,"x":"In narrow channels, vessels must navigate along the bank closest to their starboard side and always manoeuvre to starboard when they perceive a risk of collision."},{"i":128,"x":"In a channel or river, especially a narrow one, the larger vessel has right of way over small craft."},{"i":129,"x":"\"Safe speed\" is the speed that allows proper and effective action to be taken to avoid a collision, as well as to be stopped within a distance appropriate to the prevailing circumstances and conditions. When passing other vessels berthed or anchored along the banks of rivers and channels, we must reduce speed."},{"i":130,"x":"When one vessel is overtaking another, the faster vessel (the overtaking one) does not have the right of way and must manoeuvre to pass the other and get ahead safely."},{"i":131,"x":"The most common navigation lights on sport and recreational vessels are a white light forward, a white sternlight, and green and red (encarnada) lights combined."},{"i":132,"x":"Sound signals, which may be given by whistles, horns or bells, are used in manoeuvring situations, as warnings and in low visibility."},{"i":133,"x":"A short blast lasts approximately 1 second."},{"i":134,"x":"A prolonged blast lasts 4 to 6 seconds."},{"i":135,"x":"One short blast means \"I am altering my course to starboard\"."},{"i":136,"x":"Two short blasts mean \"I am altering my course to port\"."},{"i":137,"x":"Three short blasts mean \"I am operating astern propulsion\"."},{"i":138,"x":"Two prolonged blasts followed by one short blast mean \"I intend to overtake you on your starboard side\"."},{"i":139,"x":"Two prolonged blasts followed by two short blasts mean \"I intend to overtake you on your port side\"."},{"i":140,"x":"Five or more short blasts mean \"I do not understand your intentions\"."},{"i":141,"x":"One prolonged blast every two minutes means \"power-driven vessel making way, in restricted visibility\"."},{"i":142,"x":"Two prolonged blasts every two minutes mean \"there is a power-driven vessel underway but stopped and making no way, in restricted visibility\"."},{"i":143,"x":"A vessel not under command has right of way over a sailing vessel, a vessel restricted in her ability to manoeuvre and a vessel engaged in fishing."},{"i":144,"x":"A vessel with a tow length of less than 200 metres must display two white masthead lights."},{"i":145,"x":"A vessel with a tow length of more than 200 metres must display three white masthead lights."},{"i":146,"x":"A large vessel carrying dangerous cargo must display, at night, a red (encarnada) light at the top of the mast."},{"i":147,"x":"If during the day I sight a vessel with a black ball (day shape) on the mast, it means she is at anchor."},{"i":148,"x":"At bends of rivers or narrow channels, where visibility is impaired, we must give one prolonged blast to draw attention. This blast must be answered with one prolonged blast by any vessels that are hidden."},{"i":149,"x":"The most correct way for a vessel to pass another vessel coming in the opposite direction is port to port."},{"i":150,"x":"Navigation lights must not be used when the vessel is berthed at the quay."},{"i":151,"x":"In the absence of a whistle, the vessel may use a horn or bell to signal its intentions."},{"i":152,"x":"Sport and recreational vessels without engine propulsion and less than 5 metres in length are exempt from carrying a horn or other device that replaces it."},{"i":153,"x":"A black ball hoisted on the main mast or where it can best be seen does not constitute a distress signal."},{"i":154,"x":"A flashing yellow light crossing the channel at night may be a vessel navigating at high speed."},{"i":155,"x":"A sport and recreational vessel should avoid crossing a traffic lane as far as possible; however, if such a manoeuvre is necessary, it must do so crossing the traffic lane perpendicularly, which is the shortest route, and as quickly as possible."},{"i":156,"x":"Sidelights, masthead lights and sternlights are sectored to better identify the vessel's movement at night."},{"i":157,"x":"A searchlight may be used to signal danger to another vessel when directed at her."},{"i":158,"x":"Situations normally indicated by buoyage are: natural dangers and lateral limits of channels, areas of significant maritime accidents (wrecks), new dangers, and areas where special works are being carried out."},{"i":159,"x":"Buoyage marks are: lateral marks, cardinal marks, isolated danger marks, new dangers, safe water marks and special marks."},{"i":160,"x":"The main purpose of special marks is to indicate an area or feature mentioned in nautical documents."},{"i":161,"x":"The topmark of a special mark is a yellow \"X\"."},{"i":162,"x":"Marks are identified during the day by topmark, shape and colour."},{"i":163,"x":"An unlit buoy (bóia cega) is one that does NOT show lights."},{"i":164,"x":"Buoyage is identified at night by the rhythm and colours of the lights. In other words, we can recognize buoyage at night by the colour and rhythm of the lights."},{"i":165,"x":"The buoyage system may have a device called a RACON, a system that emits a signal on the radar screen and therefore facilitates its identification."},{"i":166,"x":"The only case in which we use doubled buoyage, with two identical marks, is when there is an isolated danger not yet recorded on the nautical chart."},{"i":167,"x":"The port-hand buoy shows a green light at night."},{"i":168,"x":"The lateral channel mark on the starboard side of someone entering the port is red (encarnada)."},{"i":169,"x":"The lateral channel mark on the port side of someone entering the port is green."},{"i":170,"x":"The starboard-hand buoy shows a red (encarnada) light at night."},{"i":171,"x":"The buoyage indicating safe water is coloured white and red (encarnada)."},{"i":172,"x":"The buoyage indicating an isolated danger is coloured black and red (encarnada)."},{"i":173,"x":"Buoyage in which marks are indicated by buoys or beacons positioned in relation to the 4 (four) quadrants is called cardinal."},{"i":174,"x":"The topmark of the north cardinal mark is two black cones, one above the other, with points upward."},{"i":175,"x":"The topmark of the south cardinal mark is two black cones, one above the other, with points downward."},{"i":176,"x":"The topmark of the east cardinal mark is two black cones, one above the other, base to base."},{"i":177,"x":"The topmark of the west cardinal mark is two black cones, one above the other, point to point."},{"i":178,"x":"The buoyage indicating the quadrant on whose side there is safe water is coloured yellow and black."},{"i":179,"x":"The buoys marking the sides of a preferred channel are coloured green and red (encarnada)."},{"i":180,"x":"At night, the colour of the lights of cardinal, isolated danger and safe water marks is white."},{"i":181,"x":"Buoyage buoys may be, in terms of lights, unlit or lit."},{"i":182,"x":"At night, the colour of the light shown by preferred channel to starboard buoyage is green."},{"i":183,"x":"At night, the colour of the light shown by preferred channel to port buoyage is red (encarnada)."},{"i":184,"x":"Channel buoyage is numbered in increasing order starting from the channel entrance."},{"i":185,"x":"A black buoy with one or more horizontal red (encarnada) bands indicates an isolated danger."},{"i":186,"x":"A buoy with white and red (encarnada) vertical stripes indicates safe water."},{"i":187,"x":"The shapes of lateral channel buoys are cylindrical (can), pillar, spar or conical."},{"i":188,"x":"The girder of the main span of a fixed bridge must show a quick-flashing white light at its centre."},{"i":189,"x":"In waterway buoyage, an \"X\" mark means change to the other bank."},{"i":190,"x":"In waterway buoyage, seeing an \"H\" mark means keep to the middle of the channel."},{"i":191,"x":"In waterway buoyage, a \"Y\" mark means a channel fork (bifurcation)."},{"i":192,"x":"In waterway buoyage, a \"+\" mark means isolated danger."},{"i":193,"x":"In waterway buoyage, a \" \" mark means channel close to the bank."},{"i":194,"x":"On a bridge pier over a navigable river, two yellow diamonds were seen, joined to each other at their side points; this means traffic is allowed in one direction only."},{"i":195,"x":"When a navigator in his vessel is approaching a channel fork and comes across a two-coloured buoyage mark, and he found that the greatest depth was in the channel on his starboard side, the two colours seen by the navigator are green with a horizontal red (encarnada) band."},{"i":196,"x":"On a bridge pier over a navigable river, a yellow diamond was seen; this means traffic is allowed in both directions."},{"i":197,"x":"On a bridge pier over a navigable river, a triangle painted green was seen; this means the traffic lane is on the right of those going down or up the river."},{"i":198,"x":"On a bridge pier over a navigable river, a triangle painted red was seen; this means the traffic lane is on the left of those going down or up the river."},{"i":199,"x":"On a bridge pier over a navigable river, a rectangle painted green was seen; this means the traffic lane is on the right of those going down or up the river."},{"i":200,"x":"On a bridge pier over a navigable river, a rectangle painted red with a wide horizontal white band was seen; this means traffic is prohibited."},{"i":201,"x":"A buoy showing a yellow light at night means a recreation area."},{"i":202,"x":"At night, a flashing green light was sighted and, according to the nautical chart, the vessel was approaching a port entrance. The probable shape of this mark is cylindrical (can)."},{"i":203,"x":"During the day, a pillar-shaped pole was seen with two black spheres on its top. We are probably facing an isolated danger mark."},{"i":204,"x":"During the day, a pillar was seen with two black cones on top. We are probably facing a mark indicating a safe-water quadrant (cardinal mark)."},{"i":205,"x":"Inner harbour buoyage follows defined rules and must be used by the navigator as guidance for safe navigation."},{"i":206,"x":"When two power-driven vessels are approaching on nearly or directly opposite courses with risk of collision, they must pass \"port to port\"."},{"i":207,"x":"Safe water marking means navigable water."},{"i":208,"x":"The topmark of the safe water mark is a red (encarnada) sphere."},{"i":209,"x":"The COLREGs (RIPEAM) rules apply to all vessels on the open sea and in all waters connected therewith navigable by seagoing ships, and to vessels in inland waters."},{"i":210,"x":"The buoyage region covering Brazil is called: Region \"B\" (IALA Region B)."},{"i":211,"x":"In Brazil, the \"conventional direction of buoyage\", that is, the buoyage numbering, always increases coming from the sea and, in the case of river navigation, going upriver."},{"i":212,"x":"A vessel engaged in diving operations must display the ALFA flag."},{"i":213,"x":"A vessel proceeding under sail when also using her mechanical propulsion must display forward, where it can best be seen, a conical shape with its apex pointing downward."},{"i":214,"x":"A vessel is deemed to be overtaking when she approaches another from a direction more than 22.5° abaft the latter's beam and at a higher speed."},{"i":215,"x":"If a navigator goes from Rio de Janeiro to Belém, he will be carrying out cabotage (coastal) navigation."},{"i":216,"x":"Power-driven vessels less than 12 metres in length may, in lieu of the lights prescribed in paragraph (a) of Rule 23 of the COLREGs (RIPEAM), exhibit an all-round white light and sidelights."},{"i":217,"x":"The expression \"running before the weather\" (correr com o tempo) means putting the sea on the quarter and navigating at reduced speed to ride out a storm."},{"i":218,"x":"A vessel showing at night two all-round red (encarnada) lights in a vertical line is a vessel not under command."},{"i":219,"x":"Sport and recreational vessels less than 12 metres in length normally show combined sidelights (green and red) and an all-round white light."},{"i":220,"x":"A steady white light placed as nearly as practicable at the stern, or on the transom, visible only to those coming from astern, over a horizontal arc of 135°, is called a sternlight."},{"i":221,"x":"A yellow light with the same characteristics as the sternlight, placed above it, is called a towing light."},{"i":222,"x":"A steady white light placed on the vessel's mast, visible to those coming from abeam or ahead over a horizontal arc of 225°, is called a masthead light."},{"i":223,"x":"A sailing vessel less than 20 metres in length, underway at night, may exhibit a combined lantern on the mast where it can best be seen."},{"i":224,"x":"Sail-only vessels of standardized classes by \"type\", for navigation exclusively in daytime, are exempt from carrying the prescribed life-saving equipment, except life jackets."},{"i":225,"x":"A vessel less than 50 metres in length displaying a white light where it can best be seen is at anchor."},{"i":226,"x":"A vessel 100 metres or more in length, at anchor, in restricted visibility, must ring the bell forward and sound the gong aft."},{"i":227,"x":"In river signalling, the left bank means the bank located on the left side of someone going downriver (from upstream to downstream)."},{"i":228,"x":"A motor vessel over 12 metres with a white light where it can best be seen is at anchor."},{"i":229,"x":"The cardinal mark buoys are: North, East, South and West (these are the 4 quadrants)."},{"i":230,"x":"According to the COLREGs (RIPEAM), in a narrow channel, if a vessel is overtaking me and sounds two prolonged blasts and one short, if I agree to being overtaken I must sound four blasts (prolonged, short, prolonged, short) and manoeuvre, allowing safe overtaking on my starboard side."},{"i":231,"x":"When I come across a North cardinal buoy, I understand that it is dangerous to navigate to the South, East and West of the buoy."},{"i":232,"x":"According to the COLREGs (RIPEAM), in a risk-of-collision situation, the vessel that is not obliged to manoeuvre is called the \"stand-on vessel\" (the vessel with right of way)."},{"i":233,"x":"When, in an accident on board, the injured person is not breathing, mouth-to-mouth resuscitation should be performed."},{"i":234,"x":"The rate of breaths per minute in mouth-to-mouth resuscitation is 10 to 15."},{"i":235,"x":"Before performing mouth-to-mouth resuscitation, you should first check for foreign bodies in the mouth."},{"i":236,"x":"If, after mouth-to-mouth resuscitation, the victim's heart is still not beating, the correct procedure is to perform external cardiac massage."},{"i":237,"x":"If the heart of the victim of an accident on board is not beating, external cardiac massage should be started."},{"i":238,"x":"One of the symptoms accompanying cardiac arrest is a dilated pupil."},{"i":239,"x":"What should be tried immediately in the case of cardiac arrest, and which sometimes works, is a strong punch to the victim's chest."},{"i":240,"x":"After cardiac massage has made the heart start beating again, mouth-to-mouth resuscitation should be continued."},{"i":241,"x":"The ideal rate of chest compression and release in external cardiac massage is 69 times per minute."},{"i":242,"x":"When respiratory arrest and cardiac arrest occur at the same time, alternating movements should be performed: 8 cardiac compressions and one mouth-to-mouth breath."},{"i":243,"x":"In mouth-to-mouth resuscitation, the victim's head should be tilted back."},{"i":244,"x":"In the case of a forearm fracture, it can be immobilized with a board, cardboard or thick newspaper."},{"i":245,"x":"A splint is the device used to immobilize broken bones, by means of strips of cloth tied to it."},{"i":246,"x":"To immobilize the arm, it should be kept bent."},{"i":247,"x":"For leg fractures, long pieces of wood can be secured with strips of cloth or a belt, with the leg straight."},{"i":248,"x":"The position of the foot of a broken leg should be as natural as possible."},{"i":249,"x":"If there is a risk of fire or explosion near the victim with a fracture, the victim should first be removed from the danger area."},{"i":250,"x":"An electric shock victim must be removed from contact with the electric current using a material that does not conduct electricity."},{"i":251,"x":"A metal object is one of the materials that must not be used to remove the victim from contact with the electric current."},{"i":252,"x":"After the victim has been removed from contact with the electric current, if necessary, mouth-to-mouth resuscitation and external cardiac massage should be performed."},{"i":253,"x":"For small burns, wash with water and avoid breaking the blister."},{"i":254,"x":"For large burns, the victim's clothing should never be removed."},{"i":255,"x":"A 2nd-degree burn is characterized by the presence of blisters and exudation (oozing)."},{"i":256,"x":"In a 3rd-degree burn the dermis is completely destroyed."},{"i":257,"x":"Haemorrhage is a large loss of blood."},{"i":258,"x":"Whenever we can see the blood, we say the haemorrhage is external."},{"i":259,"x":"To stop a haemorrhage, we should press on the site with a thick cloth."},{"i":260,"x":"A haemorrhage victim should be kept warm to prevent shock."},{"i":261,"x":"The method of stopping bleeding (haemostasis) that causes the least harm to the victim is compression."},{"i":262,"x":"A tourniquet is used to stop very large haemorrhages."},{"i":263,"x":"A tourniquet should be applied using a wide cloth and a piece of wood fixed to the cloth with a knot; by twisting the wood, the pressure will stop the haemorrhage."},{"i":264,"x":"Except in cases where the tourniquet is applied just above amputations, it should be loosened every 15 minutes."},{"i":265,"x":"Important precautions with a tourniquet are: tighten it whenever the haemorrhage does not stop, do not remove it as soon as the haemorrhage stops, do not cover it, and loosen it every 15 minutes."},{"i":266,"x":"Correct actions regarding a victim of major haemorrhage are not giving liquids while the victim is unconscious and keeping him or her warm."},{"i":267,"x":"First aid consists of emergency assistance measures taken before medical referral."},{"i":268,"x":"Heat stroke (intermação) is the consequence of excessive heat on a person in humid, poorly ventilated places."},{"i":269,"x":"In cases of ingestion of corrosive substances, caustics in general and petroleum products, dilute or neutralize these substances by drinking water or milk."},{"i":270,"x":"When, for some reason, we cannot apply the mouth-to-mouth method, we can ventilate the victim through the nose."},{"i":271,"x":"The condition in which the human body loses heat most rapidly can be produced by Hypothermia."},{"i":272,"x":"Hypothermia is caused by any water cold enough to lower the body temperature below 35 degrees Celsius."},{"i":273,"x":"In case of hypothermia, after applying first aid, we should leave the patient in the prone position (lying face down), slightly tilted to the side."},{"i":274,"x":"An injury resulting from prolonged exposure to cold is called Frostbite (Geladura)."},{"i":275,"x":"To improve the comfort of a victim with a leg fracture, the best position in which to immobilize it is: straight."},{"i":276,"x":"The approximate amount of blood in the body is 6 litres."},{"i":277,"x":"In gas poisoning, the skin turns bluish."},{"i":278,"x":"To prevent infection in a wound we should clean it with soap and water, bathe the wound with saline solution and clean it periodically."},{"i":279,"x":"The main complications of a wound are haemorrhage and infection."},{"i":280,"x":"Sunstroke (insolação) is the consequence of direct and prolonged exposure of a person to the sun's rays."},{"i":281,"x":"In the case of drowning, proceed as follows: lay the drowning victim on his side to vomit the water swallowed, remove wet clothing and warm him."},{"i":282,"x":"If the drowning victim is not breathing, lay him on his side, clear his mouth of objects obstructing breathing and perform mouth-to-mouth resuscitation."},{"i":283,"x":"If the drowning victim's heart is not beating, I should perform external cardiac massage."},{"i":284,"x":"If the burned person's clothes are stuck to the body, the clothes should be left over the burns."},{"i":285,"x":"If I see a clear fluid coming from an ear wound, it means a skull fracture."},{"i":286,"x":"In the case of an internal (closed) fracture, the immediate action is to immobilize the affected limb."},{"i":287,"x":"Fire will only occur when the three elements of the fire triangle are present: fuel, oxidizer (oxygen) and ignition temperature."},{"i":288,"x":"The temperature needed for the chemical reaction to occur between fuel and oxidizer, producing gases capable of combustion, is called the ignition temperature."},{"i":289,"x":"Combustion is the reaction of fuel and oxygen when they meet in the presence of the ignition temperature."},{"i":290,"x":"Fuel is the element in nature capable of burning in the presence of oxygen and the ignition temperature."},{"i":291,"x":"An oxidizer is any element which, by combining chemically with the fuel, is capable of making it burn. The oxidizer most easily found in nature is oxygen."},{"i":292,"x":"\"Ignition Point\" is the temperature needed to ignite the gases being released from a fuel with only the presence of the oxidizer."},{"i":293,"x":"The firefighting equipment most commonly found on board sport and recreational vessels is portable fire extinguishers."},{"i":294,"x":"Portable fire extinguishers are firefighting equipment that use extinguishing agents to put out fire."},{"i":295,"x":"Extinguishing agents are the substances that put out fires."},{"i":296,"x":"With a fire on board, to fight the flames I stay to windward of the flames and smoke."},{"i":297,"x":"The water fire extinguisher should be used to fight fires in flammable solid materials."},{"i":298,"x":"A class \"A\" fire occurs in fibrous or flammable solid materials that leave embers or ashes as residue. For example: paper, wood, cloth."},{"i":299,"x":"CO2 fire extinguishers are used on fires in energized electrical equipment."},{"i":300,"x":"Foam fire extinguishers are used on fires in flammable liquids."},{"i":301,"x":"A class \"B\" fire is one that occurs in flammable liquids."},{"i":302,"x":"A class \"C\" fire is one that occurs in energized electrical or electronic materials or equipment."},{"i":303,"x":"To use the water fire extinguisher, squeeze the trigger and direct it at the base of the flames."},{"i":304,"x":"To use the CO2 fire extinguisher, remove the safety pin, hold the diffuser and squeeze the trigger, directing the jet at the base of the fire."},{"i":305,"x":"To use the foam fire extinguisher, turn the extinguisher upside down, cap downward, and direct the jet onto the base of the flames."},{"i":306,"x":"Firefighting is greatly helped when we move flammable material far away and cool the nearby areas."},{"i":307,"x":"Precautions to take with CO2 fire extinguishers: avoid direct contact of the jet with the skin and eyes."},{"i":308,"x":"A drawback of the CO2 extinguishing agent is that it can asphyxiate a person in unventilated spaces."},{"i":309,"x":"Water is an extinguishing agent that can be used on fires in accommodation spaces."},{"i":310,"x":"Portable fire extinguishers should be stowed in easily accessible places and in places with fire risk."},{"i":311,"x":"I am in the wheelhouse and begin to smell burning coming from the engine. The portable fire extinguisher I should take is the foam one."},{"i":312,"x":"I am at the stern of the vessel and see smoke coming from the navigation console. The fire extinguisher to take is the CO2 one."},{"i":313,"x":"To put out fires, in the absence of a portable fire extinguisher, we can improvise with buckets of water."},{"i":314,"x":"You should always have on board portable fire extinguishers with valid annual inspections."},{"i":315,"x":"The number and type of portable fire extinguishers on sport and recreational vessels must be complied with on board in order to sail, and are defined in DPC regulatory documents (in the DPC's NORMAM-03)."},{"i":316,"x":"Fixed firefighting systems are systems with fixed diffusers."},{"i":317,"x":"Fires in places of difficult access are fought by means of fixed extinguishing agent systems."},{"i":318,"x":"Extinguishing agents are: water, CO2, foam and dry chemical powder."},{"i":319,"x":"The extinguishing agent for class \"D\" fires is Dry Chemical Powder (PQS)."},{"i":320,"x":"Fires involving combustible metals such as sodium, potassium, magnesium, titanium and aluminium are called class \"D\" fires."},{"i":321,"x":"Fire extinguishers used on class \"A\" fires are identified by a green triangle."},{"i":322,"x":"Fire extinguishers used on class \"B\" fires are identified by a red square."},{"i":323,"x":"Fire extinguishers us
