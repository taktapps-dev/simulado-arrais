は自船の右舷側に最も近い岸寄りを航行し、衝突のおそれがあると認めた場合は常に右舷へ避航しなければなりません。"},{"i":128,"x":"水道や河川、特に狭いところでは、大型船舶は小型船に対して優先権があります。"},{"i":129,"x":"「安全な速力」とは、衝突を避けるための適切かつ有効な動作をとることができ、また、その時の状況および条件に適した距離で停止することができる速力です。河川や水道の岸に着岸または錨泊している他の船舶のそばを通過するときは、速力を落とさなければなりません。"},{"i":130,"x":"一方の船舶が他方の船舶を追い越す場合、速力の速い船舶（追越し船）には航行の優先権がなく、他方の船舶の前方を安全に通過するように避航しなければなりません。"},{"i":131,"x":"スポーツ・レクリエーション用船舶で最も一般的な航海灯は、前方の白灯、白色の船尾灯、そして緑灯と赤灯を組み合わせた舷灯です。"},{"i":132,"x":"汽笛、ホーンまたは号鐘で発することができる音響信号は、操船、警告および視界不良の状況で使用されます。"},{"i":133,"x":"短音の長さは約1秒です。"},{"i":134,"x":"長音の長さは4〜6秒です。"},{"i":135,"x":"短音1回は「私は右舷に針路を変えている」ことを意味します。"},{"i":136,"x":"短音2回は「私は左舷に針路を変えている」ことを意味します。"},{"i":137,"x":"短音3回は「私は機関を後進にかけている」ことを意味します。"},{"i":138,"x":"長音2回に続く短音1回は「私はあなたの右舷側を追い越そうとする」ことを意味します。"},{"i":139,"x":"長音2回に続く短音2回は「私はあなたの左舷側を追い越そうとする」ことを意味します。"},{"i":140,"x":"短音5回以上は「あなたの操船の意図が理解できない」ことを意味します。"},{"i":141,"x":"2分ごとの長音1回は「視界制限状態において対水速力を有する動力船」を意味します。"},{"i":142,"x":"2分ごとの長音2回は「視界制限状態において、機関を使用しているが停止して対水速力を有しない船舶がいる」ことを意味します。"},{"i":143,"x":"運転不自由船は、帆船、操縦性能制限船および漁ろうに従事している船舶に対して優先権があります。"},{"i":144,"x":"曳航物の長さが200メートル未満の船舶は、マストに2個の白灯を表示しなければなりません。"},{"i":145,"x":"曳航物の長さが200メートルを超える船舶は、マストに3個の白灯を表示しなければなりません。"},{"i":146,"x":"危険物を運ぶ大型船舶は、夜間、マストの頂部に赤灯1個を表示しなければなりません。"},{"i":147,"x":"昼間、マストに黒色の球形形象物を掲げた船舶を見かけた場合、その船舶は錨泊していることを意味します。"},{"i":148,"x":"視界が妨げられる河川の湾曲部や狭い水道では、注意を喚起するために長音1回を鳴らさなければなりません。この汽笛に対し、見えない位置にいる船舶は長音1回で応答しなければなりません。"},{"i":149,"x":"反対方向から来る他の船舶と行き違う最も正しい方法は、左舷対左舷です。"},{"i":150,"x":"船舶が岸壁に着岸しているときは、航海灯を使用してはいけません。"},{"i":151,"x":"汽笛がない場合、船舶はホーンまたは号鐘を使って自船の意図を示すことができます。"},{"i":152,"x":"エンジン推進のない長さ5メートル未満のスポーツ・レクリエーション用船舶は、ホーンまたはその代わりとなる器具の使用を免除されています。"},{"i":153,"x":"メインマストまたは最もよく見える場所に掲げられた黒色の球形形象物1個は、遭難信号ではありません。"},{"i":154,"x":"夜間に水道を横切る黄色の点滅灯は、高速で航行している船舶である可能性があります。"},{"i":155,"x":"スポーツ・レクリエーション用船舶は、できる限り通航路を横切ることを避けなければなりませんが、そのような操船が必要な場合は、最短の経路である通航路に対して垂直な方向に、できるだけ速やかに横切らなければなりません。"},{"i":156,"x":"舷灯、マスト灯および船尾灯は、夜間に船舶の動きをよりよく識別できるよう、照射範囲が区分（セクター化）されています。"},{"i":157,"x":"探照灯は、他の船舶に向けて照射することで、その船舶に危険を知らせるために使用することができます。"},{"i":158,"x":"通常、航路標識によって示される状況は、自然の危険物と水道の側方の境界、重大な海難の発生区域、新たな危険物、および特殊な作業が行われている区域です。"},{"i":159,"x":"航路標識には、側面標識、方位標識、孤立障害標識、新危険物標識、安全水域標識および特殊標識があります。"},{"i":160,"x":"特殊標識の主な目的は、海図などの航海用文書に記載された区域または特徴を示すことです。"},{"i":161,"x":"特殊標識の頭標は黄色の「X」です。"},{"i":162,"x":"昼間の標識の識別は、頭標、形状および色によって行います。"},{"i":163,"x":"灯火のないブイ（bóia cega）とは、光を発しないブイのことです。"},{"i":164,"x":"夜間の航路標識の識別は、灯火の点灯リズムと色によって行います。言い換えれば、夜間は灯火の色とリズムによって航路標識を見分けることができます。"},{"i":165,"x":"航路標識には、レーダー画面上に信号を表示させ、その識別を容易にするシステムであるRACON（レーコン）という装置が備えられていることがあります。"},{"i":166,"x":"同じ標識を2つ重ねて設置する二重の航路標識を使用する唯一のケースは、まだ海図に記載されていない孤立した危険物がある場合です。"},{"i":167,"x":"左舷のブイは、夜間に緑色の光を発します。"},{"i":168,"x":"入港する者から見て右舷側にある水道の側面標識は、赤色です。"},{"i":169,"x":"入港する者から見て左舷側にある水道の側面標識は、緑色です。"},{"i":170,"x":"右舷のブイは、夜間に赤色の光を発します。"},{"i":171,"x":"安全水域を示す航路標識は、白色と赤色です。"},{"i":172,"x":"孤立障害を示す航路標識は、黒色と赤色です。"},{"i":173,"x":"4（四）つの象限に対応して配置されたブイまたは立標によって示される航路標識を、方位標識といいます。"},{"i":174,"x":"北方位標識の頭標は、2個の黒色円錐形を上下に重ね、頂点をいずれも上に向けたものです。"},{"i":175,"x":"南方位標識の頭標は、2個の黒色円錐形を上下に重ね、頂点をいずれも下に向けたものです。"},{"i":176,"x":"東方位標識の頭標は、2個の黒色円錐形を底面同士を合わせて上下に重ねたものです。"},{"i":177,"x":"西方位標識の頭標は、2個の黒色円錐形を頂点同士を合わせて上下に重ねたものです。"},{"i":178,"x":"その標識から見てどの象限に安全な水域があるかを示す航路標識は、黄色と黒色です。"},{"i":179,"x":"優先航路の側方の境界を示すブイは、緑色と赤色です。"},{"i":180,"x":"夜間、方位標識、孤立障害標識および安全水域標識の灯火の色は白色です。"},{"i":181,"x":"航路標識のブイは、灯火の有無によって、灯火のないものと灯火のあるものに分けられます。"},{"i":182,"x":"夜間、右舷側の優先航路を示す航路標識が発する灯火の色は緑色です。"},{"i":183,"x":"夜間、左舷側の優先航路を示す航路標識が発する灯火の色は赤色です。"},{"i":184,"x":"水道の航路標識の番号は、水道の入口から順に大きくなります。"},{"i":185,"x":"黒色に1本以上の赤色の横帯があるブイは、孤立障害を示します。"},{"i":186,"x":"白色と赤色の縦縞のブイは、安全水域を示します。"},{"i":187,"x":"水道の側面標識のブイの形状は、円筒形、柱形、葉巻形または円錐形です。"},{"i":188,"x":"固定橋の主径間の桁は、中央に白色の急閃光を表示しなければなりません。"},{"i":189,"x":"内水航路の航路標識において、「X」の標識は対岸側へ移ることを意味します。"},{"i":190,"x":"内水航路の航路標識において、「H」の標識が見えた場合は、水道の中央を進むことを意味します。"},{"i":191,"x":"内水航路の航路標識において、「Y」の標識は水道の分岐を意味します。"},{"i":192,"x":"内水航路の航路標識において、「+」の標識は孤立障害を意味します。"},{"i":193,"x":"内水航路の航路標識において、「 」の標識は岸寄りの水道を意味します。"},{"i":194,"x":"航行可能な河川に架かる橋の橋脚に、側方の頂点同士でつながった2つの黄色のひし形が見られた場合、一方通行での通航が許可されていることを意味します。"},{"i":195,"x":"船舶で水道の分岐点に近づいている航行者が2色の航路標識に出合い、自船の右舷側の水道の方が水深が深いことを確認した場合、その航行者が見た2色は、緑色に赤色の横帯1本です。"},{"i":196,"x":"航行可能な河川に架かる橋の橋脚に黄色のひし形1つが見られた場合、双方向の通航が許可されていることを意味します。"},{"i":197,"x":"航行可能な河川に架かる橋の橋脚に緑色に塗られた三角形が見られた場合、川を下る者または上る者から見て右側を通航することを意味します。"},{"i":198,"x":"航行可能な河川に架かる橋の橋脚に赤色に塗られた三角形が見られた場合、川を下る者または上る者から見て左側を通航することを意味します。"},{"i":199,"x":"航行可能な河川に架かる橋の橋脚に緑色に塗られた長方形が見られた場合、川を下る者または上る者から見て右側を通航することを意味します。"},{"i":200,"x":"航行可能な河川に架かる橋の橋脚に、白色の太い横帯が入った赤色の長方形が見られた場合、通航が禁止されていることを意味します。"},{"i":201,"x":"夜間に黄色の光を発しているブイは、レクリエーション区域を意味します。"},{"i":202,"x":"夜間に緑色の点滅する光が見え、海図により港の入口に近づいていることが確認されました。この標識の形状は円筒形である可能性が高いです。"},{"i":203,"x":"昼間、頂部に2個の黒色の球を付けた柱状の標柱が見えました。おそらく孤立障害標識の前にいます。"},{"i":204,"x":"昼間、頂部に2個の黒色の円錐形を付けた柱が見えました。おそらく安全な水域の象限を示す標識（方位標識）の前にいます。"},{"i":205,"x":"港内の航路標識は定められた規則に従っており、航行者は安全な航行のための指針としてこれを利用しなければなりません。"},{"i":206,"x":"2隻の動力船が、衝突のおそれがある状態で、ほぼ真向かいまたは真向かいの針路で接近している場合、「左舷対左舷」で行き違わなければなりません。"},{"i":207,"x":"安全水域標識は、航行可能な水域であることを意味します。"},{"i":208,"x":"安全水域標識の頭標は、赤色の球1個です。"},{"i":209,"x":"国際海上衝突予防規則（RIPEAM/COLREG）は、公海およびこれに接続し外洋航行船が航行できるすべての水域にあるすべての船舶、ならびに内水にある船舶に適用されます。"},{"i":210,"x":"ブラジルが含まれる航路標識の地域は、「B」地域（IALA B地域）と呼ばれます。"},{"i":211,"x":"ブラジルにおける「航路標識の慣行方向」、すなわち航路標識の番号は、常に海から来る方向、河川航行の場合は川を上る方向に増加します。"},{"i":212,"x":"潜水作業中の船舶は、A旗（ALFA旗）を掲げなければなりません。"},{"i":213,"x":"帆走中の船舶が推進機関も使用している場合、前方の最もよく見える場所に、頂点を下に向けた円錐形の形象物を掲げなければなりません。"},{"i":214,"x":"追越し船とみなされるのは、他の船舶の正横後22,5°を超える後方から、より速い速力でその船舶に接近する船舶です。"},{"i":215,"x":"航行者がリオデジャネイロからベレンへ向かう場合、cabotagem（沿岸航行・内航）を行っていることになります。"},{"i":216,"x":"長さ12メートル未満の動力船は、国際海上衝突予防規則（RIPEAM/COLREG）第23条a項に定める灯火の代わりに、白色全周灯1個と舷灯を表示することができます。"},{"i":217,"x":"「荒天時に追い波で走る（correr com o tempo）」という表現は、海（波）を船尾側の舷側（クォーター）から受け、速力を落として航行し、嵐を乗り切ることを意味します。"},{"i":218,"x":"夜間に垂直線上に並んだ2個の赤色全周灯を表示している船舶は、運転不自由船です。"},{"i":219,"x":"長さ12メートル未満のスポーツ・レクリエーション用船舶は、通常、両色灯の舷灯（緑と赤）と白色全周灯1個を表示します。"},{"i":220,"x":"できる限り船尾の近く、またはトランサムに設置され、後方から来る者にのみ見える、水平135°の範囲を照らす白色の不動灯を、船尾灯といいます。"},{"i":221,"x":"船尾灯と同じ特性を持ち、その上方に設置される黄色の灯火を、引き船灯といいます。"},{"i":222,"x":"船舶のマストに設置され、正横方向または船首方向から来る者に見える、水平225°の範囲を照らす白色の不動灯を、マスト灯といいます。"},{"i":223,"x":"長さ20メートル未満の帆船は、夜間航行中、マストの最もよく見える場所に三色灯（組合せ灯）を表示することができます。"},{"i":224,"x":"昼間のみ航行する、「型式」により標準化されたクラスの帆のみで推進する船舶は、救命胴衣を除き、所定の救命設備の搭載を免除されています。"},{"i":225,"x":"最もよく見える場所に白灯1個を表示している長さ50メートル未満の船舶は、錨泊しています。"},{"i":226,"x":"長さ100メートル以上の船舶が視界制限状態で錨泊している場合は、前方で号鐘を、後方でどらを鳴らさなければなりません。"},{"i":227,"x":"河川の標識において、左岸とは、川を下る者（上流から下流へ向かう者）から見て左側にある岸をいいます。"},{"i":228,"x":"最もよく見える場所に白灯1個を表示している長さ12メートルを超える動力船は、錨泊しています。"},{"i":229,"x":"方位標識のブイは、北、東、南、西です（これらが4つの象限です）。"},{"i":230,"x":"国際海上衝突予防規則（RIPEAM/COLREG）によれば、狭い水道で、ある船舶が私の船を追い越そうとして長音2回と短音1回を鳴らした場合、私が追越しに同意するなら、4回の汽笛（長音、短音、長音、短音）を鳴らし、私の船の右舷側を安全に追い越せるように操船しなければなりません。"},{"i":231,"x":"北方位標識のブイに出合った場合、そのブイの南、東、西側を航行するのは危険であると理解します。"},{"i":232,"x":"国際海上衝突予防規則（RIPEAM/COLREG）によれば、衝突のおそれがある状況で避航義務のない船舶を、「優先権のある船舶（保持船）」と呼びます。"},{"i":233,"x":"船上での事故の際、負傷者が呼吸をしていない場合は、口対口人工呼吸を行わなければなりません。"},{"i":234,"x":"口対口人工呼吸における1分あたりの吹き込み回数は10〜15回です。"},{"i":235,"x":"口対口人工呼吸を行う前に、口の中に異物がないかを確認しなければなりません。"},{"i":236,"x":"口対口人工呼吸を行った後も傷病者の心臓が拍動していないことが確認された場合、正しい処置は胸骨圧迫（体外式心臓マッサージ）を行うことです。"},{"i":237,"x":"船上での事故の傷病者の心臓が拍動していない場合は、胸骨圧迫（体外式心臓マッサージ）を開始しなければなりません。"},{"i":238,"x":"心停止に伴う症状の一つは、瞳孔の散大です。"},{"i":239,"x":"心停止の場合にすぐに試みるべきで、時に効果があるものは、傷病者の胸を強く叩くことです。"},{"i":240,"x":"心臓マッサージによって心臓が再び拍動し始めた後は、口対口人工呼吸を続けなければなりません。"},{"i":241,"x":"胸骨圧迫（体外式心臓マッサージ）における胸の圧迫と解除の理想的な頻度は、1分間に69回です。"},{"i":242,"x":"呼吸停止と心停止が同時に起きている場合は、心臓マッサージ8回と口対口人工呼吸1回を交互に行わなければなりません。"},{"i":243,"x":"口対口人工呼吸では、傷病者の頭を後ろに反らせておかなければなりません。"},{"i":244,"x":"前腕骨折の場合は、板、段ボール、または厚い新聞紙で固定することができます。"},{"i":245,"x":"副木（tala）は、布の帯で縛り付けて、骨折した骨を固定するために使用する器具です。"},{"i":246,"x":"腕を固定するときは、腕を曲げた状態にしておかなければなりません。"},{"i":247,"x":"脚の骨折の場合は、脚を伸ばした状態で、布の帯やベルトを使って長い木材を固定することができます。"},{"i":248,"x":"骨折した脚の足の位置は、できるだけ自然な状態でなければなりません。"},{"i":249,"x":"骨折した傷病者の近くに火災や爆発の危険がある場合は、まず傷病者を危険な場所から移動させなければなりません。"},{"i":250,"x":"感電した傷病者は、電気を通さない材料を使用して、電流との接触から引き離す必要があります。"},{"i":251,"x":"金属製の物は、傷病者を電流との接触から引き離すために使用してはならない材料の一つです。"},{"i":252,"x":"傷病者を電流との接触から引き離した後、必要であれば、口対口人工呼吸と胸骨圧迫（体外式心臓マッサージ）を行わなければなりません。"},{"i":253,"x":"小さなやけどの場合は、水で洗い、水ぶくれを破らないようにしなければなりません。"},{"i":254,"x":"広範囲のやけどの場合、傷病者の衣服を決して脱がせてはいけません。"},{"i":255,"x":"2度のやけどは、水ぶくれと滲出液があることが特徴です。"},{"i":256,"x":"3度のやけどでは、真皮が完全に破壊されます。"},{"i":257,"x":"出血（hemorragia）とは、大量に血液を失うことです。"},{"i":258,"x":"血液が目に見える場合は、外出血といいます。"},{"i":259,"x":"出血を止めるには、厚い布でその部位を圧迫しなければなりません。"},{"i":260,"x":"出血した傷病者は、ショックを防ぐために保温しなければなりません。"},{"i":261,"x":"傷病者への害が最も少ない止血（hemostasia）の方法は、圧迫です。"},{"i":262,"x":"止血帯（torniquete）は、非常に大量の出血を止めるために使用されます。"},{"i":263,"x":"止血帯は、幅の広い布と木片を使って施します。木片を結び目で布に固定し、木片をねじることで、その圧力によって出血が止まります。"},{"i":264,"x":"切断部のすぐ上に止血帯を施した場合を除き、締め付けは15分ごとに緩めなければなりません。"},{"i":265,"x":"止血帯に関する重要な注意点は、出血が止まらない場合は常に締めること、出血が止まってもすぐに外さないこと、覆わないこと、そして15分ごとに締め付けを緩めることです。"},{"i":266,"x":"大量出血の傷病者に対する正しい対応は、意識がない間は液体を与えないこと、そして保温しておくことです。"},{"i":267,"x":"応急手当とは、医療機関に引き渡す前に行う緊急の救護措置です。"},{"i":268,"x":"熱射病（intermação）とは、湿度が高く換気の悪い場所での過度の暑さが人に及ぼす影響の結果です。"},{"i":269,"x":"腐食性物質、一般的な苛性物質および石油製品を飲み込んだ場合は、水または牛乳を飲ませてそれらの物質を希釈または中和します。"},{"i":270,"x":"何らかの理由で口対口人工呼吸を行えない場合は、鼻から傷病者に換気を行うことができます。"},{"i":271,"x":"人体が最も急速に熱を失う状態は、低体温症（Hipotermia）によって引き起こされることがあります。"},{"i":272,"x":"低体温症は、体温を35℃未満に下げるほど冷たい水であれば、どのような水でも起こります。"},{"i":273,"x":"低体温症の場合、応急手当を行った後、患者をうつ伏せの姿勢で、やや横に傾けた状態にしておかなければなりません。"},{"i":274,"x":"長時間寒さにさらされたことによる損傷を、凍傷（Geladura）といいます。"},{"i":275,"x":"脚を骨折した傷病者の苦痛を和らげるために、固定する最良の姿勢は、伸ばした状態です。"},{"i":276,"x":"体内の血液量はおよそ6リットルです。"},{"i":277,"x":"ガスによる中毒では、皮膚が青みがかった色になります。"},{"i":278,"x":"傷の感染を防ぐには、石けんと水で洗い、生理食塩水で傷を洗浄し、定期的に清潔にしなければなりません。"},{"i":279,"x":"傷の主な合併症は、出血と感染です。"},{"i":280,"x":"日射病（insolação）とは、直射日光に長時間さらされた結果、人に生じるものです。"},{"i":281,"x":"溺水の場合は、次のように対処します：溺れた人を横向きに寝かせて飲み込んだ水を吐かせ、濡れた衣服を脱がせて体を温めます。"},{"i":282,"x":"溺れた人が呼吸をしていない場合は、横向きに寝かせ、呼吸を妨げる異物を口から取り除き、口対口人工呼吸を行わなければなりません。"},{"i":283,"x":"溺れた人の心臓が拍動していない場合は、胸骨圧迫（体外式心臓マッサージ）を行わなければなりません。"},{"i":284,"x":"やけどをした人の衣服が体に貼り付いている場合は、衣服をやけどの上にそのままにしておかなければなりません。"},{"i":285,"x":"耳の傷から透明な液体が出ているのが見える場合は、頭蓋骨骨折を意味します。"},{"i":286,"x":"閉鎖骨折の場合、直ちに行う処置は、患部の手足を固定することです。"},{"i":287,"x":"火が生じるのは、燃焼の三要素である可燃物、支燃物（酸素）、発火温度の3つがそろったときだけです。"},{"i":288,"x":"可燃物と支燃物の間で化学反応が起こり、燃焼し得るガスを発生させるのに必要な温度を、発火温度といいます。"},{"i":289,"x":"燃焼とは、発火温度のもとで可燃物と酸素が出合って起こる反応です。"},{"i":290,"x":"可燃物とは、酸素と発火温度のもとで燃えることのできる自然界の物質です。"},{"i":291,"x":"支燃物とは、可燃物と化学的に結合して、それを燃焼させることのできるあらゆる物質です。自然界で最も容易に見られる支燃物は酸素です。"},{"i":292,"x":"支燃物が存在するだけで、可燃物から発生しているガスに着火させるのに必要な温度を、「着火点（Ponto de Ignição）」といいます。"},{"i":293,"x":"スポーツ・レクリエーション用船舶に最も一般的に搭載されている消火設備は、携帯式消火器です。"},{"i":294,"x":"携帯式消火器とは、消火剤を使って火を消す消火設備です。"},{"i":295,"x":"消火剤とは、火災を消す物質です。"},{"i":296,"x":"船上で火災が発生した場合、炎を消火するときは、炎と煙の風上側に位置します。"},{"i":297,"x":"水消火器は、可燃性の固体材料の火災の消火に使用します。"},{"i":298,"x":"「A」級火災は、燃えた後に燃えさしや灰が残る繊維質または可燃性の固体材料で発生します。例：紙、木材、布。"},{"i":299,"x":"CO2消火器は、通電中の電気設備の火災に使用します。"},{"i":300,"x":"泡消火器は、可燃性液体の火災に使用します。"},{"i":301,"x":"「B」級火災とは、可燃性液体で発生する火災です。"},{"i":302,"x":"「C」級火災とは、通電中の電気・電子材料や機器で発生する火災です。"},{"i":303,"x":"水消火器を使用するには、レバーを握り、炎の根元に向けます。"},{"i":304,"x":"CO2消火器を使用するには、安全ピンを抜き、ノズル（ホーン）を持ってレバーを握り、噴射を火の根元に向けます。"},{"i":305,"x":"泡消火器を使用するには、消火器をふたが下になるようにひっくり返し、噴射を炎の根元に向けます。"},{"i":306,"x":"可燃物を遠くへ移し、近くの場所を冷却すると、消火活動に大いに役立ちます。"},{"i":307,"x":"CO2消火器について注意すべき点は、噴射が皮膚や目に直接触れないようにすることです。"},{"i":308,"x":"CO2消火剤の欠点は、換気されていない場所では人を窒息させるおそれがあることです。"},{"i":309,"x":"水は、居住区画の火災に使用できる消火剤です。"},{"i":310,"x":"携帯式消火器は、取り出しやすく、火災の危険がある場所に配置しなければなりません。"},{"i":311,"x":"操舵室にいて、エンジンから焦げたにおいがし始めました。手に取るべき携帯式消火器は泡消火器です。"},{"i":312,"x":"船舶の船尾にいて、航海用コンソールから煙が出ているのが見えました。手に取るべき消火器はCO2消火器です。"},{"i":313,"x":"携帯式消火器がない場合、火を消すためにバケツの水で代用することができます。"},{"i":314,"x":"船上には、年次点検の有効期限内にある携帯式消火器を常に備えておかなければなりません。"},{"i":315,"x":"スポーツ・レクリエーション用船舶の携帯式消火器の数と種類は、航行するために船上で満たしていなければならず、DPCの規範文書（DPCのNORMAM-03）で定められています。"},{"i":316,"x":"固定式消火設備とは、固定された噴射口を持つ設備です。"},{"i":317,"x":"立ち入りが困難な場所の火災は、固定式の消火剤設備によって消火します。"},{"i":318,"x":"消火剤には、水、CO2、泡、粉末消火剤があります。"},{"i":319,"x":"「D」級火災用の消火剤は、乾燥粉末消火剤（PQS）です。"},{"i":320,"x":"ナトリウム、カリウム、マグネシウム、チタン、アルミニウムなどの可燃性金属が関わる火災は、「D」級火災と呼ばれます。"},{"i":321,"x":"「A」級火災に使用する消火器は、緑色の三角形で識別されます。"},{"i":322,"x":"「B」級火災に使用する消火器は、赤色の四角形で識別されます。"},{"i":323,"x":"「C」級火災に使用する消火器は、青色の円で識別されます。"},{"i":324,"x":"「D」級火災に使用する消火器は、黄色の星形で識別されます。"},{"i":325,"x":"船上での量は限られていますが、「A」級および「B」級火災に最適な消火剤は泡です。"},{"i":326,"x":"乾燥粉末消火剤（PQS）消火器の欠点は、残留物が電子機器を損傷するおそれがあることです。"},{"i":327,"x":"エーテルとベンジンは揮発性の可燃物とみなされます。"},{"i":328,"x":"水を万能の消火剤とする、最も古い消火方法は、冷却消火と呼ばれます。"},{"i":329,"x":"大きな火花を発生させるブレーカーなど、仕様の不適切な電気材料が原因で船上火災が起こることはよくあります。"},{"i":330,"x":"燃焼は、その速度により、完全燃焼、不完全燃焼、自然発火および爆発に分類することができます。"},{"i":331,"x":"水蒸気は、窒息作用による消火剤として使用することができます。"},{"i":332,"x":"支燃物を含まない可燃物の例は、木材です。"},{"i":333,"x":"その内部構造に支燃物を含む可燃物の火災は、冷却によってのみ消火することができます。"},{"i":334,"x":"泡消火剤の主な作用は窒息、副次的な作用は冷却です。"},{"i":335,"x":"熱の伝わり方には、放射、伝導、対流の3つの方法があります。"},{"i":336,"x":"木材、紙、布、ウエス、塗料など、燃焼し得るすべての物質を可燃物といいます。"},{"i":337,"x":"二酸化炭素（CO2）消火剤の主な作用は窒息、副次的な作用は冷却です。"},{"i":338,"x":"固体の可燃物について見ると、材料が細かく分かれているほど、燃焼速度は速くなるといえます。"},{"i":339,"x":"船舶で燃料を保管するのに適した場所は、喫水線より下の区画です。"},{"i":340,"x":"燃焼から酸素を取り除く消火方法は、窒息消火として知られています。"},{"i":341,"x":"忘れないでください：火災と闘う最も効果的な方法は、火災が始まらないようにすること、つまり予防によって発生を防ぐことです。"},{"i":342,"x":"揮発性の可燃物とは、常温の環境下でガスを放出するものをいいます。"},{"i":343,"x":"アマチュア航行者が船上の消火器について特に注意すべき点の一つは、すぐに使える状態で有効期限内に保つことです。"},{"i":344,"x":"泡消火器は、正しく作動させるためにひっくり返す（逆さにする）必要がある唯一の消火器です。"},{"i":345,"x":"救命胴衣は、船舶を放棄しなければならない場合に着用するため、船上に保管しておかなければなりません。"},{"i":346,"x":"救命胴衣を、おもちゃ、背もたれ、枕として使ってはいけません。"},{"i":347,"x":"内水航行用に分類されたスポーツ・レクリエーション用船舶には、救命浮環（浮揚性の救命索付き）01個と、クラスIIIの救命胴衣（乗船者1人につき1着）の搭載が義務付けられています。"},{"i":348,"x":"救命胴衣は、浮力部分を前にして体にしっかり結んで着用しなければなりません。"},{"i":349,"x":"船上の救命胴衣の数は、最大乗船人数を満たさなければなりません。"},{"i":350,"x":"救命胴衣は、必要なときにすぐ取り出せる場所に置き、決して船舶に縛り付けてはいけません。"},{"i":351,"x":"膨張式救命胴衣は、水に入ってから膨らませなければなりません。"},{"i":352,"x":"消火できない火災のために船舶を放棄する場合、水面に油があるときは、潮流に逆らう側に飛び込まなければなりません。"},{"i":353,"x":"事故を起こした船舶からできるだけ速やかに離れるには、潮流に逆らって泳ぎ、必要であれば水面の油の危険がなくなるまで水中を泳がなければなりません。"},{"i":354,"x":"船舶の付近に油の流出や火災の危険がない場合は、潮流に乗って泳いで船舶から離れなければなりません。"},{"i":355,"x":"船舷から飛び込んで退船する場合は、常に風上側から行い、その後は風の方向に逆らって泳ぎます。つまり、退船作業（動作）で水に飛び込むときは、風上側から行わなければなりません。"},{"i":356,"x":"風上側から退船する理由は、そこでは油膜の広がりが小さく、また風による圧流によって船舶からより早く離れられるからです。"},{"i":357,"x":"船舶を放棄する際、救命いかだの上に飛び降りてはいけません。"},{"i":358,"x":"内水における船舶への危険には、浮遊する丸太、浮遊する木の幹、岩、砂州などがあります。"},{"i":359,"x":"船舶の安全のため、航行に出る前に、航海灯、救命設備、消火設備など、さまざまな点検を行わなければなりません。"},{"i":360,"x":"許可された乗船人数の上限を決して超えてはいけません。"},{"i":361,"x":"船舶の復原性は、船舶の高い位置に重量が過大にかかった場合や、船舶の左右に対する重量配分が悪い場合に損なわれます。最低浮揚限度の標示を決して水面下に沈めてはいけません。"},{"i":362,"x":"救命浮環は、取り外しやすい場所に取り付けておかなければなりません。"},{"i":363,"x":"救命胴衣を着用して水に飛び込む最良の方法は、脚を伸ばし、両足をそろえることです。"},{"i":364,"x":"遭難時に浮具を即席で作るには、タイヤ、缶、樽、丸太や大きな木片を利用します。"},{"i":365,"x":"船舶を放棄する際は、適切な衣服と救命設備を身につけるようにしなければなりません。"},{"i":366,"x":"遭難者の数が救命いかだの収容能力を上回る場合は、体調の良い者全員で交代して救命いかだに入るよう計画しなければなりません。"},{"i":367,"x":"救命いかだで交代する場合、いかだにいる人の快適さを保つため、衣服を交換して、いかだにいる人が常に乾いた服を着ていられるようにします。"},{"i":368,"x":"救命いかだを船舶につないでいるロープは、全員が救命いかだに乗り込んでから切らなければなりません。"},{"i":369,"x":"救命いかだの天幕は、発見しやすいようにオレンジ色になっています。"},{"i":370,"x":"現代の非常食の大部分は、砂糖の形態です。"},{"i":371,"x":"他の要因に加えて、遭難者の生存は、海水温に応じた滞在時間に左右されます。周囲の温度（気温）については、その人への影響は風速と密接に関係しています。"},{"i":372,"x":"変針の操船で引き返し、航跡（プロペラが残した跡）の上をちょうど反対の針路で航行したい場合は、Boutakowターン（ウィリアムソンターン）を使用します。"},{"i":373,"x":"同様に、誰かが水に落ちた場合、つまり「落水者」の状況で、プロペラが残した航跡の上をちょうど反対の針路で引き返すには、Boutakowターン（ウィリアムソンターン）を使用します。"},{"i":374,"x":"救命いかだは閉じたコンテナに収められており、遭難者が使用できるよう特別な装置で膨張します。"},{"i":375,"x":"救命いかだは、開放甲板に設置された専用の架台に置かれたガラス繊維製のコンテナに収められています。使用するには、コンテナを海に投下し、着水した後、ある程度の抵抗を感じるまでロープをたぐり寄せ、そこで強く引きます。これによりCO2ボンベが放出され、約30秒でいかだが膨張します。"},{"i":376,"x":"救命いかだは12か月ごとに点検しなければなりません。"},{"i":377,"x":"遭難時は、悪条件とあらゆる資源の制約により、健康に特別な注意が必要です。体力を温存し、無理をせず、不必要に話さないことが必要です。ただし、血液循環を保つために定期的に体を動かすことが望ましいです。"},{"i":378,"x":"遭難者が注意を引くために昼間使用する器具を、発煙信号（fumígeno）といいます。"},{"i":379,"x":"遭難者が注意を引くために夜間使用する器具を、ロケット信号（foguete pirotécnico）といいます。"},{"i":380,"x":"救命いかだに乗り込むときは、転覆しないよう、片側だけに重さをかけないようにしなければなりません。"},{"i":381,"x":"クラスIIIの救命胴衣は、スポーツおよび/またはレクリエーション用船舶のうち、港内航行用のものにのみ義務付けられています。"},{"i":382,"x":"遭難時、ブラジル海軍（Marinha do Brasil）で定められている水の量は、1人1日あたり700 ml（2缶）です。"},{"i":383,"x":"水に落ちた人の救助を容易にするため、救命浮環には手持ちの輪の付いた浮揚性の救命索を結び付けておかなければなりません。"},{"i":384,"x":"クラスIIIの救命いかだは、限られた水域で運航する船舶で使用されます。"},{"i":385,"x":"吐き気がする場合は、すぐに酔い止めの薬を服用し、横になっていてください。嘔吐は体にとって大きな水分の損失となります。"},{"i":386,"x":"食料が乏しいため、遭難者に便秘が起こるのはよくある現象です。"},{"i":387,"x":"内水航行に使用される船舶は、生存艇の搭載を免除されています。"}]</script>
<script type="application/json" id="banco-ko">[{"id":"838b61aa","q":"선박의 어느 부분을 선수(proa)라고 합니까?","o":["선체의 뒤쪽 끝부분.","전방을 바라볼 때 왼쪽 면.","선체의 앞쪽 끝부분.","선창의 가장 낮은 부분."],"c":"선수는 전방 끝부분입니다. 반대쪽 끝은 선미이며, 좌현과 우현은 양쪽 측면을 가리킵니다."},{"id":"b2028c0a","q":"선미(popa)는 선박의 어느 부분에 해당합니까?","o":["선체의 앞쪽 끝부분.","선체의 가장 넓은 부분.","수면 아래 부분(obra viva)과 수면 위 부분(obra morta)을 나누는 선.","선체의 뒤쪽 끝부분."],"c":"선미는 선박의 후방 부분입니다. 조종할 때 선미는 선회 방향의 반대쪽으로 쓸려 나가므로 선미의 횡방향 이동을 살피는 것이 매우 중요합니다."},{"id":"5f4e7f75","q":"선미에서 선수를 바라볼 때 우현은 어느 쪽입니까?","o":["선박의 오른쪽.","선박의 왼쪽.","선미 바로 뒤쪽 구역.","선수 바로 앞쪽 구역."],"c":"우현은 전방을 바라볼 때 항상 오른쪽이며, 승선자가 서 있는 위치에 따라 바뀌지 않습니다."},{"id":"568f807f","q":"선미에서 선수를 바라볼 때 좌현은 어느 쪽입니까?","o":["선박의 오른쪽.","선박의 왼쪽.","용골 아래쪽 구역.","갑판 위쪽 구역."],"c":"좌현은 전방을 바라볼 때 왼쪽입니다. 해당 현등은 붉은색입니다."},{"id":"e12db04f","q":"선박 용어에서 선폭(boca)은 무엇을 나타냅니까?","o":["수선과 용골 사이의 수직 거리.","선수와 선미 사이의 길이.","선체의 최대 폭.","주 마스트의 높이."],"c":"선폭은 선체의 폭으로, 보통 가장 넓은 단면을 기준으로 합니다. 흘수나 전장과 혼동하지 않아야 합니다."},{"id":"c15340e2","q":"선박의 흘수(calado)는 무엇을 나타냅니까?","o":["수선과 노출 갑판 사이의 높이.","선체의 최대 폭.","수선과 선체 또는 해당 부가물의 가장 낮은 부분 사이의 수직 거리.","한 시간 동안 이동한 수평 거리."],"c":"흘수는 선박이 물속에 얼마나 깊이 잠기는지를 알려 주며, 가용 수심 및 용골 아래 여유 수심과 비교해야 합니다."},{"id":"7bb19646","q":"건현(borda-livre)이란 무엇입니까?","o":["선체에서 항상 물에 잠겨 있는 부분.","선수와 무게중심 사이의 거리.","수선과 건현 갑판 사이의 수직 거리.","키(타)와 프로펠러 사이의 간격."],"c":"건현은 물 위에 남아 있는 선체의 높이입니다. 과적과 침수는 이 안전 여유를 줄입니다."},{"id":"3e9a057b","q":"용골(quilha)의 기본적인 구조적 기능은 무엇입니까?","o":["선체 하부의 주요 종방향 부재를 이룹니다.","펜더를 받치는 용도로만 쓰입니다.","선회할 때 키(타)를 대신합니다.","최대 흘수선을 표시합니다."],"c":"용골은 선체의 종방향 척추 역할을 하며 구조 강도에 기여합니다. 많은 선체에서 방향 안정성에도 영향을 줍니다."},{"id":"81c1531b","q":"빌지(porão de esgoto 또는 sentina)라는 용어는 어느 부분을 가리킵니까?","o":["물과 기타 액체가 고일 수 있는 선내의 가장 낮은 지점.","개방된 조종 구획.","주 갑판 위의 공간.","투묘를 위한 외부 장소."],"c":"빌지는 점검하고 깨끗하게 유지해야 합니다. 이곳에 예상치 못한 물이 있으면 누수나 수밀 결함을 의미할 수 있습니다."},{"id":"6a267472","q":"트랜섬(espelho de popa)이란 무엇입니까?","o":["선수를 막는 판.","많은 선체에서 선미를 막는 가로 방향의 면.","연료 탱크를 나누는 판.","항적이 만드는 빛의 반사."],"c":"트랜섬은 모터보트에서 흔하며, 설계에 따라 선외기, 금속 부착물 및 기타 부품이 설치될 수 있습니다."},{"id":"93280027","q":"수선(linha d'água)의 정의는 다음과 같습니다:","o":["두 지점 사이의 계획된 항로.","해당 상태에서 수면과 선체가 만나는 교차선.","갑판의 중심선.","범선에만 있는 표시."],"c":"수선의 위치는 적재량, 트림, 물의 밀도에 따라 달라집니다. 관측 상태에서 선체의 수면 위 부분과 수면 아래 부분을 나눕니다."},{"id":"5e56a6af","q":"풍하측(sotavento)에 있는 선박이나 물체는 어디에 있습니까?","o":["바람이 불어오는 쪽.","바람과 관계없이 정확히 전방.","항상 우현 쪽.","바람이 불어 가는 쪽."],"c":"풍상측(barlavento)은 바람이 불어오는 쪽이고, 풍하측(sotavento)은 바람이 불어 가는 쪽입니다. 이 기준은 접근과 구조 시에 유용합니다."},{"id":"390a761b","q":"하중이 걸려도 미끄러지지 않는 고정 고리를 만드는 매듭은 무엇입니까?","o":["보라인 매듭(lais de guia).","리프 매듭(nó direito).","클로브 히치(volta do fiel).","시트 벤드(nó de escota)."],"c":"보라인 매듭은 단단하고 안전한 고정 고리를 만들며 선박 작업에서 널리 쓰입니다. 모든 매듭과 마찬가지로 올바르게 묶고 확인해야 합니다."},{"id":"56aceec9","q":"로프 끝에 묶는 8자 매듭(nó em oito)의 주된 목적은 무엇입니까?","o":["두 와이어 로프를 영구적으로 연결합니다.","예인용 조절 고리를 만듭니다.","꼬아 잇기(스플라이스)를 대신합니다.","로프 끝이 아이, 블록 또는 통로에서 빠져나가지 않게 합니다."],"c":"8자 매듭은 스토퍼 매듭입니다. 로프 끝에 부피를 만들어 로프가 통로를 완전히 빠져나갈 위험을 줄입니다."},{"id":"1172f424","q":"클로브 히치(volta do fiel)는 보통 어떤 용도로 사용합니까?","o":["큰 하중에서 굵기가 매우 다른 로프를 연결합니다.","고정된 구조용 고리를 만듭니다.","말뚝, 난간 기둥 또는 비슷한 물체에 로프를 빠르게 묶습니다.","닻을 회수하지 않고 닻줄(앵커 체인)을 줄입니다."],"c":"클로브 히치는 간단해서 임시 계류에 유용하지만, 하중이 변하거나 풀릴 위험이 있으면 추가 보강이 필요할 수 있습니다."},{"id":"e99e7a35","q":"두 로프, 특히 굵기가 서로 다른 로프를 연결하는 데 적합한 매듭은 무엇입니까?","o":["8자 매듭(nó em oito).","시트 벤드(nó de escota).","보라인 매듭(lais de guia).","라운드 턴 앤 투 하프 히치(volta redonda com dois cotes)."],"c":"시트 벤드는 전통적으로 로프, 특히 굵기가 다른 로프를 연결하는 데 사용됩니다. 가는 로프가 굵은 로프의 고리 안에서 올바르게 작용해야 합니다."},{"id":"2d96f3d8","q":"리프 매듭(nó direito)은 어떤 용도에 가장 적합합니까?","o":["사람을 들어 올리거나 구조용 고리를 만듭니다.","중요한 하중이 걸리지 않는 가벼운 용도에서 같은 굵기의 로프를 임시로 연결합니다.","악천후 중에 닻을 고정합니다.","교번 하중에서 굵기가 매우 다른 로프를 연결합니다."],"c":"리프 매듭은 잘못 쓰면 미끄러지거나 뒤집히거나 지나치게 조여질 수 있습니다. 중요한 하중이나 구조용으로 선택해서는 안 됩니다."},{"id":"5705c5b0","q":"클리트(cunho)에 로프를 감을 때 계류를 단단하고 깔끔하게 유지하는 방법은 무엇입니까?","o":["8자 형태로 교차해 감고 올바른 마무리 감기로 끝내되, 불필요하게 로프를 많이 쓰지 않습니다.","로프를 평행한 원 모양으로만 감습니다.","클리트 위에 아무렇게나 여러 번 매듭을 짓습니다.","로프 끝을 젖은 갑판 위에 풀어 둡니다."],"c":"클리트 감기는 힘을 분산하고 통제된 상태로 풀 수 있어야 합니다. 매듭이 지나치게 많으면 비상 이안이 어려워질 수 있습니다."},{"id":"4bbec0ec","q":"섬유 로프 끝의 휘핑(falcaça)은 무엇을 위한 것입니까?","o":["로프의 사용 길이를 늘립니다.","가닥이 풀리지 않게 합니다.","로프를 체인으로 바꿉니다.","수심을 자동으로 측정합니다."],"c":"휘핑은 로프 끝을 정리하고 보호하여 풀림을 줄입니다. 적절한 실이나 재질에 맞는 방법으로 할 수 있습니다."},{"id":"62a26393","q":"투묘에서 신출 비율(relação de filame)은 무엇을 나타냅니까?","o":["내준 닻줄(앵커 체인)의 길이와 고려한 전체 수심의 비율.","선박의 선폭과 길이의 비율.","닻의 개수를 승무원 수로 나눈 값.","두 측방 부이 사이의 거리."],"c":"적절한 신출 길이는 닻에 걸리는 당김을 더 수평으로 만듭니다. 수심, 계류점의 높이, 바람, 조류, 선회 공간을 고려해야 합니다."},{"id":"c0d9ca3e","q":"일반적으로 안전한 범위 안에서 신출 길이를 늘리면 어떤 효과가 있습니까?","o":["닻이 해저에서 떨어집니다.","당김 각도가 줄어들어 닻의 파주력이 좋아집니다.","선회원이 없어집니다.","해저 저질을 확인할 필요가 없어집니다."],"c":"닻줄을 더 내주면 보통 파주에 유리하지만 선회 반경도 커집니다. 투묘할 때는 다른 선박, 위험물, 수심을 고려해야 합니다."},{"id":"880480d3","q":"투묘 지점을 고를 때 가장 중요한 요소들은 무엇입니까?","o":["해변까지의 육안 거리만.","엔진 출력만.","도착 순간의 물 색깔만.","수심, 해저 저질, 피항 여건, 조석, 바람, 조류, 선회 공간."],"c":"좋은 투묘는 주변 환경과 장비의 성능에 달려 있습니다. 조석 변화와 선박의 선회를 미리 예상해야 합니다."},{"id":"85538463","q":"접안 시 스프링 라인(espringue)의 주된 기능은 무엇입니까?","o":["선박을 부두에서 떨어뜨려 두는 것만 합니다.","모든 펜더를 대신합니다.","부두를 따라 앞뒤로 움직이는 선박의 종방향 움직임을 제한합니다.","조석의 높이를 측정합니다."],"c":"스프링 라인은 종방향으로 작용하여 선박이 부두에서 앞으로 나가거나 뒤로 밀리는 것을 막아 줍니다. 선수·선미 계류줄(lançantes)과 횡계류줄(traveses)은 다른 기능을 합니다."},{"id":"01bef512","q":"부두 계류에서 횡계류줄(traveses)은 주로 어떤 역할을 합니까?","o":["전방으로의 움직임만 막습니다.","닻을 해저에 박힌 상태로 유지합니다.","선박과 부두 사이의 횡방향 간격을 조절합니다.","키(타)를 우현으로 돌립니다."],"c":"횡계류줄은 거의 가로 방향으로 걸리는 계류줄입니다. 조석과 현지의 움직임을 고려하여 다른 계류줄과 함께 조정해야 합니다."},{"id":"d1a70c4c","q":"접안 중 펜더(defensas)의 목적은 무엇입니까?","o":["접촉을 흡수하여 선체와 부두를 보호합니다.","선박을 해저에 영구적으로 고정합니다.","구명조끼를 대신합니다.","조종불능선임을 표시합니다."],"c":"펜더는 접근하기 전에 예상 접촉 지점과 높이에 맞춰 배치해야 합니다. 펜더가 조종 통제나 계류줄을 대신하지는 않습니다."},{"id":"1ca2aa35","q":"키(타) 주위에 물의 흐름이 거의 없을 때 일반적인 키(타)의 효율이 떨어지는 이유는 무엇입니까?","o":["나침반이 더 이상 북쪽을 가리키지 않기 때문입니다.","닻이 선체에 작용하기 시작하기 때문입니다.","선회를 만들어 내는 유체역학적 힘이 줄어들기 때문입니다.","엔진 회전수가 자동으로 올라가기 때문입니다."],"c":"키(타)에는 물의 흐름이 필요합니다. 프로펠러 후류, 타력, 조류가 키의 반응을 바꿀 수 있으므로 조종은 미리 준비해야 합니다."},{"id":"e9a5aca8","q":"전진 타력이 있을 때 키(타)를 우현으로 쓰면 기본적으로 어떤 반응이 예상됩니까?","o":["선수는 좌현으로 돌고 선미는 움직이지 않습니다.","선박 전체가 회전 없이 우현 쪽으로 옆걸음합니다.","선박이 즉시 정지합니다.","선수는 우현으로 돌고 선미는 좌현 쪽으로 쓸려 나가는 경향이 있습니다."],"c":"키(타)는 물의 흐름을 바꾸어 선회 모멘트를 만듭니다. 좁은 공간에서는 선미가 쓸려 나가는 것을 반드시 고려해야 합니다."},{"id":"58e86d0f","q":"우회전 프로펠러 1개를 가진 선박에서 후진 기관을 사용하면 흔히 어떤 경향이 나타납니까?","o":["선미가 예외 없이 항상 우현으로 갑니다.","선수와 선미가 횡방향 경향 없이 일직선을 유지합니다.","닻을 내렸을 때만 선박이 선회합니다.","선미가 좌현 쪽으로 가는 경향이 있지만, 바람, 조류, 선체가 그 효과를 바꿀 수 있습니다."],"c":"우회전 프로펠러의 횡압력 효과는 후진 시 보통 선미를 좌현 쪽으로 보냅니다. 선박마다 다르므로 실제로 확인해 보아야 합니다."},{"id":"8887cadd","q":"프로펠러가 2개인 선박에서 거의 제자리에서 회전하는 방법은 다음과 같습니다:","o":["두 엔진을 같은 회전수로 전진시킵니다.","한 엔진은 전진, 다른 엔진은 후진으로 하여 적당한 출력으로 통제하며 사용합니다.","두 엔진을 끄고 키(타)를 고정합니다.","선미 닻을 내리고 최대로 가속합니다."],"c":"기관을 서로 반대 방향으로 쓰면 추력이 회전 모멘트를 만듭니다. 이 조종에는 낮은 출력, 주의 깊은 경계, 선체가 쓸려 나갈 공간이 필요합니다."},{"id":"1aa7d05c","q":"가능하다면 접안을 위한 최종 접근은 어떻게 계획해야 합니까?","o":["바람과 조류를 등지고 고속으로.","펜더 없이 부두에 수직으로.","우세한 바람이나 조류를 안고, 더 강한 외력을 이용해 속력을 조절하며.","먼 거리에서부터 엔진을 끈 채로."],"c":"우세한 외력을 안고 접근하면 통제력이 좋아지고 타력을 줄일 수 있습니다. 계획에는 공간, 수심, 탈출 경로가 포함되어야 합니다."},{"id":"22377a30","q":"이안 중 바람이 선박을 부두 쪽으로 밀고 있다면 어떤 방법이 도움이 될 수 있습니까?","o":["계류줄 하나를 스프링 라인으로 쓰고, 펜더와 기관·키(타)를 통제하며 사용해 한쪽 끝을 벌립니다.","계류줄을 풀기 전에 펜더를 모두 치웁니다.","계류줄을 모두 묶은 채로 전진 가속을 강하게 합니다.","부두 위에 닻을 내립니다."],"c":"스프링 라인은 회전의 지점이 될 수 있습니다. 승무원 간 소통과 펜더 보호 아래 순서를 미리 맞춰 두어야 합니다."},{"id":"a95d5a3f","q":"계류 부이를 잡을 때 어떤 접근이 가장 통제하기 좋습니까?","o":["우세한 외력을 등지고 빠른 속력으로 접근합니다.","우세한 바람이나 조류를 안고 천천히 접근하여 타력이 거의 없는 상태로 도착합니다.","프로펠러가 물린 상태로 부이를 선미 쪽으로 지나가게 합니다.","부이에 가볍게 부딪혀 배를 멈춥니다."],"c":"부이는 계속 보이는 곳에 있어야 하며 프로펠러에서 멀리 떨어져 있어야 합니다. 선박이 통제된 상태가 되면 준비된 승무원이 로프를 걸어 올립니다."},{"id":"7d7242d9","q":"사람이 물에 빠지는 것을 보았을 때 첫 대응 순서는 무엇이어야 합니까?","o":["서류를 찾으러 선실로 들어갑니다.","현장에서 멀어지도록 가속합니다.","'익수자(homem ao mar)'를 외치고, 부력 장비를 던지고, 시야에서 놓치지 않으며 되돌아가는 조종을 시작합니다.","다른 사람에게 알리지 않고 닻을 내립니다."],"c":"경보는 승무원을 움직이게 하고, 부력 장비는 익수자를 지탱하며 위치를 표시합니다. 조종자가 선박을 조종하는 동안 한 사람은 계속 익수자를 가리켜야 합니다."},{"id":"0275c672","q":"물에 빠진 사람에게 최종 접근할 때 가장 안전한 절차는 무엇입니까?","o":["더 빨리 다가가도록 프로펠러를 물린 상태로 둡니다.","천천히 다가가 사람을 계속 시야에 두고, 구조하기 전에 추진을 중립으로 하거나 끕니다.","높은 회전수로 후진하며 접근합니다.","사람에게 엔진 배기구 쪽으로 헤엄쳐 오라고 합니다."],"c":"프로펠러나 제트는 심각한 위험입니다. 접근할 때는 바람과 조류를 고려하고, 익수자 가까이에서는 위험한 추력이 없는 상태로 마무리해야 합니다."},{"id":"50b675da","q":"후진 조종에 보통 추가적인 주의가 필요한 이유는 무엇입니까?","o":["선박이 바람의 영향을 받지 않게 되기 때문입니다.","현등의 색이 바뀌기 때문입니다.","나침반이 남쪽을 가리키기 때문입니다.","키(타)의 반응이 작거나 달라질 수 있고, 시야가 나빠지며, 선미가 진행 방향의 앞쪽 끝이 되기 때문입니다."],"c":"후진은 조종 수단이지 빠르게 항해하기 위한 상태가 아닙니다. 타력을 작게 하고, 경계원을 두며, 후방 구역을 자주 확인하십시오."},{"id":"8827faad","q":"전방에 짐이 몰려 선수가 너무 낮게 가라앉아 있습니다. 가장 적절한 조치는 무엇입니까?","o":["정원과 설계 한도를 지키면서 짐을 안전하게 재배치합니다.","문제를 감추기 위해 속력을 높입니다.","모든 구명조끼를 선수로 옮깁니다.","물탱크를 갑판 위에 비웁니다."],"c":"부적절한 배치는 트림, 복원성, 파도를 견디는 능력을 바꿉니다. 짐은 고정하고 허가된 한도 안에서 유지해야 합니다."},{"id":"a21afda7","q":"다른 선박이나 강기슭 가까이에서 활주 항해를 할 때 반드시 지켜야 할 주의사항은 무엇입니까?","o":["통과 시간을 줄이도록 최고 속력을 유지합니다.","느린 선박의 선수 앞을 가로지릅니다.","제때 속력을 줄이고, 항적파를 통제하며, 안전한 거리를 유지합니다.","반사를 피하려고 등화를 끕니다."],"c":"항적파는 소형 선박에 피해, 추락, 위험을 일으킬 수 있습니다. 안전한 속력에는 다른 사람에게 미치는 영향도 포함됩니다."},{"id":"5ad22a72","q":"엔진이 2개인 선박에서 엔진 하나를 잃으면 어떻게 해야 합니까?","o":["조종성을 다시 평가하고, 항해 계획을 축소하며, 남은 엔진을 신중하게 사용합니다.","어떤 상황에서든 남은 엔진을 즉시 한계까지 가속합니다.","위험을 평가하지 않고 선박을 포기합니다.","키(타)를 중앙에 고정하고 바람과 조류를 무시합니다."],"c":"추력이 비대칭이 되면 조종 특성이 바뀝니다. 필요하면 상황을 알리고 수리하거나 피항할 안전한 장소를 고르십시오."},{"id":"01c94c14","q":"가속 중에 프로펠러에 공기 흡입(벤틸레이션)이나 캐비테이션이 생기면 흔히 어떤 징후가 나타납니까?","o":["회전수는 오르지만 추력은 그만큼 늘지 않고, 진동이 생길 수 있습니다.","닻의 파주력이 더 좋아집니다.","흘수가 순간적으로 몇 미터 늘어납니다.","VHF 무선기의 채널이 바뀝니다."],"c":"날개에 공기나 증기가 생기면 효율이 떨어집니다. 가속을 줄이고 트림, 잠김 깊이, 손상, 해조류, 운항 조건을 점검해야 합니다."},{"id":"437a2c25","q":"좁은 공간에서 가장 안전한 스로틀 사용법은 무엇입니까?","o":["최대 가속을 유지하고 키(타)로만 바로잡습니다.","중립을 거치지 않고 전진과 후진을 번갈아 넣습니다.","짧고 적당한 출력을 끊어서 주고, 각 반응을 확인한 뒤 다음 조작을 합니다.","펜더가 모든 실수를 바로잡아 줄 것이라고 믿습니다."],"c":"출력을 조금씩 쓰면 타력과 충돌 에너지가 제한됩니다. 분명한 지시와 중립에서의 잠깐 멈춤은 동력전달장치와 사람을 보호합니다."},{"id":"683d2101","q":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면 선내 경계는 어떻게 유지해야 합니까?","o":["야간에 레이더로만.","시각과 청각으로 항상 적절하게, 그리고 이용할 수 있는 모든 적절한 수단을 함께 사용하여.","다른 선박이 보일 때만.","다른 사람의 도움 없이 조종자 혼자서만."],"c":"경계는 상황과 충돌 위험을 판단하기 위한 계속적인 의무입니다. 주의 분산, 소음, 사각지대를 관리해야 합니다."},{"id":"f351b442","q":"안전한 속력을 정할 때 어떤 요소를 고려해야 합니까?","o":["시정, 교통량, 조종 성능, 바람, 해상 상태, 조류, 위험물, 장비의 한계.","엔진의 최대 출력만.","예정 도착 시각만.","조종자의 경험만."],"c":"안전한 속력이란 충돌을 피하기 위해 효과적인 동작을 취하고 상황에 맞는 거리 안에서 정지할 수 있는 속력입니다."},{"id":"57ea2558","q":"다른 선박의 상대 방위가 거의 변하지 않으면서 거리가 줄어들고 있습니다. 이것은 무엇을 의미합니까?","o":["두 선박이 틀림없이 떨어져서 지나갈 것입니다.","다른 선박이 투묘 중입니다.","상황을 계속 지켜볼 필요가 없습니다.","안전하다는 확실한 판단이 없는 한 충돌 위험이 있습니다."],"c":"방위가 일정하고 거리가 줄어드는 것은 위험의 전형적인 징후입니다. 의심스러우면 국제해상충돌예방규칙(RIPEAM/COLREG)은 위험이 있다고 보도록 합니다."},{"id":"1d13f747","q":"충돌을 피하기 위한 조종은 어떠해야 합니까?","o":["적극적으로, 충분히 일찍, 상대가 알아챌 수 있을 만큼 크게 하여 안전하게 지나가도록 해야 합니다.","작은 변경을 늦게 여러 번 연달아 합니다.","상황과 관계없이 항상 좌현으로 합니다.","결과를 확인하지 않고 회전수만 조금 줄입니다."],"c":"침로나 속력을 분명하게 바꾸면 상대 선박이 쉽게 알아챕니다. 조종한 뒤에는 완전히 지나쳐 벗어날 때까지 효과를 확인해야 합니다."},{"id":"e70d313e","q":"동력선 두 척이 충돌 위험이 있는 마주치는 상태(roda a roda)로 접근하고 있습니다. 각 선박은 어떻게 해야 합니까?","o":["좌현으로 변침합니다.","서로 좌현 대 좌현으로 지나가도록 우현으로 변침합니다.","침로를 유지하고 속력을 높입니다.","같은 장소에 멈춰 투묘합니다."],"c":"침로가 정반대이거나 거의 정반대인 상황에서는 두 선박 모두 우현으로 변침합니다. 동작은 분명하고 시기적절해야 합니다."},{"id":"feb81fec","q":"동력선 두 척이 횡단 상태(rumos cruzados)일 때 어느 선박이 진로를 피해야 합니까?","o":["상대 선박을 좌현 쪽에서 보는 선박.","상대 선박을 우현 쪽에서 보는 선박.","어떤 경우든 더 빠른 선박.","왼쪽 강기슭에 더 가까운 선박."],"c":"상대 선박을 우현 쪽에 두고 보는 선박이 피항선이며, 가능하면 상대 선박의 선수 앞을 가로지르지 않아야 합니다."},{"id":"55990423","q":"횡단 상태에서 유지선(우선권이 있는 선박)은 처음에 어떻게 해야 합니까?","o":["즉시 좌현으로 변침합니다.","모든 항해등을 끕니다.","침로와 속력을 유지하면서 위험의 변화를 계속 지켜봅니다.","상대 선박이 언제나 올바르게 조종할 것이라고 가정합니다."],"c":"유지선은 상황을 계속 지켜보아야 합니다. 상대가 조종하지 않는 것이 분명해지면 동작을 취할 수 있으며, 피항선의 조종만으로 충돌을 피할 수 없게 되면 반드시 동작을 취해야 합니다."},{"id":"c7d05827","q":"선박이 다른 선박의 추월선으로 간주되는 때는 언제입니까?","o":["상대 선박의 선수 쪽으로 다가갈 때마다.","추월당하는 선박의 정횡에서 22,5도보다 더 후방인 방향에서 다가갈 때.","두 선박 모두 타력이 없을 때만.","선미 쪽에서 상대 선박의 두 현등을 동시에 볼 때."],"c":"야간에 추월선은 보통 현등 없이 선미등만 봅니다. 의심스러우면 자신을 추월선으로 간주해야 합니다."},{"id":"6e96e20b","q":"추월선의 의무는 추월당하는 선박과 나란히 되었을 때 끝납니까?","o":["예. 선수가 나란히 되면 끝납니다.","아니요. 완전히 추월하여 벗어날 때까지 계속됩니다.","예. 단음 1회를 울리면 끝납니다.","아니요. 투묘한 뒤에야 끝납니다."],"c":"나중에 방위가 바뀌더라도 추월 상황이 횡단 상황으로 바뀌지는 않습니다. 추월선은 안전하게 지나갈 때까지 책임을 집니다."},{"id":"4603f735","q":"범선 두 척이 서로 다른 현에서 바람을 받고 있고 충돌 위험이 있습니다. 어느 쪽이 피해야 합니까?","o":["우현에서 바람을 받는 범선.","좌현에서 바람을 받는 범선.","언제나 풍하측에 있는 범선.","언제나 더 긴 범선."],"c":"바람을 서로 다른 현에서 받을 때는 좌현에서 바람을 받는 범선이 우현에서 바람을 받는 범선의 진로를 피합니다."},{"id":"c56de601","q":"범선 두 척이 같은 현에서 바람을 받고 있습니다. 어느 쪽이 진로를 피해야 합니까?","o":["풍하측에 있는 범선.","흘수가 더 작은 범선.","풍상측에 있는 범선.","항구에 더 가까운 범선."],"c":"같은 현에서 바람을 받을 때는 풍상측 범선이 풍하측 범선을 피해 조종해야 합니다. 위치는 바람을 기준으로 판단합니다."},{"id":"d2eb8600","q":"시정이 정상일 때 동력선이 항행 중인 범선을 만났습니다. 원칙적으로 누가 진로를 피해야 합니까?","o":["어떤 상황에서든 범선.","풍하측에 있는 선박.","기록된 속력이 더 높은 선박.","동력선."],"c":"일반 책임 규칙에 따라 동력선이 범선의 진로를 피합니다. 단, 추월이나 조종제한선 같은 특수한 상황은 예외입니다."},{"id":"7add7bf4","q":"범선이 해당 신호를 표시한 어로 종사선을 만났습니다. 원칙적으로 범선은 어떻게 해야 합니까?","o":["어로 종사선의 진로를 피합니다.","어로 종사선에게 우현으로 변침하라고 요구합니다.","위험을 살피지 않고 침로를 유지합니다.","항상 선수 앞으로 추월합니다."],"c":"원칙적으로 범선은 조종불능선, 조종제한선, 어로 종사선의 진로를 피합니다."},{"id":"46aefb85","q":"어로 종사선이 조종불능선을 만났습니다. 가능하다면 올바른 행동은 무엇입니까?","o":["조종불능선의 진로를 피합니다.","어로가 언제나 절대적 우선권을 가지므로 침로를 유지합니다.","선수 앞을 가로지르려고 다가갑니다.","단음 1회를 울리고 변경 없이 계속 갑니다."],"c":"조종불능선은 예외적인 사정 때문에 요구되는 대로 조종할 수 없으므로 더 높은 우선순위를 가집니다."},{"id":"6dec17c5","q":"좁은 수로를 항해할 때 일반적으로 요구되는 위치는 어디입니까?","o":["어떤 상황에서든 중앙으로 항해합니다.","좌현 쪽 경계에 붙어 항해합니다.","굽이마다 기슭을 바꿉니다.","안전하고 실행 가능한 한 자기 선박의 우현 쪽 수로 바깥 경계에 가깝게 붙어 항해합니다."],"c":"좁은 수로 규칙은 교통 충돌을 줄여 줍니다. 수심, 조류, 현지 조건도 계속 고려해야 합니다."},{"id":"5769c496","q":"좁은 수로에서 범선이나 길이 20 m 미만의 선박은 어떻게 해야 합니까?","o":["크기가 작다는 이유로 통과를 요구합니다.","수로 중앙선에 투묘하여 기다립니다.","풍상으로 올라가기 위해 수로를 반복해서 가로지릅니다.","수로 안에서만 안전하게 항해할 수 있는 선박의 통항을 방해하지 않습니다."],"c":"소형 선박과 범선은 수로에 제한된 선박을 방해해서는 안 됩니다. 그렇다고 충돌을 피해야 할 일반 의무가 없어지는 것은 아닙니다."},{"id":"06ed3afd","q":"수로 안에서만 안전하게 항해할 수 있는 선박을 방해하게 된다면 좁은 수로를 횡단해도 됩니까?","o":["예, 작은 선박이 가속한다면.","아니요. 횡단이 그 선박의 통항을 방해해서는 안 됩니다.","예, 좌현에서 우현 방향으로 한다면.","예, 음향신호가 없다면."],"c":"횡단은 수로에 의존하는 선박의 통항을 방해하지 않도록 계획해야 합니다. 의심스러우면 안전한 기회를 기다리십시오."},{"id":"a6ec77db","q":"통항분리방식을 이용할 때 선박은 보통 어떻게 해야 합니까?","o":["거리를 줄이기 위해 흐름을 거슬러 항해합니다.","분리대를 일반 통항로처럼 사용합니다.","적절한 통항로에서 정해진 흐름의 일반 방향을 따라 항해합니다.","원할 때마다 통항로 입구에 투묘합니다."],"c":"통항분리방식은 서로 반대인 흐름을 정리합니다. 진입과 이탈은 흐름에 대해 가능한 한 작은 각도로 해야 합니다."},{"id":"d7220379","q":"통항로를 횡단해야 할 때 흐름에 대해 어떤 침로가 권장됩니까?","o":["흐름과 평행하게 반대 방향으로.","분리대 안에서 지그재그로.","흐름에 대해 가능한 한 작은 각도로.","교통의 일반 방향에 대해 가능한 한 직각에 가깝게."],"c":"약 90도로 횡단하면 통항로 안에 머무는 시간이 줄고 다른 항해자에게 의도가 더 분명해집니다."},{"id":"c8dd497d","q":"제한된 시정에서 동력선은 기관을 어떤 상태로 유지해야 합니까?","o":["소음을 줄이기 위해 꺼 둡니다.","즉시 조종할 수 있도록 준비하고, 상황에 맞는 안전한 속력으로 항해합니다.","항상 최대 출력으로.","항해 내내 후진에 넣어 둡니다."],"c":"안개 속에서는 강화된 경계, 레이더가 있으면 적절한 사용, 음향신호, 그리고 타력을 줄이거나 멈출 수 있는 능력이 필요합니다."},{"id":"e03ab7f9","q":"안개 속에서 레이더가 정횡보다 전방에 있는 선박을 표시합니다. 변침이 필요하다면 일반적으로 어떻게 해야 합니까?","o":["항상 좌현으로 변침합니다.","고속으로 물표의 선수 앞을 가로지릅니다.","등화가 보일 때까지 레이더를 무시합니다.","상대 선박을 추월하는 경우가 아니라면 좌현으로의 변침을 피합니다."],"c":"규칙 19는 정횡보다 전방에 있는 물표에 대해 추월하는 경우를 제외하고 좌현 변침을 피하고, 정횡 또는 정횡보다 후방에 있는 물표 쪽으로 변침하는 것을 피하도록 합니다."},{"id":"07716e8f","q":"제한된 시정에서 정횡보다 전방으로 보이는 방향에서 다른 선박의 무중신호가 들리면 어떻게 해야 합니까?","o":["그 해역을 지나가기 위해 속력을 높입니다.","반드시 좌현으로 변침합니다.","음향 장비를 끕니다.","침로를 유지할 수 있는 최소 속력으로 줄이고, 필요하면 타력을 모두 없애며, 극도로 주의하여 항해합니다."],"c":"시각 접촉이 없으면 지나친 근접이 빠르게 악화될 수 있습니다. 국제해상충돌예방규칙(RIPEAM/COLREG)은 위험이 사라질 때까지 극도의 주의를 요구합니다."},{"id":"56e7054d","q":"조종불능선(embarcação sem governo)이란 어떤 선박을 말합니까?","o":["레저를 위해 스스로 멈춰 있는 선박.","약한 바람에 돛으로만 항해하는 선박.","출력이 작은 엔진을 가진 선박.","예외적인 사정으로 요구되는 대로 조종할 수 없어 다른 선박의 진로를 피할 수 없는 선박."],"c":"조종불능은 단순히 멈춰 있다는 뜻이 아닙니다. 조종 규칙을 따를 수 없는 예외적인 무능력 상태를 말합니다."},{"id":"a1733fe0","q":"조종제한선이란 어떤 선박입니까?","o":["경제적인 이유로 속력을 줄이기로 한 선박.","작업의 성질상 조종 능력이 제한되어 요구되는 대로 진로를 피할 수 없는 선박.","승객만 운송하는 선박.","길이가 12 m 미만인 선박."],"c":"특정 준설 작업, 케이블 부설, 항행 중 보급 등이 예입니다. 제한은 수행 중인 작업에서 비롯됩니다."},{"id":"ff160866","q":"흘수제약선의 특징은 무엇입니까?","o":["흘수와 가용 수심·폭의 관계 때문에 침로에서 벗어나는 능력이 심각하게 제한된 동력선.","얕은 물에 있는 모든 범선.","해변 가까이에 투묘한 모든 선박.","구명조끼가 부족한 선박."],"c":"조종불능선과 조종제한선을 제외한 다른 선박은 상황이 허락하면 흘수제약선의 통항을 방해하지 않아야 합니다."},{"id":"647d38f1","q":"선박의 현등은 어떤 색입니까?","o":["우현은 녹색, 좌현은 붉은색.","우현은 붉은색, 좌현은 녹색.","양현 모두 흰색.","우현은 노란색, 좌현은 파란색."],"c":"현등을 보면 보이는 쪽의 현을 알 수 있습니다. 녹색은 우현, 붉은색은 좌현입니다."},{"id":"fdaede09","q":"마스트등은 어느 범위를 비춥니까?","o":["우현 쪽만 112,5도.","225도, 선수 방향에서 양현 각각 정횡 후방 22,5도까지.","선미를 중심으로 135도.","수평선 둘레 360도."],"c":"마스트등은 흰색이며 전방 구역을 비춥니다. 그 호는 현등이나 선미등의 범위와 다릅니다."},{"id":"0772117c","q":"선미등의 비추는 범위는 어떻게 됩니까?","o":["선수를 중심으로 225도.","우현 쪽만 112,5도.","수평선 둘레 360도.","선미를 중심으로 135도, 양현 각각 67,5도."],"c":"선미등은 흰색이며 후방 구역을 비춥니다. 추월 상황으로 다가오는 선박이 보통 보게 되는 등입니다."},{"id":"852c7917","q":"야간에 항행 중인 길이 50 m 미만의 동력선은 보통 무엇을 표시합니까?","o":["흰색 전주등 하나만.","마스트등 1개, 현등, 선미등.","수직선상의 붉은색 등 2개.","흰색 위에 녹색 등, 현등 없음."],"c":"후방에 더 높게 두는 두 번째 마스트등은 50 m 이상이면 의무이고, 그 미만이면 선택 사항입니다."},{"id":"e0f870ce","q":"야간에 항행 중인 범선이 기본적으로 표시해야 하는 등화는 무엇입니까?","o":["의무적인 흰색 마스트등 1개와 노란색 등 2개.","수직선상의 붉은색 등 2개.","현등과 선미등.","길이와 관계없이 흰색 전주등 하나만."],"c":"길이 20 m 미만의 범선은 현등과 선미등을 마스트 꼭대기나 그 근처의 한 개의 등으로 합쳐 표시할 수 있습니다."},{"id":"8b7af86c","q":"길이 12 m 미만의 동력선이 사용할 수 있는 간소화된 방법은 무엇입니까?","o":["녹색 현등만.","수직의 노란색 등 2개.","현등 없이 붉은색 전주등 1개.","흰색 전주등 1개와 현등."],"c":"소형 동력선은 흰색 전주등 하나로 마스트등과 선미등을 따로 다는 것을 대신할 수 있으며, 현등을 함께 표시합니다."},{"id":"9be3cf1e","q":"투묘 중인 길이 50 m 미만의 선박이 야간과 주간에 각각 표시해야 하는 것은 무엇입니까?","o":["현등과 검은색 원뿔.","붉은색 등 2개와 원뿔 2개.","가장 잘 보이는 곳에 흰색 전주등 1개, 그리고 검은색 구형 형상물 1개.","흰색 위에 녹색 등과 원통."],"c":"더 큰 선박은 전방과 후방에 각각 정박등을 표시합니다. 주간 정박 형상물은 구형입니다."},{"id":"edfc33fc","q":"좌초선을 식별하는 추가 신호는 무엇입니까?","o":["녹색 등 3개와 원뿔 1개.","노란색 등 1개와 원통 1개.","흰색 등 2개와 마름모 2개.","수직선상의 붉은색 전주등 2개와 검은색 구형 형상물 3개, 그리고 해당되는 정박 신호."],"c":"좌초 신호는 정박 신호에 좌초로 인한 무능력 신호, 즉 붉은색 위 붉은색과 구형 형상물 3개를 더한 것입니다."},{"id":"a39803a4","q":"조종불능선을 식별하는 표시는 무엇입니까?","o":["수직선상의 붉은색 전주등 2개, 주간에는 검은색 구형 형상물 2개.","흰색 위 녹색 등과 원뿔 2개.","붉은색 위 흰색 등과 구형 형상물 1개.","붉은색-흰색-붉은색 등과 마름모 1개."],"c":"대수속력이 있을 때 조종불능선은 현등과 선미등도 표시합니다. 붉은색 한 쌍이 특수한 상태를 나타냅니다."},{"id":"6614f9d4","q":"조종제한선을 식별하는 표시는 무엇입니까?","o":["흰색-붉은색-흰색 등과 원뿔 3개.","수직선상의 붉은색-흰색-붉은색 등, 주간에는 구형-마름모-구형 형상물.","녹색-흰색-녹색 등과 구형 형상물 1개.","노란색 등 2개와 원통 1개."],"c":"붉은색-흰색-붉은색 순서는 구형-마름모-구형에 해당합니다. 작업 내용과 움직임에 따라 다른 신호가 추가될 수 있습니다."},{"id":"3ea60e9b","q":"트롤 어로에 종사하는 선박은 수직선상에 어떤 전주등을 표시합니까?","o":["흰색 위에 녹색.","흰색 위에 붉은색.","붉은색 위에 흰색.","녹색 위에 노란색."],"c":"전통적인 암기법은 '흰색 위에 녹색, 트롤 작업 중'입니다. 대수속력이 있을 때는 현등과 선미등도 표시합니다."},{"id":"84baeb90","q":"트롤 이외의 어로에 종사하는 선박은 무엇을 표시합니까?","o":["흰색 위에 녹색.","수직의 흰색 등 2개.","수직선상의 전주등으로 흰색 위에 붉은색.","노란색 위에 흰색."],"c":"어구가 수평으로 150 m를 넘게 뻗어 있으면 어구 방향에 흰색 전주등 또는 꼭짓점이 위를 향한 원뿔 1개를 추가로 표시합니다."},{"id":"64527826","q":"업무 중인 도선선은 어떤 등화로 알아볼 수 있습니까?","o":["붉은색 위에 흰색.","흰색 위에 붉은색.","흰색 위에 녹색.","수직의 노란색 등 2개."],"c":"도선선은 항행 중에는 현등과 선미등도 표시하고, 투묘 중에는 정박 신호를 표시합니다."},{"id":"3b4d539e","q":"예인 길이가 200 m를 넘을 때 동력 예인선은 마스트등을 수직으로 몇 개 표시합니까?","o":["1개.","2개.","붉은색 4개.","3개."],"c":"200 m 이하는 수직 마스트등 2개, 200 m 초과는 3개입니다. 주간에는 마름모 형상물 1개로도 긴 예인을 표시합니다."},{"id":"76c0affe","q":"예인선에서 선미등 바로 위에 수직으로 다는 등은 무엇입니까?","o":["녹색 현등.","붉은색 마스트등.","선미등과 같은 범위를 비추는 노란색 예선등.","파란색 전주등."],"c":"예선등은 노란색이며 선미등과 같은 범위 특성을 가지고 그 위에 위치합니다."},{"id":"1d78bc56","q":"선박이 서로 시계 안에 있을 때 단음 1회는 무엇을 뜻합니까?","o":["좌현으로 변침하고 있습니다.","후진 추진을 하고 있습니다.","투묘하고 있습니다.","우현으로 변침하고 있습니다."],"c":"신호는 조종과 함께 해야 합니다. 단음 1회는 우현, 2회는 좌현, 3회는 후진 추진입니다."},{"id":"1e5604d8","q":"선박이 서로 시계 안에 있을 때 단음 2회는 무엇을 뜻합니까?","o":["우현으로 변침하고 있습니다.","좌현으로 변침하고 있습니다.","조종불능 상태입니다.","투묘하려고 합니다."],"c":"단음 2회는 좌현으로의 변침을 알립니다. 신호가 안전하고 알아볼 수 있는 조종을 할 의무를 대신하지는 않습니다."},{"id":"ca6c0a09","q":"선박이 서로 시계 안에 있을 때 단음 3회는 무엇을 뜻합니까?","o":["후진 추진을 하고 있습니다.","우현으로 변침하고 있습니다.","좌현으로 변침하고 있습니다.","도선사를 요청하고 있습니다."],"c":"단음 3회는 기관을 후진으로 사용하고 있다는 뜻이며, 선박이 이미 후진 타력을 가지고 있다는 뜻은 아닙니다."},{"id":"d5bb28e6","q":"짧고 빠른 단음 5회 이상은 무엇을 뜻합니까?","o":["추월에 대한 동의.","정박지 도착.","VHF 일상 통신.","상대 선박의 의도나 조종에 대한 의문, 또는 상대 선박이 충돌을 피하기 위한 동작을 하지 않는다는 판단."],"c":"이는 경고 신호입니다. 위험, 속력, 조종 필요성을 즉시 다시 판단해야 합니다."},{"id":"20db00e2","q":"제한된 시정에서 대수속력이 있는 동력선은 2분을 넘지 않는 간격으로 어떤 신호를 울려야 합니까?","o":["장음 1회.","단음 2회.","단음 3회.","단음 1회에 이어 장음 1회."],"c":"기관을 사용하는 동력선이지만 정지하여 대수속력이 없으면 약 2초 간격으로 장음 2회를 울립니다."},{"id":"30162b5b","q":"항로표지의 관례적 방향에서 일반적인 입항 방향은 무엇입니까?","o":["항상 항구에서 바다 쪽으로.","항상 북쪽에서 남쪽으로.","바다에서 항구 쪽으로, 또는 내수로에서는 상류 쪽으로 정해진 방향을 따라.","선체의 색깔에 따라 정해집니다."],"c":"관례적 방향은 측방표지를 해석하는 기준입니다. 특수한 구간에서는 해도와 현지 간행물을 확인해야 합니다."},{"id":"aba265f0","q":"IALA B지역(Região B)에서 항로표지가 설치된 수로로 들어갈 때 좌현 측방표지는 어떻게 생겼습니까?","o":["붉은색, 원뿔형, 홀수 번호이며 좌현 쪽에 두고 지나갑니다.","노란색, 구형이며 측방 기준이 없습니다.","검은색과 붉은색이며 구 2개가 있습니다.","녹색, 해당하는 경우 원통형, 번호가 있다면 짝수이며 좌현 쪽에 두고 지나갑니다."],"c":"IALA B지역에서 좌현 표지는 녹색입니다. 두표는 원통형이고 번호가 있다면 짝수입니다."},{"id":"4671c730","q":"IALA B지역(Região B)에서 항로표지가 설치된 수로로 들어갈 때 우현 측방표지는 어떻게 생겼습니까?","o":["녹색, 원통형, 짝수이며 우현 쪽에 두고 지나갑니다.","흰색과 붉은색의 세로 줄무늬.","노란색이며 X자 두표가 있습니다.","붉은색, 해당하는 경우 원뿔형, 번호가 있다면 홀수이며 우현 쪽에 두고 지나갑니다."],"c":"IALA B지역에서 우현 표지는 붉은색입니다. 두표는 꼭짓점이 위를 향한 원뿔형이고 번호는 홀수입니다."},{"id":"2f0a0feb","q":"분기점에서 넓은 녹색 가로띠가 있는 붉은색 표지는 무엇을 나타냅니까?","o":["우현 쪽 우선 항로.","고립장애표지.","좌현 쪽 우선 항로.","주위 전체가 안전수역."],"c":"주된 색인 붉은색은 관례적 방향에서 이 표지를 우현 쪽에 두고 지나간다는 뜻이고, 녹색 띠는 우선 항로가 좌현 쪽으로 이어진다는 것을 알려 줍니다."},{"id":"1a060231","q":"넓은 붉은색 가로띠가 있는 녹색 표지는 무엇을 나타냅니까?","o":["우현 쪽 우선 항로.","좌현 쪽 우선 항로.","이중 신위험.","의무 투묘 구역."],"c":"주된 색인 녹색은 수로의 좌현 쪽을 나타내고, 붉은색 띠는 우현 쪽 항로가 우선이라는 것을 가리킵니다."},{"id":"ca8e0f14","q":"방위표지(sinal cardinal)의 목적은 무엇입니까?","o":["수로의 오른쪽 기슭만 표시합니다.","항구까지의 정확한 거리를 보여 줍니다.","선박의 모든 항해등을 대신합니다.","표지를 기준으로 안전수역이 있는 사분면, 즉 북·동·남·서를 나타냅니다."],"c":"방위표지의 이름은 통과를 권장하는 사분면과 같습니다. 색깔, 원뿔, 등질이 식별을 확인해 줍니다."},{"id":"fa4091ba","q":"북방위표지의 두표 원뿔은 어떻게 생겼습니까?","o":["꼭짓점이 아래를 향한 검은색 원뿔 2개.","꼭짓점이 위를 향한 검은색 원뿔 2개.","밑면이 서로 맞닿은 원뿔 2개.","검은색 구 2개."],"c":"북방위표지는 검은색이 위쪽에 있고 두 원뿔이 위를 향해 나침도의 위쪽 끝을 떠올리게 합니다."},{"id":"af441fc5","q":"동방위표지의 두표는 어떻게 생겼습니까?","o":["꼭짓점이 서로 마주 보는 원뿔 2개.","밑면이 서로 마주 보는 검은색 원뿔 2개.","위를 향한 원뿔 2개.","붉은색 구 1개."],"c":"동방위표지는 원뿔의 꼭짓점이 서로 멀어지는 방향을 향해 넓은 윤곽을 이루며, 나침도의 동쪽과 연결해 기억합니다."},{"id":"a4816f87","q":"남방위표지의 두표 원뿔은 어떻게 생겼습니까?","o":["꼭짓점이 아래를 향한 검은색 원뿔 2개.","꼭짓점이 위를 향한 원뿔 2개.","밑면이 서로 맞닿은 원뿔 2개.","녹색 원통 1개."],"c":"남방위표지는 노란색이 검은색 위에 있고 두 원뿔이 아래를 향합니다."},{"id":"438f1e44","q":"서방위표지의 두표는 어떻게 생겼습니까?","o":["밑면이 서로 마주 보는 원뿔 2개.","아래를 향한 원뿔 2개.","꼭짓점이 서로 마주 보는 검은색 원뿔 2개.","붉은색 구 2개."],"c":"맞닿은 꼭짓점은 잘록한 허리를 떠올리게 하여 서쪽을 기억하는 데 도움이 됩니다. 표지 본체는 노란색-검은색-노란색입니다."},{"id":"e888ec15","q":"동방위표지를 식별하는 등질은 무엇입니까?","o":["9회 군섬광.","6회 섬광에 장섬광 1회.","흰색 급섬광 또는 초급섬광 3회 군.","주기마다 흰색 섬광 2회."],"c":"3, 6, 9회 군은 시계의 위치처럼 동, 남, 서를 가리키며, 북쪽은 연속 급섬광을 사용합니다."},{"id":"0f8760b1","q":"남방위표지를 식별하는 등질은 무엇입니까?","o":["급섬광 3회.","급섬광 9회.","흰색 급섬광 또는 초급섬광 6회 군에 이어 장섬광 1회.","노란색 장섬광 1회."],"c":"장섬광은 남방위표지를 구별해 주며 다른 군섬광과 혼동하지 않도록 도와줍니다."},{"id":"3bb51f9e","q":"서방위표지를 식별하는 등질은 무엇입니까?","o":["흰색 급섬광 또는 초급섬광 9회 군.","3회 군섬광.","6회 섬광에 장섬광 1회.","흰색 부동등."],"c":"시계 암기법에서 9는 서쪽에 해당합니다. 동쪽 3, 남쪽 6에 장섬광, 서쪽 9입니다."},{"id":"a2d07b5a","q":"북방위표지는 어떤 등질을 사용합니까?","o":["특정한 횟수의 군을 이루지 않는 흰색 급섬광 또는 초급섬광.","정확히 흰색 섬광 2회.","노란색 섬광 9회 군.","붉은색 등의 모스 부호 A."],"c":"북방위표지는 연속적인 급섬광 또는 초급섬광을 사용합니다. 주간 표지는 노란색 위에 검은색입니다."},{"id":"76b1507a","q":"고립장애표지(perigo isolado)는 무엇을 나타냅니까?","o":["수로의 의무적인 중앙.","주위 전체가 항행 가능한 수역인 국지적인 위험물.","모든 항구 입구의 우현 쪽.","넓은 범위에 걸쳐 위험이 전혀 없는 구역."],"c":"위험물 위나 그 근처에 설치합니다. 검은색 바탕에 붉은색 띠가 있고, 검은색 구 2개의 두표와 흰색 2회 군섬광을 가집니다."},{"id":"3ab1a286","q":"안전수역표지의 외형적 특징은 무엇입니까?","o":["검은색과 붉은색의 수평 띠에 구 두 개가 있습니다.","구조물 전체가 노란색이고 꼭대기에 X자가 있습니다.","붉은색과 흰색의 세로 띠이며, 꼭대기에 붉은색 구형 두표를 선택적으로 답니다.","녹색 구조물에 붉은색 띠가 있습니다."],"c":"이 표지는 주변이 항행 가능한 수역, 항로 중앙, 육지 접근 지점 또는 대기 지점임을 나타냅니다. 등화가 있는 경우 그 색은 흰색입니다."},{"id":"e0011bc5","q":"특수표지의 기본 색은 무엇입니까?","o":["노란색이며, 등화가 있으면 노란색 등을 사용합니다.","붉은색이며, 반드시 원뿔형입니다.","녹색이며, 반드시 원통형입니다.","검은색에 붉은색 띠가 있습니다."],"c":"특수표지는 준설, 레저 활동, 케이블, 투묘 구역 등 항해 관련 문서에 기술된 구역이나 시설을 표시합니다."},{"id":"2bbc556b","q":"아직 충분히 알려지지 않은 새로운 위험물은 어떻게 강조해야 합니까?","o":["등화가 없는 파란색 부표 하나로 표시합니다.","주변의 모든 표지를 제거합니다.","항해자 사이의 구두 통보로만 알립니다.","사용하는 표지 중 적어도 하나를 동일한 표지로 이중 설치해야 합니다."],"c":"이중 설치는 새로 생긴 위험에 주의를 끌기 위한 것입니다. 사용되는 방위표지나 측방표지의 등화는 급섬광 또는 초급섬광이어야 합니다."},{"id":"2a4f8b76","q":"특수표지에 사용될 수 있는 두표는 무엇입니까?","o":["검은색 구 두 개.","위를 향한 검은색 원뿔 두 개.","노란색 X자.","반드시 붉은색 구 하나."],"c":"X자 두표는 선택 사항이며 특수한 용도를 알아보는 데 도움이 됩니다. 표지 본체의 형태는 다른 기존 표지와 혼동되지 않아야 합니다."},{"id":"0b57c10e","q":"다음 중 안전수역표지의 등화를 나타낼 수 있는 등질은 무엇입니까?","o":["모스 부호 A의 흰색 등, 그리고 등명암등, 명암등 또는 10초마다 장섬광하는 등질.","붉은색 2섬광의 군섬광.","반드시 노란색 부동등.","녹색 9섬광의 군섬광."],"c":"모스 부호 A는 점-선(·-)입니다. 흰색 등화와 붉은색·흰색 세로 띠가 이 표지를 다른 표지와 구별해 줍니다."},{"id":"a24d03cf","q":"한 사람을 위한 colete salva-vidas(구명조끼)를 고를 때 필수적인 기준은 무엇입니까?","o":["승인된 형식으로, 항해 구역에 맞는 등급이며 착용자의 체중과 체격에 맞는 것을 사용합니다.","천의 색깔만 보고 고릅니다.","승인 여부를 확인하지 않고 아무 스포츠용 조끼나 사용합니다.","헐렁하더라도 항상 가장 큰 치수를 선택합니다."],"c":"구명조끼는 착용자에게 적합하고 몸에 잘 맞아야 합니다. 헐렁하거나 부적합하거나 승인되지 않은 장비는 정작 비상시에 제 기능을 못 할 수 있습니다."},{"id":"4a777640","q":"항해 중 구명조끼는 어디에 두어야 합니까?","o":["오용을 막기 위해 잠긴 수납함 안에 둡니다.","빌지의 가장 낮은 곳에 둡니다.","표시가 되어 있고 건조하며 즉시 꺼낼 수 있는 곳에 두고, 잠그거나 짐 밑에 묻어 두지 않습니다.","공간 절약을 위해 연료 옆에 포장해 둡니다."],"c":"비상시에는 몇 초가 중요합니다. 승선자 모두가 구명조끼의 위치와 착용 방법을 알아야 하며, 가능하면 출항 전에 익혀 두어야 합니다."},{"id":"b933d1af","q":"신호용 화공품(조난 신호탄 등)을 선내에 싣기 전에 무엇을 확인해야 합니까?","o":["포장의 겉 색깔만 확인합니다.","선실 안에서 시험해 볼 수 있는지 확인합니다.","열원 근처에 아무렇게나 보관해도 되는지 확인합니다.","유효기간, 손상 여부, 승인 여부, 사용 설명, 안전한 보관 방법을 확인합니다."],"c":"유효기간이 지났거나 손상되었거나 잘못 보관된 화공품은 위험하며 작동하지 않을 수 있습니다. 제조사 설명에 따라 실제 비상 상황에서만 사용해야 합니다."},{"id":"a607ca99","q":"주황색 발연 신호의 주된 용도는 무엇입니까?","o":["선실 내부를 계속 밝힙니다.","특히 주간에 조난 중인 선박이나 사람의 위치를 알립니다.","연료 화재를 끕니다.","우현 항해등을 대신합니다."],"c":"주황색 연기는 주간에 눈에 띄는 시각적 표시가 되며, 수색팀이 풍향을 파악하는 데도 도움이 될 수 있습니다."},{"id":"75193f44","q":"붉은색 낙하산 신호탄의 주요 장점은 무엇입니까?","o":["용골 아래 수심을 정확히 표시합니다.","물속에서만 연기를 냅니다.","휴대용 소화기로 쓸 수 있습니다.","높이 올라가 더 오래 보이므로 먼 거리에서도 발견되기 쉽습니다."],"c":"낙하산 신호탄은 시인 거리가 긴 조난 신호입니다. 바람, 사람, 장애물을 살피며 신중하게 발사해야 합니다."},{"id":"52e17956","q":"다음 중 조난을 나타내는 시각 신호로 인정되는 조합은 무엇입니까?","o":["노란색 원뿔 위의 녹색 깃발.","사각형 깃발과 그 위 또는 아래에 있는 구 또는 구와 비슷한 물체.","나란히 걸린 파란색 깃발 두 개.","흰색 삼각기 아래의 검은색 원통."],"c":"이것은 국제 조난 신호 중 하나입니다. 한 가지 신호를 사용한다고 해서 MAYDAY, EPIRB, 화공품 등 사용 가능한 다른 수단을 함께 쓰지 못하는 것은 아닙니다."},{"id":"ad9069cd","q":"비상시 선박은 언제 퇴선해야 합니까?","o":["위험이 없더라도 첫 기계 고장이 나면 바로.","조난 요청을 송신하기 전에.","선내에 남는 것이 더 큰 위험일 때에만, 지휘에 따라 가능한 구명 설비를 가지고 퇴선합니다.","선박이 몇 분간 조종 불능이 될 때마다."],"c":"선박은 보통 물속의 사람보다 더 많은 보호를 제공하고 발견하기도 쉽습니다. 퇴선은 최후의 수단입니다."},{"id":"f4a1c899","q":"소형 선박이 전복되었지만 계속 떠 있고 즉각적인 화재 위험은 없습니다. 구조에 유리한 행동은 무엇입니까?","o":["거리를 모르더라도 혼자 해안까지 헤엄칩니다.","필요 없이 선체 밑으로 반복해서 잠수합니다.","더 빨리 헤엄치기 위해 구명조끼를 벗습니다.","선체 곁에 머물러 선체에 몸을 기대고, 목적 없이 헤엄치지 않습니다."],"c":"선체는 수색 시 더 큰 목표물이 되고 부력을 제공할 수 있습니다. 구체적인 위협이 있거나 분명히 더 안전한 대안이 있을 때만 선체를 떠나야 합니다."},{"id":"9547cf2f","q":"balsa salva-vidas(구명뗏목)에서 해묘(바다 닻)의 용도는 무엇입니까?","o":["표류를 줄이고 뗏목이 파도와 바람에 대해 일정한 방향을 유지하도록 돕습니다.","염분을 자동으로 측정합니다.","뗏목을 파도 위로 들어 올립니다.","수리 키트를 대신합니다."],"c":"해묘는 물속에서 저항을 만들어 표류를 제한하고, 거친 바다에서 뗏목의 거동을 개선할 수 있습니다."},{"id":"d1097b8c","q":"생존 상황에서 바닷물을 마시면 안 되는 이유는 무엇입니까?","o":["과도한 염분이 탈수를 악화시키고 신체에 해를 줄 수 있기 때문입니다.","즉시 저체온증을 일으키기 때문입니다.","항상 연료가 섞여 있기 때문입니다.","갈증을 완전히 없애 주기 때문입니다."],"c":"신장은 섭취한 염분을 배출해야 하며, 이때 마신 양보다 더 많은 물이 필요할 수 있습니다. 식수는 신중하게 배분하되, 필요한 수분 섭취를 부당하게 중단해서는 안 됩니다."},{"id":"4e08b057","q":"구명조끼를 입은 사람들이 차가운 물속에서 구조를 기다리고 있습니다. 체온 손실을 줄이는 방법은 무엇입니까?","o":["계속 강하게 헤엄칩니다.","무릎을 끌어안기 위해 구명조끼를 벗습니다.","더 넓은 구역을 차지하도록 무리를 흩어지게 합니다.","몸을 최대한 움직이지 않고, 열 손실이 큰 부위를 보호하며, 안전하다면 함께 모여 있습니다."],"c":"열 손실 감소 자세와 무리 짓기는 노출을 줄여 줍니다. 불필요한 움직임은 몸 주변의 물이 바뀌는 속도를 높여 체온 손실을 키웁니다."},{"id":"98d55dca","q":"화재의 3요소(연소의 삼각형)는 무엇입니까?","o":["연료(가연물), 산소 공급원(조연물), 열.","물, 포말, 이산화탄소.","연기, 재, 불꽃.","압력, 습도, 전기."],"c":"화재 종류에 따라 냉각, 질식, 가연물 제거 등으로 필수 요소 중 하나를 없애거나 줄이면 소화됩니다."},{"id":"d373a263","q":"A급 화재의 전형적인 물질은 무엇입니까?","o":["휘발유 같은 인화성 액체.","통전 중인 전기 장비.","목재, 종이, 천처럼 잔재를 남기는 일반 고체.","오직 산업용 설비의 식용유."],"c":"A급 화재는 일반 고체 물질과 관련됩니다. 소화약제는 감전 위험을 만들거나 주변의 다른 연료를 퍼뜨리지 않도록 선택해야 합니다."},{"id":"e5838e14","q":"유출된 휘발유에 불이 붙었습니다. 이 화재는 주로 몇 급 화재로 분류됩니까?","o":["A급, 목재 불씨를 남기므로.","C급, 단지 선박에서 발생했으므로.","B급, 인화성 액체와 관련되므로.","D급, 가연성 금속과 관련되므로."],"c":"인화성 액체 화재에 물을 직사하면 연료가 퍼질 수 있습니다. B급 화재에 적합한 약제와 방법을 사용합니다."},{"id":"156f142b","q":"통전 중인 전기 배전반에 불이 났습니다. 적절한 분류와 초기 조치는 무엇입니까?","o":["통전 중에는 C급이며, 안전하다면 전원을 차단하고 적절한 비전도성 약제를 사용합니다.","A급이며, 전원을 끄지 않고 바로 물을 뿌립니다.","B급이며, 배전반을 열고 전선을 만집니다.","D급이며, 젖은 천으로 덮습니다."],"c":"전기는 감전 위험을 만듭니다. 전원을 차단한 뒤에는 실제로 타고 있는 물질에 따라 화재를 다룹니다."},{"id":"397613da","q":"불타는 휘발유나 통전 중인 전기 설비에 물줄기를 뿌리면 안 되는 이유는 무엇입니까?","o":["물은 항상 산소 농도를 높이기 때문입니다.","연료를 퍼뜨릴 수 있고, 전기의 경우 전류가 흘러 감전을 일으킬 수 있기 때문입니다.","물은 모든 화재를 D급으로 바꾸기 때문입니다.","모든 물 소화기는 야외에서 폭발하기 때문입니다."],"c":"약제 선택은 소화 작업의 결정적인 부분입니다. 불을 끄는 것뿐 아니라 확산, 감전, 탈출로 상실을 막아야 합니다."},{"id":"a9913891","q":"밀폐된 엔진실에 화재가 의심됩니다. 가장 안전한 조치는 무엇입니까?","o":["잘 보기 위해 덮개를 한 번에 엽니다.","연료를 다 소모하도록 엔진 회전수를 높입니다.","불을 덮기 위해 발화점에 휘발유를 붓습니다.","엔진을 정지하고 가능하면 연료와 전기를 차단한 뒤, 엔진실을 완전히 열지 않고 전용 투입구로 약제를 분사합니다."],"c":"완전히 열면 산소가 공급되어 불길이 솟구칠 수 있습니다. 소화 작업 중에도 탈출로를 확보하고 구조 요청 필요성을 고려해야 합니다."},{"id":"1e55290d","q":"시동 전에 강한 연료 냄새가 나면 어떻게 해야 합니까?","o":["시스템을 시험하기 위해 즉시 시동을 겁니다.","누출 부위를 찾으려고 불을 켭니다.","엔진이나 불꽃을 낼 수 있는 장비를 작동하지 말고, 공급원을 잠그고 환기한 뒤 안전하게 누출 부위를 찾습니다.","환기구를 모두 닫고 배터리 충전기를 켭니다."],"c":"연료 증기는 특히 낮고 밀폐된 구획에서 폭발성 혼합기를 만들 수 있습니다. 시동 전에 원인을 제거해야 합니다."},{"id":"c03358e4","q":"휴대용 extintor(소화기)를 사용할 때 약제를 어디로 향해야 합니까?","o":["연기의 가장 높은 부분만 향합니다.","출구를 등지고 천장을 향합니다.","가까운 사람들을 식히기 위해 사람을 향합니다.","불꽃의 밑부분을 향해 비로 쓸듯이 분사하며 탈출로를 유지합니다."],"c":"방사된 약제가 연소 구역에 닿아야 합니다. 접근 방법은 약제, 바람, 방사 거리, 화세에 따라 달라지며, 불이 커지면 대피와 구조 요청을 우선합니다."},{"id":"189b22f3","q":"작고 환기가 잘 안 되는 구획에서 CO2를 사용할 때 따르는 위험은 무엇입니까?","o":["끓는 물이 반드시 생깁니다.","외부 대기압이 영구적으로 높아집니다.","화재가 방사성 물질로 바뀝니다.","호흡에 필요한 산소가 줄어들므로, 재진입 전에 철수하고 안전하게 환기해야 합니다."],"c":"CO2는 불을 질식시키지만 질식성 대기를 만들 수도 있습니다. 상태를 평가하지 않고 그 안에 머물거나 다시 들어가서는 안 됩니다."},{"id":"b007c3ee","q":"선내 화재 초기에 불에 공급되는 것을 제한하는 데 도움이 되는 조치는 무엇입니까?","o":["모든 연료 탱크를 엽니다.","불타는 구획의 환기를 늘립니다.","인화성 물질을 발화점 가까이로 옮깁니다.","안전하다면 해당 구역의 연료 공급과 전원을 차단합니다."],"c":"에너지원과 연료를 차단하면 화재의 확대를 막을 수 있습니다. 이 조치는 연기를 통과하거나 탈출로를 잃지 않는 상태에서 해야 합니다."},{"id":"dd66c3c0","q":"작은 손상 부위로 선체에 물이 들어오기 시작했습니다. 적절한 초기 대응은 무엇입니까?","o":["모든 통신을 끄고 항해를 계속합니다.","모든 사람을 낮아진 쪽 현측에 모읍니다.","구명조끼를 착용하고, 침수 부위를 찾아 유입을 줄이며, 배수 장치를 작동하고 안전한 곳으로 향하면서 필요하면 도움을 요청합니다.","물이 고루 퍼지도록 다른 구획을 엽니다."],"c":"손상 통제는 인명 안전, 막음 조치, 배수, 신중한 항해를 함께 수행하는 것입니다. 복원성과 펌프 용량을 계속 확인해야 합니다."},{"id":"75f12cf2","q":"선박이 예기치 않게 좌초했습니다. 이초를 시도하기 전에 조종자는 무엇을 해야 합니까?","o":["부상자, 누수, 위치, 해저 상태, 조석, 복원성을 확인하고 손상을 악화시킬 수 있는 조종은 피합니다.","점검 없이 최대 출력으로 후진합니다.","즉시 모든 사람을 선수로 옮깁니다.","수심을 확인하려고 선체에 구멍을 뚫습니다."],"c":"진단 없이 선박을 빼내면 해저에 눌려 막혀 있던 파공이 커질 수 있습니다. 결정할 때는 조석, 가능한 지원, 환경 위험을 고려합니다."},{"id":"50a650cd","q":"사람이 물에 빠졌습니다. 가장 적절한 즉각 대응은 무엇입니까?","o":["모두 선박 안쪽을 봅니다.","직진으로 가속한 뒤 나중에야 돌아옵니다.","구명조끼 없이, 다른 조종자를 정하지 않은 채 물에 뛰어듭니다.","큰 소리로 알리고, 시선을 떼지 않으며, 부력 기구를 던지고, 안전하게 인양 조종을 시작합니다."],"c":"익수자를 계속 손으로 가리키면 시야에서 놓치지 않습니다. 접근할 때는 프로펠러, 바람, 조류, 구조자의 위험을 통제해야 합니다."},{"id":"a965b043","q":"출항 전 안전 교육에는 무엇이 포함되어야 합니까?","o":["예상 도착 시각만.","구명조끼와 소화기의 위치와 사용법, 비상 절차, 통신, 선박의 한계, 승무원의 기본 역할.","조종자 휴대전화의 비밀번호만.","어떤 장비도 필요 없을 것이라는 약속."],"c":"짧은 안전 교육은 대응 시간을 줄여 주고, 조종자가 행동 불능이 되었을 때 다른 사람이 도울 수 있게 합니다."},{"id":"e3be1f32","q":"선내에서 부상자를 발견했을 때 가장 먼저 해야 할 일은 무엇입니까?","o":["처치하기 전에 현장의 안전을 확인하고 자신, 부상자, 다른 사람을 보호합니다.","어떤 상황이든 즉시 부상자를 옮깁니다.","의식을 확인하기 전에 물을 줍니다.","더 자유롭게 움직이기 위해 구조자의 구명조끼를 벗습니다."],"c":"구조자가 또 다른 피해자가 되어서는 안 됩니다. 위험을 통제한 뒤 반응과 호흡을 평가하고 도움을 요청합니다."},{"id":"5d401810","q":"외상이 의심되지 않는 사람이 의식은 없지만 정상적으로 호흡하고 있습니다. 도움을 기다리는 동안 어떻게 해야 합니까?","o":["똑바로 눕혀 두고 음식을 줍니다.","회복 자세(옆으로 눕힌 안전 자세)로 두고 호흡을 계속 지켜봅니다.","지지 없이 앉혀 둡니다.","정상 호흡을 하는데도 가슴 압박을 시작합니다."],"c":"옆으로 눕힌 자세는 기도를 유지하고 분비물이 흘러나오게 해 줍니다. 외상이 의심되면 안전이나 기도 확보에 필요할 때만 움직입니다."},{"id":"8ba9e054","q":"부상자가 반응이 없고 정상적으로 호흡하지 않습니다. 적절한 순서는 무엇입니까?","o":["10분 기다린 후 조치합니다.","음료를 주고 앉혀 둡니다.","먼저 발목 골절을 찾습니다.","도움을 요청하고 AED(자동심장충격기)를 가져오게 한 뒤 RCP(심폐소생술, CPR)를 시작하고, 장비와 응급 서비스의 안내를 따릅니다."],"c":"헐떡임 호흡(임종 호흡)은 정상 호흡이 아닙니다. 조기 인지, 질 높은 심폐소생술, AED가 생존 가능성을 높입니다."},{"id":"c2fd0285","q":"성인 심폐소생술에서 훈련받은 구조자를 위한 일반적인 지침에 해당하는 조합은 무엇입니까?","o":["분당 10회 압박과 주기마다 인공호흡 1회.","가슴이 다시 올라오지 않게 복부만 압박.","분당 100~120회 압박, 약 5~6 cm 깊이, 압박 30회에 인공호흡 2회의 주기.","압박 5회에 인공호흡 30회의 주기."],"c":"손은 가슴 중앙에 두고, 압박 사이에 가슴이 완전히 올라오게 하며 중단을 최소화합니다. 인공호흡을 할 수 없는 사람은 적어도 가슴 압박을 계속하고 의료 지도 요원의 안내를 따라야 합니다."},{"id":"ed40b265","q":"심한 외부 출혈을 지혈하기 위한 첫 조치는 무엇입니까?","o":["상처를 보려고 첫 드레싱을 반복해서 떼어 냅니다.","통증을 줄이려고 술을 줍니다.","상처 주변을 세게 문지릅니다.","드레싱이나 깨끗한 천으로 강하게 직접 압박하고 도움을 요청합니다."],"c":"드레싱이 피에 젖으면 압박을 유지한 채 그 위에 덧댑니다. 심한 출혈에는 훈련받은 사람의 추가 장비와 기술이 필요할 수 있습니다."},{"id":"8ab458b4","q":"부상자의 몸에 물체가 박혀 있습니다. 어떻게 해야 합니까?","o":["빠르게 뽑고 상처 안쪽을 씻습니다.","완전히 들어갈 때까지 밀어 넣습니다.","고정하지 않고 피부 높이에서 부러뜨립니다.","물체를 빼지 말고 주변을 고정한 뒤 긴급 처치를 받게 합니다."],"c":"물체를 빼면 출혈과 내부 손상이 커질 수 있습니다. 생명 유지 처치를 위해 불가피한 경우가 아니면 자격 있는 의료진만 물체를 다뤄야 합니다."},{"id":"dd174a00","q":"팔다리 골절이 의심될 때는 어떻게 해야 합니까?","o":["통증이 사라질 때까지 억지로 바로잡습니다.","발견된 자세 그대로 두고, 혈액순환을 압박하지 않게 고정한 뒤 진료를 받게 합니다.","시험 삼아 걸어 보게 합니다.","변형된 부위를 직접 문지릅니다."],"c":"가능하면 위아래 관절까지 고정하고, 고정 전후에 색, 온도, 감각을 확인합니다. 개방 골절은 상처 보호가 필요합니다."},{"id":"021a8a84","q":"추락 후 척추 손상이 의심될 때 가장 안전한 행동은 무엇입니까?","o":["균형을 확인하려고 앉힙니다.","불필요한 움직임을 피하고 머리와 목을 고정한 뒤 전문 응급 서비스를 요청합니다.","필요 없이 팔을 잡아당겨 다른 구획으로 옮깁니다.","움직임을 확인하려고 머리를 반복해서 돌립니다."],"c":"화재나 침몰처럼 즉각적인 더 큰 위험이 있을 때만 적절한 기술 없이 부상자를 옮길 수 있습니다."},{"id":"1d06f695","q":"방금 생긴 작은 열 화상에 권장되는 초기 처치는 무엇입니까?","o":["피부에 직접 얼음을 댑니다.","버터, 치약, 연료를 바릅니다.","물집을 모두 터뜨립니다.","깨끗한 흐르는 물로 약 20분간 식히고, 달라붙지 않은 장신구를 빼고, 조이지 않게 덮습니다."],"c":"시원한 흐르는 물은 손상을 제한합니다. 얼음이나 민간요법은 손상을 악화시킬 수 있습니다. 넓거나 깊거나 중요한 부위의 화상은 긴급 처치가 필요합니다."},{"id":"66a35c70","q":"화학 물질이 눈에 들어갔습니다. 적절한 즉각 대응은 무엇입니까?","o":["물질을 모르는 상태에서 다른 화학 물질로 중화합니다.","마른 천으로 눈을 문지릅니다.","씻지 않고 눈을 감고 있습니다.","눈꺼풀을 벌린 채 깨끗한 물을 많이 흘려 씻고 의료 상담을 받습니다."],"c":"빨리 씻어 내면 오염 물질이 희석되고 제거됩니다. 콘택트렌즈는 쉽게 빠지면 제거하되, 세척을 늦춰서는 안 됩니다."},{"id":"417df74c","q":"경련(발작) 중에는 어떻게 하는 것이 옳습니까?","o":["팔다리를 힘껏 붙잡아 움직이지 못하게 합니다.","위험한 물건을 치우고, 머리를 보호하고, 시간을 재며, 움직임을 억제하거나 입에 무엇을 넣지 않습니다.","이 사이에 물건을 끼워 넣습니다.","몸부림치는 동안 물을 줍니다."],"c":"발작이 끝나면 호흡을 확인하고 적절하면 옆으로 눕힙니다. 오래 지속되거나 반복되거나 외상이 동반되거나 처음 발생한 발작은 긴급 구조가 필요합니다."},{"id":"9a29e07e","q":"의식이 있는 성인이 목이 막혀 말하거나 기침하거나 숨 쉬지 못합니다. 훈련받은 구조자에게 권장되는 조치는 무엇입니까?","o":["견갑골 사이를 5회 두드리고 복부 밀어내기 5회를 번갈아 하며 도움을 요청합니다.","물을 주고 눕게 합니다.","보이지 않는 상태로 입안에 손가락을 넣습니다.","개입하지 않고 막힌 것이 내려가기를 기다립니다."],"c":"의식을 잃으면 심폐소생술 절차를 시작하고, 이물이 보일 때만 꺼내려고 합니다. 임신부나 고도 비만인 사람에게는 변형된 기법이 필요합니다."},{"id":"c660d969","q":"부상자의 피부가 창백하고 차가우며, 기운이 없고 쇼크 징후가 있습니다. 구조대가 오기 전까지 어떻게 해야 합니까?","o":["혈액순환을 돕기 위해 억지로 걷게 합니다.","술을 줍니다.","팔을 올린 채 세워 둡니다.","눕히고 체온을 유지하며, 보이는 원인을 통제하고 음식이나 음료를 주지 않습니다."],"c":"쇼크는 출혈, 외상, 기타 응급 상황에 동반될 수 있습니다. 호흡 곤란, 외상, 구토 위험이 있으면 자세를 조정해야 합니다."},{"id":"db0062b4","q":"더위에 노출된 후 혼란, 매우 뜨거운 피부, 의식 변화를 보입니다. 심각한 열사병이 의심됩니다. 어떻게 해야 합니까?","o":["담요를 여러 겹 덮고 환기를 막습니다.","응급 구조를 요청하고 가능한 수단으로 빠르게 체온을 낮추며 호흡을 지켜봅니다.","술을 주고 혼자 둡니다.","아무것도 하지 않고 체온이 내려가기를 기다립니다."],"c":"고체온과 신경학적 이상이 함께 있으면 응급 상황입니다. 과도한 옷을 벗기고 추가 위험 없이 식히되, 의식이 변한 사람에게는 음료를 주지 마십시오."},{"id":"42097a62","q":"물에 잠긴 사람을 구조할 때 구조자와 익수자 모두를 보호하는 우선 사항은 무엇입니까?","o":["훈련을 받지 않았더라도 부력 기구 없이 물에 들어갑니다.","불필요하게 자신을 위험에 노출하지 않고 구출한 뒤, 호흡을 평가하고 필요하면 심폐소생술과 AED를 시작합니다.","팔을 잡고 들어 올린 채 기다립니다.","호흡을 평가하기 전에 폐에서 물을 빼려고 합니다."],"c":"가능하면 손 뻗기, 로프, 부표, 선박을 이용하십시오. 호흡이 없으면 훈련에 따라 인공호흡과 가슴 압박을 해야 하며, 물을 빼내려다 심폐소생술을 늦춰서는 안 됩니다."},{"id":"d4d37ba9","q":"자기 나침반의 바늘이 제공하는 기본 정보는 무엇입니까?","o":["용골 아래의 정확한 수심.","진풍의 속도.","출발 후 항주한 거리.","침로를 정하는 기준이 되는 자북 방향."],"c":"자기 나침반은 진북을 직접 가리키지 않습니다. 올바르게 사용하려면 침로, 편차(자기 편차), 자차를 이해해야 합니다."},{"id":"cf396f55","q":"편차(variação magnética)와 자차(desvio da bússola)의 차이는 무엇입니까?","o":["편차는 진북과 자북 사이의 각도이고, 자차는 선박 자체의 자기에 의해 생기는 오차입니다.","편차는 엔진 때문에 생기고, 자차는 조석 때문에만 생깁니다.","같은 속도를 가리키는 다른 이름입니다.","편차는 수심을, 자차는 바람을 측정합니다."],"c":"편차는 장소와 시기에 따라 다르며 해도에 표시됩니다. 자차는 설치 상태와 침로에 따라 달라지므로 비교나 자차표로 파악해야 합니다."},{"id":"9a0d8697","q":"GNSS 수신기가 화면에 정확한 위치를 보여 줍니다. 그래도 계속 지켜야 할 행동은 무엇입니까?","o":["육안 관측을 생략합니다.","해도 최신화 여부를 고려하지 않고 항해합니다.","경계를 유지하고 해도, 수심, 기타 가능한 수단으로 위치를 확인합니다.","시정이 나쁠 때 속력을 높입니다."],"c":"GNSS는 설정 오류, 신호 상실, 전원 고장이 생길 수 있습니다. 항해에 도움이 되지만 경계, 계획, 주변 상황 판단을 대신하지는 못합니다."},{"id":"a5c961a1","q":"음향측심기(측심기)는 일반적으로 어떤 정보를 제공합니까?","o":["선박 위 구름의 높이.","보정하지 않은 진침로.","설정된 보정값에 따른, 송수파기에서 해저까지의 수직 거리.","모든 수심에서의 조류 속도."],"c":"표시값은 오프셋 설정에 따라 송수파기, 수선 또는 용골(킬)을 기준으로 할 수 있습니다. 조종자는 이 설정을 알고 안전 여유를 유지해야 합니다."},{"id":"4aa649e1","q":"엔진 회전계(타코미터)의 용도는 무엇입니까?","o":["풍속을 표시합니다.","엔진 회전수를 보통 분당 회전수(RPM)로 표시합니다.","수심을 측정합니다.","자북을 가리킵니다."],"c":"회전수는 권장 범위 내에서 운전하는 데 도움이 되며, 평소의 속력과 조건과 비교하면 비정상적인 부하나 고장을 알아낼 수 있습니다."},{"id":"443c31ba","q":"거리계(오도미터) 또는 선박용 측정의(log)와 관련된 양은 무엇입니까?","o":["기압과 날씨 경향.","천문조의 높이.","항주 거리와, 장비에 따라서는 물에 대한 선박의 속력.","엔진 내부 온도."],"c":"이 장비는 누적 거리와 속력을 표시할 수 있습니다. 조류와 풍압차 때문에 대수속력과 GNSS의 대지속력에 차이가 생깁니다."},{"id":"549f034f","q":"풍속계는 무엇을 측정하는 데 사용합니까?","o":["선체 아래 수심.","풍속.","추진축의 회전수.","해도의 편차."],"c":"바람의 방향과 세기는 조종, 파도, 기상 변화를 판단하는 데 도움이 됩니다. 선상에서 읽는 값은 선박의 움직임이 반영된 시풍(겉보기 바람)일 수 있습니다."},{"id":"cdb697b9","q":"기압계가 나타내는 기압이 계속해서 크게 떨어지면 무엇을 의미할 수 있습니까?","o":["며칠 동안 맑은 하늘이 보장됩니다.","조석이 자동으로 낮아집니다.","저기압 계통이 다가오고 있어 날씨가 나빠질 수 있습니다.","나침반이 반드시 고장 납니다."],"c":"기압 경향은 구름, 바람, 공식 예보, 현지 상황과 함께 분석해야 합니다. 한 번의 측정값만으로는 종합적인 정보를 대신할 수 없습니다."},{"id":"b5004097","q":"뇌우, 돌풍, 강한 비, 낙뢰와 자주 관련되는 구름은 무엇입니까?","o":["얇고 고립된 권운(Cirrus).","적란운(Cumulonimbus).","수직 발달이 없는 낮은 층운(Stratus).","반드시 바람이 없는 렌즈구름."],"c":"적란운은 수직으로 크게 발달하며 급격한 변화를 일으킬 수 있습니다. 일찍 피난처를 찾으십시오. 폭풍이 선박에 닥칠 때까지 기다리지 마십시오."},{"id":"88a2d7a3","q":"안개가 끼어 시정이 빠르게 나빠지고 있습니다. 조종자는 어떻게 해야 합니까?","o":["빨리 벗어나기 위해 속력을 높입니다.","안전한 속력으로 운항하고, 경계를 강화하며, 적절한 신호와 장비를 사용하고, 필요하면 안전한 곳으로 갑니다.","등화와 VHF를 끕니다.","다른 선박의 항적만 따라갑니다."],"c":"제한된 시계에서는 눈으로 보이기 전에 이미 위험이 존재할 수 있습니다. RIPEAM(국제해상충돌예방규칙, COLREG)은 무중 신호, 기관 즉시 사용 준비, 각별한 주의를 요구합니다."},{"id":"8262a21a","q":"보퍼트 풍력 계급의 용도는 무엇입니까?","o":["자침로를 진침로로 변환합니다.","구명조끼를 분류합니다.","바람의 세기와 바다 및 육지에서 관찰되는 영향을 바탕으로 풍력을 추정합니다.","달의 월령을 계산합니다."],"c":"보퍼트 계급은 숫자를 풍속 범위와 수면 상태에 연결합니다. 관측에 유용하지만 기상 통보와 계기를 대신하지는 못합니다."},{"id":"73fb87d8","q":"고조(preamar)와 저조(baixamar)는 무엇을 뜻합니까?","o":["고조는 한 번의 조석에서 최고 수위이고, 저조는 그 앞이나 뒤의 최저 수위입니다.","고조는 강풍이고, 저조는 무풍입니다.","고조는 남쪽으로 흐르는 조류이고, 저조는 북쪽으로 흐르는 조류입니다.","두 가지 수온 척도입니다."],"c":"예측된 시각과 조고는 기준 지점별로 조석표(Tabelas das Marés)에 나와 있습니다. 기상 조건에 따라 실제 수위는 달라질 수 있습니다."},{"id":"445f80ea","q":"일반적으로 수위가 오를 때와 내려갈 때 함께 나타나는 조류를 각각 무엇이라고 부릅니까?","o":["표류와 풍압차.","바람이 불어오는 쪽과 바람이 불어가는 쪽.","각각 창조류와 낙조류.","고조와 소조."],"c":"창조류와 낙조류는 조석 주기에 따른 수평 흐름을 나타냅니다. 조류가 멈추는 순간(게류)이 반드시 고조나 저조와 일치하는 것은 아닙니다."},{"id":"05faeb8d","q":"한 주기에서 조차(조석의 진폭)란 무엇입니까?","o":["두 측방표지 부표 사이의 거리.","항로에서 허용되는 최대 속력.","진북과 자북 사이의 각도.","고조와 그에 이어지는 저조 사이의 높이 차."],"c":"조차는 달의 위상, 지형 등 여러 요인에 따라 달라집니다. 기본 수준면을 기준으로 한 조고와 혼동해서는 안 됩니다."},{"id":"fcb63bf7","q":"조차가 큰 대조(사리)는 일반적으로 달의 어느 위상에서 일어납니까?","o":["삭(신월)과 망(보름달).","상현과 하현.","위상과 관계없이 원지점에서만.","어느 위상에서나 항상 같은 조차로."],"c":"삭망 때에는 태양, 지구, 달이 대략 일직선이 되어 조석을 일으키는 힘이 서로 강화됩니다. 현지의 반응은 시간 차를 두고 나타날 수 있습니다."},{"id":"7f1ec04c","q":"조차가 작은 소조(조금)는 일반적으로 어느 위상에서 일어납니까?","o":["삭(신월)과 망(보름달).","상현과 하현.","일식이나 월식 때에만.","여름에만."],"c":"소조 때에는 태양과 달의 작용 방향이 대략 직각을 이루어 조차가 작아지는 경향이 있습니다."},{"id":"de13f8df","q":"반일주조인 많은 곳에서 다음 날의 고조는 약 50분 늦게 일어납니다. 이 정보는 어떻게 활용해야 합니까?","o":["세계 어느 항구에나 적용되는 정확한 규칙으로 씁니다.","수심 확인을 생략하는 근거로 씁니다.","바람을 자동으로 계산하는 데 씁니다.","일반적인 개념으로만 활용하고, 항해할 때는 해당 장소와 날짜의 공식 조석표를 확인합니다."],"c":"달의 주기가 평균적인 지연을 설명하지만, 실제 조석은 반일주조, 일주조, 혼합조일 수 있으며 지형과 기상의 영향을 받습니다."},{"id":"fcc2fba7","q":"해도에 수심 1,8 m가 표시되어 있고 그 시각의 조고는 0,7 m입니다. 다른 보정을 무시하면 추정 수심은 얼마입니까?","o":["1,1 m.","1,8 m.","2,5 m.","0,7 m."],"c":"두 값이 같은 기준면을 쓸 때 해도 수심에 조고를 더합니다: 1,8 + 0,7 = 2,5 m. 여기서 흘수와 안전 여유를 추가로 빼야 합니다."},{"id":"8685b246","q":"일부만 채워진 탱크는 어떤 효과로 복원성을 떨어뜨릴 수 있습니까?","o":["편차 효과.","자유표면 효과: 액체가 움직이면서 무게중심을 가상적으로 높입니다.","선미등 효과.","정지한 키(타)의 공동 현상 효과."],"c":"액체의 횡방향 이동은 복원 능력을 줄입니다. 가능한 한 일부만 찬 탱크를 많이 두지 말고 액체 화물을 통제하십시오."},{"id":"abd509b7","q":"소형 선박의 복원성을 좋게 하는 화물 배치는 무엇입니까?","o":["무게를 높게, 한쪽 현에 몰아 둡니다.","승객 모두가 선수에 서 있습니다.","정원과 제조사 한계를 지키면서 무게를 낮게, 중앙에 두고 단단히 고박합니다.","무거운 물건을 갑판에 고정하지 않고 둡니다."],"c":"무게중심이 높아지거나 옆으로 치우치면 경사와 전복 위험이 커집니다. 화물과 사람은 고루 배치하고 고정해야 합니다."},{"id":"d58c9279","q":"해상 VHF 무선전화의 국제 호출 및 조난 채널은 무엇입니까?","o":["채널 06, 주파수 121,5 MHz.","일상 음성 통화용 채널 70.","채널 16, 주파수 156,8 MHz.","어느 나라, 어떤 상황에서나 채널 09."],"c":"채널 16은 조난, 긴급, 안전 통신과 최초 호출에 사용됩니다. 일상 통신은 연결된 후 적절한 실무 채널로 옮겨야 합니다."},{"id":"1bd3ca68","q":"VHF로 송신하기 전에 운용자는 무엇을 해야 합니까?","o":["말하지 않고 PTT 버튼을 몇 분간 누릅니다.","MAYDAY 통신 중에 일상 호출을 합니다.","임의로 만든 암호를 사용합니다.","채널을 청취하여 우선 통신이 없는지 확인하고, 짧고 명확한 메시지를 준비합니다."],"c":"먼저 청취하면 진행 중인 통신을 방해하지 않습니다. 천천히 말하고, 국(스테이션)을 밝히며, 가능한 한 빨리 채널을 비워 주십시오."},{"id":"7446d94c","q":"채널 16에서 일상 호출로 연결된 뒤의 정상적인 절차는 무엇입니까?","o":["모든 잡담을 채널 16에서 계속합니다.","적절한 실무 채널을 정해 옮기고 채널 16을 비워 줍니다.","채널 70으로 옮겨 음성으로 대화합니다.","상대 국이 응답하기 전에 무전기를 끕니다."],"c":"호출 및 조난 채널은 우선 통신을 위해 항상 비어 있어야 합니다. 실무 채널은 해당 목적과 구역에서 허용된 채널이어야 합니다."},{"id":"98a2fd88","q":"절차어 MAYDAY는 언제 사용합니까?","o":["선박이나 사람에게 중대하고 임박한 위험이 있어 즉각적인 지원이 필요할 때.","일상적인 기상 정보를 요청할 때.","위험이 없는 약간의 지연을 알릴 때.","출항 전에 마이크를 시험할 때."],"c":"MAYDAY는 최우선 순위를 가집니다. 허위 호출은 수색 자원을 낭비하고 다른 생명을 위험에 빠뜨릴 수 있습니다."},{"id":"1f02c525","q":"절차어 PAN PAN은 언제 사용하는 것이 적절합니까?","o":["중대하고 임박한 위험에는 해당하지 않지만 사람이나 선박의 안전에 관한 긴급 메시지를 보낼 때.","즉각 퇴선한 이후에만.","모두를 대상으로 한 바람 예보를 알릴 때.","개인 대화용 채널을 확보할 때."],"c":"PAN PAN은 일반 메시지보다 우선하지만 MAYDAY보다는 낮습니다. 상황이 중대하고 임박한 위험으로 악화되면 등급을 높여야 합니다."},{"id":"249ecca9","q":"항행 안전이나 기상에 관한 중요한 메시지를 시작하는 절차어는 무엇입니까?","o":["어떤 상황에서나 MAYDAY RELAY.","SECURITE.","반드시 PAN PAN MÉDICO.","최초 호출로서 OVER AND OUT."],"c":"SECURITE는 안전 통보를 알립니다. 일반적으로 호출은 호출 채널에서 하고, 세부 내용은 해당 절차에 따라 지정된 채널에서 이어집니다."},{"id":"d39bae1e","q":"조난 메시지에는 가능한 한 어떤 정보가 들어가야 합니까?","o":["조종자의 이름만.","엔진 상표만.","선박의 가격과 구입 날짜.","식별 정보, 위치, 위험의 성격, 필요한 지원, 승선 인원, 기타 유용한 정보."],"c":"명확하고 반복되며 올바른 기준으로 표시된 위치가 결정적입니다. 시간이 부족하면 식별 정보, 위치, 위험의 성격을 먼저 송신하십시오."},{"id":"4c32d8ef","q":"자신에게 보내지 않은 MAYDAY를 들었을 때 운용자는 어떻게 해야 합니까?","o":["같은 채널에서 일상 대화를 시작합니다.","수신한 위치를 지웁니다.","침묵을 지키고 정보를 기록하며 대기합니다. 당국이나 상황이 요구하고 도울 수 있다면 응답하거나 중계합니다.","도달 거리를 확인하려고 음악을 송신합니다."],"c":"조난 통신은 절대적인 우선권을 가집니다. 해안국이나 다른 선박이 통신을 조정하고 무선 침묵을 명령할 수 있습니다."},{"id":"7c78dc8d","q":"해상 VHF 채널 70은 무엇을 위해 지정되어 있습니까?","o":["승객 간의 음성 대화.","음악의 연속 송신.","디지털 선택 호출(DSC)용이며, 일상 음성 통신용이 아닙니다.","선외기의 원격 조종."],"c":"DSC 장비는 올바르게 연동·설정되어 있으면 식별 정보와 위치를 포함한 디지털 경보를 보낼 수 있습니다."},{"id":"bab5397f","q":"휴대용 VHF 무전기의 실제 통신 거리에 주로 영향을 주는 것은 무엇입니까?","o":["가시선, 안테나의 높이와 품질, 출력, 장애물, 배터리 상태.","유일한 요인인 달의 위상.","선체의 색.","선내 식수의 양."],"c":"VHF는 주로 가시선으로 전파됩니다. 안테나가 높고 가리는 것이 없으면 대개 도달 거리가 늘어나며, 휴대용 무전기는 충전되어 있고 물로부터 보호되어야 합니다."},{"id":"b68f8014","q":"Arrais-Amador(소형선박 조종면허)의 기본적인 범위는 무엇입니까?","o":["외해에서 제한 없이 모든 선박을 조종합니다.","수상오토바이를 제외하고, 내수 항해 범위 안에서 스포츠·레저용 선박을 조종합니다.","공해에서 수상오토바이만 조종합니다.","상선의 선장 업무를 직업으로 수행합니다."],"c":"이 면허는 아마추어 면허이며 직업 활동을 허용하지 않습니다. 수상오토바이는 현행 규정에 따라 Motonauta(수상오토바이 면허) 등급이 필요합니다."},{"id":"e216e684","q":"Motonauta(수상오토바이 면허) 등급으로 할 수 있는 것은 무엇입니까?","o":["원양 항해에서 상선을 조종합니다.","모든 직업용 여객선을 조종합니다.","스포츠·레저 활동으로, 내수 항해 범위 안에서 수상오토바이를 조종합니다.","수상오토바이의 등록과 장비를 면제받습니다."],"c":"Motonauta는 수상오토바이 전용 면허이며, 조종자를 직업 선원으로 만들어 주지 않습니다."},{"id":"a819c9a8","q":"조종 중 아마추어 조종면허증(Carteira de Habilitação de Amador)은 어떤 상태여야 합니까?","o":["반드시 집에 보관합니다.","유효하고, Autoridade Marítima(해사 당국)가 인정하는 형식으로 단속 시 제시할 수 있게 지녀야 합니다.","연료 영수증으로만 대신합니다.","승객이 있으면 면제됩니다."],"c":"조종자는 선박과 항해 구역에 맞는 면허를 가지고 있어야 합니다. 유효기간이 지난 면허나 맞지 않는 등급은 요건을 충족하지 않습니다."},{"id":"70e3e5b3","q":"LESTA에 따르면, 사고와 항행 위험에 관련된 선장의 의무는 무엇입니까?","o":["단속을 피하려고 모든 손상을 숨깁니다.","임의로 부표를 옮깁니다.","긴급한 위험을 연말까지 기다렸다가 보고합니다.","사고, 사건, 항로표지의 결함, 발견한 장애물을 Autoridade Marítima(해사 당국)에 통보합니다."],"c":"적시에 보고하면 조치, 조사, 다른 항해자에 대한 경고가 가능해집니다. 선장은 또한 안전 규정을 지키고 지키게 해야 합니다."},{"id":"14010766","q":"다음 중 LESTA에 규정된 행정적 안전 조치는 무엇입니까?","o":["경우에 따라 면허증 압수 또는 선박의 출항 금지.","단속 공무원이 절차 없이 바로 구금.","모든 개인 재산의 소유권 상실.","마리나의 의무적인 월 회비 징수."],"c":"행정 조치는 위험이나 위법 상황에서 사람, 선박, 교통, 환경을 보호하기 위한 것입니다. 절차 종료 후의 처벌과 반드시 같은 것은 아닙니다."},{"id":"e1738d11","q":"LESTA 위반으로 부과될 수 있는 행정 처벌은 무엇입니까?","o":["해당 사항에 따라 벌금, 면허 정지, 면허 취소, 공작물 또는 시설물의 철거.","구두 경고만.","새 등록 비용 징수만.","Capitania dos Portos(항만청)가 부과하는 구금만."],"c":"처벌은 위반 내용과 행정 절차에 따라 정해지며, 해당되는 경우 다른 민사·형사 책임도 별도로 질 수 있습니다."},{"id":"3569c018","q":"맞는 면허 없이 선박을 조종하는 것은 무엇에 해당합니까?","o":["항해가 1시간 미만이면 허용되는 행위.","RLESTA에 규정된 위반으로, 해당 조치와 처벌의 대상.","구명조끼가 선내에 있으면 언제나 적법한 상황.","마리나의 계약상 결함일 뿐."],"c":"면허, 등급, 구역이 조종 행위와 맞아야 합니다. 선박을 빌려준다고 해서 이 책임이 넘어가지 않습니다."},{"id":"aaae6a8b","q":"의무 안전 장비가 부족하거나 작동하지 않거나 유효기간이 지난 상태로 항해하면 어떻게 될 수 있습니까?","o":["어느 목적지로든 자동으로 항해가 허가됩니다.","위험도와 해당 사항에 따라 위반으로 처리되고 출항 금지 또는 기타 조치를 받습니다.","장비를 휴대전화로 대체합니다.","레저 선박이므로 면제됩니다."],"c":"의무 장비 목록은 선박의 분류, 항해 구역, 특성에 따라 달라집니다. 출항 전에 유효기간과 작동 상태를 점검하면 위험과 단속을 피할 수 있습니다."},{"id":"d77533a5","q":"허가된 정원을 초과해 사람을 태우는 것이 위험한 이유는 무엇입니까?","o":["무게가 늘어나 항상 복원성이 좋아지기 때문입니다.","아무도 앉지 않으면 허용되기 때문입니다.","선박의 한계를 넘어 건현, 복원성, 대응 능력이 줄어들 수 있기 때문입니다.","연료 소비만 바뀌고 안전에는 영향이 없기 때문입니다."],"c":"정원은 설계와 안전 조건을 고려해 정해집니다. 초과하면 침수가 악화되고, 하중 배분이 나빠지며, 퇴선이 어려워질 수 있습니다."},{"id":"b8468bc3","q":"RLESTA는 음주 상태 또는 마약성·유독성 물질 사용 후 선박을 조종하는 것에 대해 어떤 결과를 규정합니까?","o":["최대 120일의 면허 정지, 재범 시 면허 취소이며, 다른 책임도 별도로 집니다.","기록 없이 구두 권고만 합니다.","면허가 자동으로 직업 면허로 바뀝니다.","내수 항해에서는 아무 결과도 없습니다."],"c":"술과 약물은 판단력, 균형 감각, 반응 시간, 경계 능력을 떨어뜨립니다. 이 금지는 물을 이용하는 모든 사람을 보호합니다."},{"id":"0f3bec1d","q":"더 엄격한 현지 규정이 없다면, 수상오토바이는 기준선(linha de base)으로부터 어느 거리부터 고속 항해를 시작할 수 있습니까?","o":["20미터부터.","50미터부터.","2해리를 지난 후에만.","기준선으로부터 200미터부터."],"c":"해변, 강가, 시설 가까이의 구역에는 수영객과 접안·출입 조종이 몰립니다. 현지 규정, 금지 구역, 항로표지를 지켜야 합니다."},{"id":"0f241b11","q":"강가나 해변과 수상오토바이 항해 허용 구역 사이를 지날 때는 어떻게 해야 합니까?","o":["기준선에 최대한 수직인 경로로, 3노트 미만의 속력으로 지납니다.","지그재그로 최대한 빠르게 지납니다.","해변과 나란히, 수영객과 50미터 이내로 지납니다.","파도를 만들기 위해 반복해서 가속합니다."],"c":"느리고 곧게 통과하면 민감한 구역에 머무는 시간이 줄고 움직임을 예측하기 쉬워집니다. 수영객과 다른 선박을 계속 살피십시오."},{"id":"a3198e39","q":"수상오토바이 항해가 허용되는 시간대는 언제입니까?","o":["안전 조건을 지키는 범위에서 해 뜰 때부터 해 질 때까지의 주간.","전조등만 켜면 언제든지.","자정부터 새벽 사이에만.","야간에 휴대용 손전등만 있으면."],"c":"수상오토바이는 야간에 운항하면 안 됩니다. 주간이라도 시정, 기상, 현지 제한 때문에 출항이 위험할 수 있습니다."},{"id":"355824f4","q":"현재 수상오토바이 조종자와 동승자에게 허용되는 구명조끼 등급은 무엇입니까?","o":["해당 용도로 승인된 III등급 또는 V등급.","원양용 I등급만.","승인되지 않은 아무 부력 보조구.","등급을 확인하지 않은 일반용 자동 팽창식 조끼."],"c":"조종자와 동승자는 운항 중 적합한 구명조끼를 입어야 합니다. 착용 상태, 승인 여부, 관리 상태를 확인해야 합니다."},{"id":"1e7046ea","q":"엔진 차단 장치(안전 키)는 조종 중 어디에 연결되어 있어야 합니까?","o":["수납함 안에 풀어 둡니다.","장치 방식과 제조사 설명서에 따라 조종자에게 연결하여, 떨어지면 엔진이 꺼지게 합니다.","동승자에게만 연결합니다.","조종자와 연결하지 않고 핸들에 묶어 둡니다."],"c":"안전 코드는 조종자가 떨어졌을 때 실제로 분리되어 엔진을 차단해야 합니다. 출항 전에 설명서에 따라 장치를 시험하십시오."},{"id":"a7da3cb1","q":"움직이는 수상오토바이에서 금지된 동승자 위치는 어디입니까?","o":["조종자의 앞.","조종자 뒤의 전용 좌석.","제조사가 정한 위치.","정원 이내에서 조종자의 뒤."],"c":"조종자는 핸들, 스로틀, 시야를 통제할 수 있어야 합니다. 동승자는 허가된 좌석, 즉 조종자 뒤에 앉아 발을 발판에 두어야 합니다."},{"id":"0f177580","q":"6세 어린이를 수상오토바이에 태울 수 있습니까?","o":["예, 조종자 앞에 앉으면 됩니다.","예, 바다가 잔잔하면 구명조끼 없이도 됩니다.","예, 수상오토바이의 크기와 관계없이 됩니다.","아니요. 7세 미만 어린이의 탑승은 금지되어 있습니다."],"c":"연령 제한은 조종자의 경험과 관계없이 적용됩니다. 정원, 구명조끼, 위치에 관한 규정은 다른 탑승자에게도 계속 적용됩니다."},{"id":"42a085a2","q":"9세 어린이는 동승자의 일반 최소 연령을 넘었습니다. 그래도 반드시 지켜야 할 것은 무엇입니까?","o":["면허 없이 수상오토바이를 조종하게 합니다.","지켜보기 쉽도록 조종자 앞에 앉힙니다.","조종자 뒤 자리에 안전하게 앉을 수 있고, 몸에 맞는 구명조끼를 입으며, 정원과 현지 규정을 지킬 때에만 태웁니다.","이미 7세가 넘었으므로 구명조끼를 생략합니다."],"c":"최소 연령을 넘었다고 해서 탑승이 자동으로 안전해지는 것은 아닙니다. 조종자는 체격, 발판 사용 가능 여부, 구명조끼 착용 상태, 수면 상태를 평가하고, 현지 규정과 보호자의 허락도 확인해야 합니다."},{"id":"8feb679c","q":"선회 중 스로틀을 완전히 놓으면 많은 수상오토바이의 조종이 어려워질 수 있는 이유는 무엇입니까?","o":["감속할 때마다 핸들이 기계적으로 잠기기 때문입니다.","나침반이 엔진을 끄기 때문입니다.","해묘가 자동으로 투하되기 때문입니다.","추진 제트가 조향력도 만들어 내는데, 출력을 줄이면 그 힘이 약해지기 때문입니다."],"c":"조향 능력은 설계와 추진 방식에 따라 다릅니다. 조종을 미리 하고, 거리를 유지하며, 사용하는 모델의 감속 및 제어 기능을 알아 두십시오."},{"id":"c4103e0b","q":"전복된 수상오토바이는 어떻게 바로 세워야 합니까?","o":["모든 모델에서 항상 시계 방향으로.","선체나 제조사 설명서에 표시된 방향으로.","엔진을 켠 채 키 코드를 잡아당겨서.","양쪽 방향으로 반복해서 돌려서."],"c":"일부 모델은 잘못된 방향으로 돌리면 엔진에 물이 들어갈 수 있습니다. 조종자는 운항 전에 해당 모델의 절차를 알아 두어야 합니다."},{"id":"ed94f601","q":"수상오토바이의 흡입구 그릴에 수초가 걸렸습니다. 제거하기 전에 무엇을 해야 합니까?","o":["설명서에 따라 엔진을 끄고 안전 키를 뽑은 뒤 완전히 멈출 때까지 기다립니다.","엔진을 가속한 채 흡입구에 손을 넣습니다.","동승자에게 돌고 있는 터빈에 손을 뻗게 합니다.","엔진이 켜진 상태에서 배터리 케이블을 바꿔 연결합니다."],"c":"제트 펌프는 심각한 부상을 일으킬 수 있습니다. 엔진이 작동하는 동안 손, 발, 머리카락, 옷을 흡입구나 노즐 가까이 가져가지 마십시오."},{"id":"4a5ea341","q":"떨어진 후 수상오토바이에 다시 오르기에 가장 안전한 지점은 어디입니까?","o":["핸들을 발판 삼아 선수 쪽으로.","엔진을 가속한 채 노즐 쪽으로.","터빈을 돌린 채 아무 곳으로나.","제조사가 지정한 지점, 보통 선미 쪽으로, 엔진을 끈 상태에서."],"c":"지정된 위치로 다시 오르면 재전복과 추진 장치 접촉 위험이 줄어듭니다. 한 번에 한 사람씩 오르고 무게를 다시 배분하십시오."},{"id":"72eaff64","q":"수상오토바이 출항 전 점검에는 무엇이 포함되어야 합니까?","o":["좌석의 외관만.","누출은 무시하고 연료량만.","선체, 배수 마개, 연료, 누출, 배터리, 조종 장치, 안전 키, 구명조끼, 기상, 항해 구역.","잃어버리지 않도록 안전 코드를 빼 두는 것."],"c":"체크리스트와 제조사 설명서를 활용하십시오. 여유를 둔 항속 거리를 계획하고 경로를 알리며, 조종 장치 고장, 누출, 부적합한 기상이 있으면 출항하지 마십시오."},{"id":"fa901622","q":"규정에 따른 현재 Motonauta(수상오토바이 면허) 교육의 최소 시간은 얼마입니까?","o":["실기 10분만.","강의실 교육만 8시간.","이론 교육 60분과 실기 교육 60분.","시험 전 교육 없음."],"c":"수료증은 NORMAM-212/DPC에 따라 자격을 갖춘 기관이나 전문가의 교육을 거쳐 발급되어야 합니다. 최소 시간을 채웠다고 책임 있는 연습이 면제되지는 않습니다."},{"id":"e299b354","q":"공식 과정에 따르면 Motonauta 필기시험은 어떻게 구성됩니까?","o":["8시간 동안 서술형 100문제.","최저 점수 없는 구술 10문제.","객관식 20문제, 최대 1시간 30분, 10점 만점에 최저 5점.","30분 동안 40문제, 최저 9점."],"c":"이 과정은 NORMAM-212/DPC의 부속서 3-C에 나와 있습니다. Autoridade Marítima(해사 당국)가 절차를 개정할 수 있으므로, 응시자는 시험을 볼 Capitania dos Portos(항만청)의 안내를 확인해야 합니다."},{"id":"bb0a4f71","q":"“roda a roda(마주치는 상태)”, 즉 __________________ 상황에서 선박들은 다음과 같이 조선해야 합니다.","o":["선수 대 선수로, 두 선박 모두 각자 자기의 우현 쪽으로 변침한다","선수 대 선수로, 두 선박이 서로 반대 현 쪽으로 변침한다","횡단 상태로, 두 선박 모두 우현 쪽으로 변침한다","횡단 상태로, 두 선박이 서로 반대 현 쪽으로 변침한다","추월 상태로, 추월하는 선박이 조선해야 한다"],"c":"마주치는 상태(Roda a Roda): 선수 대 선수로 마주칠 때 두 선박 모두 우현(오른쪽)으로 변침합니다."},{"id":"f7943ef3","q":"예인줄의 길이가 200미터 미만인 선박은 무엇을 표시해야 합니까?","o":["마스트에 붉은색 등 2개","마스트에 흰색 등 1개","마스트에 흰색 등 3개","마스트에 흰색 등 2개","마스트에 흰색 등 4개"],"c":"예인줄 200m 미만: 마스트에 수직선상으로 흰색 등 2개를 표시합니다."},{"id":"b2d556a3","q":"낮에 마스트에 검은색 구형 형상물을 단 선박을 보았다면, 그 선박은 어떤 상태입니까?","o":["조종불능 상태","기관을 사용하여 정지(표류 대기) 중","투묘 중(닻을 내린 상태)","트롤 어로 작업 중","준설 작업 중"],"c":"마스트의 검은색 구형 형상물(구) 1개는 투묘 중인 선박을 나타냅니다."},{"id":"19f21993","q":"밤에 녹색 섬광등이 보였고, 해도로 확인해 보니 항구 입구에 접근하고 있었습니다. 이 표지의 형태는 무엇일 가능성이 높습니까?","o":["피라미드형.","정육면체형.","구형.","원통형.","원뿔형."],"c":"브라질은 IALA B지역에 해당합니다. 항구로 들어갈 때 녹색 표지는 좌현 쪽에 있으며 원통형이고, 붉은색 표지는 우현 쪽에 있으며 원뿔형입니다. 정정: 원래 자료에는 “원뿔형”으로 되어 있었습니다."},{"id":"4a136f7e","q":"하천 항로표지에서 좌안(왼쪽 기슭)이란 어느 쪽 기슭을 말합니까?","o":["물 흐름의 오른쪽에 있는 기슭","선박의 우현 쪽에 있는 기슭","선박의 좌현 쪽에 있는 기슭","강을 거슬러 올라가는 사람의 왼쪽에 있는 기슭","강을 따라 내려가는 사람의 왼쪽에 있는 기슭"],"c":"좌안은 강을 따라 (하구 방향으로) 내려가는 사람의 왼쪽 기슭입니다."},{"id":"74037c7d","q":"안전수역표지는 무엇을 의미합니까?","o":["흐름이 없는 수역","단속(순찰) 중인 수역","항행 가능한 수역","경계 수역","얕은 수역"],"c":"안전수역표지는 표지 주변 전체가 항행 가능한 수역임을 나타냅니다."},{"id":"4b5011b2","q":"주요 계류줄은 무엇입니까?","o":["던짐줄(retinida), 스프링 라인, 횡계류줄(través)","선수·선미줄(lançante), 스프링 라인, 던짐줄(retinida)","선수·선미줄(lançante), 스프링 라인, 횡계류줄(través)","선수 및 선미 스프링 라인과 던짐줄(retinida)","선수 및 선미 선수·선미줄(lançante)과 횡계류줄(través)"],"c":"선수·선미줄(Lançante, 길이 방향), 스프링 라인(Espringue, 길이 방향/전후 이동 방지), 횡계류줄(Través, 가로 방향)입니다."},{"id":"283355c2","q":"프로펠러가 1개이고 반시계 방향으로 회전하며, 키를 중앙에 두고 전진하는 선박은 어느 쪽으로 회두하는 경향이 있습니까?","o":["좌현 쪽으로 매우 빠르게","우현 쪽으로 천천히","우현 쪽으로 빠르게","좌현 쪽으로 천천히","우현 쪽으로 매우 천천히"],"c":"좌선회(반시계 방향) 프로펠러로 전진하면 선미가 우현 쪽으로, 선수가 좌현 쪽으로 가는 경향이 있습니다."},{"id":"f356018b","q":"두 선박이 좁은 수로에서 반대 침로로 서로 접근하며 항행할 때, 충돌 위험이 있다면 두 선박의 올바른 조선은 무엇입니까?","o":["수로를 거슬러 올라가는 선박은 좌현 쪽으로, 다른 선박은 우현 쪽으로 조선해야 한다","수로를 거슬러 올라가는 선박은 우현 쪽으로, 다른 선박은 좌현 쪽으로 조선해야 한다","수로를 따라 내려가는 선박은 우현 쪽으로 조선하고 다른 선박은 침로를 유지해야 한다","두 선박 모두 각자 우현 쪽 기슭으로 더 붙어야 한다","두 선박 모두 우현 대 우현으로 지나가야 한다"],"c":"좁은 수로에서의 황금률은 가능한 한 우현 쪽 기슭에 가깝게 붙어 항행하는 것입니다."},{"id":"66591a9c","q":"투묘지에서 닻을 올리고 출항하려면 어떻게 해야 합니까?","o":["닻줄이 선박의 후방 쪽을 “가리키고” 있으면, 기관 미속 전진으로 닻을 감아올린다","닻줄이 전방 쪽으로 팽팽하게 당겨져 있으면, 기관 미속 전진으로 닻을 감아올린다","닻줄이 선박과 수직을 이루고 있으면, 기관 미속 전진으로 닻을 감아올린다","기관 미속 후진으로 닻을 감아올린다","선수에 대한 닻줄의 위치를 관찰하면서 닻을 감아올린다"],"c":"닻을 올릴 때는 양묘기에 무리가 가지 않도록 닻줄의 위치를 계속 주의 깊게 살펴야 합니다."},{"id":"fe80bf2f","q":"이산화탄소(CO2) 소화약제의 주된 작용과 부수적 작용은 각각 무엇입니까?","o":["질식과 격리","질식과 냉각","냉각과 질식","격리와 냉각","냉각과 격리"],"c":"CO2는 주로 질식(산소 차단) 작용으로, 부수적으로 냉각 작용으로 불을 끕니다."},{"id":"a21434df","q":"습하고 환기가 되지 않는 장소에서 과도한 열로 인해 사람에게 나타나는 결과는 무엇입니까?","o":["일사병","저체온증","수분 공급","동상","열사병(Intermação)"],"c":"Intermação(열사병)는 밀폐되거나 습한 장소의 과도한 열로 발생합니다(직사광선에 의한 일사병과는 다릅니다)."},{"id":"caff95af","q":"다음 증상 중 심정지에 동반되지 않는 것은 무엇입니까?","o":["동공 확대","얼굴이 붉어짐","체온의 급격한 저하","의식 상실","창백함"],"c":"심정지 시 얼굴은 창백하거나 푸르스름해지며(청색증), 결코 붉어지지 않습니다."},{"id":"b96cafd0","q":"지혈(출혈 중단) 방법 중 환자에게 가장 해가 적은 방법은 무엇입니까?","o":["지혈대","결찰(조이기)","교액(졸라매기)","절단","압박"],"c":"직접 압박은 극단적인 조치에 앞서 시행하는 가장 간단하고 덜 침습적인 방법입니다."},{"id":"c3f13bbe","q":"구명조끼는 어디에 두어야 합니까?","o":["안전한 장소에 잠가 둔다","비상시 사용할 수 있도록 주갑판에 풀어 둔다","날씨로부터 보호하기 위해 선박에 묶어 꽉 닫힌 곳에 둔다","필요할 때 쉽게 꺼낼 수 있는 곳에 두고, 절대 선박에 묶어 두지 않는다","선박의 창고나 거주 구역에 둔다"],"c":"구명조끼는 쉽게 꺼낼 수 있어야 하며, 절대 묶거나 잠가 두어서는 안 됩니다."},{"id":"3933da59","q":"위반자는 위반 통지서(auto de infração)를 받은 후 며칠 이내에 소명(방어)을 제출할 수 있습니까?","o":["5일","20일","10일","15일","12일"],"c":"위반 통지서를 받은 후 사전 소명 기한은 15일입니다."},{"id":"8148a5ee","q":"환경, 승무원, 제3자 또는 수상 교통 안전에 피해를 줄 위험이 있는 결함이 있는 외국 선박에 대해서는 어떤 명령을 내릴 수 있습니까?","o":["검역에 들어갈 것","승무원을 본국으로 송환할 것","해사 당국이 정한 벌금을 낼 것","관할 수역에서 나갈 것","책임 각서에 서명할 것"],"c":"주권과 안전을 이유로 Autoridade Marítima(해사 당국)는 브라질 관할 수역(AJB)에서 나가도록 명령할 수 있습니다."},{"id":"48c8df11","q":"범선(Veleiro) 면허를 받기 위한 최저 연령과 필요 조건은 무엇입니까?","o":["16세이며, 요트 클럽, 정식 마리나 또는 스카우트 단체에 소속되어야 한다.","8세이며, 요트 클럽, 정식 마리나 또는 해양 스카우트 단체에 소속되어야 한다.","12세이며, Capitania dos Portos(항만청)의 시험에 합격해야 한다.","18세이며, NORMAM 211에 따라 면허를 받아야 한다.","10세이며, Capitania dos Portos(항만청)의 시험에 합격해야 한다."],"c":"범선(어린이/청소년): 8세부터 가능하며, 해양 관련 단체에 소속되어 있어야 합니다."},{"id":"35ea555e","q":"선박 길이의 어느 지점에서든 현측에서 측정한, 수면에서 주갑판(보통 갑판)까지의 수직 거리를 무엇이라고 합니까?","o":["불워크(Borda Falsa)","건현(Borda Livre)","수선 아래 선체(Obras Vivas)","방현재(Verdugo)","메이아 보르다(Meia Borda)"],"c":"건현(Borda Livre)은 흘수선에서 갑판까지의 거리입니다."},{"id":"c1ffe62a","q":"선수 부근에서 우현 또는 좌현에 있는 선박 현측의 곡면 부분을 무엇이라고 합니까?","o":["선미 쪽 현측(쿼터)","선폭","세로 보강재(롱거)","선수 쪽 현측(바우)","갑판"],"c":"선수 쪽의 “곡면”은 바우(bochecha), 선미 쪽의 곡면은 쿼터(alheta)입니다."},{"id":"ff8f1b9c","q":"다음 중 옳은 것을 고르십시오.","o":["포말은 부식성이 매우 강하므로 휘발유 화재 진압에 사용할 수 없다","물은 발화 온도를 낮추므로 휘발유 화재 진압에 물을 사용할 수 있다","바닷물은 휘발유를 녹여 빠르게 섞이므로 화재를 진압한다","포말은 매우 차가우므로 냉각 작용으로 휘발유 화재를 진압한다","휘발유의 발화 온도가 물의 온도보다 낮으므로 휘발유 화재 진압에 물을 사용할 수 없다"],"c":"액체 연료 화재(B급)에 물을 뿌리면 불이 꺼지지 않고 오히려 번집니다."},{"id":"2ee95428","q":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면, 구형 형상물, 원뿔 등의 형상물은 언제 표시해야 합니까?","o":["낮이나 밤에","밤에만","낮에만","시정이 나쁠 때만","조선 중일 때"],"c":"형상물(기하학적 모양)은 주간용 표시입니다. 밤에는 등화를 사용합니다."},{"id":"521a9fd7","q":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면, 좁은 수로에서 어떤 선박이 나를 추월하려고 장음 2회, 단음 1회를 울립니다. 내가 동의한다면 내 선박은 어떻게 해야 합니까?","o":["그 선박이 내 좌현 쪽으로 추월할 것이므로, 장음 4회를 울리고 우현 쪽으로 변침한다","장음·단음·장음·단음의 4회 기적을 울리고, 내 우현 쪽으로 안전하게 추월할 수 있도록 조선한다","그 선박이 내 좌현 쪽으로 추월하려는 것이므로, 침로와 속력을 그대로 유지한다","그 선박이 내 우현 쪽으로 추월하려는 것이므로, 침로와 속력을 그대로 유지한다","그 선박이 내 좌현 쪽으로 추월할 것이므로, 장음 1회를 울리고 우현 쪽으로 변침하며 속력을 줄인다"],"c":"장음 2회와 단음 1회: 우현 쪽으로 추월하겠다는 의사입니다. 동의 신호: 장음-단음-장음-단음."},{"id":"2eda24ca","q":"국제해상충돌예방규칙(RIPEAM/COLREG)에 따르면, 충돌 위험이 있는 상황에서 조선할 의무가 없는 선박을 무엇이라고 합니까?","o":["우선권이 없는 선박","조선하는 선박","우선권이 있는 선박","조선할 의무가 있는 선박","추월당하는 선박"],"c":"조선하지 않는 선박은 “우선권이 있는” 선박, 즉 침로와 속력을 유지하는 선박입니다."},{"id":"e412fa95","q":"다음 중 스포츠·레저용 선박의 사고 발생에 가장 적게 기여하는 것은 무엇입니까?","o":["면허가 없는 사람이 조종하는 선박","선박의 모든 장비에 대한 부실한 정비","항행할 지역에 발생한 안개","출항(이안) 전 음주한 조종자","선박의 과속"],"c":"안개는 자연 요인입니다. 나머지(음주, 무면허 등)는 직접적인 인적 과실입니다."},{"id":"65f4d368","q":"중형 선박이 연안 항해를 할 때, NORMAM-211의 규정에 따라 다음 중 생략할 수 있는 품목은 무엇입니까?","o":["구명뗏목.","자기 컴퍼스.","기적(호루라기).","닻(앵커).","불꽃 신호기."],"c":"중형 선박(24m까지)이 연안 항해를 할 때, 지원·구조용 선박이 있으면 구명뗏목은 생략할 수 있습니다."},{"id":"5a478a51","q":"항행 중인 선박에서 골절된 다리를 고정하기 위해 즉석에서 무엇을 활용할 수 있습니까?","o":["핼야드(adriça)와 계선줄(boça).","키판과 계류줄(espia).","단단한 재료 조각과 천 조각.","타륜 손잡이와 닻줄.","선미재(cadaste)와 천 조각."],"c":"응급처치: 단단한 재료로 부목을 만들고 천 조각으로 묶어 고정합니다."},{"id":"ec8f4639","q":"내륙 수로에서 검은색 R 글자가 그려진 주황색 사각형 표지판을 보면 무엇을 의미합니까?","o":["되돌아가라","항행 제한","회항 금지","따라야 할 침로","속력 감소"],"c":"검은색 “R”이 있는 주황색 표지판 = 속력 감소(Redução de Velocidade)."},{"id":"00115d5a","q":"GPS(위성항법장치)는 선박이 어떤 상태일 때 선박의 크기와 관계없이 의무 장비가 아닙니까?","o":["원양을 항해할 때","원양 스포츠 낚시를 할 때","내륙 항해를 할 때","연안 항해를 할 때","투묘 중일 때"],"c":"내륙 항해(강, 호수, 만)에서는 GPS가 의무 비치 품목이 아닙니다."},{"id":"fee6b113","q":"일사병을 올바르게 처치하려면 어떻게 해야 합니까?","o":["목욕이나 시원한 찜질로 몸을 식힌다","커피나 홍차 같은 가벼운 각성제를 준다","확실하지 않으면 인공호흡을 실시한다","환자를 앉히거나 세워 둔다","마른 담요로 몸을 따뜻하게 유지한다"],"c":"일사병 처치는 체온을 서서히 낮추는 데 중점을 둡니다."},{"id":"04d41153","q":"보호된 수역에서 내륙 항해를 할 때, 붉은색 수동 신호홍염 1개는 어떤 선박에만 의무입니까?","o":["대형 선박","공공기관 선박","영세 어선","소형 선박","범선"],"c":"수동 신호홍염은 보호된 수역에서도 대형 선박(요트)에는 의무입니다."},{"id":"b6f15673","q":"익수자에 대한 응급처치에서 처치를 시작하기 위한 환자의 올바른 자세는 무엇입니까?","o":["머리를 옆으로 돌린 채 등을 대고 눕힌다","머리를 옆으로 돌린 채 엎드려 눕힌다","어떤 자세에서도 처치할 수 있다","머리를 아래로 향하게 하여 옆으로 눕힌다","머리를 똑바로 세운 채 세우거나 앉힌다"],"c":"등을 대고 눕히고 머리를 옆으로 돌리면 처음에 물이나 구토물을 배출하는 데 도움이 됩니다."},{"id":"377701fb","q":"연방법 9.537/97(LESTA)과 법령 제2.596/98호(RLESTA)에 따르면, 브라질의 Autoridade Marítima(해사 당국)는 누구입니까?","o":["Marinha do Brasil(브라질 해군)","Capitania dos Portos(항만청)","항만·연안국(DPC)","교통부","국가수자원청"],"c":"브라질에서 해사 당국의 권한은 해군 사령관이 행사합니다."},{"id":"a0d18cb4","q":"이론적으로 비상 상황에서 빠르게 회두하기 위해 키에 적용하는 이상적인 각도는 대략 얼마입니까?","o":["원하는 현 쪽으로 10°","원하는 현 쪽으로 60°","원하는 현 쪽으로 35°","원하는 현 쪽으로 45°","원하는 현 쪽으로 90º"],"c":"키의 효율이 최대가 되는 각도는 일반적으로 30°~35°입니다."},{"id":"fe6b4686","q":"주간에 레저 다이빙 활동을 지원하느라 조종이 제한된 모든 선박은 무엇을 표시해야 합니까?","o":["“Charlie” 기를 달고, 흰색 가로띠가 있는 녹색 기를 달 수 있다","“Oscar” 기를 달고, 녹색 가로띠가 있는 붉은색 기를 달 수 있다","“Mike” 기","“Alfa” 기를 달고, 흰색 가로띠가 있는 붉은색 기를 달 수 있다","“Zulu” 기를 달고, 녹색 가로띠가 있는 붉은색 기를 달아야 한다"],"c":"다이빙: Alfa 기(국제신호서) 또는 흰색 띠가 있는 붉은색 기를 사용합니다."},{"id":"f2e48822","q":"프로펠러가 1개(우선회 피치)이고 키를 좌현 쪽으로 끝까지 돌린 선박이 정지 상태에서 출발하여 프로펠러가 반시계 방향으로 회전할 때, 선수는 어떻게 됩니까?","o":["후방으로 간다","우현 쪽으로 천천히 회두한다","반시계 방향으로 원을 그린다","좌현 쪽으로 빠르게 회두한다","시계 방향으로 원을 그린다"],"c":"우선회 피치 프로펠러로 후진하면(반시계 방향 회전) 선미는 좌현 쪽으로, 선수는 우현 쪽으로 갑니다."},{"id":"e5482aa3","q":"1도 화상의 특징은 무엇이 나타나는 것입니까?","o":["피부가 벗겨짐","물집","검게 변한 구멍","피부 표면이 붉어짐","만져도 감각이 없음"],"c":"1도: 붉어짐(예: 햇볕). 2도: 물집. 3도: 조직 파괴."},{"id":"9b528514","q":"구강 대 구강 인공호흡과 심장 마사지를 함께 실시할 때, 환자의 몸에서 심장 마사지를 해야 하는 올바른 위치는 어디입니까?","o":["등의 한가운데.","복부의 아래쪽 1/3.","흉골의 아래쪽 1/3.","척골의 아래쪽 1/3.","갈비뼈의 한가운데."],"c":"마사지는 흉골(가슴 중앙) 위에서 실시합니다."},{"id":"5255e199","q":"물을 충분히 마시지 않아 생긴 탈수 상태를 알려 주는 증상 중 하나는 무엇입니까?","o":["어지러움","갈증","호흡곤란","경련","침 분비 없음"],"c":"탈수의 가장 기본적이고 분명한 증상은 갈증입니다."},{"id":"9f65ff9a","q":"수로나 강, 특히 좁은 곳에서 대형 선박(20미터 초과)은 소형 선박에 대해 어떤 관계에 있습니까?","o":["자기 우현 쪽을 상대에게 비워 주어야 한다","상대의 상황과 관계없이 침로와 속력을 유지해야 한다","우선권이 있다","조선해야 한다","항상 우현 쪽으로 조선해야 한다"],"c":"좁은 수로에서 소형 선박(20m 미만)은 수로 안에서만 안전하게 항행할 수 있는 대형 선박의 통항을 방해해서는 안 됩니다. 그래서 대형 선박이 우선권을 가집니다."},{"id":"272e1924","q":"장음의 지속 시간은 얼마입니까?","o":["4~6초","1초","2초","1분","3초"],"c":"단음은 약 1초, 장음은 4~6초 동안 지속됩니다."},{"id":"0ffc09c5","q":"추월선으로 간주되는 선박은 다른 선박에 어떻게 접근하는 선박입니까?","o":["상대 선박과 반대 방향에서 더 빠른 속력으로","상대 선박과 같은 방향에서 더 느린 속력으로","상대 선박의 정횡 후방 67.5도를 넘는 방향에서 더 빠른 속력으로","상대 선박과 반대 방향에서 더 느린 속력으로","상대 선박의 정횡 후방 22.5도를 넘는 방향에서 더 빠른 속력으로"],"c":"추월선은 상대 선박의 정횡 후방 22.5°를 넘는 방향에서 더 빠른 속력으로 접근하는 선박입니다. 밤에는 상대 선박의 선미등(선미의 흰색 등)만 보이게 됩니다."},{"id":"8188ef15","q":"밤에 가장 잘 보이는 곳에 수직선상으로 붉은색 전주등 2개를 표시한 선박은 어떤 선박입니까?","o":["수로에 있는 선박","조종불능 선박","주변에 잠수부가 있는 선박","투묘 중인 선박","조종이 제한된 선박"],"c":"수직선상의 붉은색 전주등 2개는 조종불능 선박을 나타냅니다. 낮에는 검은색 구형 형상물 2개가 이에 해당합니다."},{"id":"5688782d","q":"“항행 중(em movimento)”이라는 용어는 어떤 선박에 적용됩니까?","o":["투묘 중인 선박","계류된 선박","투묘, 육지 계류 또는 좌초 상태가 아닌 선박","좌초된 선박","접안된 선박"],"c":"RIPEAM(국제해상충돌예방규칙)에 따르면, 투묘, 육지 계류, 좌초 상태가 아닌 모든 선박은 멈춰 있더라도 항행 중입니다."},{"id":"1f1ef914","q":"장음 2회에 이어 단음 1회는 무엇을 의미합니까?","o":["기관을 정지하고 있다","후진하고 있다","귀선의 좌현 쪽으로 추월하려고 한다","귀선의 우현 쪽으로 추월하려고 한다","어느 쪽으로든 추월하려고 한다"],"c":"좁은 수로에서: 장음 2회와 단음 1회 = 귀선의 우현 쪽으로 추월하겠다; 장음 2회와 단음 2회 = 귀선의 좌현 쪽으로 추월하겠다."},{"id":"fb697d99","q":"무등부표(bóia cega)는 어떤 부표입니까?","o":["단속적인 빛을 낸다","빛을 내지 않는다","매우 빠른 빛을 낸다","노란색 빛을 낸다","흰색 빛을 낸다"],"c":"무등부표는 등화가 없는 부표입니다. 낮에만 색, 형태, 두표로 식별할 수 있습니다."},{"id":"ab1de4c5","q":"낮에는 표지를 무엇으로 식별합니까?","o":["형태와 색만으로","두표, 색, 소리로","두표, 형태, 색으로","두표, 색, 크기로","두표와 색만으로"],"c":"낮에는 두표, 형태, 색의 세 가지 요소로 표지를 식별합니다. 밤에는 등화의 색과 리듬으로 식별합니다."},{"id":"4d740626","q":"좌현 쪽 우선 항로를 나타내는 항로표지의 등화 색은 무엇입니까?","o":["녹색","파란색","흰색","노란색","붉은색"],"c":"좌현 쪽 우선 항로 표지는 녹색 띠가 있는 붉은색 표지입니다. IALA B지역에서 등화는 주된 색을 따르므로 붉은색입니다."},{"id":"0eb51097","q":"일반적으로 투묘할 때 사용하는 닻줄의 양을 정하는 간단한 규칙은 무엇입니까?","o":["최소한 해당 수심의 2배","최소한 해당 수심의 4배","최소한 해당 수심의 3배","최소한 해당 수심의 1.5배","최소한 해당 수심의 6배"],"c":"실용 규칙: 최소한 해당 수심의 3배를 내어 줍니다. 날씨가 나쁘거나 해저 상태가 나쁘면 더 늘립니다."},{"id":"e160e8a0","q":"거친 바다에서 큰 파도를 넘으려면 엔진을 어떻게 가속·감속해야 합니까?","o":["오르막에서 감속하고 내리막 전에 가속한다","파도를 오를 때 가속하고 내려갈 때도 계속 가속한다","오르막에서도 내리막에서도 가속하지 않는다","파도를 오를 때나 내려갈 때나 일정한 속력을 유지한다","오르막에서 가속하고 내리막 전에 감속한다"],"c":"타력을 잃지 않도록 파도를 오를 때 가속하고, 선수가 다음 파도에 처박히지 않도록 내려가기 전에 감속합니다."},{"id":"3ab973cd","q":"누군가 물에 빠졌을 때, 즉 “homem ao mar(익수자, 사람 추락)” 상황에서 프로펠러가 남긴 항적을 따라 정확히 반대 침로로 되돌아가려면 무엇을 사용해야 합니까?","o":["“레이스 트랙(Race Track)” 선회","윌리엄슨 선회(Curva de Williams)","푸틴 조선법","부타코프 선회(Curva de Butakow)","제마네 조선법"],"c":"부타코프 선회는 선박을 반대 침로에 놓아 자신의 항적을 따라 추락 지점으로 되돌아가게 합니다."},{"id":"d7d1c3f0","q":"C급 화재는 어떤 화재입니까?","o":["소화약제가 있는 곳에서 발생하는 화재","가연성 고체 물질에서 발생하는 화재","인화성 액체에서 발생하는 화재","전기 장비에서 발생하는 화재","가연성 금속에서 발생하는 화재"],"c":"A급 = 고체(불씨와 재가 남음); B급 = 인화성 액체; C급 = 통전 중인 전기 장비; D급 = 자연발화성 금속."},{"id":"afd43eb1","q":"섬유질 또는 고체 물질이 연소하여 불씨나 재를 남기는 화재를 무엇이라고 합니까?","o":["“C”급 화재","“E”급 화재","“A”급 화재","“B”급 화재","“D”급 화재"],"c":"불씨와 재를 남기는 고체 물질(나무, 종이, 천)은 A급입니다. 주로 물을 사용한 냉각으로 진압합니다."},{"id":"4f90437d","q":"포말 소화기를 사용하려면 어떻게 해야 합니까?","o":["손잡이를 누르고 분사 방향을 불꽃으로 향한다","작동 밸브를 연다","안전핀을 뽑고 전기 장비 쪽으로 향한다","손잡이를 누르고 인화성 액체 쪽으로 향한다","소화기를 뒤집어 뚜껑이 아래로 가게 한 뒤, 분사를 불꽃의 아랫부분으로 향한다"],"c":"화학 포말 소화기는 뚜껑이 아래로 가도록 뒤집어 약제를 섞는 방식으로 작동합니다. 분사를 불꽃의 아랫부분으로 향합니다."},{"id":"6f7331b7","q":"상처의 주요 합병증은 무엇입니까?","o":["출혈과 발열","물집과 출혈","감염과 화상","출혈과 감염","물집과 화상"],"c":"상처의 두 가지 가장 큰 위험은 출혈(혈액 손실)과 감염입니다. 그러므로 출혈을 멈추고 상처를 보호해야 합니다."},{"id":"1eedc7a5","q":"내 선박에서 누군가 물에 빠지면 어떻게 해야 합니까?","o":["소방서에 전화한다","구명부환을 던지고, 그 사람을 계속 눈으로 확인하면서 조종하는 사람에게 알리게 한다","단음 3회를 울린다","Alfa 기를 게양한다","장음 2회를 울린다"],"c":"먼저 구명부환을 던지고, 그다음 익수자를 항상 시야에 두며 조종하는 사람에게 알립니다."},{"id":"715bbe76","q":"구명뗏목의 덮개(캐노피)는 어떻습니까?","o":["바다와 어울리도록 파란색","악천후에 견디도록 유리섬유","상어를 쫓기 위해 노란색 범포","열을 덜 받도록 흰색","눈에 잘 띄도록 주황색"],"c":"주황색과 노란색은 바다와 가장 대비가 커서 구조대가 발견하기 쉽습니다."},{"id":"f60f447d","q":"선박에 승선하여 선박 운항 업무를 수행하는 선원(aquaviário) 또는 아마추어(amador)를 무엇이라고 합니까?","o":["아마추어","승객","승무원","선원(aquaviário)","선주(armador)"],"c":"승무원은 선상에서 선박 운항 업무를 수행하는 사람입니다. 승객은 선상에서 맡은 업무가 없습니다."},{"id":"782cb100","q":"술에 취한 상태로 선박을 조종했을 때의 처벌은 무엇입니까?","o":["면허증 최대 60일 정지","면허증 최대 120일 정지. 재범 시 면허증 취소 처분을 받는다","면허증 최대 90일 정지","면허증 취소","면허증 영구 정지"],"c":"음주: 면허증 최대 120일 정지; 재범 시 취소됩니다."},{"id":"71ad5559","q":"구명뗏목의 시 앵커(물닻)는 무엇을 줄이기 위해 물속에 유지해야 합니까?","o":["파도의 높이","바람","표류 속도","전복 가능성","상어의 위험"],"c":"시 앵커(드로그)는 뗏목의 표류를 줄여 수색이 시작될 조난 지점 가까이에 머물게 합니다."},{"id":"bf08b2fd","q":"“B”급 화재에 사용하는 소화기는 무엇으로 식별합니까?","o":["노란색 별","파란색 원","빨간색 사각형"
